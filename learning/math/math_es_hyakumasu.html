<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<!-- ホーム画面追加で全画面(standalone)起動＝Safariのタブ枠とジェスチャー処理が外れ、
     高速連打の握りつぶし（タッチミス）がさらに減る。 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="100マス">
<title>100マス たし算れんしゅう | 中京個別指導学院</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<!-- 【他ツールと違う点】印刷シートに ChukyoPrint のロゴ透かしを入れない。
     100マスはタイムを競いながらマス目に数字を書き込むシートなので、
     背景に絵柄があると計算の集中を削ぐため（校名は見出しのテキストで入れてある）。
     そのぶん print-watermark.js（53KB）自体を読み込まなくて済んでいる。 -->
<style>
:root{
  --washi:#f8f4ec;
  --washi-deep:#efe8d9;
  --ink:#3a3226;
  --ink-soft:#7a7060;
  --sakura:#d76e8b;
  --sakura-deep:#c4526f;
  --leaf:#7ba05b;
  --line:#d9cfba;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* touch-action は html にも書く。iOS はタップのたびに「この座標の要素の touch-action は何か」を
   調べてダブルタップ拡大などのジェスチャー審査をするか決めるが、ルート要素が既定値(auto)のままだと
   その判定にメインスレッドの答えを待つ場面が出る。1打目の描画でメインスレッドが埋まっていると
   待ちきれずに審査側へ倒れ、2打目の接地イベントがそこで消える（＝1の位が無反応の正体）。
   html まで静的に決めておけば、この判定はメインスレッドを待たずに済む。 */
html{touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Zen Maru Gothic",system-ui,sans-serif;
  background:var(--washi);
  color:var(--ink);
  user-select:none;-webkit-user-select:none;
  touch-action:manipulation;
  display:flex;flex-direction:column;
  height:100svh;
}
.wrap{width:100%;max-width:430px;margin:0 auto;flex:1;min-height:0;display:flex;flex-direction:column;padding:6px 14px 12px}

/* ---- header ---- */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.title{font-weight:900;font-size:17px;letter-spacing:.04em;text-align:center}
.title small{font-size:11px;color:var(--ink-soft);font-weight:700;display:block;letter-spacing:.1em}
.timer{font-family:"Consolas","Menlo","Roboto Mono",monospace;
  font-variant-numeric:tabular-nums;font-weight:700;font-size:30px;color:var(--ink);
  text-align:right;justify-self:end;min-width:5.2ch}
.home-btn{font-family:inherit;font-size:20px;line-height:1;background:#fff;
  border:2px solid var(--line);border-radius:12px;padding:6px 10px;cursor:pointer;
  box-shadow:0 2px 0 var(--line)}
.home-btn:active{transform:translateY(2px);box-shadow:none}
.home-link{font-family:inherit;font-weight:900;font-size:15px;color:var(--ink-soft);
  background:none;border:none;cursor:pointer;padding:6px 10px;margin-top:2px}
.home-link:active{opacity:.6}

/* ---- progress ---- */
.progress{margin-top:8px}
.prog-label{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-soft)}
.bar{height:8px;background:var(--washi-deep);border-radius:99px;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--sakura),var(--sakura-deep));border-radius:99px;transform:scaleX(0);transform-origin:left center;transition:transform .25s;will-change:transform}
/* 幅アニメ(=毎問レイアウト)ではなく transform(=GPU合成)で伸ばす。高速連打時にメインスレッドを奪わない */

/* ---- question ---- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:0;gap:8px;overflow:hidden;position:relative}
.q-h{display:flex;flex-direction:column;align-items:center;gap:8px;transform:translateY(2vh)}
.countdown{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  background:var(--washi);z-index:10;
  font-weight:900;font-size:110px;color:var(--sakura-deep);
}
.countdown.show{display:flex}
.countdown b{animation:cd .95s ease}
@keyframes cd{0%{transform:scale(1.6);opacity:0}30%{transform:scale(1);opacity:1}100%{opacity:1}}
.question{
  font-weight:900;font-size:min(15vw,62px);letter-spacing:.02em;
  display:flex;align-items:baseline;gap:.18em;font-variant-numeric:tabular-nums;
}
.answer-box{
  min-width:2.4em;padding:0 .15em;text-align:center;
  font-weight:900;font-size:calc(min(17vw,68px) * var(--ansk,1));font-variant-numeric:tabular-nums;
  line-height:1.25;padding-bottom:8px;
  border-bottom:6px solid var(--line);color:var(--sakura-deep);
  transition:border-color .12s;
}
.answer-box.on{border-color:var(--sakura)}
/* 打った数字は3桁目以降も消さずに並べる（間違えたひと組がそのまま残る）ので、
   桁数によっては文字を縮めないと入らない。倍率は --ansk で渡す。
   ⚠ font-size を直接上書きしないこと。100マスモードは .q-grid .cell の方が
   詳細度が高くて勝ってしまう（下の .q-grid .cell.answer-box を参照）。
   横しきは答え欄が1行を独り占めしていて6桁でも余る（実測 ink 152px / 幅 402px）ので
   あえて縮めない。打っている途中で文字の大きさが変わる方が気が散るため。 */

/* ---- grid (masu) mode ---- */
.q-grid{display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;
  width:min(42vw,168px);font-variant-numeric:tabular-nums}
.stage[data-mode="grid"] .q-h{display:none}
.stage[data-mode="grid"] .q-grid{display:grid;transform:translate(-16%,-2%)}
.q-grid .cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:min(8vw,38px)}
/* 答えのマスだけ上の --ansk を効かせる（.q-grid .cell より詳細度を1つ上げてある） */
.q-grid .cell.answer-box{font-size:calc(min(8vw,38px) * var(--ansk,1))}
/* こちらは幅がマス1つ分しか無いので、横しきより強く縮める必要がある
   （実測: 38px のまま4桁を入れるとマスから溢れる）。 */
.q-grid .cell.answer-box[data-len="3"]{--ansk:.8}
.q-grid .cell.answer-box[data-len="4"]{--ansk:.68}
.q-grid .cell.answer-box[data-len="5"]{--ansk:.58}
.q-grid .cell.answer-box[data-len="6"]{--ansk:.5}
.q-grid .head{border:4px solid var(--ink-soft);color:var(--ink);background:#fff}
.q-grid .head.n{border-radius:0 4px 0 0;color:var(--leaf)}
.q-grid .head.m{border-radius:0 0 0 4px;color:var(--sakura-deep)}
.q-grid .corner{color:var(--ink-soft);font-size:min(6vw,26px);opacity:.5;border-radius:4px 0 0 0}
.q-grid .ans{border:4px solid var(--sakura);border-radius:0 0 4px 0;
  color:var(--sakura-deep);background:#fff8fa;
  min-width:0;padding:0;font-size:min(8vw,38px)}
.q-grid .ans.on{border-color:var(--sakura-deep)}
.stage.correct .q-grid .ans,.stage.correct .question{animation:pop .18s ease}
.stage.correct .question{animation:pop .18s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.correct-flash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle,rgba(123,160,91,.22),transparent 70%);opacity:0;transition:opacity .15s;
  will-change:opacity;transform:translateZ(0)}   /* 独立レイヤー化＝正解ごとの全画面再描画でタッチを落とさない */
.correct-flash.show{opacity:1}

/* ---- tenkey ---- */
/* gap を 0 にしてボタンを隙間なく敷き詰める＝キー間の“死角”をなくす。
   高速連打で指がズレても必ずどれかのキーに当たり、すき間タップの取りこぼしが消える。
   外枠だけ角丸＋overflow:hidden でパッド全体をまとめ、境界はボタンの1px枠で見せる。 */
/* 下端の余白は「0.5vh＋ホームバー分」。viewport-fit=cover を指定しているため
   コンテンツが iPhone のホームインジケータ領域まで伸びる＝そこに最下段(0/C/B)を置くと
   タップがホームスワイプの開始と判定されて落ちることがある。
   Safari(下ツールバー表示中)は env が 0 なので指定どおり下がり、
   ホーム画面追加(standalone)の時だけ自動でホームバー分を戻す。 */
.tenkey{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:32px;
  margin-bottom:calc(0.5vh + env(safe-area-inset-bottom, 0px));
  touch-action:none;border-radius:16px;overflow:hidden;
  border:2px solid var(--line);background:var(--line);}
.tenkey button{
  font-family:inherit;font-weight:900;font-size:28px;color:var(--ink);
  background:#fff;border:0.5px solid var(--line);border-radius:0;
  padding:16px 0;box-shadow:none;cursor:pointer;
  transition:background-color .05s;
  touch-action:none;user-select:none;-webkit-user-select:none;
  /* 長押しコールアウト/選択を無効化。iOSはこれが出ると素早い次のタップを握りつぶすことがある */
  -webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
/* 押した瞬間の合図は「マスの背景がうすい桜色になる」。
   隣と地続きなので枠色ではなく面で光らせる＝どのキーを押したか一目で分かる。 */
.tenkey button:active,
.tenkey button.pressed{background:#fdeef2;color:var(--sakura-deep)}
.tenkey .fn{font-size:20px;color:var(--ink-soft);background:var(--washi-deep)}
.tenkey .fn:active,
.tenkey .fn.pressed{background:#fdeef2;color:var(--sakura-deep)}

/* ---- screens ---- */
.screen{flex:1;min-height:0;display:none;flex-direction:column}
.screen.show{display:flex}
.center{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.big-btn{
  font-family:inherit;font-weight:900;font-size:22px;color:#fff;
  background:linear-gradient(180deg,var(--sakura),var(--sakura-deep));
  border:none;border-radius:16px;padding:16px 48px;
  box-shadow:0 4px 0 #a03e59;cursor:pointer;
}
.big-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a03e59}
.big-btn.start{
  background:linear-gradient(180deg,#c07d8b,#b06d7b);
  box-shadow:0 5px 0 #935663;border-radius:20px;
  font-size:20px;padding:13px 40px;
  display:flex;align-items:center;gap:14px;letter-spacing:.12em;margin-top:2px;
}
.big-btn.start:active{transform:translateY(3px);box-shadow:0 2px 0 #935663}
.big-btn.start span{color:#f3dfe4;font-size:18px}
.mode-pick{display:flex;gap:8px;margin:2px 0 4px;z-index:1;position:relative}
.mode-btn{font-family:inherit;font-weight:900;font-size:14px;color:#a08fbf;
  background:#fff;border:2.5px solid #d9cdeb;border-radius:99px;padding:7px 16px;cursor:pointer}
.mode-btn.on{color:#fff;background:#b3a3d6;border-color:#b3a3d6;box-shadow:0 3px 0 #9787c2}
.mode-section{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:1px;margin-bottom:2px}
.mode-title{font-weight:900;font-size:14px;color:#9885bf;letter-spacing:.08em}
.mode-guide{font-weight:700;font-size:11px;color:#a99e93;margin-bottom:1px}
.mode-wrap{position:relative;display:flex;align-items:center}
.bubble{display:none;position:absolute;top:50%;transform:translateY(-50%);
  background:#fff;border:2.5px solid #b3a3d6;border-radius:12px;padding:6px 8px;
  box-shadow:0 3px 6px rgba(120,100,150,.18);z-index:2}
#modePick[data-sel="h"] #bubH{display:block}
#modePick[data-sel="grid"] #bubG{display:block}
.bubble-left{right:calc(100% + 12px)}
.bubble-right{left:calc(100% + 12px)}
.bubble::after{content:"";position:absolute;top:50%;margin-top:-7px;
  border:7px solid transparent}
.bubble-left::after{left:100%;border-left-color:#b3a3d6}
.bubble-right::after{right:100%;border-right-color:#b3a3d6}
.bubble::before{content:"";position:absolute;top:50%;margin-top:-6px;z-index:1;
  border:6px solid transparent}
.bubble-left::before{left:100%;border-left-color:#fff}
.bubble-right::before{right:100%;border-right-color:#fff}
.mini-h{display:flex;align-items:baseline;gap:2px;font-weight:900;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.mini-h span{color:var(--ink-soft)}
.mini-h u{text-decoration:none;border-bottom:3px solid var(--sakura);min-width:14px;display:inline-block}
.mini-g{display:grid;grid-template-columns:repeat(2,20px);grid-auto-rows:20px;font-weight:900;font-size:11px;font-variant-numeric:tabular-nums}
.mini-g .mc{display:flex;align-items:center;justify-content:center}
.mini-g .n{border:2px solid var(--ink-soft);border-radius:5px 5px 0 0;color:var(--leaf)}
.mini-g .m{border:2px solid var(--ink-soft);border-radius:5px 0 0 5px;color:var(--sakura-deep)}
.mini-g .a{border:2px solid var(--sakura);border-radius:0 5px 5px 0;background:#fff8fa}
.mini-g .corner{color:var(--ink-soft);opacity:.5;font-size:9px}
.desc{font-size:14px;font-weight:700;color:#8a7d73;line-height:1.7}
#scrStart .desc{
  position:relative;padding:10px 0;margin:3px 4px;
  border-top:3px dotted #c9b8e0;border-bottom:3px dotted #c9b8e0;
}
#scrStart .desc b{color:#cf8fa0;font-weight:900}
#scrStart .desc i{color:#9885bf;font-style:normal;font-weight:900}
.result-card{width:100%;padding:0 6px}
.result-card h2{font-size:34px;font-weight:900;color:var(--sakura-deep);margin-bottom:14px;text-align:center;
  text-shadow:2px 2px 0 #fff}
.result-row{display:flex;justify-content:space-between;align-items:baseline;font-weight:900;font-size:26px;padding:6px 0}
.result-row b{font-variant-numeric:tabular-nums;font-size:44px;color:var(--sakura-deep)}
.splits{margin-top:14px;font-size:17px;color:var(--ink-soft);font-weight:700;text-align:left}
.splits div{display:flex;justify-content:space-between;padding:2px 0;font-variant-numeric:tabular-nums}
.start-title{
  font-family:"Zen Maru Gothic",system-ui,sans-serif;
  font-weight:900;font-size:54px;line-height:1.1;letter-spacing:.02em;
  color:#d199a5;text-align:center;
  -webkit-text-stroke:6px #fff;paint-order:stroke fill;
  filter:drop-shadow(0 5px 3px rgba(150,110,120,.18));
  display:flex;flex-direction:column;align-items:center;gap:4px;
  animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1);
}
.start-title em{
  font-style:normal;font-size:.46em;
  color:#fff;-webkit-text-stroke:0;background:#b3a3d6;border-radius:99px;
  padding:.08em .7em;box-shadow:0 3px 0 #9787c2;
  filter:none;
}
@keyframes bounceIn{0%{transform:rotate(-2deg) scale(.6);opacity:0}100%{transform:rotate(-2deg) scale(1);opacity:1}}
#scrStart{
  position:relative;
  background-color:#f7f0e6;
  background-image:
    linear-gradient(#ece3d5 1px, transparent 1px),
    linear-gradient(90deg, #ece3d5 1px, transparent 1px);
  background-size:34px 34px;
  border:2.5px solid #e6dccb;
  border-radius:26px;
  overflow:hidden;
}
#scrStart::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 42%, transparent 34%, rgba(247,240,230,.85) 88%);
  pointer-events:none;
}
/* corner blobs */
.blob{position:absolute;z-index:0;pointer-events:none;}
.blob.lav{bottom:-24px;left:-30px;width:180px;height:150px;
  background:#ddd2ef;border-radius:48% 52% 60% 40%/55% 45% 55% 45%;transform:rotate(12deg)}
.blob.sage{bottom:-30px;right:-34px;width:200px;height:150px;
  background:#d3ddc7;border-radius:52% 48% 40% 60%/50% 55% 45% 50%;transform:rotate(-10deg)}
#scrStart .center{position:relative;z-index:1;gap:8px}
.deco-watch{
  width:84px;height:auto;
  animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 6px rgba(138,99,184,.25));
}
@keyframes bob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(-6deg) translateY(-8px)}}
.deco-num{
  position:absolute;font-weight:900;opacity:.55;
  font-size:26px;pointer-events:none;z-index:1;
  border-bottom:3px solid currentColor;padding-bottom:2px;line-height:1;
}
#scrEnd{
  position:relative;
  background-image:
    linear-gradient(#e2ded6 1px, transparent 1px),
    linear-gradient(90deg, #e2ded6 1px, transparent 1px);
  background-size:34px 34px;
  border-radius:14px;
  overflow:hidden;
}
#scrEnd::after{
  content:"";position:absolute;inset:0;
  background:radial-gradient(circle at 50% 45%, transparent 30%, var(--washi) 85%);
  pointer-events:none;
}
#scrEnd .center{position:relative;z-index:1;
  justify-content:flex-start;overflow-y:auto;padding:8px 0 4px}
/* 新記録バナー等で内容が画面を超えたらスクロール、収まる時は上下中央（auto余白）*/
#scrEnd .center>.result-card{margin-top:auto}
#scrEnd .center>.home-link{margin-bottom:auto}
.deco-petal{
  position:absolute;z-index:1;pointer-events:none;
  animation:sway 3.2s ease-in-out infinite;
}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-7px) rotate(8deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- 記録を見るボタン（ログイン時のみ表示）---- */
.records-btn{
  font-family:inherit;font-weight:900;font-size:14px;color:var(--sakura-deep);
  background:#fff;border:2.5px solid var(--sakura);border-radius:99px;
  padding:8px 20px;cursor:pointer;box-shadow:0 3px 0 rgba(196,82,111,.35);
  display:inline-flex;align-items:center;gap:6px;
}
.records-btn:active{transform:translateY(2px);box-shadow:none}
.records-btn[hidden]{display:none}

/* ---- プリントボタン（紙の100マスを出す）----
   スタート画面の縦は iPhone SE でほぼ埋まっているので、ボタンの行を増やさず
   右上の角に浮かせる。押すのは主に先生・おうちの人で、子どもの導線（スタート）
   とは競合させたくない、という意味でも隅が正しい。 */
.print-btn{
  position:absolute;top:8px;right:10px;z-index:2;
  font-family:inherit;font-weight:900;font-size:12px;color:#5f7f45;
  background:#fff;border:2px solid #a8c48c;border-radius:99px;
  padding:6px 13px;cursor:pointer;box-shadow:0 2px 0 rgba(123,160,91,.35);
  display:inline-flex;align-items:center;gap:5px;
}
.print-btn:active{transform:translateY(2px);box-shadow:none}

/* ---- 新記録バナー（結果画面）---- */
.record-badge{display:none}
.record-badge.show{
  display:flex;flex-direction:column;align-items:center;gap:2px;
  margin:0 auto 14px;padding:12px 18px;max-width:100%;
  background:linear-gradient(180deg,#fff6d6,#ffe6a3);
  border:3px solid #f0c64b;border-radius:16px;
  box-shadow:0 4px 0 rgba(200,150,20,.35);
  animation:badgePop .5s cubic-bezier(.34,1.56,.64,1);
}
.record-badge .rb-emoji{font-size:30px;line-height:1}
.record-badge .rb-main{font-weight:900;font-size:21px;color:#b07d0a}
.record-badge .rb-sub{font-weight:700;font-size:12.5px;color:#8a6d1f;text-align:center}
@keyframes badgePop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}

/* 未ログインで完走した時に結果画面へ出す「ログインすれば記録が残せる」案内。
   ログイン窓はヘッダーに一本化しているので、ここでは誘導だけ（自前のログイン欄は作らない）。 */
.save-nudge{display:none}
.save-nudge.show{
  display:flex;align-items:center;gap:10px;
  margin:0 auto 14px;padding:12px 16px;max-width:100%;
  background:linear-gradient(180deg,#fff,#fdeef2);
  border:2px dashed var(--sakura);border-radius:16px;
  animation:badgePop .4s cubic-bezier(.34,1.56,.64,1);
}
.save-nudge .sn-emoji{font-size:26px;line-height:1;flex:0 0 auto}

<script>
(function(){
  'use strict';
  var TOTAL = 100, PER_COOL = 10;
  var UNIT_KEY = 'math_es_hyakumasu';

  function shuffle(a){
    for(var i=a.length-1;i>0;i--){
      var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t;
    }
    return a;
  }
  function range(lo,hi){var r=[];for(var v=lo;v<=hi;v++)r.push(v);return r;}
  function twoDistinctTens(){
    var t=shuffle(range(10,19));
    return [t[0],t[1]];
  }
  // 10個の値: 1桁(2〜9)8個すべて + 2桁2個 → シャッフル
  function buildSet(){
    return shuffle(range(2,9).concat(twoDistinctTens()));
  }

  var ms=[], ns=[], idx=0, miss=0, startT=0, splits=[], coolStart=0, running=false, input='';
  // input=判定に使う「状態」／dispInput=答え欄に出す「見た目」。
  // 正解した瞬間は状態だけ空にして見た目は打ち終えた数字を残す（下の ANS_HOLD_MS）ので、
  // この2つは意図的に別物にしてある。
  var dispInput='';
  var rafId=null, lastShown='';
  var lastLen=-1;                    // 答え欄に出している桁数（data-len の書き込みを間引く）

  // ── 正解した答えを一瞬だけ見せる（ニニマス方式）────────────────────
  // 従来は正解した瞬間に renderQ() が走って答え欄を空にしていたため、
  // 2桁目を描いてから消すまでが同じタスク内＝ブラウザが一度も描画せず、
  // 「2桁目が表示されないまま次の問題へ行く」ように見えていた。
  // そこで「状態だけ先に進め、次の問題の描画だけ ANS_HOLD_MS ぶん保留」する。
  // 保留中に次のキーが来たら即座に描画を吐き出す(flushQ)ので、
  // 速く打つ生徒の入力は1つも待たされない＝タイムに影響しない。
  var ANS_HOLD_MS=90;                // 見せる長さ。ここだけ触れば調整できる
  var qHoldTimer=null, qPending=false;

  // 答え欄に並べておく数字の上限（間違えたひと組を残すので伸びる）。
  // 2桁の答えなら3回ぶん。超えたら古いひと組ぶんを頭から捨てる（press 参照）。
  // 桁数が増えたぶんは CSS の [data-len] が文字を縮めて受け止める。
  var MAX_SHOWN=6;

  // ── 描画はすべて次のフレームにまとめる ─────────────────────────────
  // タップの瞬間に走る処理は軽いほどよい。既定の passive 経路では
  // 「ブラウザがJSを待つ」こと自体が無くなっているが、描画をまとめるのは
  // 経路に関係なく効くので常に有効にしてある（?tap=n の旧経路では必須。
  // 非passive のリスナーの中で DOM を書くと、スタイル再計算がぶら下がった分だけ
  // ジェスチャー審査を待たせて2打目を落とす）。
  // そこで「タップの瞬間に走るのは状態の更新だけ」にして、画面の書き換えは
  // requestAnimationFrame に1回ぶんまとめて逃がす（見た目は最大1フレーム＝約16msの差）。
  var paintReq=false, needQ=false, needIn=false, flashQueue=[];
  function schedulePaint(){
    if(paintReq) return;
    paintReq=true;
    requestAnimationFrame(paintNow);
  }
  function paintNow(){
    paintReq=false;
    // 【採寸し直しはここでやる】タップのたびに1フレーム後の位置へ追従する。
    // rAF の入口＝前フレームのレイアウトが確定した直後なので、ここでの
    // getBoundingClientRect は再レイアウトを起こさない（下の書き込みより前に読むこと）。
    // 以前は resize / 回転 / フォント適用 などイベントの一覧に頼っていたが、
    // 共通ヘッダー(divp-header)が whoami.php の応答でログイン窓⇔氏名に描き変わると
    // ヘッダーの高さが変わり、.wrap ごとテンキーが動く。これを知らせるイベントは無く、
    // 「1回タップを失ってから remeasureSoon で直る」形になっていた。
    measureKeys();
    if(needQ){ needQ=false; paintQ(); }
    if(needIn){ needIn=false; renderInput(); }
    for(var i=0;i<flashQueue.length;i++) flashKeyNow(flashQueue[i]);
    flashQueue.length=0;
  }
  function flushQ(){
    if(!qPending) return;
    qPending=false;
    clearTimeout(qHoldTimer); qHoldTimer=null;
    // 状態(idx)は correctNext で進み済み。ここは描画だけ＝フレームに逃がす。
    // 答え欄も塗り直す（タイマー経由なら input='' なので空に、
    // キー経由ならこの直後に press が paintInput() で1桁目を積む）。
    dispInput=input; needQ=true; needIn=true; schedulePaint();
  }
  function cancelHold(){
    qPending=false;
    clearTimeout(qHoldTimer); qHoldTimer=null;
  }

  // ── 計測モード（?debug=1 のときだけ）─────────────────────────────
  // 「ブラウザが受け取った生タップ数(raw)」と「数字として登録された数(key)」を画面隅に出す。
  // raw が指のタップ回数より少ない → OS/ブラウザ段階で落ちている（＝Web構造的ハンデ、コードでは救えない）
  // raw は合っているのに key が少ない → 解決ロジックで落としている（＝コードで直せる）
  // トリガーは複数用意（どれかが通ればON）:
  //  ・?debug=1（クエリ。リライトで落ちる環境あり）
  //  ・#debug（ハッシュ。リダイレクトでも残りやすい）
  //  ・一度ONにしたら localStorage に記憶して継続（?debug=0 / #nodebug で解除）
  var DBG=false;
  try{
    var qs=String(location.search||''), hs=String(location.hash||'');
    if(/[?&]debug=0/.test(qs) || /nodebug/.test(hs)){ localStorage.removeItem('hm_dbg'); DBG=false; }
    else if(/[?&]debug=1/.test(qs) || /(^|#)debug\b/.test(hs)){ localStorage.setItem('hm_dbg','1'); DBG=true; }
    else if(localStorage.getItem('hm_dbg')==='1'){ DBG=true; }
  }catch(e){ DBG = /[?&]debug=1/.test(String(location.search||'')); }

  // ── 入力経路：touch リスナーは passive にする（2026-08-30 実機で確定）──────
  // 【これが一番効く。ほかのテンキー系ツールへ横展開する時もここから移す】
  //
  // 非passive の touch リスナーが1つでもあると、iOS は「このタップをジェスチャーとして
  // 扱うか」を決める前に JS の実行を待つ。その待ちの間に来た2打目が審査側に倒れて消える。
  // ＝「2桁の答えの1の位だけ反応しない」の正体。passive にすると待ち自体が無くなり、
  // ネイティブの touchesBegan に一番近い挙動になる。
  // 実機(iPhone)で、Safari・ホーム画面追加(standalone)の両方で明確に改善を確認済み。
  // ⚠ touchstart だけ passive にしても効かない。非passive の touchmove が1つ残れば
  //    ブラウザは結局そこで待つので、touch 系は全部まとめて passive にすること。
  //
  // preventDefault をやめても止めたいものは全部ふさいである:
  //   ・ダブルタップ拡大/ピンチ … .tenkey と button の touch-action:none
  //   ・合成クリック … テンキーに click ハンドラが無い（pointerdown 経路は非タッチ端末専用）
  //   ・スクロール … html,body が overflow:hidden + overscroll-behavior:none
  //   ・長押しメニュー/選択 … -webkit-touch-callout:none と user-select:none
  // ⚠ このうち touch-action:none だけは iOS 13 未満で効かない。万一そういう端末で
  //    テンキーがダブルタップ拡大するようなら `?tap=n` で旧経路（非passive＋
  //    preventDefault）に戻せる。localStorage に残るので1回開かせれば継続する
  //    （standalone は URL を打ち替えられないので ?tap=n 付きURLでアイコンを作り直す）。
  //    戻すのは `?tap=p`。
  var PASSIVE_TAP=true;
  try{
    var tq=String(location.search||''), th=String(location.hash||'');
    if(/[?&]tap=n/.test(tq) || /(^|#)tap=n\b/.test(th)) localStorage.setItem('hm_tap','n');
    else if(/[?&]tap=p/.test(tq) || /(^|#)tap=p\b/.test(th)) localStorage.removeItem('hm_tap');
    PASSIVE_TAP = localStorage.getItem('hm_tap')!=='n';
  }catch(e){ PASSIVE_TAP = !/[?&]tap=n/.test(String(location.search||'')); }

  // ── 答え欄の入力の持ち方を切り替える（`?in=stack` / 戻すのは `?in=cap`）──────
  // どちらも「打った数字を勝手に消さない」点は同じで、満杯のあとの扱いだけが違う。
  //  cap（既定）… 答えの桁数で満杯にして、それ以上の数字キーは無反応にする。
  //               答え欄は必ず答えの桁数ぶんに収まる＝「画面に出ている数字＝今の入力」が
  //               桁数の増減なしで成り立つ。訂正は ⌫ か C（誤答1回あたり1〜2タップ増える）。
  //  stack     … 打った数字を消さずに積む。3桁目以降もそのまま表示し、採点は
  //               「答えの桁数ぶん打ち終わるごとに末尾のひと組」。間違えてもそのまま
  //               正しい答えを打てばよい＝訂正に余分なタップが要らない。
  //               ⚠ MAX_SHOWN まで伸びる＝答え欄が5〜6桁になる。
  // localStorage に残るので、試したい端末で1回 `?in=stack` 付きURLを開かせれば継続する
  // （PASSIVE_TAP と同じ方式。?debug=1 の計測パネルに今どちらかを表示する）。
  var STACK_INPUT=false;
  try{
    var iq=String(location.search||''), ih=String(location.hash||'');
    if(/[?&]in=stack/.test(iq) || /(^|#)in=stack\b/.test(ih)) localStorage.setItem('hm_in','stack');
    else if(/[?&]in=cap/.test(iq) || /(^|#)in=cap\b/.test(ih)) localStorage.removeItem('hm_in');
    STACK_INPUT = localStorage.getItem('hm_in')==='stack';
  }catch(e){ STACK_INPUT = /[?&]in=stack/.test(String(location.search||'')); }

  var dbgRaw=0, dbgKey=0, dbgBox=null, dbgLast=0, dbgMulti=0, dbgMaxN=1;
  // ブラウザが投げてきた touch の数を、判定を通さずそのまま数える計器。
  // dbgRaw は running 中かつ hit() まで来たものしか数えないので、
  // 「届いているのにこちらが数え落としている」場合を切り分けられなかった。
  var dbgTs=0, dbgTe=0, dbgMinGap=1e9, dbgPrevTs=0;
  function dbgCountTouch(kind, n){
    if(!DBG) return;
    if(kind==='ts'){
      dbgTs+=n;
      var t=nowMs();
      if(dbgPrevTs){ var g=t-dbgPrevTs; if(g<dbgMinGap) dbgMinGap=g; }
      dbgPrevTs=t;
    }else dbgTe+=n;
    dbgRender();
  }
  function dbgInit(){
    if(!DBG) return;
    dbgBox=document.createElement('div');
    dbgBox.style.cssText='position:fixed;left:6px;bottom:6px;z-index:9999;'
      +'font:700 13px/1.4 monospace;color:#fff;background:rgba(0,0,0,.72);'
      +'padding:6px 9px;border-radius:8px;pointer-events:none;white-space:pre';
    document.body.appendChild(dbgBox);
    dbgRender();
  }
  function dbgRender(){
    if(!dbgBox) return;
    // 採寸ズレ＝「持っているキー位置」と「今の実際の位置」の差。
    // 0 以外が出ていたら、その瞬間のタップは隣のキーや圏外に落ちうる＝取りこぼしの正体。
    var drift='-';
    try{
      if(KEYS.length){
        var live=KEYS[0].el.getBoundingClientRect();
        drift=Math.round(Math.max(Math.abs(live.top-KEYS[0].t), Math.abs(live.left-KEYS[0].l)))+'px';
      }
    }catch(e){}
    dbgBox.textContent='経路:'+(PASSIVE_TAP?'passive(既定)':'旧(preventDefault)')
      +'  採寸ズレ:'+drift
      +'\n入力:'+(STACK_INPUT?'stack(積む)':'cap(既定・満杯で無反応)')
      // ts/te は「ブラウザが投げてきた数」そのもの。running もキー判定も通さずに数える。
      // raw との差＝こちら側で数え落としている分なので、
      //   ts が指の回数どおり → ブラウザは届けている（原因はこちら）
      //   ts が足りない       → ブラウザ/OSの段階で消えている
      // te だけ足りている場合は接地が握りつぶされて離した時だけ届いた形＝拾い直しが効く範囲。
      +'\nts(接地):'+dbgTs+'  te(離す):'+dbgTe+'  最短間隔:'+(dbgMinGap<1e8?Math.round(dbgMinGap)+'ms':'-')
      +'\nraw(生タップ):'+dbgRaw+'\nkey(登録):'+dbgKey
      +'\nΔ(取りこぼし):'+(dbgRaw-dbgKey)
      +'\n同時2本以上:'+dbgMulti+' (最大'+dbgMaxN+'本)'
      +(dbgLog.length?('\n── 直近の入力 ──\n'+dbgLog.join('\n')):'');
  }
  // 直近12件の入力タイムライン。1タップが「どの経路で届き」「押されたキーが何で」
  // 「press に入って入力欄がどうなったか」を時刻差つきで並べる。
  //  ・ts/pd の行そのものが出ない → ブラウザ/OSがそのタップを投げていない（Web側の限界）
  //  ・ts は出るのに press が出ない → 解決ロジックで落としている（コードで直る）
  //  ・press は出るのに in= が伸びない → 判定・状態側の問題
  var dbgLog=[], dbgT0=0;
  function dbgEv(s){
    if(!DBG) return;
    var t=nowMs(), d=dbgT0?Math.round(t-dbgT0):0;
    dbgT0=t;
    dbgLog.push('+'+d+'ms '+s);
    if(dbgLog.length>12) dbgLog.shift();
    dbgRender();
  }
  function dbgHit(isKey){
    if(!DBG) return;
    dbgRaw++;                 // touchstart で受け取った1接地=raw+1
    if(isKey) dbgKey++;       // 実際に数字/機能キーとして press に渡った=key+1
    dbgRender();
  }
  // 両手同時押しがOSまで届いているかの確認用。n=その瞬間に接地している指の本数。
  // 「同時2本以上」が増えないのに取りこぼす＝OS側で1接地に丸められている（Web側の限界）。
  function dbgTouches(n){
    if(!DBG) return;
    if(n>dbgMaxN) dbgMaxN=n;
    if(n>=2) dbgMulti++;
    dbgRender();
  }

  var $=function(id){return document.getElementById(id);};

  // 計測そのものは Date.now() で続けているので、結果画面のタイム・クール別スプリット・
  // 記録の保存は今まで通り。非表示中は毎フレームの rAF ループも止める
  //（残り時間を気にせず打てる＋タップ処理に回るメインスレッドが増える）。

  var SHOW_TIMER=/[?&]timer=1/.test(String(location.search||''));

  // 結果・スプリット用（0.1秒まで）。ここは今まで通り正確に出す。
  function fmt(ms_){
    var s=ms_/1000, m=Math.floor(s/60), r=(s-m*60).toFixed(1);

  // プレイ中の時計用（秒まで）。表示が変わった時だけ書き換える＝毎フレームのDOM書き込みを無くす。
  function fmtClock(ms_){
    var s=Math.floor(ms_/1000), m=Math.floor(s/60), r=s-m*60;
    return m+':'+(r<10?'0':'')+r;
  }
  function tick(){
    if(!running)return;

  function paintQ(){

    lastShown='0:00'; timerEl.textContent='0:00';

    function step(){
      if(!cdActive)return;
      if(c===0){
        countdown.classList.remove('show');
        measureKeys();          // 「はじめ！」の直前＝レイアウトが確定した状態で採寸する
        // 最初の1問目だけは「タップして直す」が間に合わない（その1打が失われる）。
        // 開始直後はまだ動く要素がある（ヘッダーの描き変わり・Webフォントの適用）ので、
        // 数回だけ測り直して追いつく。以降は paintNow が毎タップ追従する。
        [80,200,500,1000,2000].forEach(function(ms){ setTimeout(measureKeys, ms); });

      }

      cdNum.style.animation='none'; void cdNum.offsetWidth; cdNum.style.animation='';

  function correctNext(){
    // ① 状態は即進める。次の問題の“描画”だけを一瞬保留し、打ち終えた答えを見せる。
    idx++;
    if(idx%PER_COOL===0){
      var now=Date.now();
      splits.push(now-coolStart);
      coolStart=now;
    }
    // 100問目は保留せず結果画面へ（保留するとタイムに保留時間が乗ってしまう）
    if(idx>=TOTAL){ cancelHold(); finish(); return; }
    // 高速モード常時：正解演出（フラッシュ／ぴょこっと）は出さない。
    // input は状態として即クリアするが renderInput() は呼ばない
    // ＝答え欄には打ち終えた数字が残ったまま、次の入力も受け付けられる。
    input='';
    qPending=true;
    clearTimeout(qHoldTimer);
    qHoldTimer=setTimeout(flushQ, ANS_HOLD_MS);
  }

  // 結果画面（タイム・ミス・クール別スプリット）を描画する共通ルーチン。
  // 完走直後と、ログイン復帰後の「退避データからの復元」の両方から呼ぶ。
  function renderResult(d){
    $('resTime').textContent=fmt(d.time_ms);
    $('resMiss').textContent=(d.miss_count||0)+' 回';
    var sp=d.splits||[], msl=d.ms||[], html='';
    for(var i=0;i<sp.length;i++){

    }
    $('resSplits').innerHTML=html;

  function finish(){
    running=false;
    cancelAnimationFrame(rafId);
    document.getElementById('topBar').style.display='none';
    var total=Date.now()-startT;
    renderResult({time_ms:total, miss_count:miss, splits:splits, ms:ms});
    hideRecordBadge();
    show(scrEnd);

    // タイムだけ記録する。正解エフェクトは付けない（タイムアタックの邪魔になるため）。
    // ログイン済なら即保存。未ログインなら「ログインすれば残せる」と案内し、今回のタイムを
    // 退避してログイン→reload後に自動保存する（下の flushPendingTime）。
    hideSaveNudge();
    if(window.Divp && typeof Divp.saveTime==='function'){
      Divp.saveTime({time_ms:total, miss_count:miss, meta:{mode:mode}})
        .then(function(res){
          if(res && res.ok){
            if(res.is_best) showRecordBadge('new', res.prev_best_ms);
            else if(res.is_first) showRecordBadge('first');
            refreshRecordsButtons();   // 記録が付いた＝ログイン済なので「きろくを見る」を出す
            clearPendingTime();
            return;
          }
          // 保存されなかった。「サーバーは応答したが未ログイン(authState==='out')」の時だけ
          // 案内＋退避する。API未到達(catch→'unknown')やローカルでは出さない＝しつこくしない思想。
          if(canRecord() && res && res.authState==='out'){
            stashPendingTime({time_ms:total, miss_count:miss, mode:mode, splits:splits, ms:ms});
            showSaveNudge();
          }
        })
        .catch(function(){});
    }
  }

  // ── 未ログイン完走時の「記録しますか？」案内＋ログイン後の自動保存 ──────────
  // ヘッダーのログインは成功時に location.reload() する＝結果画面が消えメモリも失う。
  // そこで完走タイムを sessionStorage に退避し（同一タブのreloadでは生き残る）、
  // 再読み込み後にログイン済なら自動で本保存する。
  var PENDING_KEY='divp_pending_time_'+UNIT_KEY;
  function canRecord(){ return /^https?:/.test(location.protocol); }  // file:// では案内しない
  // 復元に必要な結果一式（タイム・ミス・モード・スプリット・加算ラベル）を退避する。
  function stashPendingTime(d){
    try{ sessionStorage.setItem(PENDING_KEY, JSON.stringify({
      time_ms:d.time_ms, miss_count:d.miss_count, mode:d.mode,
      splits:d.splits||[], ms:d.ms||[], ts:Date.now()
    })); }catch(e){}
  }
  function readPendingTime(){
    try{
      var o=JSON.parse(sessionStorage.getItem(PENDING_KEY)||'null');
      if(!o||typeof o.time_ms!=='number') return null;
      if(Date.now()-(o.ts||0) > 30*60*1000) return null;   // 30分より古い退避は無効（別プレイの誤保存防止）
      return o;
    }catch(e){ return null; }
  }
  function clearPendingTime(){ try{ sessionStorage.removeItem(PENDING_KEY); }catch(e){} }
  function showSaveNudge(){ var el=$('saveNudge'); if(el) el.className='save-nudge show'; }
  function hideSaveNudge(){ var el=$('saveNudge'); if(el) el.className='save-nudge'; }

  // 退避データから結果画面を復元して新記録演出込みで出し直す。
  function flushPendingTime(){
    if(!(window.Divp && typeof Divp.loggedIn==='function' && Divp.loggedIn())) return;
    var p=readPendingTime(); if(!p) return;
    clearPendingTime();   // 先に消して二重保存を防ぐ
    if(typeof Divp.saveTime!=='function') return;
    Divp.saveTime({time_ms:p.time_ms, miss_count:p.miss_count, meta:{mode:p.mode}})
      .then(function(res){
        if(!(res && res.ok)) return;
        mode=p.mode||mode;                 // 「もう一回」で同じモードを引き継ぐ
        renderResult(p);                   // 退避した結果を再現
        hideSaveNudge();
        hideRecordBadge();
        if(res.is_best) showRecordBadge('new', res.prev_best_ms);
        else if(res.is_first) showRecordBadge('first');
        show(scrEnd);                      // スタート画面ではなく結果画面を出し直す

  // 画面版はミスしても止まらず、ミス回数を別に数えるだけ。
  // 紙は自分で時計を止めるので、塾の定番ルール「ミス1問につき+5秒」で清算する。
  // → タイムを書く欄は2か所:

  // 数の作りは画面版と同じ buildSet()（1桁2〜9の8個＋10〜19から2個）を
  // たて・よこそれぞれに使う＝10×10で100問、画面と同じ手ごたえになる。
  //
  // 左下の おうえんイラスト。base64で内蔵せず /assets/ の画像を参照するのは、

  // 相対パスの基準があいまいなので、親の origin を付けて解決してしまう
  // （本番でもミラーでも同じコードで通る）。file:// では origin が "null" に
  // なるので参照しない＝ふきだしだけ出て紙は崩れない。
  var BUTA = /^https?:$/.test(location.protocol)

  function buildPrintHtml(){
    var rows=buildSet(), cols=buildSet();
    var d=new Date();
    var dateStr=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';

    // sub行は空でも高さぶんは必ず確保する（&nbsp;）。ここが両ページで
    // 1行分でもズレると、こたえページのマス目が問題ページの真下からずれて
    // 透かし丸つけができなくなるため（.psub の有無で phead の高さが変わる事故）。
    function head(sub){
      return '<div class="phead">'
        +'<div><div class="pschool">中京個別指導学院</div>'
        +'<div class="ptitle">100マス たし算</div></div>'

        +'<div>名前 <span class="pname"></span></div>'

    function masu(withAns){
      var h='<div class="masuwrap"><table class="masu"><tr><th class="op">＋</th>';
      for(var c=0;c<cols.length;c++) h+='<th class="ch">'+cols[c]+'</th>';
      h+='</tr>';
      for(var r=0;r<rows.length;r++){
        h+='<tr><th class="rh">'+rows[r]+'</th>';
        for(var c2=0;c2<cols.length;c2++){
          h+='<td>'+(withAns?(rows[r]+cols[c2]):'')+'</td>';
        }
        h+='</tr>';
      }
      return h+'</table></div>';
    }
    // 100マスの下：左に おうえんイラスト＋ふきだし、右にタイム欄を縦2段。
    // 上＝採点前（走り終えて時計を止めた値）／下＝採点後（ミス×5秒を足した確定値）。
    // 下段は「まちがい□もん ×5びょう」の計算をその行の中に置いて、
    // 上段の値からどう作るのかが1行で追えるようにしてある。
    var foot='<div class="foot">'
      +'<div class="mascot"><div class="fbubble">ファイト！</div>'
      +(BUTA?'<img class="buta" src="'+BUTA+'" alt="">':'')+'</div>'
      +'<div class="times">'
        +'<div class="trow"><span class="tno">1</span>'
        +'<span class="tname">さいてん前の タイム</span>'
        +'<span class="tslot"><span class="wbox"></span>分<span class="wbox"></span>秒</span></div>'
        +'<div class="trow fin"><span class="tno">2</span>'
        +'<span class="tbody"><span class="tname">さいてん後の タイム</span>'
        +'<span class="tcalc">まちがい<span class="wbox sm"></span>もん ×5びょう ＝ ＋<span class="wbox sm"></span>秒</span></span>'
        +'<span class="tslot"><span class="wbox"></span>分<span class="wbox"></span>秒</span></div>'
      +'</div></div>';

    var CSS=''
      +'@page{size:A4 portrait;margin:11mm 10mm 10mm}'
      +'*{box-sizing:border-box;margin:0;padding:0}'
      +'body{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",'
        +'"Hiragino Kaku Gothic ProN",sans-serif;color:#3a3226;'
        +'-webkit-print-color-adjust:exact;print-color-adjust:exact}'
      +'.page{height:275mm;overflow:hidden}'
      +'.page+.page{page-break-before:always}'
      /* padding-bottom は保険。帯の下端がページ下端とぴったり同値だと、
         フォント計測が数値的にずれる環境（Mac Safari 等）で overflow:hidden に
         数十μm 分かじられる。2.5mm 逃がしておく（余りは masuwrap が吸うので
         2枚のマス目の位置は同じままズレない） */
      +'.pbody{height:100%;padding-bottom:2.5mm;display:flex;flex-direction:column}'
      /* --- 見出し --- */
      +'.phead{display:flex;justify-content:space-between;align-items:flex-end;'
        +'border-bottom:2.5pt solid #c4526f;padding-bottom:4px}'
      +'.pschool{font-size:9pt;font-weight:700;color:#c4526f;margin-bottom:1mm}'
      +'.ptitle{font-size:20pt;font-weight:900;letter-spacing:.04em;line-height:1}'
      +'.pmeta{font-size:10pt;font-weight:700;display:flex;flex-direction:column;'
        +'gap:1.4mm;align-items:flex-end}'
      +'.psub{font-size:9pt;color:#7a7060}'
      +'.pname{display:inline-block;min-width:34mm;border-bottom:1.2pt solid #3a3226}'
      +'.pdate{font-size:8.5pt;color:#7a7060}'
      /* --- 100マスの下の帯：左＝おうえんイラスト／右＝タイム記入欄 ---
         height を固定してあるのは、こたえページにも同じ高さの帯を置いて
         2枚のマス目を紙面のまったく同じ位置に揃えるため（重ねて透かすと丸つけが速い）。
         58mm ＝ マス目の上下に余っていた空白ぶんをタイム記入欄の背丈に回した値
         （イラスト側の実測は43.6mmのまま＝下端そろえなので絵の上に少し空くだけ）。 */
      +'.foot{display:flex;align-items:flex-end;gap:3mm;margin-top:4mm;height:58mm}'
      +'.ansfoot{align-items:center;justify-content:center}'
      +'.anote{font-size:9.5pt;font-weight:700;color:#8a7d73;text-align:center;line-height:1.9}'
      +'.anote b{color:#c4526f}'
      +'.mascot{flex:0 0 auto;width:43mm;display:flex;flex-direction:column;align-items:center}'
      +'.fbubble{position:relative;background:#fff;border:1.8pt solid #c4526f;'
        +'border-radius:99px;padding:1.6mm 4mm;font-size:11pt;font-weight:900;'
        +'color:#c4526f;white-space:nowrap;margin-bottom:2.6mm}'
      /* ふきだしの しっぽ（枠の三角の上に白の三角を重ねて“くりぬく”） */
      +'.fbubble::after,.fbubble::before{content:"";position:absolute;top:100%;left:50%;'
        +'border:2.2mm solid transparent;border-bottom:0}'
      +'.fbubble::before{margin-left:-2.2mm;border-top-color:#c4526f}'
      +'.fbubble::after{margin-left:-1.5mm;border-width:1.5mm;border-bottom:0;border-top-color:#fff}'
      +'.buta{display:block;width:40mm;height:auto}'   /* 元画像 377x294 ＝ 高さ31mm */
      /* 上段＝採点前／下段＝採点後。分秒の枠は .tslot の margin-left:auto で右端そろえ。
         下段は「まちがい×5びょう」の計算を見出しの下にもう1行ぶら下げる。
         1行に押し込むと横幅（イラストを除いた約140mm）に収まらないため。 */
      +'.times{flex:1;min-width:0;display:flex;flex-direction:column;gap:4.5mm}'
      +'.trow{display:flex;align-items:center;gap:2mm;'
        +'border:1.4pt solid #cfc6b4;border-radius:2.5mm;padding:4mm 2.8mm;background:#fbf8f1}'
      +'.trow.fin{border:2.4pt solid #c4526f;background:#fff6f8}'
      +'.tno{flex:0 0 auto;width:5.6mm;height:5.6mm;line-height:5.6mm;text-align:center;'
        +'border-radius:50%;background:#a49a88;color:#fff;font-size:8pt;font-weight:900}'
      +'.trow.fin .tno{background:#c4526f}'
      +'.tbody{flex:0 0 auto;display:flex;flex-direction:column;gap:2mm}'
      +'.tname{flex:0 0 auto;font-size:10.5pt;font-weight:900;color:#7a7060;white-space:nowrap}'
      +'.trow.fin .tname{color:#c4526f}'
      +'.tcalc{display:flex;align-items:center;gap:1.2mm;'
        +'font-size:8.6pt;font-weight:900;color:#8a7d73;white-space:nowrap}'
      +'.tslot{flex:0 0 auto;margin-left:auto;display:flex;align-items:center;gap:1.3mm;'
        +'font-size:10pt;font-weight:900;white-space:nowrap}'
      +'.wbox{display:inline-block;width:15.5mm;height:13mm;background:#fff;'
        +'border:1.2pt solid #b3aa98;border-radius:1.6mm}'
      +'.wbox.sm{width:11mm;height:9.5mm}'
      +'.trow.fin .wbox{border-color:#c4526f;border-width:1.6pt}'
      /* --- 100マス本体 --- */
      +'.masuwrap{flex:1;display:flex;align-items:center;justify-content:center}'
      +'table.masu{border-collapse:collapse;table-layout:fixed;border:2pt solid #6b6459}'
      +'table.masu th,table.masu td{width:17mm;height:17mm;border:0.8pt solid #a49a88;'
        +'text-align:center;vertical-align:middle;font-size:16pt;font-weight:900;'
        +'font-variant-numeric:tabular-nums;background:transparent}'
      +'table.masu th{background:#f2ece0}'
      +'table.masu th.op{background:#e4dbc9;font-size:18pt;color:#7a7060}'
      +'table.masu th.ch{color:#4d7a33}'
      +'table.masu th.rh{color:#b0456a;border-right:1.8pt solid #6b6459}'
      +'table.masu tr:first-child th{border-bottom:1.8pt solid #6b6459}'
      /* --- こたえページ --- */
      +'.page.ans td{color:#c4526f}';

    return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
      +'<title>100マス たし算｜中京個別指導学院</title>'
      +'<link rel="preconnect" href="https://fonts.googleapis.com">'
      /* 親ページと完全に同じURLにする＝CSSもwoff2もブラウザキャッシュに乗っているので、
         ポップアップは待ち時間ゼロで丸ゴシックが出る（下の700msが効く） */
      +'<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">'
      +'<style>'+CSS+'</style></head><body>'
      +'<div class="page"><div class="pbody">'
        +head('')
        +masu(false)
        +foot
      +'</div></div>'
      // こたえページは 見出し → 100マス → 同じ高さの帯（注記）。
      // 帯の中身は違っても高さが同じなので、マス目は問題ページと1mmも狂わない。
      +'<div class="page ans"><div class="pbody">'
        +head('こたえ（まるつけ用）')
        +masu(true)
        +'<div class="foot ansfoot"><div class="anote">'
        +'まちがいの 数を かぞえて <b>×5びょう</b>。<br>'
        +'さいてん前の タイムに たした ものが <b>さいてん後の タイム</b> だよ。</div></div>'
      +'</div></div>'
      +'</body></html>';
  }
  function doPrint(){
    // イラストは印刷ポップアップを開く前に取得しておく（キャッシュに乗せる）。
    // ポップアップは about:blank に document.write する＝読み込み完了の合図が取りづらいので、
    // 先に親側で読んでおけば w.print() の時点で確実に描かれている。
    // 取れなくても（未アップロード・オフライン等）ふきだしだけ出て紙は崩れない。
    var go=function(){
      var w=window.open('','_blank','width=794,height=1123');
      if(!w){ alert('ポップアップがブロックされました。印刷を許可してください。'); return; }
      w.document.write(buildPrintHtml());
      w.document.close();
      // Webフォント(Zen Maru Gothic)の読み込みを少し待ってから印刷ダイアログを出す。
      // 間に合わなくても system の丸ゴ／角ゴにフォールバックするだけで中身は崩れない。
      setTimeout(function(){ try{ w.focus(); w.print(); }catch(e){} }, 700);
    };
    if(!BUTA){ go(); return; }
    var im=new Image(), done=false;
    var once=function(){ if(done) return; done=true; go(); };
    im.onload=once; im.onerror=once;
    setTimeout(once, 1500);          // 遅い回線でも印刷ダイアログを待たせすぎない
    im.src=BUTA;
  }

  // ここで DOM は一切書かない（renderInput / paintQ は schedulePaint 経由でフレームに逃がす）。
  // 理由は schedulePaint のコメント参照＝1打目の描画で2打目を落とさないため。
  function press(k){
    if(!running){ if(DBG) dbgEv('  press '+k+' → 無視(未開始)'); return; }
    // 「答えを見せている最中」に次のキーが来た＝もう次へ行きたい。
    // 保留していた次の問題の描画を先に吐き出してから、このキーを処理する。
    // これで待ち時間はゼロのまま、間があいた時だけ答えが見える。
    if(qPending) flushQ();
    if(k==='C'){ input=''; paintInput(); return; }
    if(k==='B'){ input=input.slice(0,-1); paintInput(); return; }
    if(!/^[0-9]$/.test(k))return;
    // ── 打った数字は勝手に消さない ────────────────────────────────
    // input =「この問題で打った分」。答え欄はこれをそのまま出す。
    // 採点は「答えの桁数ぶん打ち終わるごとに、末尾のひと組」で行う。
    // どちらのモードでも、途中で表示が消えたり差し替わったりしない
    // ＝端末ごとの取りこぼし調査で、画面に出ている数字＝登録された入力 と読める。
    //
    // cap（既定）: 答えの桁数で満杯＝以降の数字キーは無反応。訂正は ⌫ か C。
    //   例: 答え13 に 1,4 → 末尾"14"で不正解(miss++)。以降 14 のまま動かない。
    // stack(?in=stack): 満杯にせず積む。
    //   例: 答え13 に 1,4 → 不正解。続けて 1,3 → 表示 1413・末尾"13"で正解。
    // 下の判定はどちらでも共通（cap では「満杯になった時にちょうど1回」動く）なので、
    // モードの分岐はこの return 1本だけで済む。
    var ans=String(curAns());
    if(!STACK_INPUT && input.length>=ans.length){
      if(DBG) dbgEv('  press '+k+' → 無視('+ans.length+'桁で満杯)');
      return;
    }
    input+=k;
    // 長くなりすぎたら古いひと組ぶんだけ頭から捨てる。捨てるのが必ず答えの桁数の
    // 倍数なので、下の「% ans.length」の区切りはずれない。
    if(input.length>MAX_SHOWN) input=input.slice(ans.length);
    paintInput();           // 打った数字は必ず出す（正解でもここで出した表示が一瞬残る）
    if(input.length % ans.length === 0){
      if(input.slice(-ans.length)===ans){
        if(DBG) dbgEv('  press '+k+' in='+input+' ○正解');
        correctNext();      // input だけ空にする＝答え欄は打ち終えた数字のまま
      }else{
        if(DBG) dbgEv('  press '+k+' in='+input+' ×不正解(答'+ans+')');
        miss++;
        // 【不正解でも打った数字は消さない】input も dispInput もそのまま。
        // 以前はここで input='' として答え欄だけ残していたが、次の1打で
        // 表示が丸ごと差し替わるため「2打目が反応しなかった」のと区別がつかなかった
        // （テンキーの取りこぼしを追っていたときに切り分けを汚した）。
        // いまは積むだけなので、消える瞬間そのものが無い。
      }
    }else{
      if(DBG) dbgEv('  press '+k+' in='+input+' (答'+ans+'・待ち)');
    }
  }

  // 同じキーに2本の指が続けて当たった時（例 答え77）に、1本目のタイマーが
  // 2本目の点灯を消してしまわないよう、消灯タイマーはキーごとに持ち直す。
  function flashKeyNow(el){
    el.classList.add('pressed');
    if(el._ft) clearTimeout(el._ft);
    el._ft=setTimeout(function(){ el.classList.remove('pressed'); el._ft=null; },90);
  }
  // press が早期 return する場合（2桁で満杯など）でも点灯だけは出したいので、
  // ここでも描画フレームを予約しておく。
  function flashKey(el){ flashQueue.push(el); schedulePaint(); }
  var nowMs=(window.performance&&performance.now)?function(){return performance.now();}
                                               :function(){return +new Date();};

  // ── テンキー入力：1接地 = 1入力 ─────────────────────────────
  // 経路は端末ごとに1本だけ。タッチ端末は touch イベント、それ以外は pointerdown。
  // 2つのAPIを併用しないので「同じ指を二重に入力しないための座標・時刻の近接判定」が
  // 要らない＝両手同時押し（答え 11/77 のように同じキーを2本で打つ）を取りこぼす
  // 理屈がそもそも無い。触るのは次の3か所だけ:
  //   keyAt() … 座標→キー / hit() … 1接地を入力 / 下のリスナー群
  //
  // 判定は「座標だけ」で行う（イベントの target は見ない）。target を信じると、
  // 指の下に一瞬でも別の要素が重なった接地や、ジェスチャー審査で遅れて届いた接地で
  // 見当違いの要素が入ってきて落ちる。座標→キーは事前採寸した矩形との比較だけなので、
  // DOM もレイアウトも触らずに済む＝touchstart の中でブラウザを待たせない。
  var TOUCH=('ontouchstart' in window);
  // ヒットスロップ(px): キーの外縁からこの距離内の“かすり接地”は最寄りキーに吸着。
  // 大きくしすぎると隣キー誤爆になるので控えめに。
  var HIT_SLOP=20;

  // ── キーの位置は先に測って持っておく ────────────────────────────
  // 以前は接地のたびに elementFromPoint / getBoundingClientRect を呼んでいた。
  // どちらも「今のレイアウトを確定させてから答える」API＝passive:false の
  // touchstart の中で強制同期レイアウトが走る。1打目でこれをやると、直後に来る
  // 2打目の接地をブラウザが捌けずにジェスチャー審査へ流してしまう。
  // 位置は打っている間ずっと変わらないので、測るのは事前に1回でよい。
  var KEYS=[], keysOK=false;
  function measureKeys(){
    var btns=$('tenkey').querySelectorAll('button');
    var list=[], ok=false;
    for(var i=0;i<btns.length;i++){
      var r=btns[i].getBoundingClientRect();
      if(r.width>0 && r.height>0) ok=true;
      list.push({el:btns[i],k:btns[i].dataset.k,l:r.left,t:r.top,r:r.right,b:r.bottom});
    }
    KEYS=list; keysOK=ok;      // 非表示中(display:none)は全部0＝採寸できていない
    return ok;
  }
  // 測り直しは「レイアウトが動きうる時」だけ。タップ経路からは絶対に呼ばない。
  function remeasureSoon(){ requestAnimationFrame(function(){ measureKeys(); }); }

  function keyAt(x,y){
    if(!keysOK && !measureKeys()) return null;
    var best=null,bestD=HIT_SLOP;
    for(var i=0;i<KEYS.length;i++){
      var r=KEYS[i];
      var dx=x<r.l?r.l-x:(x>r.r?x-r.r:0);
      var dy=y<r.t?r.t-y:(y>r.b?y-r.b:0);
      if(dx===0&&dy===0) return r.el;              // キーの内側＝即決
      var d=dx>dy?dx:dy;                           // 矩形からのはみ出し量（縦横の大きい方）
      if(d<bestD){bestD=d;best=r.el;}
    }
    return best;                                   // 縁や隙間をかすった接地は最寄りキーへ吸着
  }
  // 1接地を入力する。戻り値 true = テンキーを押した。
  // 「直前の入力と近いから捨てる」類の判定はここに置かない
  //（両手同時押し＝同座標・同時刻の2発が正当な入力なので、近さで捨ててはいけない）。
  function hit(x,y,src){
    var b=running?keyAt(x,y):null;         // プレイ中のテンキー上だけ反応する
    if(DBG){ dbgEv((src||'?')+' '+(b?b.dataset.k:'—')); if(running) dbgHit(!!b); }
    if(!b){
      // キーに当たらなかった＝採寸がずれている可能性がある（フォント読み込み・
      // 回転・ヘッダーの高さ変化など）。次フレームで測り直して自分で治す。
      if(running) remeasureSoon();
      return false;
    }
    flashKey(b); press(b.dataset.k);
    return true;
  }
  if(TOUCH){
    // 【接地=touchstart で入力する】
    // #tenkey ではなく document で受ける。指の下に一瞬でも別の要素（演出・トースト・
    // ヘッダー）が重なった接地はテンキーのリスナーに届かず消えるが、document で受けて
    // 「座標がどのキーか」で決めれば、届いたイベントは必ず入力になる。
    // identifier → その指をどう処理したか。
    //   1 = 接地(touchstart)でキーとして入力済み / 2 = 接地は届いたがキー外だった
    // 「そもそも登録が無い identifier」＝接地イベントが届かなかった指なので、
    // touchmove / touchend で初めて見た時に拾い直す（下の recover）。
    // ※2 を分けているのは、テンキーの外から始めた指がなぞってキーに入った時に
    //   勝手に入力しないため（0 と 2 を混ぜると誤爆する）。
    var down={};
    // passive で受ける（既定）。旧経路に戻すのは ?tap=n のときだけ＝上の PASSIVE_TAP 参照。
    // ⚠ passive:true のリスナーの中で preventDefault を呼ぶとコンソール警告が出るだけで
    //    何も起きないので、呼ぶ側も必ずフラグで分岐させること。
    var TS_OPT = PASSIVE_TAP ? {passive:true,capture:true} : {passive:false,capture:true};
    document.addEventListener('touchstart',function(e){
      if(DBG){ dbgCountTouch('ts', e.changedTouches.length);
               dbgTouches(Math.max(e.touches?e.touches.length:1, e.changedTouches.length)); }
      var onKey=false;
      for(var i=0;i<e.changedTouches.length;i++){
        // ※changedTouches の並び＝接地された順。同一フレームに2本着地しても
        //   この配列順がそのまま十の位→一の位の順になる。
        var t=e.changedTouches[i];
        if(hit(t.clientX,t.clientY,'ts')){ down[t.identifier]=1; onKey=true; }
        else down[t.identifier]=2;
      }
      // テンキーを打った時だけ止める（合成クリック・ダブルタップ拡大・ピンチ審査を切る）。
      // document 全体で無条件に止めると、ヘッダーのログイン窓や記録一覧が触れなくなる。
      if(!PASSIVE_TAP && onKey && e.cancelable) e.preventDefault();
    },TS_OPT);

    // 【接地イベントが来なかった指を拾い直す】
    // iOS は素早い2打目をジェスチャー審査でいったん保留し、touchstart を投げて
    // こないことがある（?debug=1 で ts が増えない状態＝1の位が無反応になる正体）。
    // 審査が終わると touchmove / touchend からは届くので、そこで初めて見た指を入力する。
    // 動いた時点で拾うので、指を離すまで待たずに済む＝表示の遅れも小さい。
    function recover(e,src){
      for(var i=0;i<e.changedTouches.length;i++){
        var t=e.changedTouches[i];
        if(down[t.identifier]) continue;               // 接地で処理済み(1 or 2)
        down[t.identifier]=hit(t.clientX,t.clientY,src)?1:2;
      }
    }
    // 指がわずかに動いた瞬間にピンチ/スクロール判定が走ると、以降の接地が落ちる。
    // テンキーを触っている指の移動は無効化しておく（記録一覧のスクロールは通す）。
    // ⚠ touchstart だけ passive にしても意味がない。
    //    非passive の touchmove が1つ残っていれば、ブラウザは結局そこで JS を待つ。
    document.addEventListener('touchmove',function(e){
      recover(e,'tm');
      if(PASSIVE_TAP) return;                          // 移動の抑止は touch-action:none に任せる
      var ours=false;
      for(var i=0;i<e.changedTouches.length;i++){
        if(down[e.changedTouches[i].identifier]===1){ ours=true; break; }
      }
      if(ours && e.cancelable) e.preventDefault();
    },TS_OPT);

    function lift(e){
      if(DBG) dbgCountTouch('te', e.changedTouches.length);
      recover(e,'te');
      for(var i=0;i<e.changedTouches.length;i++) delete down[e.changedTouches[i].identifier];
      if(!e.touches || e.touches.length===0) down={};   // 全部離れた＝控えを空にする
    }
    document.addEventListener('touchend',lift,{passive:true,capture:true});
    document.addEventListener('touchcancel',lift,{passive:true,capture:true});

    // 観測のみ（?debug=1 のときだけ）。touchstart が来ない接地で pointerdown は
    // 来ているのかを見る。入力はしない＝入力経路は1本のまま。
    if(DBG) document.addEventListener('pointerdown',function(e){
      if(e.pointerType==='touch') dbgEv('pd↓（観測のみ）');
    },{passive:true,capture:true});
  }else{
    // マウス / ペン
    document.addEventListener('pointerdown',function(e){
      if(hit(e.clientX,e.clientY,'mouse')) e.preventDefault();
    },{passive:false,capture:true});
  }
  // 採寸のやり直し。ここに挙げた「レイアウトが動きうる出来事」でだけ測り直す。
  ['resize','orientationchange','pageshow'].forEach(function(ev){
    window.addEventListener(ev,remeasureSoon);
  });
  window.addEventListener('load',remeasureSoon);   // Webフォント適用でキーの高さが変わる
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible') remeasureSoon();
  });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(remeasureSoon).catch(function(){});
  // .wrap の高さが変わる＝上の共通ヘッダーが伸び縮みした＝テンキーが動いた。
  // イベントの一覧に頼らず、実際に動いたことを見て採寸し直す。
  if(window.ResizeObserver){
    try{ new ResizeObserver(remeasureSoon).observe(document.querySelector('.wrap')); }catch(e){}
  }

  // 長押しメニュー・ダブルタップ拡大・ピンチ判定は、OSがタップをイベント化する前に
  // 次の1発を握りつぶす原因になる。この審査はページ単位で走る（iOS は
  // user-scalable=no を無視する）ので、テンキーではなく document 側で塞ぐ。
  // ※これらは touch イベントではないので、passive 経路でも残す
  //   ＝touchstart の配達を待たせる原因にはならない。
  $('tenkey').addEventListener('contextmenu',function(e){ e.preventDefault(); });
  ['gesturestart','gesturechange','gestureend','dblclick'].forEach(function(ev){
    document.addEventListener(ev,function(e){ e.preventDefault(); },{passive:false});
  });
  // 物理キーボード。capture では登録しないこと（divp-header がログイン欄のキーを
  // バブル段階の stopPropagation でツールから守っているため、capture だと横取りしてしまう）。
  // IME変換中(日本語入力ON)のキーは無視する。変換確定のキーや keyCode 229 の
  // 「未確定入力」通知を数字として拾うと、打っていない数字が答え欄に入る。
  document.addEventListener('keydown',function(e){
    if(e.isComposing || e.keyCode===229) return;
    if(/^[0-9]$/.test(e.key))press(e.key);
    else if(e.key==='Backspace')press('B');
    else if(e.key==='Escape')press('C');
  });
  // ── ボタンのタップ：合成クリックに頼らない ─────────────────────────
  // テンキーを passive 経路にして preventDefault をやめた結果、キーのタップでも
  // 合成クリックが出るようになった。その直後にボタンを押すと、iOS が直前のタップとの
  // ダブルタップ候補として扱い、click を出さないことがある。
  // 症状は「押した見た目(:active)は出るのに何も起きない」＝原因が分かりにくい形で出る
  // （100マスのホームボタンで多発した。連打のあとに押すボタンほど踏みやすい）。
  // テンキーと同じ「touch イベントで自分で判定する」形に寄せて click 依存をやめる。
  // ⚠ 発火は touchend。touchstart で動かすと、画面上部に指がかすっただけで
  //    プレイ中に離脱してしまう。
  // ⚠ click も残す（マウス・キーボード操作・iPadのトラックパッド用）。
  //    両方来た時は後から来たほうを time で捨てる＝二重発火しない。
  // 「その指の touchstart が JS まで届いたか」の控え。
  // 届いていない指＝ジェスチャー審査に握りつぶされた接地なので、touchend しか来ない
  // （テンキーの2打目と同じ現象。:active は WebKit のヒットテストで出るため、
  //   見た目だけ反応して何も起きない、という同じ症状になる）。
  // capture で記録し、bubble で消す＝要素側の touchend が読む時点ではまだ残っている。
  var seenTs={};
  if(TOUCH){
    document.addEventListener('touchstart',function(e){
      for(var i=0;i<e.changedTouches.length;i++) seenTs[e.changedTouches[i].identifier]=1;
    },{passive:true,capture:true});
    var clearSeen=function(e){
      for(var i=0;i<e.changedTouches.length;i++) delete seenTs[e.changedTouches[i].identifier];
    };
    document.addEventListener('touchend',clearSeen,{passive:true});
    document.addEventListener('touchcancel',clearSeen,{passive:true});
  }

  function onTap(el, fn){
    if(!el) return;
    // ⚠ 0 で初期化しないこと。nowMs() は performance.now() ＝ページ読み込みからの経過msなので、
    //    0 にすると「読み込み後500ms以内の最初のタップ」が二重発火とみなされて丸ごと消える
    //    （読み込みが速いとスタートボタンが 無反応になる。回帰テストで踏んだ）。
    var last=-1e9;
    var run=function(e){
      var n=nowMs();
      if(n-last<500) return;      // 直前に別経路で発火済み
      last=n;
      fn.call(el, e);
    };
    el.addEventListener('click', run);
    if(!TOUCH) return;
    var armed=false;
    el.addEventListener('touchstart',function(){ armed=true; },{passive:true});
    el.addEventListener('touchcancel',function(){ armed=false; },{passive:true});
    el.addEventListener('touchend',function(e){
      var t=e.changedTouches && e.changedTouches[0];
      // armed=false でも、その指の touchstart がそもそも届いていないなら受ける
      // （握りつぶされた接地。届いた上でよそから流れてきた指だけを弾く）
      if(!armed && !(t && !seenTs[t.identifier])) return;
      armed=false;
      // 指がボタンの外へ流れていたら取り消す（押し間違いの逃げ道を残す）
      if(t){
        var r=el.getBoundingClientRect();
        if(t.clientX<r.left-8 || t.clientX>r.right+8 ||
           t.clientY<r.top-8  || t.clientY>r.bottom+8) return;
      }
      run(e);
    },{passive:true});
  }

  onTap($('modePick'),function(e){
    var b=e.target.closest && e.target.closest('.mode-btn'); if(!b)return;
    mode=b.dataset.mode;
    this.setAttribute('data-sel', mode);
    var btns=this.querySelectorAll('.mode-btn');
    for(var i=0;i<btns.length;i++)btns[i].classList.toggle('on',btns[i]===b);
  });
  onTap($('btnStart'),start);
  onTap($('btnRetry'),start);
  onTap($('btnPrint'),doPrint);
  onTap($('btnHomePlay'),goHome);
  onTap($('btnHomeEnd'),goHome);

  // 記録一覧モーダル
  onTap($('btnRecords'),openRecords);
  onTap($('btnRecordsEnd'),openRecords);
  onTap($('recordsClose'),closeRecords);
  // 背景タップで閉じるのは click のまま。onTap にすると、カード内で始めた指が
  // 背景の上で離れただけで閉じてしまう（誤爆のほうが困る）。
  $('recordsOverlay').addEventListener('click',function(e){ if(e.target===this) closeRecords(); });
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape' && $('recordsOverlay').classList.contains('show')) closeRecords();
  });

  // 共通処理の初期化（学習時間の計測・タイム記録・ログイン状態の取得）。
  // 正解エフェクト(divp-correct)は読み込まない＝タイムアタックの邪魔をしない。
  if(window.Divp && typeof Divp.init==='function'){
    try{ Divp.init(UNIT_KEY); }catch(e){}
  }
  // ログイン状態が確定したら「きろくを見る」ボタンの表示可否を決める＋
  // 未ログイン完走→ログインで戻ってきた場合、退避したタイムをここで自動保存する。
  if(window.Divp && typeof Divp.ready==='function'){
    Divp.ready().then(function(){ refreshRecordsButtons(); flushPendingTime(); });
  }

  dbgInit();   // ?debug=1 のときだけ計測カウンターを表示
})();
</script>
</body>
</html>
