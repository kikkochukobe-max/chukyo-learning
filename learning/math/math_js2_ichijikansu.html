/* ---------- SVG grid ---------- */
const SVGNS="http://www.w3.org/2000/svg";
function makeGrid(R,size,interactive){
  size=size||360;
  const pad=16, W=size, u=(W-pad*2)/(2*R);
  const svg=document.createElementNS(SVGNS,"svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${W}`);
  svg.setAttribute("width",Math.min(W,420));
  /* 解き直しプリント側の目印。方眼は 360 単位四方あるので、共通の
     「.q-fig2 svg は高さ54mm」だと目盛りの数字が1.5mmになって読めない
     （teacher.php に .q-fig2 svg.gridfig の高さ指定がある） */
  svg.setAttribute("class","gridfig");
  const gx=x=>pad+(x+R)*u, gy=y=>pad+(R-y)*u;
  svg._gx=gx; svg._gy=gy; svg._R=R; svg._u=u;
  /* 方眼 */
  for(let i=-R;i<=R;i++){
    const l1=document.createElementNS(SVGNS,"line");
    l1.setAttribute("x1",gx(i));l1.setAttribute("y1",gy(-R));l1.setAttribute("x2",gx(i));l1.setAttribute("y2",gy(R));
    l1.setAttribute("stroke",i===0?"#4a443c":"#E3DACA");l1.setAttribute("stroke-width",i===0?1.6:1);
    svg.appendChild(l1);
    const l2=document.createElementNS(SVGNS,"line");
    l2.setAttribute("x1",gx(-R));l2.setAttribute("y1",gy(i));l2.setAttribute("x2",gx(R));l2.setAttribute("y2",gy(i));
    l2.setAttribute("stroke",i===0?"#4a443c":"#E3DACA");l2.setAttribute("stroke-width",i===0?1.6:1);
    svg.appendChild(l2);
  }
  /* 矢印・ラベル */
  const arr=(x1,y1,x2,y2)=>{const p=document.createElementNS(SVGNS,"path");p.setAttribute("d",`M${x1} ${y1} L${x2} ${y2}`);p.setAttribute("stroke","#4a443c");p.setAttribute("stroke-width",1.6);svg.appendChild(p);};
  arr(gx(R),gy(0),gx(R)-7,gy(0)-4);arr(gx(R),gy(0),gx(R)-7,gy(0)+4);
  arr(gx(0),gy(R),gx(0)-4,gy(R)+7);arr(gx(0),gy(R),gx(0)+4,gy(R)+7);
  const lab=(t,x,y,anchor)=>{const e=document.createElementNS(SVGNS,"text");e.textContent=t;e.setAttribute("x",x);e.setAttribute("y",y);e.setAttribute("font-size",13);e.setAttribute("font-style","italic");e.setAttribute("fill","#4a443c");if(anchor)e.setAttribute("text-anchor",anchor);svg.appendChild(e);};
  lab("x",gx(R)-2,gy(0)+16);lab("y",gx(0)+8,gy(R)+10);lab("O",gx(0)-6,gy(0)+14,"end");
  /* 目盛(5ごと) */
  const step=R>8?5:2;
  for(let i=-R;i<=R;i++){
    if(i===0||i%step!==0)continue;
    const t1=document.createElementNS(SVGNS,"text");t1.textContent=i;t1.setAttribute("x",gx(i));t1.setAttribute("y",gy(0)+14);t1.setAttribute("font-size",10);t1.setAttribute("text-anchor","middle");t1.setAttribute("fill","#8a8074");svg.appendChild(t1);
    const t2=document.createElementNS(SVGNS,"text");t2.textContent=i;t2.setAttribute("x",gx(0)-5);t2.setAttribute("y",gy(i)+3);t2.setAttribute("font-size",10);t2.setAttribute("text-anchor","end");t2.setAttribute("fill","#8a8074");svg.appendChild(t2);
  }
  return svg;
}
function drawLineOn(svg,a,b,color,dash){
  const R=svg._R, av=rVal(a), bv=rVal(b);
  /* クリップ境界との交点2つを求める */
  const pts=[];
  const yAt=x=>av*x+bv;
  [[-R,yAt(-R)],[R,yAt(R)]].forEach(p=>{if(Math.abs(p[1])<=R)pts.push(p);});
  if(av!==0){
    [[( R-bv)/av, R],[(-R-bv)/av,-R]].forEach(p=>{if(Math.abs(p[0])<=R)pts.push(p);});
  }
  pts.sort((p,q)=>p[0]-q[0]);
  if(pts.length<2)return;
  const p1=pts[0],p2=pts[pts.length-1];
  const l=document.createElementNS(SVGNS,"line");
  l.setAttribute("x1",svg._gx(p1[0]));l.setAttribute("y1",svg._gy(p1[1]));
  l.setAttribute("x2",svg._gx(p2[0]));l.setAttribute("y2",svg._gy(p2[1]));
  l.setAttribute("stroke",color);l.setAttribute("stroke-width",2.6);l.setAttribute("stroke-linecap","round");
  if(dash)l.setAttribute("stroke-dasharray","6 5");
  svg.appendChild(l);
  return {p1,p2};
}
function drawPointOn(svg,x,y,color,r){
  const c=document.createElementNS(SVGNS,"circle");
  c.setAttribute("cx",svg._gx(x));c.setAttribute("cy",svg._gy(y));
  c.setAttribute("r",r||5);c.setAttribute("fill",color);
  c.setAttribute("stroke","#fff");c.setAttribute("stroke-width",1.5);
  svg.appendChild(c);return c;
}
/* 線分(端で止まる線)。無限に伸びる drawLineOn とは別物 */
function drawSegOn(svg,P,Q,color,w){
  const l=document.createElementNS(SVGNS,"line");
  l.setAttribute("x1",svg._gx(P[0]));l.setAttribute("y1",svg._gy(P[1]));
  l.setAttribute("x2",svg._gx(Q[0]));l.setAttribute("y2",svg._gy(Q[1]));
  l.setAttribute("stroke",color);l.setAttribute("stroke-width",w||3);l.setAttribute("stroke-linecap","round");
  svg.appendChild(l);
  return l;
}
/* 座標を読み取るための点線(わかっている方の軸から点まで) */
function drawGuideOn(svg,x,y,known){
  const l=document.createElementNS(SVGNS,"line");
  if(known==="x"){
    l.setAttribute("x1",svg._gx(x));l.setAttribute("y1",svg._gy(0));
    l.setAttribute("x2",svg._gx(x));l.setAttribute("y2",svg._gy(y));
  }else{
    l.setAttribute("x1",svg._gx(0));l.setAttribute("y1",svg._gy(y));
    l.setAttribute("x2",svg._gx(x));l.setAttribute("y2",svg._gy(y));
  }
  l.setAttribute("stroke","var(--gold)");l.setAttribute("stroke-width",1.6);
  l.setAttribute("stroke-dasharray","5 4");
  svg.appendChild(l);
}
/* 点のよこに A / B などの名前を出す(右寄りの点は左側に置いて枠外に出さない) */
function ptLabel(svg,x,y,text,color){
  const right=x>svg._R*0.55;
  const e=document.createElementNS(SVGNS,"text");
  e.textContent=text;
  e.setAttribute("x",svg._gx(x)+(right?-9:9));
  e.setAttribute("text-anchor",right?"end":"start");
  e.setAttribute("y",Math.max(13,svg._gy(y)-8));
  e.setAttribute("font-size",14);e.setAttribute("fill",color);e.setAttribute("font-weight","bold");
  svg.appendChild(e);
}
function shadeTri(svg,tri){
  const p=document.createElementNS(SVGNS,"polygon");
  p.setAttribute("points",tri.map(v=>svg._gx(v[0])+","+svg._gy(v[1])).join(" "));
  p.setAttribute("fill","rgba(201,85,111,.18)");
  p.setAttribute("stroke","var(--sakura-deep)");
  p.setAttribute("stroke-width",1.2);
  svg.appendChild(p);
}
function lineLabel(svg,ln,text,color){
  if(!ln||!ln.p1||!ln.p2)return;
  /* 線の「上に伸びている側」の端に置く。右下がりの線を右端(＝図の下)に
     置くと x軸の目盛りと重なって読めないため。
     p1 は左端・p2 は右端(drawLineOn が x 順に返す)。 */
  const useP1=ln.p1[1]>=ln.p2[1];
  const top=useP1?ln.p1:ln.p2;
  const e=document.createElementNS(SVGNS,"text");
  e.textContent=text;
  e.setAttribute("x",svg._gx(top[0])+(useP1?5:-5));
  e.setAttribute("text-anchor",useP1?"start":"end");
  /* 上端から出ていく線はラベルが枠外に切れるので下げる */
  e.setAttribute("y",Math.max(13,svg._gy(top[1])-6));
  e.setAttribute("font-size",13);e.setAttribute("fill",color);e.setAttribute("font-weight","bold");
  svg.appendChild(e);
}

/* ---------- render figure ---------- */
function renderFig(fig){
  const wrap=document.getElementById("figWrap");
  wrap.innerHTML="";
  document.getElementById("clearPtsBtn").style.display="none";
  if(!fig)return;
  const R=fig.range||8;
  const svg=makeGrid(R,360);
  wrap.appendChild(svg);
  if(fig.kind==="line"||fig.kind==="twolines"||fig.kind==="linept"){
    (fig.lines||[]).forEach(l=>{
      const seg=drawLineOn(svg,l.a,l.b,l.color);
      if(l.label)lineLabel(svg,seg,l.label,l.color);
    });
    /* 通る座標: 点Pと，わかっている方の軸からの点線を出す(値そのものは読ませる) */
    if(fig.kind==="linept"&&fig.pt){
      drawGuideOn(svg,fig.pt.x,fig.pt.y,fig.known);
      drawPointOn(svg,fig.pt.x,fig.pt.y,"var(--gold)",5.5);
      ptLabel(svg,fig.pt.x,fig.pt.y,"P","var(--ink)");
    }
    if(fig.kind==="twolines"&&fig.pt&&!graded){/* 交点は答えなので採点前は描かない */}
  }
  if(fig.kind==="points"){
    if(fig.seg)drawSegOn(svg,fig.seg[0],fig.seg[1],"var(--sakura-deep)");
    if(fig.pivot)drawPointOn(svg,fig.pivot.x,fig.pivot.y,"var(--gold)",5);  /* 回転の中心 */
    fig.points.forEach(p=>drawPointOn(svg,p.x,p.y,"var(--sakura-deep)"));
    (fig.labels||[]).forEach(l=>ptLabel(svg,l.x,l.y,l.t,"var(--ink)"));
  }
  if(fig.kind==="tri"){
    (fig.lines||[]).forEach(l=>{
      const seg=drawLineOn(svg,l.a,l.b,l.color);
      if(l.label)lineLabel(svg,seg,l.label,l.color);
    });
    shadeTri(svg,fig.tri);
    /* 面積の2等分: 頂点に A / B / C の名前を出す(問題文が頂点名で指定するため) */
    (fig.pts||[]).forEach(p=>drawPointOn(svg,p.x,p.y,"var(--sakura-deep)",5));
    (fig.labels||[]).forEach(l=>ptLabel(svg,l.x,l.y,l.t,"var(--ink)"));
  }
  if(fig.kind==="draw"){
    svg.style.cursor="crosshair";
    svg.id="drawSvg";
    document.getElementById("clearPtsBtn").style.display="inline-block";
    const hint=document.createElement("div");
    hint.className="fig-hint";
    hint.textContent=(cur&&cur.ans&&cur.ans.kind==="drawseg")
      ? "① グラフが通る格子点を2つタップ(実線の部分が変域)"
      : "格子点をタップ(2点で直線が決まる)";
    wrap.appendChild(hint);
    const handler=ev=>{
      if(graded)return;
      const rect=svg.getBoundingClientRect();
      const scale=360/rect.width;
      const px=(ev.clientX-rect.left)*scale, py=(ev.clientY-rect.top)*scale;
      const x=Math.round((px-16)/svg._u - R);
      const y=Math.round(R-(py-16)/svg._u);
      if(Math.abs(x)>R||Math.abs(y)>R)return;
      const i=drawPts.findIndex(p=>p.x===x&&p.y===y);
      if(i>=0){drawPts.splice(i,1);}
      else{
        if(drawPts.length>=2)drawPts.shift();
        drawPts.push({x,y});
      }
      redrawUserLine();
    };
    svg.addEventListener("pointerdown",handler);
  }
}
function redrawUserLine(){
  const svg=document.getElementById("drawSvg");
  if(!svg)return;
  svg.querySelectorAll(".upt,.uln,.uhi").forEach(e=>e.remove());
  if(drawPts.length===2){
    const [P,Q]=drawPts;
    if(P.x!==Q.x){
      const a=rmk(Q.y-P.y,Q.x-P.x);
      const b=rsub(rmk(P.y),rmul(a,rmk(P.x)));
      /* 変域モードは「変域の外は点線・変域の中は実線」で表す。
         点線の直線を先に引き，その上に実線の線分を重ねる。 */
      if(cur&&cur.ans&&cur.ans.kind==="drawseg"){
        const p=cur.ans.p, q=cur.ans.q;
        const yp=rVal(radd(rmul(a,rmk(p)),b)), yq=rVal(radd(rmul(a,rmk(q)),b));
        drawLineOn(svg,a,b,"rgba(201,85,111,.5)",true);
        svg.lastChild.classList.add("uln");
        drawSegOn(svg,[p,yp],[q,yq],"var(--sakura-deep)",3.6).classList.add("uhi");
        /* 変域の両端は金色。タップした点(朱)と見分けがつくようにする */
        [[p,yp],[q,yq]].forEach(w=>{
          drawPointOn(svg,w[0],w[1],"var(--gold)",5).classList.add("uhi");
        });
      }else{
        drawLineOn(svg,a,b,"var(--sakura-deep)");
        svg.lastChild.classList.add("uln");
      }
    }else{
      /* 垂直線プレビュー */
      const l=document.createElementNS(SVGNS,"line");
      l.setAttribute("x1",svg._gx(P.x));l.setAttribute("y1",svg._gy(-svg._R));
      l.setAttribute("x2",svg._gx(P.x));l.setAttribute("y2",svg._gy(svg._R));
      l.setAttribute("stroke","var(--sakura-deep)");l.setAttribute("stroke-width",2.6);
      l.classList.add("uln");svg.appendChild(l);
    }
  }
  drawPts.forEach(p=>{
    const c=drawPointOn(svg,p.x,p.y,"var(--sakura-deep)",6);
    c.classList.add("upt");
  });
}

/* ---------- render answer UI ---------- */
/* 6択のボタン群。choice モード / 式をつくる①/ 変域モードの② で共用する */
function makeChoiceGroup(ch){
  const g=document.createElement("div");
  g.className="choices"+(ch.short?" short":"");
  ch.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.className="choiceBtn";
    b.innerHTML=`<span class="inner">${c}</span>`;
    b.addEventListener("click",()=>{
      if(graded)return;
      selChoice=i;
      g.querySelectorAll(".choiceBtn").forEach((x,j)=>x.classList.toggle("sel",j===i));
    });
    g.appendChild(b);
  });
  return g;
}
/* 採点後の色づけは共通モジュール divp-choice-mark.js にまかせる
   (正解=緑 / 選んだ誤答=朱 / 選ばなかった正解=緑＋「正解」バッジ) */
/* 採点表示は共通モジュール divp-choice-mark.js にまかせる。
   dimOthers:true で「正解でも選んでもいない選択肢」も薄く印を付ける
   ＝どの選択肢にも状態が付く（他のツールと同じ見え方。付け漏れがあると
     どれが答えだったのか読み取りにくい） */
function markChoices(correct){
  safeDivp("markChoices","#ansArea .choiceBtn",{correct:correct,selected:selChoice,dimOthers:true});
}
function renderAns(ans){
  const area=document.getElementById("ansArea");
  area.innerHTML="";
  selChoice=-1;selOx=-1;orderSeq=[];drawPts=[];activeField=0;
  if(ans.kind==="order"){
    const lab=document.createElement("div");
    lab.className="stepLab ordLab";
    lab.innerHTML=`<i>順</i><span>${T("\\text{①}\\to\\text{②}\\to\\text{③}")} の順にタップ</span><b id="ordCnt">0 / 3</b>`;
    area.appendChild(lab);
    const g=document.createElement("div");g.className="choices";
    ans.choices.forEach((c,i)=>{
      const b=document.createElement("button");
      b.className="choiceBtn ordable";
      b.innerHTML=`<span class="ordNum"></span><span class="inner">${c}</span>`;
      b.addEventListener("click",()=>{
        if(graded)return;
        const at=orderSeq.indexOf(i);
        if(at>=0)orderSeq.splice(at,1);            /* もう一度押したら取り消し */
        else if(orderSeq.length<3)orderSeq.push(i);
        else return;                                /* 3つ選んだら「選び直す」で消す */
        refreshOrder(g);
      });
      g.appendChild(b);
    });
    area.appendChild(g);
    renderTexIn(area);
    g.querySelectorAll(".choiceBtn .inner").forEach(el=>fitEl(el,el.parentElement.clientWidth-56));
    document.getElementById("clearPtsBtn").style.display="inline-block";
  }
  if(ans.kind==="eqox"){
    /* ① 式を6択で選ぶ */
    const s1=document.createElement("div");s1.className="eqStep";
    s1.innerHTML=`<div class="stepLab"><i>1</i>${T("y")} を ${T("x")} の式で表すと？</div>`;
    const g=makeChoiceGroup(ans);
    s1.appendChild(g);
    area.appendChild(s1);
    renderTexIn(s1);
    g.querySelectorAll(".choiceBtn .inner").forEach(el=>fitEl(el,el.parentElement.clientWidth-16));
    /* ② 一次関数かどうかを ○× で答える */
    const s2=document.createElement("div");s2.className="eqStep";
    s2.innerHTML=`<div class="stepLab"><i>2</i>${T("y")} は ${T("x")} の一次関数といえる？</div>`;
    const row=document.createElement("div");row.className="oxRow";
    [["○","いえる"],["×","いえない"]].forEach((o,i)=>{
      const b=document.createElement("button");
      b.className="oxBtn";
      b.innerHTML=`${o[0]}<small>${o[1]}</small>`;
      b.addEventListener("click",()=>{
        if(graded)return;
        selOx=i;
        row.querySelectorAll(".oxBtn").forEach((x,j)=>x.classList.toggle("sel",j===i));
      });
      row.appendChild(b);
    });
    s2.appendChild(row);
    area.appendChild(s2);
    renderTexIn(s2);
  }
  if(ans.kind==="choice"){
    /* 値だけを選ばせるときは「何を答えるのか」を上に出す(例: 変化の割合) */
    if(ans.prompt){
      const lab=document.createElement("div");
      lab.className="stepLab";
      lab.innerHTML=`<i>答</i><span>${T(ans.prompt)}は？</span>`;
      area.appendChild(lab);
      renderTexIn(lab);
    }
    const g=makeChoiceGroup(ans);
    area.appendChild(g);
    renderTexIn(g);
    g.querySelectorAll(".choiceBtn .inner").forEach(el=>fitEl(el,el.parentElement.clientWidth-16));
  }
  /* 変域モード: ① グラフをかく(上のSVG) → ② y の変域を6択で選ぶ */
  if(ans.kind==="drawseg"&&ans.rc){
    const lab=document.createElement("div");
    lab.className="stepLab";
    lab.innerHTML=`<i>2</i>${T("y")} の変域は？`;
    area.appendChild(lab);
    renderTexIn(lab);
    const g=makeChoiceGroup(ans.rc);
    area.appendChild(g);
    renderTexIn(g);
    g.querySelectorAll(".choiceBtn .inner").forEach(el=>fitEl(el,el.parentElement.clientWidth-16));
    return;
  }
  if(ans.kind==="input"||ans.kind==="drawseg"){
    const f=document.createElement("div");f.className="fields";
    if(ans.kind==="drawseg"){
      const lab=document.createElement("div");
      lab.className="stepLab";
      lab.innerHTML=`<i>2</i>${T("y")} の変域は？`;
      area.appendChild(lab);
      renderTexIn(lab);
    }
    if(ans.pre){
      const pre=document.createElement("div");pre.className="field";
      pre.innerHTML=`<span class="flab">${T(ans.pre)}</span><span style="color:var(--ink-soft);margin:0 4px;">→</span>`;
      f.appendChild(pre);
    }
    ans.fields.forEach((fd,i)=>{
      const w=document.createElement("div");w.className="field";
      w.innerHTML=`<span class="flab">${T(fd.label)}</span>`;
      const box=document.createElement("div");
      box.className="fbox"+(i===0?" act":"");
      box.dataset.idx=i;
      box.addEventListener("click",()=>{
        if(graded)return;
        activeField=i;
        area.querySelectorAll(".fbox").forEach(x=>x.classList.toggle("act",+x.dataset.idx===i));
      });
      w.appendChild(box);
      f.appendChild(w);
    });
    area.appendChild(f);
    /* tenkey */
    const tk=document.createElement("div");tk.className="tenkey";
    [["1","2","3","4","5"],["6","7","8","9","0"],["−","/",".","⌫","C"]].forEach(row=>{
      row.forEach(k=>{
        const b=document.createElement("button");
        b.textContent=k;
        if("−/.⌫C".includes(k))b.classList.add("op");
        b.addEventListener("click",()=>keyIn(k));
        tk.appendChild(b);
      });
    });
    area.appendChild(tk);
    renderTexIn(f);
  }
}
/* 選んだ順に ①②③ のバッジを振り直す */
function refreshOrder(g){
  g=g||document.querySelector("#ansArea .choices");
  if(!g)return;
  g.querySelectorAll(".choiceBtn").forEach((b,i)=>{
    const at=orderSeq.indexOf(i);
    b.classList.toggle("ord",at>=0);
    b.querySelector(".ordNum").textContent=at>=0?ORDNUM[at]:"";
  });
  const c=document.getElementById("ordCnt");
  if(c)c.textContent=orderSeq.length+" / 3";
}
function keyIn(k){
  if(graded)return;
  const boxes=[...document.querySelectorAll(".fbox")];
  const box=boxes.find(b=>+b.dataset.idx===activeField);
  if(!box)return;
  let s=box.textContent;
  if(k==="C")s="";
  else if(k==="⌫")s=s.slice(0,-1);
  else if(k==="−"){s+= "-";}
  else s+=k;
  if(s.length>10)return;
  box.textContent=s;
  /* 自動で次のフィールドへは移動しない(明示タップ) */
}

/* ---------- fit helpers ---------- */
function fitEl(el,maxW){
  el.style.transform="";
  const w=el.scrollWidth;
  if(w>maxW){
    const sc=Math.max(0.4,maxW/w);
    el.style.transform=`scale(${sc})`;
  }
}
function fitQuestion(){
  /* 問題文は文章なので縮小せず折り返す */
  const q=document.getElementById("qText");
  q.style.transform="";
  q.style.whiteSpace="normal";
}

/* ---------- flow ---------- */
function newQuestion(){
  graded=false;
  const tag=document.getElementById("qTag");
  if(retryQ&&!retryQ.length){                   /* 解き直しを1周した */
    retryQ=null;
    retryBanner("解き直し おつかれさま！ 同じ問題に2回連続で正解すると リストから消えるよ");
  }
  let useMode, seed, retryInfo="";
  if(retryQ){                                   /* 解き直し: 保存した種で同じ問題を出す */
    const it=retryQ.shift();
    retryDone++;
    useMode=it.question_params.m;
    seed=it.question_params.s>>>0;
    retryInfo="解き直し "+retryDone+" / "+retryTotal;
  }else{
    if(mode==="mix"&&!mixKeys().length){        /* 1つもえらばれていない */
      cur=null;
      tag.style.display="none";
      document.getElementById("toast").textContent="";
      document.getElementById("explain").style.display="none";
      document.getElementById("nextBtn").style.display="none";
      document.getElementById("checkBtn").style.display="none";
      document.getElementById("ansArea").innerHTML="";
      renderFig(null);
      const q0=document.getElementById("qText");
      q0.style.transform="";
      q0.innerHTML="上の「出題する種類をえらぶ」で，練習したい種類にチェックを入れてね。";
      return;
    }
    /* ミックスは毎問，チェックした種類の中から1つえらぶ */
    useMode=(mode==="mix")?pickMixMode():mode;
    seed=rngPick();
    if(mode==="mix")mixLast=useMode;
  }
  if(retryInfo){tag.style.display="block";tag.textContent=retryInfo+" ・ "+modeLabel(useMode);}
  else if(mode==="mix"){tag.style.display="block";tag.textContent=modeLabel(useMode);}
  else tag.style.display="none";
  curMode=useMode;
  curSeed=seed;
  rngSeed(seed);                                /* ここから先の乱数は種で決まる */
  cur=GENS[useMode]();
  /* グラフをかく以外の解答は6択に組み直す(ジェネレータは値を返すだけでよい) */
  if(cur.ans.kind==="input")cur.ans=inputToChoice(cur.ans);
  /* 変域モードは①グラフをかく＋②変域を答える。②だけを6択にする */
  if(cur.ans.kind==="drawseg")cur.ans.rc=inputToChoice({fields:cur.ans.fields});
  document.getElementById("toast").textContent="";
  document.getElementById("explain").style.display="none";
  document.getElementById("nextBtn").style.display="none";
  document.getElementById("checkBtn").style.display="inline-block";
  const q=document.getElementById("qText");
  q.style.transform="";
  q.innerHTML=cur.qHtml;
  renderTexIn(q);
  renderFig(cur.fig);
  renderAns(cur.ans);
  requestAnimationFrame(fitQuestion);
  /* 図は「正解を重ねる前」に撮る。1問の所要時間もここから数える */
  figSnap=figureSnapshot();
  qStart=Date.now();
}

function check(){
  if(graded||!cur)return;
  const ans=cur.ans;
  let userStr="", ok=false, missMsg="おしい！ 解説を読んでもう一度挑戦しよう";
  if(ans.kind==="order"){
    if(orderSeq.length<3){toast("①→②→③ の順に3つえらんでね（残り"+(3-orderSeq.length)+"つ）");return;}
    ok=orderSeq.every((v,i)=>v===ans.seq[i]);
    userStr=ordPlain(ans,orderSeq);
    /* 採点後は「正しい番号」をバッジに出す(ダミーの式はバッジなし) */
    document.querySelectorAll(".choiceBtn").forEach((b,i)=>{
      const cp=ans.seq.indexOf(i), sp=orderSeq.indexOf(i);
      b.classList.remove("ord");
      b.querySelector(".ordNum").textContent=cp>=0?ORDNUM[cp]:"";
      /* 正しい位置に置けた=緑 / まったく選ばなかった正解=緑＋バッジ /
         位置ちがい・ダミーを選んだ=朱 */
      safeDivp("markChoice",b,
        (cp>=0&&cp===sp) ? "correct"
        : (cp>=0&&sp<0)  ? "answer"
        : (cp>=0||sp>=0) ? "wrong" : null);
    });
    const nHit=orderSeq.filter((v,i)=>v===ans.seq[i]).length;
    if(!ok&&nHit>0)missMsg=nHit+"つは合っているよ！ 残りをグラフで確かめよう";
  }
  else if(ans.kind==="eqox"){
    if(selChoice<0){toast("① 式をえらんでね");return;}
    if(selOx<0){toast("② ○ か × をえらんでね");return;}
    const okEq=(selChoice===ans.correct), okOx=((selOx===0)===ans.lin);
    ok=okEq&&okOx;
    userStr=(ans.plain?ans.plain[selChoice]:"式:"+selChoice)+" / "+(selOx===0?"○":"×");
    markChoices(ans.correct);
    safeDivp("markChoices",".oxBtn",{correct:ans.lin?0:1,selected:selOx,dimOthers:true});
    if(okEq&&!okOx)missMsg="式は合っているよ！ 一次関数かどうかをもう一度考えよう";
    else if(!okEq&&okOx)missMsg="○×は合っているよ！ 式の立て方を解説で確かめよう";
  }
  else if(ans.kind==="choice"){
    if(selChoice<0){toast("答えを選んでね");return;}
    ok=(selChoice===ans.correct);
    userStr=ans.plain?ans.plain[selChoice]:"choice:"+selChoice;
    markChoices(ans.correct);
  }
  else if(ans.kind==="input"){
    const boxes=[...document.querySelectorAll(".fbox")];
    const vals=boxes.map(b=>b.textContent.trim());
    if(vals.some(v=>v==="")){toast("答えを入れてね");return;}
    const rats=vals.map(parseRat);
    if(rats.some(r=>r===null)){toast("数の形を確かめてね(例: -3, 1/2, 4.5)");return;}
    ok=rats.every((r,i)=>rEq(r,ans.fields[i].val));
    userStr=vals.join(",");
    boxes.forEach((b,i)=>{
      b.style.borderColor=rEq(rats[i],ans.fields[i].val)?"var(--moss)":"var(--sakura-deep)";
      b.style.background=rEq(rats[i],ans.fields[i].val)?"#E8F1E4":"#FBE7EA";
    });
  }
  else if(ans.kind==="drawseg"){
    if(drawPts.length<2){toast("① グラフが通る点を2つタップしてね");return;}
    if(selChoice<0){toast("② y の変域をえらんでね");return;}
    /* かいた直線そのものが合っているかで判定する(タップする2点はグラフ上ならどこでもよい) */
    const [P,Q]=drawPts;
    let okDraw=false;
    if(P.x!==Q.x){
      const ua=rmk(Q.y-P.y,Q.x-P.x);
      const ub=rsub(rmk(P.y),rmul(ua,rmk(P.x)));
      okDraw=rEq(ua,ans.a)&&rEq(ub,ans.b);
    }
    const okRange=(selChoice===ans.rc.correct);
    ok=okDraw&&okRange;
    userStr=drawPts.map(p=>`(${p.x},${p.y})`).join(" ")+" / "+ans.rc.plain[selChoice];
    markChoices(ans.rc.correct);
    /* 正しい直線と，変域にあたる部分を重ねて見せる */
    const svg=document.getElementById("drawSvg");
    if(svg){
      if(!okDraw)drawLineOn(svg,ans.a,ans.b,"var(--moss)",true);
      drawSegOn(svg,[ans.pts[0].x,ans.pts[0].y],[ans.pts[1].x,ans.pts[1].y],"var(--moss)",4);
      ans.pts.forEach(w=>drawPointOn(svg,w.x,w.y,"var(--moss)",6));
    }
    if(okDraw&&!okRange)missMsg="直線は合っているよ！ 変域の両端の y の値をもう一度確かめよう";
    else if(!okDraw&&okRange)missMsg="y の変域は合っているよ！ 直線が合っているか確かめよう";
  }
  else if(ans.kind==="draw"){
    if(drawPts.length<2){toast("グラフが通る点を2つ選んでね");return;}
    const [P,Q]=drawPts;
    if(P.x===Q.x){ok=false;}
    else{
      const ua=rmk(Q.y-P.y,Q.x-P.x);
      const ub=rsub(rmk(P.y),rmul(ua,rmk(P.x)));
      ok=rEq(ua,ans.a)&&rEq(ub,ans.b);
    }
    userStr=drawPts.map(p=>`(${p.x},${p.y})`).join(" ");
    /* 正解の線を重ねる */
    const svg=document.getElementById("drawSvg");
    if(svg&&!ok)drawLineOn(svg,ans.a,ans.b,"var(--moss)",true);
  }
  graded=true;
  document.getElementById("checkBtn").style.display="none";
  document.getElementById("nextBtn").style.display="inline-block";

  /* 交点モード: 採点後に交点マーカーを表示 */
  if(cur.fig&&cur.fig.kind==="twolines"&&cur.fig.pt){
    const svg=document.querySelector("#figWrap svg");
    if(svg)drawPointOn(svg,cur.fig.pt.x,cur.fig.pt.y,"var(--gold)",6);
  }
  /* 面積の2等分: 採点後に中線(頂点→対辺の中点M)を重ねて，なぜ2等分かを見せる */
  if(cur.fig&&cur.fig.bisect){
    const svg=document.querySelector("#figWrap svg");
    if(svg){
      const bs=cur.fig.bisect;
      drawSegOn(svg,[bs.from.x,bs.from.y],[bs.mid.x,bs.mid.y],"var(--moss)",3);
      drawPointOn(svg,bs.mid.x,bs.mid.y,"var(--moss)",5.5);
      ptLabel(svg,bs.mid.x,bs.mid.y,"M","var(--moss)");
    }
  }
  /* 傾きの範囲: 採点後に境界の2直線を点線で重ねる(切片は問題ごとに固定) */
  if(cur.fig&&cur.fig.bounds){
    const svg=document.querySelector("#figWrap svg");
    const bb=cur.fig.boundB||rmk(0);
    if(svg)cur.fig.bounds.forEach(s=>drawLineOn(svg,s,bb,"var(--moss)",true));
  }

  const correctStr=texToPlain(describeAnswer(ans));
  if(ok){
    streak++;perfectRun++;
    /* 「+10 XP」の代わりに連続の伸びだけ出す(XPはサーバー側が持つ) */
    toast(streak>=3?("連続 "+streak+" 問正解！"):"");
    correctEffect();
  }else{
    streak=0;perfectRun=0;
    toast(missMsg);
    incorrectEffect();
    document.getElementById("card").classList.remove("shake");
    void document.getElementById("card").offsetWidth;
    document.getElementById("card").classList.add("shake");
  }
  updHUD();
  showExplain();
  /* ── 学習記録（判定直後に1行）──────────────────────────────
     question_key はモード名そのまま(CLAUDE.md 設計判断3)。
     question_params は {m:モード, s:種} だけで、この2つがあれば
     ?retry=1 で同じ問題を作り直せる(復元用のロジックはPHP側に置かない)。
     未ログイン・file:// では divp-core が黙ってスキップする。 */
  const qSec=qStart?Math.max(1,Math.round((Date.now()-qStart)/1000)):0;
  safeDivp("answer",ok,{
    question_key:curMode,
    question_params:{m:curMode,s:curSeed},
    question_text:qTextPlain(),
    /* 図やグラフが無いと紙で解き直せない問題用(誤答時だけ保存される)。
       出題直後のスナップショット＝正解の線は写っていない */
    question_figure:figSnap,
    /* 「式の特徴」だけは選択肢も保存する(並んだ式から選ぶ問題は選択肢が無いと紙で解けない) */
    question_choices:choicesForRecord(),
    correct_answer:correctStr,
    wrong_answer:texToPlain(userStr),
    /* 離席ぶんを混ぜないよう10分超は記録しない(愛知大問1と同じ扱い) */
    time_taken_sec:(qSec>0&&qSec<=600)?qSec:null
  });
}
/* ①②③ の並びを記録用の平文にする(選んでいない枠は「?」) */
function ordPlain(ans,seq){
  if(!ans.plain)return seq.join("-");
  return ORDNUM.map((n,i)=>n+(seq[i]>=0&&seq[i]!==undefined?ans.plain[seq[i]]:"?")).join(" ");
}
function describeAnswer(ans){
  if(ans.kind==="order")return ordPlain(ans,ans.seq);
  if(ans.kind==="drawseg")return ans.pts.map(p=>"("+p.x+","+p.y+")").join(" ")
    +" / "+(ans.rc?ans.rc.plain[ans.rc.correct]:ans.fields.map(f=>ratPlain(f.val)).join("〜"));
  if(ans.kind==="eqox")return (ans.plain?ans.plain[ans.correct]:"式:"+ans.correct)+" / "+(ans.lin?"○":"×");
  if(ans.kind==="choice")return ans.plain?ans.plain[ans.correct]:"choice:"+ans.correct;
  if(ans.kind==="input")return ans.fields.map(f=>f.val.n+(f.val.d>1?"/"+f.val.d:"")).join(",");
  if(ans.kind==="draw")return lineTexPlain(ans.a,ans.b);
  return "";
}
/* 記録用の平文。分数は講師画面の規約どおり F(分子/分母) で書く */
function lineTexPlain(a,b){
  const ax=rEq(a,rmk(1))?"x":(rEq(a,rmk(-1))?"-x":ratPlain(a)+"x");
  if(b.n===0)return "y="+ax;
  return "y="+ax+(b.n>0?"+":"")+ratPlain(b);
}
/* ---------- 記録用のテキスト・図（講師/保護者画面向け） ----------
   TeX → プレーンテキスト。分数は必ず F(分子/分母) にする
   （生の "/" だと「6xy/2x」のような除算と区別できない。CLAUDE.md 2a の規約で、
     mypage.php / retry.php / teacher.php の renderMathToHTML が縦組みに戻す） */
function texToPlain(tex){
  let s=String(tex);
  s=s.replace(/\^\{2\}/g,"²").replace(/\^2/g,"²").replace(/\^\{3\}/g,"³").replace(/\^3/g,"³");
  /* \text{} / \mathrm{} / \dfrac{}{} は内側から畳む(入れ子があるので繰り返す) */
  for(let i=0;i<8;i++){
    const t=s.replace(/\\text\{([^{}]*)\}/g,"$1")
             .replace(/\\mathrm\{([^{}]*)\}/g,"$1")
             .replace(/\\(?:dfrac|frac)\{([^{}]*)\}\{([^{}]*)\}/g,"F($1/$2)");
    if(t===s)break;
    s=t;
  }
  return s
    .replace(/\\ell_1/g,"ℓ₁").replace(/\\ell_2/g,"ℓ₂").replace(/\\ell_3/g,"ℓ₃").replace(/\\ell/g,"ℓ")
    .replace(/\\times/g,"×").replace(/\\div/g,"÷")
    .replace(/\\leqq/g,"≦").replace(/\\geqq/g,"≧")
    .replace(/\\Rightarrow/g,"⇒").replace(/\\Leftrightarrow/g,"⇔").replace(/\\to/g,"→")
    .replace(/\\triangle/g,"△").replace(/\\cap/g,"∩").replace(/\\ne/g,"≠").replace(/\\sim/g,"∽")
    .replace(/\\pi/g,"π")
    .replace(/\\left|\\right/g,"")
    .replace(/\\\\|\\,|\\ |\\!|\\;/g," ")
    .replace(/[{}]/g,"")
    .replace(/\s+/g," ").trim();
}
/* 問題文(qHtml)を1本のプレーンテキストに。
   表(対応表モード)は問題文にすると「x0123y-5-3」と潰れるので、
   本文からは外して question_figure 側に回す */
function qTextPlain(q){
  let h=String((q||cur||{}).qHtml||"");
  h=h.replace(/<table[\s\S]*?<\/table>/gi,"（下の表）").replace(/<br\s*\/?>/gi," ");
  /* タグ外しは正規表現ではなくブラウザにやらせる(不等号や実体参照で崩れない) */
  const d=document.createElement("div");
  d.innerHTML=h;
  return texToPlain(d.textContent||"");
}
/* 選択肢そのものが問題の中身になる種類だけ、選択肢も保存する。
   「式の特徴」は<b>並んだ式の中から選ぶ</b>問題なので、問題文と図だけ刷っても
   紙で解けない（「右上がりになる一次関数を選びなさい」だけでは答えが定まらない）。
   ほかの種類は答えが値や式そのもの＝記述式で解けるので保存しない
   （愛知大問1の KEEP_CHOICES と同じ考え方。CLAUDE.md の question_choices 参照）。 */
const KEEP_CHOICES={tokucho:1};
function choicesForRecord(){
  if(!KEEP_CHOICES[curMode])return null;
  const a=cur&&cur.ans;
  if(!a||!a.plain||a.plain.length<2)return null;
  return a.plain.map(v=>({t:"tex",v:texToPlain(v)}));
}
/* 図が無いと解けない問題用のスナップショット（誤答時だけ保存される）。
   ⚠ 採点後は正解の線を図に重ねるので、**出題直後に**撮っておくこと。
   ⚠ 画面のSVGは stroke="var(--indigo)" のようにCSS変数を使っているが、
     講師ページの解き直しプリントにはその変数が無い＝線が消える。
     ここで実際の色に置き換えてから保存する。 */
function figureSnapshot(){
  const svg=document.querySelector("#figWrap svg");
  if(svg){
    const cs=getComputedStyle(document.documentElement);
    return svg.outerHTML.replace(/var\((--[a-zA-Z0-9-]+)\)/g,
      (m,v)=>(cs.getPropertyValue(v)||"").trim()||"#33312B");
  }
  const m=/<table[\s\S]*?<\/table>/i.exec(String(cur&&cur.qHtml||""));
  return m?m[0]:null;
}
function showExplain(){
  const ex=document.getElementById("explain");
  const body=document.getElementById("exBody");
  body.innerHTML=cur.exLines.map(l=>`<div class="exLine">${l}</div>`).join("");
  renderTexIn(body);
  ex.style.display="block";
}
function toast(s){document.getElementById("toast").textContent=s;}
/* 正解=はんこ / 誤答=「ナイスチャレンジ！」バッジ（js/jh共通 divp-correct-jh.js）。
   第1引数のセレクタは必須。#card は overflow:visible にしてある
   （はんこは直径171pxで、hidden だと切れる） */
function correctEffect(){
  if(window.Divp&&typeof Divp.correct==="function"){Divp.correct("#card");return;}
  const h=document.getElementById("hanko");           /* モジュール未読込のときの自前演出 */
  h.classList.remove("pop");void h.offsetWidth;h.classList.add("pop");
  setTimeout(()=>h.classList.remove("pop"),1100);
}
function incorrectEffect(){
  if(window.Divp&&typeof Divp.incorrect==="function")Divp.incorrect("#card");
}

/* ---------- 解き直しモード(?retry=1) ----------
   マイページの「解き直し」から ?retry=1 付きで開かれたときだけ動く。
   question_params の {m:モード, s:種} で生成関数を回すと同じ問題が出るので、
   pending をその順に消化する。判定後は通常どおり Divp.answer が飛ぶ＝
   params_hash も同じなので、2連続正解で save_answer.php が mastered にする。 */
function initRetry(){
  if(!(window.Divp&&typeof Divp.getRetries==="function"))return;
  Divp.getRetries().then(items=>{
    const use=(items||[]).filter(it=>{
      const p=it&&it.question_params;
      return p&&GENS[p.m]&&typeof p.s==="number";
    });
    if(!use.length){
      retryBanner("解き直せる問題は まだありません。これからまちがえた問題が ここに入ります");
      return;
    }
    retryQ=use.slice();retryTotal=retryQ.length;retryDone=0;
    newQuestion();
  }).catch(()=>{});
}
/* 画面上部に数秒だけ出す帯(HTMLを増やさずJSだけで完結させる) */
function retryBanner(msg){
  const old=document.getElementById("retryBanner");
  if(old)old.remove();
  const d=document.createElement("div");
  d.id="retryBanner";d.textContent=msg;
  d.style.cssText="max-width:860px;margin:0 auto 10px;background:#FBF3E0;border:1.5px solid var(--gold);"
    +"border-radius:10px;padding:9px 12px;font-size:.8rem;color:#6E5518;line-height:1.5";
  const nav=document.getElementById("modeNav");
  nav.parentNode.insertBefore(d,nav);
  setTimeout(()=>{if(d.parentNode)d.remove();},9000);
}

/* ---------- events ---------- */
document.getElementById("modeNav").addEventListener("click",e=>{
  const c=e.target.closest(".chip");if(!c)return;
  mode=c.dataset.mode;
  retryQ=null;                                  /* 種類をえらび直したら解き直しモードを抜ける */
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  document.getElementById("mixBox").style.display=(mode==="mix")?"block":"none";
  newQuestion();
});
/* 「ぜんぶ外す」→「必要な種類だけチェック」がえらび直しの近道。
   0種類のときは問題を出さずに案内を出す(newQuestion が受け持つ) */
document.getElementById("mixAll").addEventListener("click",()=>{setMixAll(()=>true);if(mode==="mix"&&!cur)newQuestion();});
document.getElementById("mixBasic").addEventListener("click",()=>{setMixAll(isBasic);if(mode==="mix"&&!cur)newQuestion();});
document.getElementById("mixNone").addEventListener("click",()=>{
  setMixAll(()=>false);
  if(mode==="mix")newQuestion();
});
/* 設定パネルの開閉。えらび終わったら畳んで問題に集中できるようにする(初期は開) */
document.getElementById("mixFold").addEventListener("click",()=>{
  const box=document.getElementById("mixBox"), b=document.getElementById("mixFold");
  const fold=!box.classList.contains("folded");
  box.classList.toggle("folded",fold);
  b.textContent=fold?"ひらく":"とじる";
  b.setAttribute("aria-expanded",fold?"false":"true");
});
document.getElementById("checkBtn").addEventListener("click",check);
document.getElementById("nextBtn").addEventListener("click",newQuestion);
document.getElementById("clearPtsBtn").addEventListener("click",()=>{
  if(graded)return;
  if(cur&&cur.ans.kind==="order"){orderSeq=[];refreshOrder();return;}
  drawPts=[];redrawUserLine();
});
window.addEventListener("resize",fitQuestion);

/* KaTeX 読み込み後に再レンダリング */
window.addEventListener("load",()=>{renderTexIn(document.body);fitQuestion();});

/* 学習記録の開始(セッション・学習時間・ハートビートは divp-core にまかせる) */
safeDivp("init",UNIT_KEY);
buildMixBox();
updHUD();
newQuestion();
/* マイページの「解き直し」から来たときだけ、pending を同じ問題で出し直す */
if(/[?&]retry=1/.test(location.search)){try{initRetry();}catch(e){}}
