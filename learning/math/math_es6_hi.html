<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="only light">
<title>比マスター｜中京個別指導学院</title>
<meta name="description" content="小6算数の比を練習。比の値・等しい比・比を簡単にする（整数・小数・分数）・比の利用（一方を求める・全体を比で分ける）。「比ってなに？」をテープ図のアニメーションで解説。中京個別指導学院(神丘)の学習ツール。">
<!-- 本番(Heteml)ではサブセット自己ホストに差し替え -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 印刷シートのロゴ透かし（ChukyoPrint） -->
<script src="/assets/print-watermark.js"></script>
<style>
  :root{
    --paper:#FBFAF6;
    --grid:#ECE9E0;
    --sumi:#33312B;
    --usuzumi:#8B877C;
    --shu:#C73E2E;
    --kin:#C9A227;
    --ai:#2C5F8A;
    /* 答え合わせの色は共通モジュール(divp-choice-mark.js)の既定にそろえる */
    --divp-mark-ok:#3E8E5A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scrollbar-gutter:stable; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--sumi);
    font-family:"Zen Kaku Gothic New", sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;     /* ⚠ 横並び(row)にしない。共通ヘッダーが左端に縦長の帯になる */
    touch-action:manipulation;
  }
  .app{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:12px 14px calc(90px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }

  /* ---- ヘッダー ---- */
  header{ display:flex; align-items:center; gap:8px; }
  header h1{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:17px; font-weight:700; margin:0;
    letter-spacing:.04em;
  }
  header h1 .sub{
    display:block;
    font-size:11px; font-weight:500; color:var(--usuzumi);
    letter-spacing:.1em;
  }
  .mode-back{
    margin-left:auto;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:11px; font-weight:700;
    color:var(--ai);
    border:1.5px solid var(--ai);
    background:#fff;
    border-radius:8px;
    padding:5px 9px;
    cursor:pointer;
    white-space:nowrap;
  }

  /* ---- スコア ---- */
  .score{
    display:flex; align-items:baseline; gap:12px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:12px; font-weight:700; color:var(--usuzumi);
  }
  .score b{ color:var(--shu); font-size:17px; }
  .score .streak b{ color:var(--kin); }
  .score .qno{ margin-left:auto; color:var(--ai); }

  /* ---- 問題カード ---- */
  .card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--grid);
    border-radius:16px;
    box-shadow:0 2px 0 rgba(51,49,43,.06);
    padding:16px 16px 14px;
  }
  .card .qtag{
    display:inline-block;
    font-size:11px; font-weight:700;
    color:var(--ai);
    border:1.2px solid var(--ai);
    border-radius:999px;
    padding:2px 10px;
    margin-bottom:8px;
    letter-spacing:.06em;
  }
  .card .qtext{
    font-size:16px; line-height:1.85;
    letter-spacing:.02em;
  }
  .card .qtext b{ color:var(--shu); }
  /* 問題の 比そのもの（大きく まん中に） */
  .ratio-big{
    display:block;
    text-align:center;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:27px; font-weight:700;
    letter-spacing:.04em;
    margin:6px 0 8px;
    color:var(--sumi);
  }
  .ratio-big .fr{ font-size:.82em; }
  .blank{
    display:inline-block;
    width:1.5em; height:1.15em;
    border:2.5px solid var(--shu);
    border-radius:6px;
    vertical-align:-.12em;
    background:#FDF4F2;
  }
  .cl{ margin:0 .18em; }

  /* ---- 分数（縦組み） ---- */
  .fr{
    display:inline-flex; flex-direction:column; align-items:center;
    vertical-align:middle;
    line-height:1.12;
    margin:0 .1em;
  }
  .fr .nu{ border-bottom:.08em solid currentColor; padding:0 .18em; }
  .fr .de{ padding:0 .18em; }

  /* ---- 解答パーツ ---- */
  .part{ display:flex; flex-direction:column; gap:8px; }
  .p-label{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700;
    color:var(--ai);
    letter-spacing:.04em;
  }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .optBtn{
    position:relative;          /* 「正解」バッジの基準（divp-choice-mark.js） */
    flex:1 1 calc(50% - 4px);
    min-width:120px;
    min-height:58px;
    padding:8px 12px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:3px solid #D8D4C8;
    border-radius:11px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:21px; font-weight:700;
    color:var(--sumi);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1.4;
  }
  .optBtn .u{ font-size:.68em; margin-left:3px; color:var(--usuzumi); }
  .optBtn.on{
    background:#FDECE9;
    border-color:var(--shu);
    border-bottom-color:var(--shu);
    color:var(--shu);
  }
  .optBtn.on .u{ color:var(--shu); }
  .optBtn:active{ transform:translateY(2px); border-bottom-width:1.5px; }
  .optBtn:disabled{ cursor:default; transform:none; }
  .optBtn:focus-visible{ outline:3px solid var(--ai); outline-offset:2px; }

  /* ---- フィードバック ---- */
  .feedback{ display:none; }
  .feedback.show{ display:flex; flex-direction:column; gap:10px; }
  .fb-msg{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:18px; font-weight:700;
    text-align:center;
    letter-spacing:.06em;
  }
  .fb-msg.good{ color:var(--shu); }
  .fb-msg.bad{ color:var(--ai); }
  .expl{
    background:#fff;
    border:1.5px dashed var(--kin);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px; line-height:2.05;
  }
  .expl b{ color:var(--shu); }
  .expl .ttl{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700; color:var(--kin);
    letter-spacing:.08em;
    display:block; margin-bottom:4px;
  }
  .expl .step{ display:block; }
  .expl .tape{ display:flex; justify-content:center; margin:6px 0 2px; }
  .expl .tape svg{ width:100%; max-width:330px; height:auto; background:#FFFDF7; border-radius:10px; }
  .expl .kufu{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--grid);
    font-size:13px; color:var(--ai);
  }
  .expl .naze{
    display:inline-block;
    margin-top:8px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:12px; font-weight:700;
    color:var(--ai);
    border:1.2px solid var(--ai);
    background:#F5F9FC;
    border-radius:999px;
    padding:4px 12px;
    cursor:pointer;
  }
  .toast{
    text-align:center;
    font-size:13px; font-weight:700; color:var(--ai);
    min-height:20px;
  }

  /* ---- 下の大きなボタン ---- */
  .bottom{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 62%, rgba(251,250,246,0));
    z-index:20;
  }
  .bottom .inner{ max-width:560px; margin:0 auto; }
  .bigBtn{
    width:100%;
    height:54px;
    border:none;
    border-radius:13px;
    background:var(--shu);
    color:#fff;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:18px; font-weight:700;
    letter-spacing:.2em; text-indent:.2em;
    box-shadow:0 3px 0 #9E2F22;
    cursor:pointer;
  }
  .bigBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #9E2F22; }
  .bigBtn.next{ background:var(--ai); box-shadow:0 3px 0 #1E466A; }
  .bigBtn.next:active{ box-shadow:0 1px 0 #1E466A; }
  .bigBtn:focus-visible{ outline:3px solid var(--ai); outline-offset:2px; }

  /* ---- モード選択画面（立体の体積マスターと同じ作り） ---- */
  .mode-screen{ display:none; }
  body.choosing .app,
  body.choosing .bottom{ display:none; }
  body.choosing .mode-screen{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:34px 18px 48px;
  }
  .m-logo{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:25px; font-weight:700;
    text-align:center;
    letter-spacing:.08em;
  }
  .m-sub{
    text-align:center;
    font-size:13px; color:var(--usuzumi);
    margin-bottom:8px;
  }
  /* .m-link は「別の画面へのリンク」。見た目は .m-card と同じだが、
     クリック処理(startMode)は .m-card だけに付いているので class は分けておく */
  .m-card,
  .m-link{
    display:flex; align-items:center; gap:13px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:4px solid #D8D4C8;
    border-radius:16px;
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    width:100%;
  }
  .m-card:active,
  .m-link:active{ transform:translateY(2px); border-bottom-width:1.5px; }
  .m-card.review{ border-color:#BFD4C6; border-bottom-color:#8FB9A0; background:#F7FBF8; }
  .m-card.mix{ border-color:var(--kin); border-bottom-color:var(--kin); }
  .m-link{
    text-decoration:none; color:inherit;
    border-color:var(--ai); border-bottom-color:#1E466A;
    background:#F5F9FC;
  }
  .m-link .m-name{ color:var(--ai); }
  .m-sep{
    display:flex; align-items:center; gap:8px;
    margin-top:14px;
    font-size:11.5px; color:var(--usuzumi); letter-spacing:.06em;
  }
  .m-sep::before, .m-sep::after{
    content:""; flex:1; height:1px; background:var(--grid);
  }
  .m-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .m-name{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:17px; font-weight:700;
  }
  .m-desc{ font-size:11.5px; color:var(--usuzumi); line-height:1.5; }

  /* 解き直し(?retry=1)の案内帯 */
  #retryBanner{
    background:#FBF3E0;
    border:1.5px solid var(--kin);
    border-radius:10px;
    padding:9px 12px;
    font-size:12.5px; line-height:1.6;
    color:#6E5518;
  }

  /* ---- しくみの部屋（比って なに？） ---- */
  .lab{ display:none; }
  body.labbing .app,
  body.labbing .bottom,
  body.labbing .mode-screen{ display:none !important; }
  body.labbing .lab{
    display:flex;
    flex-direction:column;
    gap:12px;
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:14px 14px calc(28px + env(safe-area-inset-bottom));
  }
  .lab-head{ display:flex; align-items:center; gap:8px; }
  .lab-head h2{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:18px; font-weight:700; margin:0;
    letter-spacing:.04em;
  }
  .lab-head h2 .sub{
    display:block;
    font-size:11px; font-weight:500; color:var(--usuzumi);
    letter-spacing:.1em;
  }
  .lab-card{
    background:#fff;
    border:1.5px solid var(--grid);
    border-radius:16px;
    box-shadow:0 2px 0 rgba(51,49,43,.06);
    padding:13px 14px 14px;
  }
  .lab-ttl{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700; color:var(--ai);
    letter-spacing:.06em;
    margin-bottom:8px;
  }
  .lab-chips{ display:flex; flex-wrap:wrap; gap:7px; }
  .lab-chip{
    flex:1 1 auto;
    min-width:64px; min-height:44px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:3px solid #D8D4C8;
    border-radius:10px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:16px; font-weight:700;
    color:var(--sumi);
    cursor:pointer;
  }
  .lab-chip.on{
    background:#FDECE9; border-color:var(--shu);
    border-bottom-color:var(--shu); color:var(--shu);
  }
  .lab-chip:active{ transform:translateY(2px); border-bottom-width:1.5px; }
  .lab-stage{ display:flex; justify-content:center; margin:10px 0 0; }
  .lab-stage svg{
    width:100%; max-width:340px; height:auto;
    background:#FFFDF7; border-radius:10px;
  }
  .lab-row{
    display:flex; align-items:center; gap:10px;
    margin-top:10px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700; color:var(--usuzumi);
  }
  .lab-row input[type=range]{ flex:1; accent-color:var(--shu); height:28px; }
  .lab-row .val{ color:var(--shu); font-size:16px; min-width:58px; text-align:right; }
  .lab-shiki{
    margin-top:10px;
    background:var(--paper);
    border:1.5px solid var(--grid);
    border-radius:12px;
    padding:10px 12px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:15px; font-weight:700;
    text-align:center; line-height:1.9;
    letter-spacing:.02em;
  }
  .lab-shiki .sq{ color:var(--ai); }
  .lab-shiki .hh{ color:var(--kin); }
  .lab-shiki .vv{ color:var(--shu); font-size:1.15em; }
  .lab-shiki small{ font-size:12px; color:var(--usuzumi); }
  .lab-play{
    width:100%; height:48px; margin-top:10px;
    border:none; border-radius:12px;
    background:var(--ai); color:#fff;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:16px; font-weight:700; letter-spacing:.12em;
    box-shadow:0 3px 0 #1E466A; cursor:pointer;
  }
  .lab-play:active{ transform:translateY(2px); box-shadow:0 1px 0 #1E466A; }
  .lab-step{
    display:flex; gap:9px;
    padding:9px 0;
    border-top:1px dashed var(--grid);
    font-size:13.5px; line-height:1.85;
  }
  .lab-step:first-child{ border-top:none; }
  .lab-step .no{
    flex:0 0 22px; height:22px;
    border-radius:50%;
    background:var(--ai); color:#fff;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:12px; font-weight:700;
    display:flex; align-items:center; justify-content:center;
    margin-top:3px;
  }
  .lab-step b{ color:var(--shu); }
  .lab-matome{
    background:#FBF3E0;
    border:1.5px solid var(--kin);
    border-radius:14px;
    padding:12px 14px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:16px; font-weight:700;
    text-align:center; line-height:1.9;
    color:#6E5518;
  }
  .lab-matome .big{ display:block; font-size:19px; color:var(--shu); margin-top:2px; }

  /* 積もったキラキラ(divp-correct-kirakira の pile, z-index:5)にうもれないように。
     モジュール側の :where() は詳細度0で、div/span だけで組んだ帯は
     セレクタから漏れるため、画面の直下の子をまとめて前面に出しておく */
  .divp-header{ position:relative; z-index:11; }
  .app > *, .mode-screen > *, .lab > *,
  .feedback > *, .lab-card > *, .lab-row > *{ position:relative; z-index:10; }

  .mode-back.next-to{ margin-left:6px; }

  /* ---- モード画面の「プリントを 印刷する」 ---- */
  .m-print{
    background:#fff;
    border:1.5px dashed #CFC9B8;
    border-radius:16px;
    padding:12px 14px 14px;
  }
  .m-print-ttl{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:15px; font-weight:700;
    margin-bottom:9px;
  }
  .m-print-ttl span{
    display:block;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:11px; font-weight:500; color:var(--usuzumi);
    margin-top:1px;
  }
  .m-print-btns{ display:flex; flex-wrap:wrap; gap:7px; }
  .m-print-btns button{
    flex:1 1 calc(33% - 7px);
    min-width:92px; min-height:40px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:3px solid #D8D4C8;
    border-radius:10px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13.5px; font-weight:700;
    color:var(--sumi);
    cursor:pointer;
  }
  .m-print-btns button:active{ transform:translateY(2px); border-bottom-width:1.5px; }

  /* ---- 印刷シート ---- */
  .print-area{ display:none; }
  @media print{
    @page{ size:A4 portrait; margin:10mm 11mm; }
    /* 共通ヘッダーは紙に出さない（assets/divp-header.js と同じ方針） */
    .divp-header{ display:none !important; }
    .mode-screen, .app, .bottom, .lab,
    #divp-kk-layer, #divp-kk-pile, .divp-kk-layer, .divp-kk-canvas, .divp-kk-text{ display:none !important; }
    html, body{ background:#fff !important; min-height:0 !important; }
    body{ display:block !important; }
    .print-area{ display:block !important; color:#222; font-family:"Zen Kaku Gothic New", sans-serif; }
    .sheet{ position:relative; page-break-after:always; break-after:page;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet:last-child{ page-break-after:auto; break-after:auto; }
    .p-head{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end;
      border-bottom:2px solid #33312B; padding-bottom:4px; margin-bottom:6px; }
    .p-school{ font-size:11px; font-weight:700; color:#555; }
    .p-title{ font-family:"Zen Maru Gothic", sans-serif; font-weight:700; font-size:20px; margin-top:1px; }
    .p-title small{ font-size:13px; margin-left:8px; color:#555; }
    .p-name{ font-size:12px; white-space:nowrap; }
    .p-name span{ display:inline-block; border-bottom:1px solid #000; min-width:170px; margin-left:6px; }
    .p-inst{ position:relative; z-index:1; font-size:11.5px; margin:0 0 6px; }
    .p-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:3.5mm 7mm; }
    .p-item{ break-inside:avoid; page-break-inside:avoid; padding:1mm 1mm 0; }
    .p-no{ display:inline-block; font-weight:700; font-size:12px; background:#33312B; color:#fff;
      border-radius:5px; padding:0 7px; margin-right:4px; }
    .p-tag{ font-size:9.5px; color:#777; }
    .p-q{ font-size:12px; line-height:1.65; margin:2px 0 0; min-height:15mm; }
    .p-q b{ color:#222; }
    .p-q .ratio-big{ font-size:19px; margin:2px 0 3px; }
    .p-q .blank{ border-width:1.5px; background:#fff; }
    .p-ans{ display:flex; align-items:flex-end; gap:6px; margin-top:2mm; font-size:11px; color:#555; }
    .p-ans i{ flex:1; border-bottom:1px solid #333; height:8mm; font-style:normal; }
    .a-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:2.5mm 7mm; }
    .a-item{ break-inside:avoid; font-size:12px; line-height:1.6; border-bottom:1px dashed #ccc; padding:1.5mm 0 2mm; }
    .a-item .a-v{ font-family:"Zen Maru Gothic", sans-serif; font-size:16px; font-weight:700; color:#C73E2E; margin-left:4px; }
    .a-item .a-how{ display:block; font-size:10.5px; color:#555; line-height:1.55; margin-top:1px; }
    .a-item .a-how .tape{ display:none; }
  }
</style>
</head>
<body class="choosing" data-theme="es" data-effect="kirakira">

<!-- 共通ヘッダー(ロゴ・ログイン窓)の差し込み先。script は body 直後に置くこと -->
<div class="divp-header"></div>
<!-- 学習記録システム共通モジュール -->
<script src="/assets/divp-core.js" defer></script>
<script src="/assets/divp-header.js" defer></script>
<!-- 小学生ツールなので正解演出は星バースト。
     data-effect="kirakira" なので、都道府県マスターと同じ星が
     そのまま画面の下に積もっていく（divp-core.js より後ろに置くこと） -->
<script src="/assets/divp-correct-kirakira.js" defer></script>

<script>
"use strict";
/* =====================================================================
   比マスター（算数・小6）
   unit_key = math_es6_hi

   ■ モードと question_key
     比の値         → atai
     比を作る       → tsukuru_kihon（同じ単位の 2つの量）/ tsukuru_tani（単位を そろえて 比を作る）/
                      tsukuru_zentai（全体と 部分の 比）
     等しい比       → hitoshii（□に あてはまる 数）
     比を簡単にする → kantan_sei / kantan_shou / kantan_bun（整数・小数・分数の比）
     比の利用       → riyou_ippou（比と 片方から もう片方）/ riyou_bunkatsu（全体を 比で 分ける）
     ランダム       → 上の ぜんぶを ごちゃまぜ（question_key は実際に出た種類）
     日本語ラベルは db/seeds/seed_math_es6_hi.sql で question_catalog へ。

   ■ 解き直し（?retry=1）は「種(seed)方式」＝ CLAUDE.md 2d
     乱数は ri()/pick()/shuffle() に一本化してあり、出題のたびに種を1つ引いて
     question_params:{m:question_key, s:種} だけを保存する。?retry=1 では同じ種で
     同じ生成関数を回すだけで まったく同じ問題が出る。
     ⚠ 生成関数の中身を変えると、既存 pending の種から出る問題が変わる
       （params_hash は同じままなので解き直し自体は成立する）。
     ⚠ 生成関数の中で Math.random() を 直接 呼ばないこと（種で 再現できなくなる）。
       くり返しで 条件に あう 数を さがす ところも rngNext() だけを 使う。

   ■ 図（question_figure）は 渡さない
     どの問題も 問題文だけで 解ける（解説の テープ図は 説明用）。
     question_text の 分数は F(分子/分母) で書く（CLAUDE.md 2a。講師画面が 縦組みにする）。
   ===================================================================== */

var UNIT_KEY = "math_es6_hi";

/* ---------- 共通モジュールの安全呼び出し（未読込でも壊れない） ---------- */
function safeDivp(fn){
  try{
    if(window.Divp && typeof window.Divp[fn] === "function"){
      return window.Divp[fn].apply(window.Divp, [].slice.call(arguments,1));
    }
  }catch(e){}
  return null;
}

/* ---------- RNG（xorshift32・種から決まった順に出る） ---------- */
var _rngState = 1;
function rngSeed(s){ _rngState = (s>>>0) || 1; }
function rngPick(){ return (Math.floor(Math.random()*4294967296)>>>0) || 1; }  /* 種そのものだけ真の乱数 */
function rngNext(){
  var x = _rngState;
  x ^= x<<13; x >>>= 0; x ^= x>>>17; x ^= x<<5; x >>>= 0;
  _rngState = x;
  return x/4294967296;
}
function ri(min,max){ return Math.floor(rngNext()*(max-min+1))+min; }
function pick(arr){ return arr[ri(0,arr.length-1)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=ri(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ---------- 数のあつかい ---------- */
function gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ var t=a%b; a=b; b=t; } return a; }
function lcm(a,b){ return a/gcd(a,b)*b; }
function isInt(v){ return Math.abs(v-Math.round(v)) < 1e-9; }
/* 小数は 100分の1 を単位にした 整数で持ち、表示のときだけ 小数に もどす（誤差を出さない） */
function fmt100(n){ return String(Math.round(n)/100); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }

/* 1〜hi の中から 互いに素で ちがう2つの数（p : q がもう簡単な比） */
function coprimePair(lo,hi){
  for(var t=0;t<60;t++){
    var p = ri(lo,hi), q = ri(lo,hi);
    if(p !== q && gcd(p,q) === 1) return [p,q];
  }
  return [2,3];
}

/* ---------- 表示の部品 ---------- */
function frHtml(n,d){
  if(d === 1) return String(n);
  return '<span class="fr"><span class="nu">'+n+'</span><span class="de">'+d+'</span></span>';
}
function frPlain(n,d){ return d === 1 ? String(n) : "F("+n+"/"+d+")"; }
function rHtml(a,b){ return a+'<span class="cl">:</span>'+b; }
function rText(a,b){ return a+" : "+b; }

/* ---------- 選択肢 ----------
   選択肢は {html, plain, key, ok}。key が同じものは 同じ選択肢とみなして 重ねない。
   plain は 記録用（wrong_answer / correct_answer）。 */
function optNum(v,u){
  return { html: String(v) + (u ? '<span class="u">'+u+'</span>' : ""),
           plain: String(v) + (u ? " "+u : ""),
           key: "n"+v, ok: v > 0 && isInt(v) };
}
function optRatio(a,b){
  return { html: rHtml(a,b), plain: a+":"+b, key: "r"+a+":"+b,
           /* 「5 : 5」のような 同じ数どうしは 出さない（この画面の 正解は いつも p≠q なので、すぐ消せてしまう） */
           ok: a > 0 && b > 0 && a !== b && isInt(a) && isInt(b) };
}
function optFrac(n,d){
  if(!(n > 0 && d > 0 && isInt(n) && isInt(d))) return { ok:false, key:"x" };
  var g = gcd(n,d); n /= g; d /= g;
  return { html: frHtml(n,d), plain: frPlain(n,d), key: "f"+n+"/"+d, ok:true };
}
/* 正解1つ＋まちがい3つ。cands（ねらった まちがい）を先に使い、足りなければ fb で うめる */
function buildChoices(cor, cands, fb){
  var out = [cor], seen = {}, i;
  seen[cor.key] = 1;
  function add(c){
    if(out.length >= 4 || !c || !c.ok || seen[c.key]) return;
    seen[c.key] = 1; out.push(c);
  }
  var cs = shuffle(cands);
  for(i=0;i<cs.length;i++) add(cs[i]);
  for(i=0;i<fb.length;i++) add(fb[i]);
  var arr = shuffle(out);
  return { options: arr, correct: arr.indexOf(cor) };
}
/* 数の答えの うめ草（正解の となりの数） */
function numFallback(ans, step, u){
  var a = [];
  for(var k=1;k<=6;k++){ a.push(optNum(ans+step*k,u)); a.push(optNum(ans-step*k,u)); }
  return a;
}
function ratioFallback(p,q){
  var a = [];
  for(var k=1;k<=6;k++){ a.push(optRatio(p+k,q)); a.push(optRatio(p,q+k)); }
  return a;
}

/* 問題を くみたてる（全種類 共通） */
function mk(o){
  var ch = buildChoices(o.cor, o.cands, o.fb);
  return {
    key: o.key, tag: o.tag,
    qHtml: o.q, plainQ: o.plain,
    label: o.label,
    options: ch.options, correct: ch.correct,
    ansText: o.cor.plain,
    expl: '<span class="ttl">とき方</span>' + o.expl
        + (o.kufu ? '<div class="kufu">💡 ' + o.kufu + '</div>' : "")
        + (o.naze ? '<button type="button" class="naze">比って なに？ テープ図で 見る →</button>' : "")
  };
}

/* =====================================================================
   テープ図（解説用の SVG）。色・線は 属性で 書く（CLAUDE.md 2b と同じ流儀）
   ===================================================================== */
var SVGFONT = "Zen Maru Gothic,Hiragino Maru Gothic ProN,HGMaruGothicMPRO,sans-serif";
var COL = {
  a:"#C73E2E", aL:"#F9DDD8",
  b:"#2C5F8A", bL:"#D6E4F0",
  ink:"#33312B", sub:"#8B877C", kin:"#A8851B"
};
function svgText(x,y,s,color,anchor,size,weight){
  return '<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+(size||13)+'" font-weight="'+(weight||700)
       + '" text-anchor="'+(anchor||"start")+'" font-family="'+SVGFONT+'">'+esc(s)+'</text>';
}
function blocks(x0,y,n,bw,h,fill,stroke){
  var s = "";
  for(var i=0;i<n;i++){
    s += '<rect x="'+(x0+i*bw)+'" y="'+y+'" width="'+bw+'" height="'+h+'" fill="'+fill
       + '" stroke="'+stroke+'" stroke-width="1.6"/>';
  }
  return s;
}
/* 上に かぶせる かっこ（全体を 表す） */
function braceOver(x1,x2,y,label,color){
  return '<path d="M'+x1+' '+(y+7)+' V'+y+' H'+x2+' V'+(y+7)+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>'
       + svgText((x1+x2)/2, y-5, label, color, "middle", 13);
}
/* 下の かっこ。dy で 文字を 下へ ずらす（となりの かっこの 文字と 重ならないように 段を 変える） */
function braceUnder(x1,x2,y,label,color,dy){
  return '<path d="M'+x1+' '+(y-7)+' V'+y+' H'+x2+' V'+(y-7)+'" fill="none" stroke="'+color+'" stroke-width="1.6"/>'
       + svgText((x1+x2)/2, y+16+(dy||0), label, color, "middle", 13);
}
/* 2段の テープ図：A が p つぶん、B が q つぶん。valA / valB は 右はしに 書く文字 */
function tapeTwo(p,q,nameA,nameB,valA,valB){
  var X0 = 74, H = 24, max = Math.max(p,q);
  var bw = Math.min(30, Math.floor(178/max));
  var s = "";
  s += svgText(8, 30, nameA, COL.a, "start", 13);
  s += blocks(X0, 14, p, bw, H, COL.aL, COL.a);
  s += svgText(X0+p*bw+8, 31, valA, valA === "？" ? COL.a : COL.ink, "start", 14);
  s += svgText(8, 78, nameB, COL.b, "start", 13);
  s += blocks(X0, 62, q, bw, H, COL.bL, COL.b);
  s += svgText(X0+q*bw+8, 79, valB, valB === "？" ? COL.b : COL.ink, "start", 14);
  return '<div class="tape"><svg viewBox="0 0 330 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="テープ図">'
       + s + '</svg></div>';
}
/* 1本の テープ図：A の p つぶん と B の q つぶんを つなげて、上に 全体 */
function tapeOne(p,q,nameA,nameB,labA,labB,total){
  var n = p+q, bw = Math.min(30, Math.floor(290/n)), X0 = Math.round((330-n*bw)/2), y = 36, H = 26;
  var s = "";
  s += braceOver(X0, X0+n*bw, 18, "全体 "+total, COL.kin);
  s += blocks(X0, y, p, bw, H, COL.aL, COL.a);
  s += blocks(X0+p*bw, y, q, bw, H, COL.bL, COL.b);
  s += braceUnder(X0, X0+p*bw, y+H+12, nameA+" "+labA, COL.a, 0);
  s += braceUnder(X0+p*bw, X0+n*bw, y+H+12, nameB+" "+labB, COL.b, 17);
  return '<div class="tape"><svg viewBox="0 0 330 122" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="テープ図">'
       + s + '</svg></div>';
}

/* =====================================================================
   ① 比の値
   ===================================================================== */
function gen_atai(){
  var p, q;
  if(ri(1,5) === 1){ q = 1; p = ri(2,9); }          /* 5問に1問は わりきれる（比の値が 整数） */
  else{ var pr = coprimePair(1,9); p = pr[0]; q = pr[1]; }
  var g = ri(1, Math.max(1, Math.floor(48/Math.max(p,q))));
  if(g > 8) g = ri(2,8);
  var a = p*g, b = q*g;
  var cor = optFrac(p,q);
  var calc = a+" ÷ "+b+" ＝ ";
  if(q === 1)      calc += "<b>"+p+"</b>（わりきれるので 整数）";
  else if(g === 1) calc += "<b>"+frHtml(a,b)+"</b>";
  else             calc += frHtml(a,b)+" ＝ <b>"+frHtml(p,q)+"</b>（"+g+"で 約分）";
  return mk({
    key:"atai", tag:"比の値",
    q:'<span class="ratio-big">'+rHtml(a,b)+'</span>の <b>比の値</b>を もとめましょう。',
    plain:a+":"+b+" の比の値",
    label:"比の値は？",
    cor:cor,
    cands:[optFrac(q,p), optFrac(p,p+q), optFrac(q,p+q), optFrac(p+q,q)],
    fb:[optFrac(p+1,q), optFrac(p,q+1), optFrac(p+2,q), optFrac(p,q+2)],
    expl:'<span class="step">比の値は「前の数 ÷ うしろの数」。</span>'
        +'<span class="step">'+calc+'</span>',
    kufu:"比の値は「前の数が うしろの数の 何倍か」を あらわす数。"
        +"うしろの数で わるので、"+a+" : "+b+" と "+b+" : "+a+" の 比の値は ちがう。"
  });
}

/* =====================================================================
   ② 等しい比（□に あてはまる数）
   ===================================================================== */
function gen_hitoshii(){
  var pr = coprimePair(1,9), p = pr[0], q = pr[1], mx = Math.max(p,q);
  var m1 = ri(1,4), t = ri(2,5);
  while(t > 2 && mx*m1*t > 99) t--;
  if(mx*m1*t > 99) m1 = 1;
  var small = [p*m1, q*m1], big = [p*m1*t, q*m1*t];
  var up = ri(0,1) === 1;                       /* 左が小さい（×）か 大きい（÷）か */
  var L = up ? small : big, R = up ? big : small;
  var pos = pick([2,3,2,3,0,1]);                /* □の場所。右がわを 多めに */
  var S = pos >= 2 ? R : L, O = pos >= 2 ? L : R;  /* S=□のある がわ / O=もう一方 */
  var i = pos % 2, j = 1 - i;
  var ans = S[i];                               /* L と R は 同じ比から 作ってあるので そのまま答え */
  var mul = S[j] > O[j];                        /* O → S が ×t か ÷t か */
  var cells = [L[0], L[1], R[0], R[1]].map(function(v,k){ return k === pos ? '<span class="blank"></span>' : String(v); });
  var plainCells = [L[0], L[1], R[0], R[1]].map(function(v,k){ return k === pos ? "□" : String(v); });
  var cands = [
    optNum(O[i] + (S[j]-O[j])),                 /* かけ算ではなく 足し算・引き算で そろえた */
    optNum(mul ? O[i]/t : O[i]*t),              /* ×と÷を 反対に した */
    optNum(ans + (i === 0 ? p : q)),
    optNum(ans - (i === 0 ? p : q)),
    optNum(O[j] * (mul ? t : 1))
  ];
  var op = mul ? "×" : "÷";
  return mk({
    key:"hitoshii", tag:"等しい比",
    q:'<span class="ratio-big">'+cells[0]+'<span class="cl">:</span>'+cells[1]+' ＝ '
      +cells[2]+'<span class="cl">:</span>'+cells[3]+'</span>□に あてはまる 数を もとめましょう。',
    plain:plainCells[0]+":"+plainCells[1]+"="+plainCells[2]+":"+plainCells[3]+" の□",
    label:"□に あてはまる 数は？",
    cor:optNum(ans),
    cands:cands,
    fb:numFallback(ans, 1),

/* =====================================================================

function gen_kantan_sei(){
  var pr = coprimePair(1,9), p = pr[0], q = pr[1], mx = Math.max(p,q);
  var g = ri(2, Math.min(12, Math.floor(120/mx)));
  var a = p*g, b = q*g, cands = [optRatio(q,p)], d;
  for(d=2; d<g; d++) if(g % d === 0) cands.push(optRatio(a/d, b/d));   /* とちゅうで やめた 比 */
  cands.push(optRatio(p, b));                                         /* 片方しか わっていない */
  cands.push(optRatio(a, q));
  if(g !== 2) cands.push(optRatio(p*2, q*2));
  return mk({
    key:"kantan_sei", tag:"整数の比を 簡単に",
    q:'<span class="ratio-big">'+rHtml(a,b)+'</span>を いちばん 簡単な 整数の比に しましょう。',
    plain:a+":"+b+" を簡単な整数の比に",

    cands:cands,
    fb:ratioFallback(p,q),
    expl:'<span class="step">'+a+' と '+b+' の 最大公約数は <b>'+g+'</b></span>'
        +'<span class="step">両方を '+g+' で わる： '+a+' ÷ '+g+' : '+b+' ÷ '+g+' ＝ <b>'+rText(p,q)+'</b></span>',
    kufu:"最大公約数が すぐに 見つからなければ、2 や 3 で 何回か わっていっても よい。"

  });
}
/* 小数の比。かける数は 100分の1 単位の 整数で持つ（0.3 → 30） */
var SHOU_SCALE = [10,20,30,40,50,60,70,80,90,120,150,25,75];
function gen_kantan_shou(){
  var pr = coprimePair(1,9), p = pr[0], q = pr[1];
  var s = pick(SHOU_SCALE);
  var A = p*s, B = q*s;                         /* 100分の1 単位 */
  var mult = (A % 10 === 0 && B % 10 === 0) ? 10 : 100;
  var iA = A*mult/100, iB = B*mult/100, G = gcd(iA,iB);
  var cands = [optRatio(iA, iB), optRatio(q,p)];
  if(mult === 100) cands.push(optRatio(A/10, B/10));          /* 10倍 しか していない（小数が のこる＝はじかれる） */
  if(G > 2) for(var d=2; d<G; d++) if(G % d === 0){ cands.push(optRatio(iA/d, iB/d)); break; }
  cands.push(optRatio(p*2, q*2));
  var st = '<span class="step">まず 両方を <b>'+mult+'倍</b> して 整数に する： '
         + fmt100(A)+' : '+fmt100(B)+' ＝ '+rText(iA,iB)+'</span>';
  st += G > 1
     ? '<span class="step">'+iA+' と '+iB+' の 最大公約数 '+G+' で わる： <b>'+rText(p,q)+'</b></span>'
     : '<span class="step">これ以上 同じ数で われないので <b>'+rText(p,q)+'</b></span>';
  return mk({
    key:"kantan_shou", tag:"小数の比を 簡単に",

    plain:fmt100(A)+":"+fmt100(B)+" を簡単な整数の比に",

    cands:cands,

  });
}
function gen_kantan_bun(){
  var a=1,b=2,c=3,d=4, L=4, X=2, Y=3, G=1, p=2, q=3;
  for(var t=0; t<80; t++){
    b = ri(2,9); d = ri(2,9);
    a = ri(1,b-1); c = ri(1,d-1);
    if(gcd(a,b) !== 1 || gcd(c,d) !== 1) continue;
    if(a === c && b === d) continue;
    L = lcm(b,d); X = a*(L/b); Y = c*(L/d); G = gcd(X,Y);
    p = X/G; q = Y/G;
    if(p !== q && Math.max(p,q) <= 24) break;
  }
  if(p === q || Math.max(p,q) > 24){ a=2;b=3;c=3;d=4; L=12; X=8; Y=9; G=1; p=8; q=9; }
  var cands = [optRatio(a,c), optRatio(b,d), optRatio(d,b), optRatio(q,p)];
  if(G > 1) cands.push(optRatio(X,Y));
  var st = '<span class="step">分母 '+b+' と '+d+' の 最小公倍数 <b>'+L+'</b> を 両方に かける：</span>'
         + '<span class="step">'+frHtml(a,b)+' × '+L+' ＝ '+X+'、 '+frHtml(c,d)+' × '+L+' ＝ '+Y
         + ' → '+rText(X,Y)+'</span>';
  st += G > 1
     ? '<span class="step">さらに '+G+' で わる： <b>'+rText(p,q)+'</b></span>'
     : '<span class="step">これ以上 われないので <b>'+rText(p,q)+'</b></span>';
  return mk({
    key:"kantan_bun", tag:"分数の比を 簡単に",
    q:'<span class="ratio-big">'+frHtml(a,b)+'<span class="cl">:</span>'+frHtml(c,d)+'</span>'
     +'を いちばん 簡単な 整数の比に しましょう。',
    plain:frPlain(a,b)+":"+frPlain(c,d)+" を簡単な整数の比に",
    label:"いちばん 簡単な 比は？",
    cor:optRatio(p,q),
    cands:cands,
    fb:ratioFallback(p,q),
    expl:st,
    kufu:b === d
      ? "分母が そろっているときは、分子どうしの 比 "+a+" : "+c+" と 同じに なる。"
      : "分子どうし（"+a+" : "+c+"）や 分母どうしを ならべるだけでは まちがい。分母を はらってから くらべる。",
    naze:false
  });
}

/* やさしい形：同じ単位の 2つの 量を そのまま ならべて 簡単にする
   （コーヒー 50mL と 牛乳 150mL → 1 : 3）。数は 小さめ（p,q は 5まで） */
var KIHON_CTX = [

  { intro:"赤い テープが {A}cm、青い テープが {B}cm あります。", A:"赤い テープ", B:"青い テープ", what:"長さ", k:[3,4,5,6,8,10] },
  { intro:"酢 {A}mLと サラダ油 {B}mLで ドレッシングを 作ります。", A:"酢", B:"サラダ油", what:"量", k:[10,15,20,30] },

function gen_tsukuru_kihon(){

  return mk({

        +(rev ? "聞かれた 順（"+n0+"が 先）に 書くことに 注意。" : "")

/* 単位を そろえる。b=大きい単位 s=小さい単位 f=1b が何s か wf=よくある まちがいの 換算 */
var TANI = [
  { b:"時間", s:"分",  f:60,   wf:100, br:[1,3], sr:[5,55], st:1 },
  { b:"分",   s:"秒",  f:60,   wf:100, br:[1,4], sr:[1,11], st:5 },
  { b:"m",    s:"cm",  f:100,  wf:10,  br:[1,4], sr:[1,19], st:5 },

function reduceStep(X,Y,p,q){
  var G = gcd(X,Y);
  return G > 1
    ? '<span class="step">'+X+' と '+Y+' の 最大公約数 '+G+' で わる： <b>'+rText(p,q)+'</b></span>'
    : '<span class="step">これ以上 同じ数で われないので <b>'+rText(p,q)+'</b></span>';

function gen_tsukuru_tani(){
  var U = pick(TANI);

  var X = bigFirst ? bigS : sv, Y = bigFirst ? sv : bigS, G = gcd(X,Y), p = X/G, q = Y/G;
  var t1 = bigFirst ? bv+U.b : sv+U.s, t2 = bigFirst ? sv+U.s : bv+U.b;
  function red(a,b){ var g = gcd(a,b); return optRatio(a/g, b/g); }
  var rawA = bigFirst ? bv : sv, rawB = bigFirst ? sv : bv;
  var wrongA = bigFirst ? bv*U.wf : sv, wrongB = bigFirst ? sv : bv*U.wf;
  return mk({
    key:"tsukuru_tani", tag:"比を 作る（単位を そろえる）",
    q:'「<b>'+t1+'</b>」と「<b>'+t2+'</b>」の 比を、いちばん 簡単な 整数の比で 表しましょう。',

    cor:optRatio(p,q),
    cands:[
      red(rawA, rawB),                          /* 単位を そろえずに 数だけで 比を作った */
      red(wrongA, wrongB),                      /* 換算を まちがえた（1時間＝100分 など） */
      optRatio(X, Y),                           /* そろえたが 簡単に していない */
      optRatio(q, p)                            /* 前と うしろが 逆 */
    ],
    fb:ratioFallback(p,q),
    expl:'<span class="step">まず 単位を そろえる： '+bv+U.b+' ＝ '+bigS+U.s+'</span>'
        +'<span class="step">'+(bigFirst ? bigS+U.s+' : '+sv+U.s : sv+U.s+' : '+bigS+U.s)
        +' → '+rText(X,Y)+'</span>'

    kufu:"比を 作る前に 単位を そろえる（1"+U.b+" ＝ "+U.f+U.s+"）。"

var ZENTAI_VARS = [["T","A"],["T","A"],["A","T"],["T","B"],["B","T"],["A","B"]];
function gen_tsukuru_zentai(){

      hasT ? red(A,B) : red(T, A),                       /* 全体を 出さずに 部分どうしで 作った（または その逆） */
      hasT ? red(val(v[0] === "T" ? "T" : other(v[0])), val(v[1] === "T" ? "T" : other(v[1])))

    cor:optNum(ans, c.u),
    cands:[
      optNum(other, c.u),                       /* もう一方を 答えた */
      optNum(k, c.u),                           /* 1つぶんで 止まった */
      optNum(T/n, c.u),                         /* 全体を つぶの数で わった */
      optNum(T, c.u)                            /* 全体を そのまま 答えた */
    ],
    fb:numFallback(ans, k, c.u),
    expl:'<span class="step">全体を '+p+' ＋ '+q+' ＝ <b>'+(p+q)+'つぶん</b> と 考える</span>'
        +'<span class="step">1つぶん ＝ '+T+' ÷ '+(p+q)+' ＝ '+k+c.u+'</span>'
        +'<span class="step">'+askName+'は '+n+'つぶん → '+n+' × '+k+' ＝ <b>'+ans+' '+c.u+'</b></span>'
        +tapeOne(p, q, c.A, c.B, askA ? "？" : "", askA ? "" : "？", T+c.u),
    kufu:"「全体と "+askName+"の 比は "+(p+q)+" : "+n+"」と 考えて、"+(p+q)+" : "+n+" ＝ "+T+" : □ と しても とける。",
    naze:true
  });
}

var MODE = "atai";

var sel = -1, graded = false;
var score = 0, total = 0, streak = 0, qStart = 0;

/* 解き直し（?retry=1） */
var retryQ = null, retryTotal = 0, retryDone = 0;

function $(id){ return document.getElementById(id); }

function makeQ(key, seed){
  rngSeed(seed);                       /* ここから先の乱数は種で決まる */
  return GENS[key]();
}

function newQuestion(){
  graded = false; sel = -1;
  $("feedback").classList.remove("show");
  $("toast").textContent = "";
  $("checkBtn").style.display = "block";
  $("nextBtn").style.display = "none";

  var useKey, seed;
  if(retryQ){
    /* 解き直しを1周した。モード選択にもどって、案内帯を そこに 出す */
    if(!retryQ.length){
      retryQ = null;
      backHome();
      showRetryBanner("解き直し おつかれさま！ 同じ問題に 2回つづけて 正解すると リストから 消えるよ");
      return;
    }
    var it = retryQ.shift();
    retryDone++;
    useKey = it.question_params.m;
    seed = it.question_params.s>>>0;
  }else{
    useKey = pick(MODE_KEYS[MODE] || MODE_KEYS.atai);
    seed = rngPick();
  }

  curKey = useKey;
  curSeed = seed;
  cur = makeQ(useKey, seed);

  /* 種類バッヂ。ランダムは 種類名が そのまま ヒントに なるので 出さない */
  var tagText = retryQ ? ("解き直し "+retryDone+" / "+retryTotal+" ・ "+cur.tag)
                       : (MODE === "mix" ? "" : cur.tag);
  $("qTag").textContent = tagText;
  $("qTag").style.display = tagText ? "" : "none";
  $("qNo").textContent = retryQ ? "" : ("第 "+(total+1)+" 問");
  $("qText").innerHTML = cur.qHtml;
  renderOptions();
  qStart = nowMs();
  try{ window.scrollTo({ top:0, behavior:"smooth" }); }catch(e){ window.scrollTo(0,0); }
}

function renderOptions(){
  var host = $("partArea");
  host.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "part";

  var lab = document.createElement("div");
  lab.className = "p-label";
  lab.textContent = cur.label;
  wrap.appendChild(lab);

  var opts = document.createElement("div");
  opts.className = "opts";
  cur.options.forEach(function(o, oi){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "optBtn";
    b.dataset.idx = oi;
    b.innerHTML = o.html;          /* 中身は この画面で 組み立てた 数字・分数だけ */
    b.addEventListener("click", function(){ tapOption(oi); });

function tapOption(oi){
  if(graded) return;
  sel = oi;
  $("toast").textContent = "";

    b.classList.toggle("on", Number(b.dataset.idx) === oi);
  });

/* ---------- 答え合わせ ---------- */
function check(){
  if(graded || !cur) return;
  if(sel < 0){ $("toast").textContent = "答えを えらんでね"; return; }

  graded = true;
  var ok = (sel === cur.correct);
  var btns = document.querySelectorAll(".optBtn");
  safeDivp("markChoices", btns, { correct:cur.correct, selected:sel,
                                  dimOthers:true, label:"正解" });
  btns.forEach(function(b){ b.disabled = true; });

  total++;
  if(ok){ score++; streak++; } else { streak = 0; }
  renderScore();

  var sec = Math.round((nowMs()-qStart)/1000);
  /* 学習記録（未ログイン・ローカルでは黙ってスキップされる） */
  safeDivp("answer", ok, {
    question_key: curKey,
    question_params: { m: curKey, s: curSeed },     /* 種方式：この2つで同じ問題を作り直せる */
    question_text: cur.plainQ,
    correct_answer: cur.ansText,
    wrong_answer: ok ? null : cur.options[sel].plain,
    time_taken_sec: (sec > 0 && sec < 600) ? sec : null
  });

  $("fbMsg").className = "fb-msg " + (ok ? "good" : "bad");
  $("fbMsg").textContent = ok ? "せいかい！ よくできました" : "おしい！ とき方を 見てみよう";
  $("expl").innerHTML = cur.expl;
  $("feedback").classList.add("show");
  $("checkBtn").style.display = "none";
  $("nextBtn").style.display = "block";
  $("toast").textContent = "";

  /* 正解エフェクト（キラキラ）。pileBottom で「山の床」を ボタンの帯の 上に する
     （わたさないと 画面下の #bottom が 積もりはじめを かくす） */
  if(ok) safeDivp("correct", { pileBottom: "#bottom" });
}

/* ---------- 解き直し（?retry=1） ---------- */
function showRetryBanner(msg){
  var slot = $("retryBannerSlot");
  var e = $("retryBanner");
  if(!e){
    e = document.createElement("div");
    e.id = "retryBanner";
    slot.appendChild(e);
  }
  e.textContent = msg;
}
function initRetry(){
  if(!(window.Divp && typeof Divp.getRetries === "function")) return;
  Divp.getRetries().then(function(items){
    var use = (items||[]).filter(function(it){
      var p = it && it.question_params;
      return p && GENS[p.m] && typeof p.s === "number";
    });
    if(!use.length){
      showRetryBanner("解き直せる 問題は まだ ありません。まちがえた 問題が ここに たまっていくよ。");
      return;
    }
    retryQ = use.slice();
    retryTotal = retryQ.length;
    retryDone = 0;
    MODE = "retry";
    score = 0; total = 0; streak = 0;
    renderScore();
    $("modeLabel").textContent = "まちがえた問題の 解き直し";
    document.body.classList.remove("choosing");
    newQuestion();
  }).catch(function(){});
}

/* =====================================================================
   しくみの部屋「比って なに？」
   赤と青の テープを「1つぶん」の まとまりで 区切る。1つぶんを 何マスに しても
   まとまりの数（＝比）は かわらない → 等しい比。
   マスで 数えた比を まとまりで 数えなおす → 比を 簡単にする。
   ===================================================================== */
var LAB_RATIOS = [[2,3],[1,2],[3,4],[3,5],[4,5],[5,2]];
var labIdx = 0, labK = 1, labTimer = null;

function labSVG(){
  var r = LAB_RATIOS[labIdx], p = r[0], q = r[1], k = labK;
  var X0 = 54, BW = 50, H = 30, s = "";
  function tape(n, y, name, col, colL){
    var t = svgText(8, y+21, name, col, "start", 15);
    for(var i=0;i<n;i++){
      var x = X0 + i*BW;
      t += '<rect x="'+x+'" y="'+y+'" width="'+BW+'" height="'+H+'" fill="'+colL+'" stroke="'+col+'" stroke-width="2.4"/>';
      for(var c=1;c<k;c++){
        var xx = x + c*BW/k;
        t += '<line x1="'+xx+'" y1="'+(y+3)+'" x2="'+xx+'" y2="'+(y+H-3)+'" stroke="'+col+'" stroke-width="1" opacity="0.55"/>';
      }
    }
    t += svgText(X0, y+H+17, n+"つぶん ＝ "+(n*k)+"マス", col, "start", 12.5);
    return t;
  }
  s += tape(p, 14, "赤", COL.a, COL.aL);
  s += tape(q, 86, "青", COL.b, COL.bL);
  return '<svg viewBox="0 0 330 156" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="比のテープ図">'+s+'</svg>';
}
function labDraw(){
  var r = LAB_RATIOS[labIdx], p = r[0], q = r[1], k = labK;
  $("labStage").innerHTML = labSVG();
  $("labKVal").textContent = k + "マス";
  $("labK").value = k;
  var h;
  if(k === 1){
    h = '1つぶん ＝ 1マス のとき<br>赤 : 青 ＝ <span class="sq">'+rText(p,q)+'</span>';
  }else{
    h = 'マスで 数えると <span class="hh">'+rText(p*k,q*k)+'</span><br>'
      + 'まとまり（1つぶん）で 数えると <span class="sq">'+rText(p,q)+'</span><br>'
      + '<span class="vv">'+rText(p*k,q*k)+' ＝ '+rText(p,q)+'</span><br>'
      + '<small>'+(p*k)+' と '+(q*k)+' を 両方 '+k+' で わると '+p+' と '+q+' に もどる</small>';
  }
  h += '<br><small>ぜんぶで '+p+' ＋ '+q+' ＝ '+(p+q)+'つぶん（'+((p+q)*k)+'マス）</small>';
  $("labShiki").innerHTML = h;
  document.querySelectorAll(".lab-chip").forEach(function(b,i){ b.classList.toggle("on", i === labIdx); });
}
function labStop(){
  if(labTimer){ clearInterval(labTimer); labTimer = null; }
  $("labPlay").textContent = "1つぶんを 大きく してみる ▶";
}
function labAnimate(){
  if(labTimer){ labStop(); return; }
  labK = 1; labDraw();
  $("labPlay").textContent = "とめる ■";
  labTimer = setInterval(function(){
    if(labK >= 5){ labStop(); return; }
    labK++; labDraw();
  }, 1100);
}
function labChips(){
  var host = $("labChips");
  host.innerHTML = "";
  LAB_RATIOS.forEach(function(r,i){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "lab-chip";
    b.textContent = rText(r[0], r[1]);
    b.addEventListener("click", function(){ labStop(); labIdx = i; labDraw(); });
    host.appendChild(b);
  });
}
function labSteps(){
  var st = [
    '比 <b>a : b</b> は「赤が aつぶん、青が bつぶん」という くらべかた。'
      + '1つぶんの 大きさ（何マスか）は 決まっていない。',
    '1つぶんを 何マスに しても、まとまりの数は かわらない。だから '
      + '<b>両方に 同じ数を かけても、両方を 同じ数で わっても 等しい比</b>（等しい比）。',
    'マスで 数えた 6 : 9 を、3マスずつの まとまりで 数えなおすと 2 : 3。'
      + 'これが <b>比を 簡単にする</b> こと（両方を 最大公約数で わる）。',
    'ぜんぶで a ＋ b つぶん。全体の 量が わかれば <b>全体 ÷ (a ＋ b)</b> で 1つぶんが 出る。'
      + 'あとは つぶの数を かければ よい（比の利用）。'
  ];
  $("labSteps").innerHTML = '<div class="lab-ttl">② わかること</div>' + st.map(function(t,i){
    return '<div class="lab-step"><span class="no">'+(i+1)+'</span><span>'+t+'</span></div>';
  }).join("");
}

/* =====================================================================
   印刷（A4・12問＋答え）。紙は 毎回 ちがう 問題で よいので 1問ごとに 種を 引く。
   画面の 問題と 同じ 生成関数を 使うので、問題の 中身・答え・とき方は 画面と 一致する。
   ⚠ makeQ() は 乱数の 状態を 書きかえるが、画面の 問題(cur)は 作り終わっているので 影響しない
   （次の newQuestion() で また 種を 入れ直す）。
   ===================================================================== */
function printItems(mode){
  var keys = PRINT_KEYS[mode] || PRINT_KEYS.mix, seen = {}, seenTpl = {}, out = [];
  keys.forEach(function(k){
    /* 同じ問題は 2つ 並べない。できれば 同じ場面（数字だけ ちがう 文章題）も さける
       （1枚に「赤い テープ」が 3回 出た）。比の値のように 形が 1つしか ない 種類は
       30回で あきらめて「同じ問題でない」ものを 使う */
    var q = null, best = null;
    for(var t=0; t<30; t++){
      q = makeQ(k, rngPick());
      if(seen[q.plainQ]) continue;
      if(!best) best = q;
      if(!seenTpl[q.plainQ.replace(/[\d.]+/g, "#")]){ best = q; break; }
    }
    q = best || q;
    seen[q.plainQ] = 1;
    seenTpl[q.plainQ.replace(/[\d.]+/g, "#")] = 1;
    out.push(q);
  });
  return out;
}
function printAnsBox(q){
  if(/^(tsukuru|kantan)/.test(q.key)) return '答え<i></i>:<i></i>';
  if(/^riyou/.test(q.key)) return '答え<i></i>' + esc(q.ansText.split(" ")[1] || "");
  return '答え<i></i>';
}
/* 答えのページに出す 「とき方」＝ 画面の 解説の 手順だけ（テープ図・ポイント・ボタンは のぞく） */
function printHow(q){
  var box = document.createElement("div");
  box.innerHTML = q.expl;
  var rm = box.querySelectorAll(".ttl, .kufu, .naze, .tape");
  for(var i=0;i<rm.length;i++) rm[i].parentNode.removeChild(rm[i]);
  var steps = box.querySelectorAll(".step"), s = [];
  for(i=0;i<steps.length;i++) s.push(steps[i].innerHTML.replace(/<\/?b>/g, ""));
  return s.join(" → ");
}
function buildPrint(mode){
  var items = printItems(mode);
  var d = new Date();
  var dateStr = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  var label = MODE_LABEL[mode] || MODE_LABEL.mix;
  function head(sub){
    return '<div class="p-head"><div><div class="p-school">中京個別指導学院</div>'
      + '<div class="p-title">比マスター<small>'+esc(label)+'　'+sub+'</small></div></div>'
      + '<div class="p-name">'+dateStr+'　名前<span></span></div></div>';
  }
  var qh = items.map(function(q,i){
    return '<div class="p-item"><span class="p-no">'+(i+1)+'</span><span class="p-tag">'+esc(q.tag)+'</span>'
      + '<div class="p-q">'+q.qHtml+'</div>'
      + '<div class="p-ans">'+printAnsBox(q)+'</div></div>';
  }).join("");
  var ah = items.map(function(q,i){
    return '<div class="a-item"><span class="p-no">'+(i+1)+'</span>'
      + '<span class="a-v">'+q.options[q.correct].html+'</span>'
      + '<span class="a-how">'+printHow(q)+'</span></div>';
  }).join("");
  var wm = window.ChukyoPrint ? ChukyoPrint.img() : "";
  return wm
    + '<div class="sheet">'+head("問題")+'<p class="p-inst">'+esc(PRINT_INST[mode] || PRINT_INST.mix)+'</p>'
    + '<div class="p-grid">'+qh+'</div></div>'
    + '<div class="sheet">'+head("答え")+'<div class="a-grid">'+ah+'</div></div>';
}
function printSheet(mode){
  if(!PRINT_KEYS[mode]) mode = "mix";
  var area = $("printArea");
  /* 透かしは position:fixed で 1枚だけ 置く＝印刷では どのページにも 同じ位置に 出る */
  var wmCss = window.ChukyoPrint ? '<style>'+ChukyoPrint.css({ zIndex:0 })+'.wm{position:fixed;}</style>' : "";
  area.innerHTML = wmCss + buildPrint(mode);
  /* 透かし画像の デコードを 待ってから 印刷する（直後に print() するとロゴが 抜けることがある） */
  if(window.ChukyoPrint && ChukyoPrint.print) ChukyoPrint.print(area);
  else window.print();
}

/* divp-core は defer で読まれるので、DOM構築後に初期化する */
window.addEventListener("DOMContentLoaded", function(){
