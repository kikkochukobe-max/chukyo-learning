/* ============ 出題 ============ */
function start(k){
  S={unit:k,total:k==="mix"?20:10,idx:0,ok:0,marks:[],p:null,inputs:[],cells:[],cf:{r:0,c:0},focus:0,answered:false,retry:[]};
  $("menu").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
  $("uname").textContent=k==="mix"?"ぜんぶミックス":UNITS.find(u=>u.k===k).n;
  nextQ();
}
function genFor(k){
  const u=(k==="mix")?pick(UNITS):UNITS.find(x=>x.k===k);
  return genSeeded(u,newSeed());
}
function nextQ(){
  if(S.queue){                       // 解き直し: 用意した問題だけを 順に出す
    if(S.queue.length){S.p=S.queue.shift();}
    else if(S.retry.length){S.p=S.retry.shift();}
    else return finish();
  }
  else if(S.retry.length&&(S.idx>=S.total||Math.random()<0.28)){S.p=S.retry.shift();}
  else if(S.idx<S.total){S.p=genFor(S.unit);}
  else return finish();
  hideMaru();          // 「せいかい！」は次の問題に進むまで出したままにする
  S.answered=false;S.focus=0;
  if(S.p.type==="cells"){
    const g=S.p.grid;
    S.cells=g.rows.map(()=>new Array(g.w).fill(""));
    S.cf={r:0,c:startCol(0)};   // わり算=上の位から / 小数の筆算=小さい位から
    S.inputs=[];
  }else{
    S.cells=[];
    S.inputs=(S.p.type==="choice")?[null]
      :(S.p.type==="frac")?["",""]
      :(S.p.type==="mixed")?["","",""]
      :S.p.boxes.map(()=>"");
    if(S.p.type==="frac")S.focus=1;   // 分数は分母(下)から書く
  }
  render();
}
function render(){
  const p=S.p;
  $("cnt").textContent=p._r?"もう1回チャレンジ":`${Math.min(S.idx+1,S.total)} / ${S.total}`;
  const d=$("dots");d.innerHTML="";
  for(let i=0;i<S.total;i++){const e=document.createElement("i");
    if(S.marks[i]==="o")e.className="o";if(S.marks[i]==="x")e.className="x";d.appendChild(e);}
  $("fig").innerHTML=p.fig||"";
  $("fig").style.display=(p.fig?"":"none");
  const qh=(S.unit==="mix"?`<div style="font-size:11px;color:#6E6558;margin-bottom:4px">${p.unitName}</div>`:"")+op(p.q||"").replace(/\n/g,"<br>");
  $("q").innerHTML=qh;
  $("q").parentElement.style.display=qh.trim()?"":"none";   // 問題文が空なら行ごとつめる
  fitText();
  const A=$("ansarea"),P=$("padarea");
  A.innerHTML="";P.innerHTML="";
  if(p.type==="cells"){
    A.innerHTML=`<div class="cellhint">${(p.grid.dir||1)>0
      ?"上の位から 入れると 右へ すすみます"
      :"右の 小さい位から 入れると 左へ すすみます"} / 入れなおすときは マスをタップ</div>`;
    P.appendChild(tenkey(false));
    document.querySelectorAll("#fig .ic").forEach(el=>{
      if(el.classList.contains("no"))return;
      el.onclick=()=>{if(S.answered)return;S.cf={r:+el.dataset.r,c:+el.dataset.c};drawCells();};});
  }else if(p.type==="choice"){
    const w=document.createElement("div");
    w.className="choices"+(p.choices.some(c=>String(c).length>=9)?" w1":"");
    p.choices.forEach((c,i)=>{
      const b=document.createElement("button");b.className="ch";b.textContent=c;
      b.onclick=()=>{if(S.answered)return;S.inputs[0]=i;[...w.children].forEach(x=>x.classList.remove("on"));b.classList.add("on");};
      w.appendChild(b);});
    A.appendChild(w);
  }else if(p.type==="frac"){
    const w=document.createElement("div");w.className="ansrow";
    w.innerHTML=`<div class="frac"><div class="box" data-i="0"></div><div class="fl"></div><div class="box" data-i="1"></div></div>`;
    A.appendChild(w);
    const h=document.createElement("div");h.className="cellhint";h.textContent="分母(下)から 入れてね";
    A.appendChild(h);
    bindBoxes();P.appendChild(tenkey(false));
  }else if(p.type==="mixed"){
    const w=document.createElement("div");w.className="ansrow";
    w.innerHTML=`<div class="box" data-i="0"></div><span class="suf">と</span>`
      +`<div class="frac"><div class="box" data-i="1"></div><div class="fl"></div><div class="box" data-i="2"></div></div>`;
    A.appendChild(w);
    const h=document.createElement("div");h.className="cellhint";h.textContent="整数 → 分母(下) → 分子(上) の じゅんに 入るよ";
    A.appendChild(h);
    bindBoxes();P.appendChild(tenkey(false));
  }else{
    const w=document.createElement("div");w.className="ansrow";
    p.boxes.forEach((b,i)=>{
      const el=document.createElement("div");el.className="box";el.dataset.i=i;w.appendChild(el);
      if(b.s){const sp=document.createElement("span");sp.className="suf";sp.textContent=b.s;w.appendChild(sp);}
    });
    A.appendChild(w);bindBoxes();
    P.appendChild(tenkey(!!p.dec));
  }
  $("go").textContent="こたえあわせ";$("go").className="submit";
  $("fb").className="fb";
  if(p.type==="cells")drawCells();else drawBoxes();
}
/* そのだんで 入力できる 列の一覧（左から順）。
   ・cols を持つだん（小数の筆算）… そのまま（小数点の列は 入っていない）
   ・from を持つだん（わり算の商）… from 以降 */
function rowCols(r){
  const g=S.p.grid,row=g.rows[r];
  if(row.cols)return row.cols;
  const w=row.w||g.w,out=[];
  for(let i=(row.from||0);i<w;i++)out.push(i);
  return out;
}
/* 書きはじめの マス。わり算(dir=1)は 上の位から、小数の筆算(dir=-1)は 小さい位から */
function startCol(r){
  const c=rowCols(r);
  return ((S.p.grid.dir||1)>0)?c[0]:c[c.length-1];
}
function endCol(r){
  const c=rowCols(r);
  return ((S.p.grid.dir||1)>0)?c[c.length-1]:c[0];
}
function drawCells(){
  document.querySelectorAll("#fig .ic").forEach(el=>{
    const r=+el.dataset.r,c=+el.dataset.c;
    el.textContent=(S.cells[r]&&S.cells[r][c])||"";
    el.classList.toggle("foc",!S.answered&&S.cf.r===r&&S.cf.c===c);});
}
/* step=+1:右へ / -1:左へ（画面で 見た向き）。入力できないマス（小数点の列・
   商が立たない位）は とばす。だんの はしを 入力の 向きに こえたときだけ
   次のだん（商→あまり）へ うつり、逆向きに こえたときは 前のだんへ もどる */
function moveCell(step){
  const g=S.p.grid,dir=g.dir||1;
  const r=S.cf.r,cols=rowCols(r),i=cols.indexOf(S.cf.c)+step;
  if(i>=0&&i<cols.length){S.cf={r:r,c:cols[i]};return;}
  const fwd=(step===dir);
  if(fwd&&r<g.rows.length-1){S.cf={r:r+1,c:startCol(r+1)};return;}
  if(!fwd&&r>0){S.cf={r:r-1,c:endCol(r-1)};return;}
  S.cf={r:r,c:cols[Math.max(0,Math.min(cols.length-1,i))]};
}
function fitText(){
  const q=$("q"),c=q.parentElement;
  q.style.transform="scale(1)";
  const cw=c.clientWidth-6,w=q.scrollWidth;
  const s=w>cw?Math.max(.4,cw/w):1;
  q.style.transformOrigin="center";q.style.transform="scale("+s+")";
}
function bindBoxes(){
  document.querySelectorAll("#ansarea .box").forEach(b=>{
    b.onclick=()=>{if(S.answered)return;S.focus=+b.dataset.i;drawBoxes();};});
}
function drawBoxes(){
  document.querySelectorAll("#ansarea .box").forEach(b=>{
    const i=+b.dataset.i,v=S.inputs[i];
    b.classList.toggle("on",i===S.focus);
    b.classList.toggle("lg",String(v||"").length>=8);
    b.innerHTML=(v===""||v==null)?`<span class="ph">?</span>`:v;});
}
function tenkey(dec){
  const w=document.createElement("div");w.className="pad";
  const keys=["7","8","9","4","5","6","1","2","3",dec?".":"clr","0","del"];
  keys.forEach(k=>{
    const b=document.createElement("button");b.className="key";
    if(k==="del"){b.className="key fn";b.textContent="⌫";b.setAttribute("aria-label","1文字けす");}
    else if(k==="clr"){b.className="key fn";b.textContent="C";b.setAttribute("aria-label","ぜんぶけす");}
    else if(k==="."){b.className="key fn";b.textContent="・";b.setAttribute("aria-label","小数点");}
    else b.textContent=k;
    b.onclick=()=>press(k);
    w.appendChild(b);});
  return w;
}
function press(k){
  if(S.answered)return;
  if(S.p.type==="cells"){
    const dir=S.p.grid.dir||1;
    const r=S.cf.r,c=S.cf.c;
    if(k==="del"){ if(S.cells[r][c]==="")moveCell(-dir); S.cells[S.cf.r][S.cf.c]=""; }
    else if(k==="clr"){ S.cells[r]=new Array(S.p.grid.w).fill(""); S.cf={r:r,c:startCol(r)}; }
    else if(k!=="."){ S.cells[r][c]=k; moveCell(dir); }
    drawCells();return;
  }
  const i=S.focus;
  if(k==="del"){S.inputs[i]=S.inputs[i].slice(0,-1);}
  else if(k==="clr"){S.inputs[i]="";}
  else if(k==="next"){S.focus=(S.focus+1)%S.inputs.length;}
  else if(k==="."){if(!S.inputs[i].includes("."))S.inputs[i]+=".";}
  else{
    if(S.inputs[i].replace(".","").length<13)S.inputs[i]+=k;
    /* 分数・帯分数は 書く じゅんに 入力欄が すすむ（下→上） */
    if(S.p.type==="frac"&&i===1&&S.inputs[1]!=="")S.focus=0;
    else if(S.p.type==="mixed"&&i===0&&S.inputs[0]!=="")S.focus=2;
    else if(S.p.type==="mixed"&&i===2&&S.inputs[2]!=="")S.focus=1;
  }
  drawBoxes();
}
/* 正解の文字づら（フィードバック・記録・こたえプリントで 同じものを使う） */
function ansText(p){
  if(p.type==="cells")return p.grid.rows.map(r=>(r.label?r.label+" ":"")+fmt(r.ans)).join("　");
  if(p.type==="choice")return String(p.choices[p.ai]);
  if(p.type==="frac")return `${p.ans[0]}/${p.ans[1]}`;
  if(p.type==="mixed")return `${p.ans[0]}と${p.ans[1]}/${p.ans[2]}`;
  if(p.type==="num2")return `${fmt(p.ans[0])}${(p.boxes[0]&&p.boxes[0].s)||""} ${fmt(p.ans[1])}${(p.boxes[1]&&p.boxes[1].s)||""}`;
  return fmt(p.ans)+((p.boxes&&p.boxes[0]&&p.boxes[0].s)||"");
}
function judge(){
  const p=S.p;let ok=false,ua="";
  const ca=ansText(p);
  if(p.type==="cells"){
    const g=p.grid,vals=[];
    for(let r=0;r<g.rows.length;r++){
      let str;
      if(g.point!=null){
        // 小数の筆算: ［整数の位］.［小数の位］に 組み立ててから 数として くらべる
        const ip=S.cells[r].slice(0,g.point).join("");
        const dp=S.cells[r].slice(g.point+1).join("");
        const need=(g.rows[r].w||g.w)-g.point-1;
        if(ip===""){flash("整数の 位も 入れてね（0のときは 0）");return;}
        if(dp.length!==need){flash("小数点より 下の マスを ぜんぶ 入れてね");return;}
        str=ip+"."+dp;
      }else{
        str=S.cells[r].join("").replace(/^0+(?=\d)/,"");
        if(str===""){flash(g.rows.length>1?"商と あまりの 両方を 入れてね（あまりが ないときは 0）":"答えを 入れてね");return;}
      }
      vals.push(str);}
    ok=vals.every((v,r)=>Math.abs(Number(v)-g.rows[r].ans)<1e-9);
    ua=vals.map((v,r)=>(g.rows[r].label?g.rows[r].label+" ":"")+v).join("　");
  }else if(p.type==="choice"){
    if(S.inputs[0]==null){flash("答えを えらんでね");return;}
    ok=S.inputs[0]===p.ai;ua=String(p.choices[S.inputs[0]]);
  }else if(p.type==="frac"){
    if(S.inputs[0]===""||S.inputs[1]===""){flash("分子と 分母を 入れてね");return;}
    ok=Number(S.inputs[0])===p.ans[0]&&Number(S.inputs[1])===p.ans[1];
    ua=`${S.inputs[0]}/${S.inputs[1]}`;
  }else if(p.type==="mixed"){
    if(S.inputs.some(v=>v==="")){flash("整数・分子・分母を ぜんぶ 入れてね");return;}
    ok=Number(S.inputs[0])===p.ans[0]&&Number(S.inputs[1])===p.ans[1]&&Number(S.inputs[2])===p.ans[2];
    ua=`${S.inputs[0]}と${S.inputs[1]}/${S.inputs[2]}`;
  }else if(p.type==="num2"){
    if(S.inputs.some(v=>v===""||v==="."))
      {flash("2つとも 入れてね");return;}
    ok=S.inputs.every((v,i)=>Math.abs(Number(v)-p.ans[i])<1e-9);
    ua=S.inputs.join(" ");
  }else{
    if(S.inputs[0]===""||S.inputs[0]==="."){flash("答えを 入れてね");return;}
    ok=Math.abs(Number(S.inputs[0])-p.ans)<1e-9;
    ua=S.inputs[0];
  }
  S.answered=true;
  if(p.type==="cells")drawCells();
  logAnswer(p,ok,ua,ca);
  if(!p._r){S.marks[S.idx]=ok?"o":"x";S.idx++;}
  if(ok){
    if(!p._r)S.ok++;
    fx();
  }else if(!p._r&&S.retry.length<6){
    p._r=true;S.retry.push(p);
  }
  if(p.type==="choice"){
    const chs=document.querySelectorAll("#ansarea .ch");
    chs.forEach((c,i)=>{c.classList.remove("on");if(i===p.ai)c.classList.add("ok");
      if(!ok&&i===S.inputs[0])c.classList.add("ng");});
  }
  const fb=$("fb");fb.className="fb show "+(ok?"ok":"ng");
  $("fbt").textContent=ok?"せいかい！":`おしい！ 答えは ${ca}`;
  $("fbe").innerHTML=op(p.exp||"");
  $("go").textContent=(S.idx>=S.total&&S.retry.length===0)?"けっかを 見る":"つぎの問題 →";
  $("go").className="submit next";
}
function flash(msg){
  const fb=$("fb");fb.className="fb show ng";$("fbt").textContent=msg;$("fbe").textContent="";
  setTimeout(()=>{if(!S.answered)fb.className="fb";},1600);
}

/* ---- 学習記録（divp-core連携） ----
   question_key は 単元キー（カルテが16単元の行になるように）。
   どの出題パターンかは p.key、再生成の種は seed として question_params に残す。
   セット内の再挑戦(p._r)は 答えを見たあとなので 記録しない
   （それで retry_queue の マスター判定が 進んでしまわないように）。
   図が無いと解けない問題（分度器・展開図・グラフ・表など）は
   question_figure に 画面と同じ図を そのまま渡す＝誤答のときだけ 保存され、
   講師画面の 解き直しプリントに 図が出る。 */
/* 紙に出す図は「それだけで 成り立つもの」に かぎる。
   ・SVGと表 … 送る（講師の解き直しプリント側に .q-fig2 svg / table のCSSがある）
   ・筆算(.wariwrap / .hissan)と 分数の式(.fexp) … 送らない。このページのCSSで 位や 横線を
     組んでいるので、CSSの無い 別ページに 生HTMLだけ 置くと 数字の羅列に なる。
     そのぶん qtext に「671 ÷ 8」「F(5/6) + F(4/6) = □」と 式を 入れてある。
   ⚠ 送る図は save_answer.php の figure_is_safe() の ホワイトリスト
     （FIG_TAGS / FIG_ATTRS）を 通る必要がある。通らないと 図だけ 黙って 捨てられる。
     筆算のマスに 付けている data-r / data-c は 一覧に無いので、
     これも「筆算は送らない」理由の1つ（新しい図で属性を増やすときは 要確認）。 */
function figForLog(p){
  const f=p.fig||"";
  if(!f||/class="(wariwrap|hissan|fexp)"/.test(f))return "";
  return f;
}
function logAnswer(p,ok,ua,ca){
  if(p._r)return;
  try{
    const D=window.Divp;
    if(!D||typeof D.answer!=="function")return;
    D.answer(ok,{
      question_key:p.unit,
      question_params:{g:p.unit,s:p.seed},
      question_text:String(p.qtext||p.q||p.unitName||"").replace(/<[^>]*>/g,"").replace(/\s*\n\s*/g,"　"),
      question_figure:figForLog(p),
      correct_answer:String(ca),
      wrong_answer:String(ua),
    });
  }catch(e){/* オフラインでも演習はつづける */}
}

/* 解き直し（マイページ → retry.php → ?retry=1 でこのツールを開いたとき）。
   question_params の {g,s} から 保存時と まったく同じ問題を 作り直して 順に出す。
   ツール内に解き直しメニューは置かない（入口はマイページに一本化） */
function startDbRetry(){
  if(!/[?&]retry=1/.test(location.search))return;
  const D=window.Divp;
  if(!D||typeof D.getRetries!=="function")return;
  D.getRetries().then(items=>{
    const qs=[];
    (items||[]).forEach(it=>{
      if(qs.length>=10)return;
      const pm=it.question_params;if(!pm||!pm.g||!pm.s)return;
      const u=UNITS.find(x=>x.k===pm.g);if(!u)return;
      try{ qs.push(genSeeded(u,pm.s)); }catch(e){}
    });
    if(!qs.length)return;
    S={unit:"__retry",total:qs.length,idx:0,ok:0,marks:[],p:null,inputs:[],cells:[],
       cf:{r:0,c:0},focus:0,answered:false,retry:[],queue:qs};
    $("menu").hidden=true;$("result").hidden=true;$("quiz").hidden=false;
    $("uname").textContent="まちがえた もんだい";
    nextQ();
  }).catch(()=>{});
}
/* 「せいかい！」の文字を すぐ 消す（画面を はなれるとき用。ふだんは 自動で消える） */
function hideMaru(){try{if(window.DivpFirework&&DivpFirework.hide)DivpFirework.hide();}catch(e){}}
function finish(){
  hideMaru();
  $("quiz").hidden=true;$("result").hidden=false;
  const rate=S.ok/S.total;
  const rk=rate>=1?"SSS":rate>=0.9?"SS":rate>=0.8?"S":rate>=0.7?"A":rate>=0.5?"B":rate>=0.3?"C":"D";
  $("rk").textContent=rk;
  $("sc").textContent=`${S.total}問中 ${S.ok}問 せいかい`;
  if(S.unit==="__retry"){   // 解き直しはバッジの対象外
    $("rsub").innerHTML=`2回 つづけて できたら マスター！ また ちょうせんしてね`;
    $("again").hidden=true;
    drawTotal();
    return;
  }
  $("again").hidden=false;
  const need=Math.ceil(S.total*0.8), before=badgeOf(S.unit);
  let got=false;
  if(S.ok>=need&&before<BMAX){save.badge[S.unit]=before+1;persist();got=true;}
  const now=badgeOf(S.unit);
  let h=`<div class="bg" style="justify-content:center;margin:10px 0 6px">`;
  for(let i=0;i<BMAX;i++)h+=`<i class="${i<now?"on":""}" style="width:16px;height:16px"></i>`;
  h+=`</div>`;
  h+= got ? (now>=BMAX?`バッジ かんぜんコンプリート！ この単元は マスターだ`:`バッジを 1つ かくとく！ あと ${BMAX-now}こで マスター`)
          : (now>=BMAX?`この単元は すでに マスター`:`${need}問 いじょうで バッジが 1つ ふえるよ`);
  $("rsub").innerHTML=h;
  drawTotal();
}

/* ================================================================
   練習プリント（A4・別ウィンドウ）
   画面と同じ生成関数で n 問つくり、「問題」→改ページ→「こたえ」を出す。
   ⚠ 図(SVG・表)は 文字列を そのまま 子ウィンドウへ 流し込む。見た目を そろえるため
     このページの <style id="appcss"> を 丸ごと コピーして 先に 読ませ、そのあとに
     紙用の 上書きCSSを 足す（図のCSSを 2か所に 持たない＝直すのは 1か所）。
   ⚠ 透かしは print-watermark.js を通す（直後に print すると 画像の デコードが
     間に合わず「ロゴだけ 出ない」ことがある。モジュールが 無ければ 透かし無しで印刷）。
   ⚠ 図の高さは max-height で 止める。分度器・グラフは そのままだと 1問で
     半ページ 使ってしまい、1枚に 収まらない。
   ⚠ 1枚 6問（2列×3段）。A4の 使える高さは 約1039px（96dpi・上下余白11mm）で、
     図つき1問が 200〜240px あるため 8問だと あふれる（実測して 6問にした）。
     器の高さを ぎりぎりに しないこと＝空の 2枚目が 出る原因になる。
   ⚠ 問題と こたえは 6問ずつ 交互に 出す（表=問題 / 裏=こたえ の 両面印刷に なる）。
   ================================================================ */
const PRT_PER_SHEET=6;
function toast(s){
  const t=$("toast");if(!t)return;
  t.textContent=s||"";t.classList.toggle("on",!!s);
  if(toast._t)clearTimeout(toast._t);
  if(s)toast._t=setTimeout(()=>{t.classList.remove("on");},7000);
}
function pmsg(s){const m=$("pmsg");if(m)m.textContent=s||"";toast(s);}
/* n問つくる。同じ問題・同じ出題パターンに かたよらないよう 少し ばらす */
function prtPick(k,n){
  const out=[],seen=new Set(),cap=Math.max(2,Math.ceil(n/3));
  for(let t=0;t<n*80&&out.length<n;t++){
    const p=genFor(k);
    const sig=[p.unit,p.key||"",p.q||"",p.fig||"",ansText(p)].join("|");
    if(seen.has(sig))continue;
    if(out.filter(x=>x.unit===p.unit&&x.key===p.key).length>=cap)continue;
    seen.add(sig);out.push(p);
  }
  return out;
}
function prtAnsArea(p){
  const box=`<span class="pln"></span>`;
  if(p.type==="cells"){
    // 小数の筆算は マスに 書きこんで 終わり。わり算は かこいの下に 計算する 余白と
    // 「こたえ 商__ あまり__」の行を つける
    if(p.grid.point!=null)return "";
    return `<div class="pspace"></div><div class="pal">こたえ　`
      +p.grid.rows.map(r=>`${r.label||""}<span class="pln s2"></span>`).join("　")+`</div>`;
  }
  if(p.type==="choice")
    return `<div class="pch">`+p.choices.map((c,i)=>`<span><i>${"アイウエオ"[i]||(i+1)}</i>${esc(c)}</span>`).join("")
      +`</div><div class="pal">こたえ<span class="pbx"></span></div>`;
  if(p.type==="frac")
    return `<div class="pal">こたえ<span class="pfr"><i></i><b></b></span></div>`;
  if(p.type==="mixed")
    return `<div class="pal">こたえ<span class="pln s2"></span><span class="pto">と</span><span class="pfr"><i></i><b></b></span></div>`;
  if(p.type==="num2")
    return `<div class="pal">こたえ${box}${esc((p.boxes[0]&&p.boxes[0].s)||"")}${box}${esc((p.boxes[1]&&p.boxes[1].s)||"")}</div>`;
  return `<div class="pal">こたえ${box}${esc((p.boxes&&p.boxes[0]&&p.boxes[0].s)||"")}</div>`;
}
function prtItem(p,i,showUnit){
  const fig=(p.type==="cells"&&p.figP)?p.figP:p.fig;
  return `<div class="pit${p.wide?" wide":""}">`
    +`<div class="pqh"><span class="pno">${i+1}</span>${showUnit?`<span class="put">${esc(p.unitName)}</span>`:""}</div>`
    +(p.q?`<div class="pq">${op(esc(p.q)).replace(/\n/g,"<br>")}</div>`:"")
    +(fig?`<div class="pfig">${fig}</div>`:"")
    +prtAnsArea(p)
    +`</div>`;
}
function prtAnsItem(p,i){
  return `<div class="pa"><span class="pno">${i+1}</span><div class="pab">`
    +`<div class="pav">${esc(ansText(p))}</div>`
    +(p.figA?`<div class="pfig small">${p.figA}</div>`:"")
    +`<div class="pae">${op(esc(p.exp||""))}</div>`
    +`</div></div>`;
}

function prtHtml(items,label,withAns,showUnit){
  const d=new Date();
  const date=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const wmImg=(window.ChukyoPrint&&ChukyoPrint.img)?ChukyoPrint.img():"";
  const head=(ttl,extra)=>`<div class="phd"><div>`
    +`<div class="pb">中京個別指導学院</div><div class="pt">${ttl}</div></div>`
    +`<div class="pr"><div>名前<span class="pnm"></span></div><div>${date}${extra||""}</div></div></div>`;
  /* 1枚の 問題数。図（分度器・グラフ・筆算など）が 1つも 無い単元は
     1問が 3行ほどで 収まるので 12問まで 入れる＝紙のむだを へらす。
     図が 1つでも あると 高さが 読めないので 6問に する（A4の 1面に 収める）。 */
  const per=items.some(p=>p.fig||p.type==="cells")?PRT_PER_SHEET:PRT_PER_SHEET*2;
  // こたえは その1面ぶんを すぐ 次の面に 出す（両面印刷で 表=問題・裏=こたえ）
  const sheets=[];
  for(let i=0;i<items.length;i+=per)sheets.push(items.slice(i,i+per));
  const foot=`<p class="pfoot">chukyokobetsu.com　小4算数 まるごとパック</p>`;
  let body="";
  sheets.forEach((chunk,si)=>{
    const no=sheets.length>1?`（${si+1}/${sheets.length}）`:"";
    const from=si*per;
    body+=`<section class="psheet">`+head("小4算数 まるごとパック　練習プリント",no?`　${no}`:"")
      +`<div class="plb">${esc(label)}${no}</div>`
      +`<p class="pins">つぎの もんだいに 答えましょう。</p>`
      +`<div class="pgrid${per>PRT_PER_SHEET?" tight":""}">`+chunk.map((p,j)=>prtItem(p,from+j,showUnit)).join("")+`</div>`
      +foot+`</section>`;
    if(withAns){
      body+=`<section class="psheet">`+head("小4算数 まるごとパック　こたえ",no?`　${no}`:"")
        +`<div class="plb gy">こたえ・${esc(label)}${no}</div>`
        +`<p class="pins">丸つけを して、まちがえた もんだいは もう一度 やってみましょう。</p>`
        +`<div class="pgrid one">`+chunk.map((p,j)=>prtAnsItem(p,from+j)).join("")+`</div>`
        +foot+`</section>`;
    }
  });
  return `<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">`
    +`<title>小4算数まるごとパック 練習プリント｜中京個別指導学院</title>`
    +`<link rel="preconnect" href="https://fonts.googleapis.com">`
    +`<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">`
    +`<style>${prtCss()}</style></head><body>${wmImg}${body}</body></html>`;
}
function printSheet(k,n,withAns){
  try{
    const label=(k==="mix")?"ぜんぶ ミックス":(UNITS.find(u=>u.k===k)||{n:""}).n;
    const items=prtPick(k,n);
    if(!items.length){pmsg("プリントを つくれませんでした。もう一度 おしてください。");return;}
    const w=window.open("","_blank","width=820,height=1160");
    if(!w){pmsg("印刷の タブが ひらけませんでした。ブラウザの ポップアップを 許可してから もう一度 おしてください。");return;}
    w.document.write(prtHtml(items,label,withAns!==false,k==="mix"));
    w.document.close();
    pmsg(`「${label}」の プリント（${items.length}問${withAns!==false?"＋こたえ":""}）を つくりました。`);
    /* 透かし画像の デコードを 待ってから 印刷ダイアログを 出す
       （待たないと ロゴだけ 抜けることがある。モジュールが 無ければ そのまま印刷） */
    setTimeout(()=>{
      try{
        if(window.ChukyoPrint&&ChukyoPrint.print)ChukyoPrint.print(w.document,w);
        else{w.focus();w.print();}
      }catch(e){try{w.focus();w.print();}catch(e2){}}
    },700);
  }catch(err){
    pmsg("プリントの さくせいで エラーが 出ました。");
    try{console.error("print error",err);}catch(e){}
  }
}
