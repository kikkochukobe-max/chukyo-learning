<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2次不等式マスター | 中京個別指導学院</title>
<meta name="description" content="高校数学I「2次不等式」を基礎から応用までまるごと練習できるツール。因数分解で解く・解の公式で解く・D≦0の不等式（すべての実数／解なし）・連立不等式・解から係数決定・判別式と実数解・つねに成り立つ不等式・解の配置・文章題・絶対値を含む不等式・文字係数の場合分けと整数解の11タイプを、基本／標準／発展のレベル別に出題します。図モードではグラフと x 軸の位置関係を動かしながら確かめられます。中京個別指導学院。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- ⚠ 共通モジュール（divp-header.js など）は <head> ではなく <body> 開始直後に置く。
     ヘッダーは document.currentScript の位置に自分を挿し込むので、head に書くと
     header 要素が head の中に入って画面に一切出ない（エラーは出ない）。 -->
<style>
/* ================================================================
   2次不等式マスター — 2次関数マスター / 数列完全マスター / 円と方程式マスターと
   同じ「高校生向け・暗い紺地＋シアン／バイオレット」でそろえる（同じ生徒が行き来する）。
   共通モジュールの色は :root の変数で上書きする（var()のフォールバック方式なので
   読み込み順に関係なくツール側が勝つ）。
   ================================================================ */
:root{
  --bg:#070A12;
  --bg2:#0C1120;
  --panel:rgba(255,255,255,.045);
  --line:rgba(140,175,255,.16);
  --line2:rgba(140,175,255,.30);
  --ink:#E9EEFB;
  --ink2:#B7C1DA;
  --muted:#7C86A1;
  --cy:#38E8FF;
  --cy2:#0E9EC0;
  --vi:#A78BFA;
  --vi2:#7C5CFA;
  --gold:#FFD166;
  --ok:#7EE0A0;
  --ng:#FF7A80;
  --jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ── 答え合わせ表示（divp-choice-mark.js）────────────────────────
     正解の緑は #3E8E5A に統一するのが原則だが、このツールは暗背景なので
     science_js3_ionlab / 2次関数マスター などと同じ明るい緑の例外側にそろえる。 */
  --divp-mark-ok:#7ee0a0;
  --divp-mark-ok-bg:rgba(126,224,160,.16);
  --divp-mark-ok-bg-soft:rgba(126,224,160,.10);
  --divp-mark-ok-text:#bfe6cf;
  --divp-mark-ng:#ff7a80;
  --divp-mark-ng-bg:rgba(255,122,128,.16);
  --divp-mark-dim-opacity:.38;
  /* ── 10問ごとの評価（divp-result.js）を暗配色に寄せる。
     ランクの色（--divp-result-grade-*）は既定の派手な配色のまま（ランクは目立ってよい） */
  --divp-result-bg:#0C1222;
  --divp-result-ink:#E9EEFB;
  --divp-result-sub:#7C86A1;
  --divp-result-accent:#38E8FF;
  --divp-result-accent-ink:#04121A;
  --divp-result-sub-btn:rgba(255,255,255,.07);
  --divp-result-wrong-btn:#7C5CFA;
  --divp-result-ok:#7ee0a0;
  --divp-result-ok-bg:rgba(126,224,160,.14);
  --divp-result-ng:#ff7a80;
  --divp-result-ng-bg:rgba(255,122,128,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
/* html 側にも地の色を置く（body の背景は fixed なので、端まで引っ張られたときに
   ここが無いと白地が出て、ほぼ白の文字 --ink が読めなくなる） */
html{background:#070A12;}
body{
  background:
    radial-gradient(1200px 760px at 82% -12%, rgba(56,232,255,.10), transparent 60%),
    radial-gradient(900px 700px at 4% 6%, rgba(167,139,250,.11), transparent 58%),
    linear-gradient(180deg,var(--bg2),var(--bg) 46%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--jp);
  font-feature-settings:"palt";
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
/* ⚠ body を flex/grid にしない。共通ヘッダーは .wrap の兄弟として body に挿されるので、
   flex にすると横に並んで画面左端に縦長の帯になる（中央寄せは .wrap 側の margin で行う）。 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg, rgba(140,175,255,.045) 0 1px, transparent 1px 56px),
    repeating-linear-gradient(0deg,  rgba(140,175,255,.045) 0 1px, transparent 1px 56px);
  mask-image:radial-gradient(1000px 700px at 50% 0%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(1000px 700px at 50% 0%, #000 30%, transparent 78%);
}
.wrap{position:relative;z-index:1;padding:14px 12px 96px;}
a{color:var(--cy);}

/* ---------- ヘッダー ---------- */
header.dv-head{
  max-width:920px;margin:0 auto 12px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);
}
h1{font-size:1.42rem;font-weight:900;letter-spacing:.02em;line-height:1.18;display:flex;flex-direction:column;gap:5px;}
h1 .sub{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.26em;color:var(--cy);text-transform:uppercase;}
h1 .ttl{background:linear-gradient(92deg,#fff 12%,var(--cy) 58%,var(--vi) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.stats{display:flex;gap:8px;}
.stat{min-width:74px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:7px 10px;}
.stat b{display:block;font-family:var(--mono);font-size:1.12rem;line-height:1.1;color:#fff;}
.stat span{display:block;font-size:.56rem;letter-spacing:.18em;color:var(--muted);margin-top:3px;}
#rankBadge b{background:linear-gradient(92deg,var(--gold),#FFF1C2);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ---------- 上段タブ ---------- */
.viewtabs{max-width:920px;margin:0 auto 14px;display:flex;gap:8px;}
.vtab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:10px 8px;color:var(--ink2);cursor:pointer;font-family:inherit;
  transition:border-color .18s, box-shadow .18s, background .18s, color .18s;
}
.vtab b{font-size:.94rem;font-weight:700;}
.vtab i{font-style:normal;font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;color:var(--muted);}
.vtab.on{
  color:#fff;border-color:var(--cy);
  background:linear-gradient(140deg,rgba(56,232,255,.16),rgba(167,139,250,.14));
  box-shadow:0 0 0 1px rgba(56,232,255,.28), 0 14px 30px -18px rgba(56,232,255,.85);
}
.vtab.on i{color:var(--cy);}

/* ---------- 出題タイプ / レベル ---------- */
.pane{max-width:920px;margin:0 auto;}
.selbox{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;margin-bottom:12px;}
.selhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.selhead h2{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.22em;color:var(--cy);text-transform:uppercase;}
.selacts{display:flex;align-items:center;gap:7px;}
.foldBtn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:.7rem;padding:4px 12px;cursor:pointer;}
.foldBtn.prt{color:var(--gold);border-color:rgba(255,209,102,.38);}
.foldBtn.prt:hover{background:rgba(255,209,102,.12);}
.selbox.folded .chips,.selbox.folded .mixbox{display:none;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);
  color:var(--ink2);font-family:inherit;font-size:.76rem;padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;line-height:1.2;
  transition:border-color .16s, box-shadow .16s, background .16s, color .16s;
}
.chip small{font-family:var(--mono);font-size:.58rem;color:var(--muted);}
.chip:hover{border-color:var(--line2);color:var(--ink);}
.chip.on{
  color:#fff;border-color:var(--cy);
  background:linear-gradient(135deg,rgba(56,232,255,.20),rgba(167,139,250,.16));
  box-shadow:0 0 0 1px rgba(56,232,255,.26), 0 10px 24px -16px rgba(56,232,255,.9);
}
.chip.on small{color:#CFF6FF;}
.chip.mix{border-style:dashed;}
.chip.mix.on{border-style:solid;border-color:var(--vi);
  box-shadow:0 0 0 1px rgba(167,139,250,.3), 0 10px 24px -16px rgba(167,139,250,.9);}
.lvrow{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;}
.lvlabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);}
.lvseg{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:rgba(0,0,0,.22);}
.lvbtn{border:0;border-radius:9px;background:transparent;color:var(--ink2);font-family:inherit;
  font-size:.76rem;padding:6px 13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .16s,color .16s;}
.lvbtn u{text-decoration:none;font-family:var(--mono);font-size:.66rem;color:var(--muted);}
.lvbtn.on{background:linear-gradient(135deg,var(--cy2),var(--vi2));color:#fff;}
.lvbtn.on u{color:#DFF6FF;}
/* そのタイプに無いレベル（発展を持たないタイプ）は押せなくする。
   ボタンごと消すと段組みが動いて押しまちがえるので、薄くして残す */
.lvbtn[disabled]{opacity:.28;cursor:default;}
#lvDesc{font-size:.74rem;color:var(--ink2);}
#lvDesc b{color:var(--cy);font-weight:700;}
#lvDesc i{font-style:normal;color:var(--muted);}
.mixbox{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;}
.mixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;}
.mixgrid label{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink2);
  border:1px solid transparent;border-radius:9px;padding:5px 7px;cursor:pointer;}
.mixgrid label:hover{background:rgba(255,255,255,.04);}
.mixgrid input{accent-color:var(--cy);width:15px;height:15px;}
.mixbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.miniBtn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:.68rem;padding:5px 11px;cursor:pointer;}
.miniBtn:hover{border-color:var(--line2);color:#fff;}

/* ---------- 問題カード ---------- */
/* ⚠ overflow は visible のまま（正解はんこは直径171pxで、hidden だと切れる） */
#card{
  position:relative;overflow:visible;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.018));
  padding:16px 16px 18px;box-shadow:0 30px 60px -50px #000;
}
#card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cy),var(--vi),transparent);opacity:.75;}
#card.shake{animation:shk .34s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.qmeta .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--cy);
  border:1px solid rgba(56,232,255,.34);border-radius:999px;padding:3px 9px;}
.qmeta .tag.vi{color:var(--vi);border-color:rgba(167,139,250,.38);}
.qmeta .tag.pl{color:var(--muted);border-color:var(--line);}
.qmeta .grow{flex:1;}
.qlead{font-size:.94rem;line-height:1.72;color:var(--ink);}
.qsub{margin-top:9px;font-size:.82rem;color:var(--ink2);line-height:1.8;}
.qdisp{margin:14px 0 4px;padding:14px 8px;text-align:center;font-size:1.22rem;color:#fff;
  border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);overflow-x:auto;}
.qdisp .katex{color:#fff;}
.qdisp .katex-display{margin:.24em 0;}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;}
@media (max-width:560px){.choices{grid-template-columns:1fr;}}
.choiceBtn{
  display:flex;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);
  color:var(--ink);font-family:inherit;font-size:.96rem;padding:12px;cursor:pointer;
  min-height:56px;transition:border-color .15s,background .15s,transform .08s;
}
.choiceBtn:hover:not([disabled]){border-color:var(--line2);background:rgba(255,255,255,.06);}
.choiceBtn:active:not([disabled]){transform:scale(.985);}
.choiceBtn .cno{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--mono);font-size:.76rem;color:var(--cy);
  border:1px solid rgba(56,232,255,.32);background:rgba(56,232,255,.08);}
.choiceBtn.sel{border-color:var(--cy);background:rgba(56,232,255,.12);box-shadow:0 0 0 1px rgba(56,232,255,.3);}
.choiceBtn .katex{color:inherit;}
/* 場合分けの答え（⑪文字係数など）は1行が長いので、選択肢は1列にして折り返す */
.choices.wide{grid-template-columns:1fr;}
.choices.wide .choiceBtn{font-size:.88rem;line-height:1.7;}
.numwrap{margin-top:14px;}
.numdisp{height:58px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:flex-end;padding:0 16px;
  font-family:var(--mono);font-size:1.62rem;color:#fff;letter-spacing:.04em;}
.numdisp.empty{color:var(--muted);font-size:1rem;letter-spacing:.14em;}
.numunit{font-size:.8rem;color:var(--muted);margin-left:8px;font-family:var(--jp);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px;max-width:330px;}
.key{height:52px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);
  color:#fff;font-family:var(--mono);font-size:1.2rem;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;}
.key:hover{background:rgba(255,255,255,.09);border-color:var(--line2);}
.key:active{transform:scale(.95);background:rgba(56,232,255,.2);}
.key.fn{font-size:.92rem;color:var(--ink2);}
.verdict{margin-top:13px;font-size:.9rem;font-weight:700;min-height:1.3em;}
.verdict.ok{color:var(--ok);}
.verdict.ng{color:var(--ng);}
#explain{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.exHead{font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;color:var(--vi);margin-bottom:8px;}
.exLine{font-size:.86rem;line-height:1.95;color:var(--ink2);padding:1px 0;}
.exLine .katex{color:#fff;}
.exLine b{color:#fff;}
.exFml{margin:8px 0;padding:9px 11px;border-left:2px solid var(--vi);
  background:rgba(167,139,250,.08);border-radius:0 10px 10px 0;font-size:.9rem;color:var(--ink);line-height:1.9;}
.exFml .katex{color:#fff;}
.exFml.ans{border-left-color:var(--gold);background:rgba(255,209,102,.08);}
/* 解説の中の図（放物線の略図・数直線）。色は SVG の属性で持つ */
.exFig{margin:10px 0 6px;padding:8px 8px 6px;border:1px solid var(--line);border-radius:12px;background:rgba(0,0,0,.25);}
.exFig svg{display:block;width:100%;max-width:380px;height:auto;margin:0 auto;}
.exFig .cap{font-size:.7rem;color:var(--muted);text-align:center;margin-top:4px;line-height:1.7;}
.exFig .cap span{margin:0 5px;white-space:nowrap;}
.figLink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  border:1px solid rgba(167,139,250,.4);border-radius:999px;background:rgba(167,139,250,.1);
  color:#D8CCFF;font-family:inherit;font-size:.74rem;padding:6px 13px;cursor:pointer;}
.figLink:hover{background:rgba(167,139,250,.2);}
.actions{max-width:920px;margin:14px auto 0;display:flex;gap:9px;}
.btn{flex:1;border:0;border-radius:14px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:15px 12px;cursor:pointer;color:#04121A;
  background:linear-gradient(135deg,var(--cy),#7FF0FF);box-shadow:0 16px 34px -22px rgba(56,232,255,.95);}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none;}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none;}
#toast{max-width:920px;margin:10px auto 0;text-align:center;font-size:.8rem;color:var(--cy);
  min-height:1.2em;font-family:var(--mono);letter-spacing:.06em;}
.banner{max-width:920px;margin:0 auto 12px;border:1px solid rgba(255,209,102,.4);
  background:rgba(255,209,102,.08);border-radius:12px;padding:10px 13px;font-size:.79rem;color:#FFE9AE;line-height:1.6;}

/* ================================================================
   図モード
   「グラフと x 軸の位置関係で解が決まる」「m を動かすとグラフが x 軸から離れる瞬間」
   「解の配置の3条件」「文字係数の場合分けが切りかわる瞬間」の4つを、値を動かしながら見る。
   ⚠ 図は JS が SVG を組み立てて innerHTML で入れる。色・線は**属性**で書いてある。
     図モードの図は紙にも記録にも出ない（question_figure には使わない）。
     演習側の問題は全部テキストで解ける。
   ================================================================ */
#view-fig{display:none;}
.glead{max-width:920px;margin:0 auto 12px;font-size:.84rem;color:var(--ink2);line-height:1.8;}
.glead b{color:var(--cy);}
.ctrlbox{border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:11px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper > span.lb{font-size:.8rem;color:var(--ink2);min-width:2.4em;}
.stepper .sbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.05);color:#fff;font-family:var(--mono);font-size:1rem;cursor:pointer;}
.stepper .sbtn:hover{background:rgba(56,232,255,.16);border-color:var(--line2);}
.stepper .sval{min-width:46px;text-align:center;font-family:var(--mono);font-size:1.02rem;color:var(--cy);
  border:1px solid var(--line);border-radius:9px;padding:4px 6px;background:rgba(0,0,0,.28);}
.stepper .sval.lbl{font-family:var(--jp);font-size:.84rem;}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:10px;align-items:start;}
@media (max-width:760px){.gwrap{grid-template-columns:1fr;}}
.gcard{border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.3);padding:10px;overflow:hidden;}
.gcard h3{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;color:var(--vi);margin-bottom:6px;text-transform:uppercase;}
/* 図は正方形に近い viewBox なので、幅いっぱいにすると縦にも同じだけ伸びる。
   画面の高さを食いすぎないよう上限をつけて中央に置く */
.gcard svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
.greadout{font-size:.86rem;line-height:2.05;color:var(--ink2);}
.greadout .katex{color:#fff;}
.greadout b{color:#fff;}
.greadout .ck{display:flex;gap:8px;align-items:baseline;}
.greadout .ck i{font-style:normal;font-weight:700;width:1.2em;text-align:center;}
.greadout .ck.y i{color:var(--ok);}
.greadout .ck.n i{color:var(--ng);}
.gjudge{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:700;
  border:1px solid rgba(56,232,255,.34);background:rgba(56,232,255,.1);color:#CFF6FF;line-height:1.7;}
.gjudge .katex{color:#fff;}

<script>
"use strict";
/* ================================================================
   math_hs_niji_futoushiki.html  2次不等式マスター
   unit_key = math_hs_niji_futoushiki
   出題範囲 = 数学I「2次不等式」とその応用（判別式の利用・解の配置・文字係数まで）
   modes(=question_key):
     2次不等式の解き方 … inshi(因数分解で解く) / koushiki(解の公式で解く) /
                          tokushu(D≦0 の不等式＝すべての実数・解なし)
     連立・係数決定     … renritsu(連立不等式) / kettei(解から係数決定)
     判別式の利用       … hanbetsu(判別式と実数解・共有点) / tsuneni(つねに成り立つ) /
                          haichi(解の配置)
     文章題             … bunsho
     発展               … zettai(絶対値を含む) / moji(文字係数の場合分け・整数解)
     ＋ mix（えらんだタイプからランダム。記録はその問題のタイプで残すので "mix" は飛ばない）
   レベル(1基本/2標準/3発展)は question_key を増やさず question_params の lv に持つ
     ＝カルテはタイプ単位で読める。⚠ レベルの数はタイプごとに違う（発展を持たないタイプは2つまで）。
   共通処理（4点セット）:
     ・学習記録 … Divp.answer（判定直後に1行）
     ・正解エフェクト … divp-correct-jh（js/jh共通のはんこ）
     ・解き直し … ?retry=1 で question_params {m:タイプ, lv:レベル, s:種} から同じ問題を作り直す（CLAUDE.md 2d）
     ・図 … 問題は全部テキストだけで解ける（式も条件も本文に出る）ので question_figure は使わない。
            選択式は question_choices を渡して解き直しプリントに選択肢ごと出す。
            解説には放物線の略図と数直線を出す（画面だけ。記録には載せない）。

   ── 答えの持ち方 ─────────────────────────────────────────
   2次不等式の答えは「区間の集まり」なので、文字列ではなく集合（mkSet の parts）で作り、
   正解も誤答もその集合を setStr() で文字列にする。同じ集合は必ず同じ文字列になる
   （＝「値としては正解と同じ誤答」が選択肢に紛れ込まない）。
   各問題は chk()（解の集合を、もとの不等式を数値で直接調べた結果と突き合わせる）を持つ。
   画面では使わないが、回帰テストが全タイプ×全レベルで回して答えの正しさを見張る。

   ⚠ 記録に載せる文字列の書き分け（CLAUDE.md 2a / 2f）:
     ・答え・選択肢の文字列は2種類だけ。
         TeX … 和文を含まない純粋な式（"-2 \lt x \lt 3"）。ASCII だけで書く。
         平文 … 和文を含むもの（"すべての実数" "a＜1 のとき …"）。^ _ { } \ を1文字も入れない。
       非ASCIIの文字が1つでもあれば平文、なければ TeX とみなして描き分ける（choiceHtml）。
     ・不等号は **生の「<」を1文字も書かない**（api/save_answer.php が question_choices を
       丸ごと捨てる）。TeX では \lt / \leqq、平文では全角の「＜」「≦」を使う。
     ・平文の分数は F(分子/分母)（講師画面が縦組みの分数に描く）。
     ・question_text は 255 バイト、correct_answer / student_answer は 100 バイトで
       サーバーが切る（バイト単位の substr）。日本語は1文字3バイトなので、
       capBytes() で文字の境目で切ってから送る（文字の途中で切れると不正なUTF-8になる）。
   ================================================================ */

/* ---------- 小道具 ---------- */
const N_CHOICES=6;
const UNIT_KEY="math_hs_niji_futoushiki";
const EPS=1e-9;
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
/* 本文中に数式を混ぜる用（KaTeXはあとで renderTexIn がまとめて描く） */
function T(tex){return '<span class="tex" data-tex="'+esc(tex)+'"></span>';}
function TD(tex){return '<span class="tex" data-d="1" data-tex="'+esc(tex)+'"></span>';}
function renderTexIn(root){
  if(!root)return;
  root.querySelectorAll(".tex").forEach(el=>{
    const s=el.dataset.tex;
    if(s==null)return;
    if(window.katex){
      try{katex.render(s,el,{throwOnError:false,displayMode:el.dataset.d==="1"});}
      catch(e){el.textContent=s;}
    }else{
      /* KaTeX が来る前でも読めるように、記号だけ落とした素の文字を出しておく */
      el.textContent=s.replace(/\\[a-zA-Z]+/g," ").replace(/[{}]/g,"");
    }
  });
}
function stripTags(html){
  const d=document.createElement("div");d.innerHTML=String(html==null?"":html);
  d.querySelectorAll(".tex").forEach(el=>{el.textContent=" ";});
  return (d.textContent||"").replace(/\s+/g," ").trim();
}
/* 経過時間は端末の時計に左右されない performance.now() で測る（CLAUDE.md 5a3） */
function nowMs(){
  try{if(window.performance&&typeof performance.now==="function")return performance.now();}catch(e){}
  return Date.now();
}
/* UTF-8 で max バイト以内に収める（文字の境目で切る）。
   サーバーはバイト単位の substr で切るので、日本語の途中で切られると不正な文字列になる */
function capBytes(s,max){
  s=String(s==null?"":s);
  let enc=null;
  try{enc=new TextEncoder();}catch(e){}
  if(!enc)return (s.length*3<=max)?s:s.slice(0,Math.floor(max/3));
  if(enc.encode(s).length<=max)return s;
  let out="";
  for(const ch of s){
    if(enc.encode(out+ch+"…").length>max)break;
    out+=ch;
  }
  return out+"…";
}

/* ---------- 数の見せ方 ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
/* 符号つきの数。0 のときは空文字（「+0」を出さない） */
function sg(v){return (v===0)?"":((v<0)?("-"+Math.abs(v)):("+"+v));}
/* 負の数だけかっこでくるむ（代入の途中式用） */
function par(v){return (v<0)?("("+v+")"):String(v);}
function fracTex(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);n/=g;d/=g;
  if(d===1)return String(n);
  return (n<0?"-":"")+"\\dfrac{"+Math.abs(n)+"}{"+d+"}";
}
/* 平文の分数。講師画面が縦組みの分数に描けるよう F(分子/分母) で包み、符号は外に出す */
function fracP(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);n/=g;d/=g;
  if(d===1)return String(n);
  return (n<0?"-":"")+"F("+Math.abs(n)+"/"+d+")";
}
/* 符号つきの分数（必ず先頭に +/- が付く。平方完成の途中式用） */
function fracSgTex(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);const nn=n/g,dd=d/g;
  return (nn<0?"-":"+")+((dd===1)?String(Math.abs(nn)):("\\dfrac{"+Math.abs(nn)+"}{"+dd+"}"));
}
/* 項を並べて多項式にする。terms=[[係数,"x^2"],[係数,"x"],[係数,""]]
   ⚠ 先頭が負のときだけ "-"、2項目以降は必ず符号を付ける（"+"の付け忘れ防止） */
function poly(terms){
  let s="";
  terms.forEach(function(t){
    const c=t[0],v=t[1];
    if(c===0)return;
    const a=Math.abs(c);
    const body=(v==="")?String(a):((a===1)?v:(String(a)+v));
    s+=(s===""?(c<0?"-":""):(c<0?"-":"+"))+body;
  });
  return s||"0";
}
/* ax²+bx+c。sup は画面/TeX なら "^2"、記録用の平文なら "²" */
function quad(a,b,c,v,sup){return poly([[a,v+sup],[b,v],[c,""]]);}
/* 1次式 ax+b */
function lin(a,b,v){return poly([[a,v||"x"],[b,""]]);}
/* 素の文字で作った式を TeX に持ち込むときの変換（KaTeX は「²」を知らない） */
function texA(s){return String(s).replace(/²/g,"^2").replace(/³/g,"^3");}

/* ---------- 不等号 ---------- */
const OPS=[">",">=","<","<="];
const OPT={">":" \\gt ",">=":" \\geqq ","<":" \\lt ","<=":" \\leqq "};
const OPP={">":"＞",">=":"≧","<":"＜","<=":"≦"};
function flipDir(op){return {">":"<",">=":"<=","<":">","<=":">="}[op];}
function togEq(op){return {">":">=",">=":">","<":"<=","<=":"<"}[op];}
function isEq(op){return op===">="||op==="<=";}
function isGt(op){return op===">"||op===">=";}
/* 数値の比較（誤差つき）。chk() の「正解」側で使う */
function cmp(val,op){
  if(op===">")return val>EPS;
  if(op===">=")return val>-EPS;
  if(op==="<")return val<-EPS;
  return val<EPS;
}
/* ax²+bx+c op 0 の TeX / 平文 */
function qIneq(a,b,c,op,v){return quad(a,b,c,v||"x","^2")+OPT[op]+"0";}
function qIneqP(a,b,c,op,v){return quad(a,b,c,v||"x","²")+OPP[op]+"0";}
/* 因数分解した形。fs=[[p,q],…] は (px-q) を表す。単独の x は先頭に置く */
function facTex(lead,fs,v){
  v=v||"x";
  const parts=fs.map(function(f){
    const s=poly([[f[0],v],[-f[1],""]]);
    return (s===v)?s:("("+s+")");
  });
  const bare=parts.filter(function(s){return s===v;});
  const rest=parts.filter(function(s){return s!==v;});
  const head=(lead===1)?"":((lead===-1)?"-":String(lead));
  return head+bare.concat(rest).join("");
}

/* ================================================================
   数（p + s√q）/ r
   2次不等式の端点は「整数・分数・(p±√q)/r」のどれか。N() で約分・√の簡約まで済ませた
   正規形にしておくと、同じ値は必ず同じ表記になる。v は大小比較用の浮動小数。
   ================================================================ */
function sqf(q){let k=1,m=q;for(let i=2;i*i<=m;i++){while(m%(i*i)===0){m/=i*i;k*=i;}}return [k,m];}
function N(p,s,q,r){
  s=s||0;q=(q==null)?1:q;r=r||1;
  if(s!==0&&q>1){const kq=sqf(q);s*=kq[0];q=kq[1];}
  if(q===1){p+=s;s=0;}
  if(q===0){s=0;q=1;}
  if(s===0)q=1;
  if(r<0){p=-p;s=-s;r=-r;}
  if(p===0&&s===0)r=1;
  const g=gcd(gcd(p,s),r);
  p/=g;s/=g;r/=g;
  if(p===0)p=0;                       /* -0 をなくす */
  return {p:p,s:s,q:q,r:r,v:(p+s*Math.sqrt(q))/r};
}
function nInt(n){return N(n,0,1,1);}
function nFr(n,d){return N(n,0,1,d);}
/* 浮動小数そのままの数（図モードで a=2.5 のような値を扱う用。約分はしない） */
function nV(x){return {p:x,s:0,q:1,r:1,v:x};}
function nNeg(n){return {p:-n.p||0,s:-n.s||0,q:n.q,r:n.r,v:-n.v};}
function nTex(n){
  if(n.s===0)return fracTex(n.p,n.r);
  const rt=(Math.abs(n.s)===1?"":Math.abs(n.s))+"\\sqrt{"+n.q+"}";
  if(n.p===0){
    if(n.r===1)return (n.s<0?"-":"")+rt;
    return (n.s<0?"-":"")+"\\dfrac{"+rt+"}{"+n.r+"}";
  }
  const num=n.p+(n.s<0?"-":"+")+rt;
  return (n.r===1)?num:("\\dfrac{"+num+"}{"+n.r+"}");
}
/* 平文（和文まじりの答え・問題文用）。分数は F()、ルートは √ */
function nPlain(n){
  if(n.s===0)return fracP(n.p,n.r);
  const rt=(Math.abs(n.s)===1?"":Math.abs(n.s))+"√"+n.q;
  const num=(n.p===0)?((n.s<0?"-":"")+rt):(n.p+(n.s<0?"-":"+")+rt);
  return (n.r===1)?num:("F("+num+"/"+n.r+")");
}
/* 図の中の目もり用（SVG の text。KaTeX を使わない） */
function nLab(n){
  if(n.s===0){
    if(n.r===1)return String(Math.round(n.p*100)/100);
    return n.p+"/"+n.r;
  }
  const rt=(Math.abs(n.s)===1?"":Math.abs(n.s))+"√"+n.q;
  const num=(n.p===0)?((n.s<0?"-":"")+rt):(n.p+(n.s<0?"-":"+")+rt);
  return (n.r===1)?num:("("+num+")/"+n.r);
}
/* (P ± √D)/R を簡約して TeX に（解の公式の途中式用） */
function pmTex(P,D,R){
  const n=N(P,1,D,R);
  if(n.s===0)return nTex(N(P,0,1,R));
  const s=Math.abs(n.s);
  const rt=(s===1?"":s)+"\\sqrt{"+n.q+"}";
  const num=(n.p===0)?("\\pm "+rt):(n.p+"\\pm "+rt);
  return (n.r===1)?num:("\\dfrac{"+num+"}{"+n.r+"}");
}

/* ================================================================
   解の集合（区間の集まり）
   part = {lo:数|null, lc:端を含むか, hi:数|null, hc:端を含むか}（null は ±∞）
   mkSet() が並べ替え・重なりの合併・空の区間の除去までして正規形にする。
   ================================================================ */
function loV(p){return p.lo?p.lo.v:-Infinity;}
function hiV(p){return p.hi?p.hi.v:Infinity;}
function mkSet(parts){
  const ps=parts.filter(function(p){
    if(p.lo&&p.hi){
      if(p.lo.v>p.hi.v+EPS)return false;
      if(Math.abs(p.lo.v-p.hi.v)<=EPS&&!(p.lc&&p.hc))return false;
    }
    return true;
  }).map(function(p){
    return {lo:p.lo||null,lc:p.lo?!!p.lc:false,hi:p.hi||null,hc:p.hi?!!p.hc:false};
  });
  ps.sort(function(a,b){
    const la=loV(a),lb=loV(b);
    if(la<lb-EPS)return -1;
    if(la>lb+EPS)return 1;
    return (b.lc?1:0)-(a.lc?1:0);
  });
  const out=[];
  ps.forEach(function(p){
    const last=out[out.length-1];
    if(last){
      const lh=hiV(last),pl=loV(p);
      if(lh>pl+EPS||(Math.abs(lh-pl)<=EPS&&(last.hc||p.lc))){
        const ph=hiV(p);
        if(ph>lh+EPS){last.hi=p.hi;last.hc=p.hc;}
        else if(Math.abs(ph-lh)<=EPS)last.hc=last.hc||p.hc;
        return;
      }
    }
    out.push({lo:p.lo,lc:p.lc,hi:p.hi,hc:p.hc});
  });
  return {parts:out};
}
function ALLS(){return {parts:[{lo:null,lc:false,hi:null,hc:false}]};}
function NONES(){return {parts:[]};}
function ptSet(n){return mkSet([{lo:n,lc:true,hi:n,hc:true}]);}
function exSet(n){return mkSet([{lo:null,hi:n,hc:false},{lo:n,lc:false,hi:null}]);}
function gtSet(n,c){return mkSet([{lo:n,lc:!!c,hi:null}]);}
function ltSet(n,c){return mkSet([{lo:null,hi:n,hc:!!c}]);}
function ivSet(a,b,ca,cb){return mkSet([{lo:a,lc:!!ca,hi:b,hc:(cb==null)?!!ca:!!cb}]);}
function outSet(a,b,c){return mkSet([{lo:null,hi:a,hc:!!c},{lo:b,lc:!!c,hi:null}]);}
function inter(A,B){
  const out=[];
  A.parts.forEach(function(a){B.parts.forEach(function(b){
    const la=loV(a),lb=loV(b),ha=hiV(a),hb=hiV(b);
    let lo,lc,hi,hc;
    if(la>lb+EPS){lo=a.lo;lc=a.lc;}
    else if(lb>la+EPS){lo=b.lo;lc=b.lc;}
    else{lo=a.lo;lc=a.lc&&b.lc;}
    if(ha<hb-EPS){hi=a.hi;hc=a.hc;}
    else if(hb<ha-EPS){hi=b.hi;hc=b.hc;}
    else{hi=a.hi;hc=a.hc&&b.hc;}
    out.push({lo:lo,lc:lc,hi:hi,hc:hc});
  });});
  return mkSet(out);
}
function union(A,B){return mkSet(A.parts.concat(B.parts));}
function comp(A){
  const out=[];
  let cur=null,curC=false,open=true;      /* open=false … 右端が +∞ まで埋まった */
  A.parts.forEach(function(p){
    if(p.lo)out.push({lo:cur,lc:curC,hi:p.lo,hc:!p.lc});
    if(p.hi){cur=p.hi;curC=!p.hc;}else open=false;
  });
  if(open)out.push({lo:cur,lc:curC,hi:null,hc:false});
  return mkSet(out);
}
function isEmpty(S){return !S.parts.length;}
function isPoint(p){return !!(p.lo&&p.hi&&Math.abs(p.lo.v-p.hi.v)<=EPS);}
function isBounded(S){return S.parts.every(function(p){return p.lo&&p.hi;});}
function inSet(S,x){
  return S.parts.some(function(p){
    const okL=!p.lo||x>p.lo.v+EPS||(Math.abs(x-p.lo.v)<=EPS&&p.lc);
    const okH=!p.hi||x<p.hi.v-EPS||(Math.abs(x-p.hi.v)<=EPS&&p.hc);
    return okL&&okH;
  });
}
/* |x| ∈ St となる x の集合（St は t についての集合。t≧0 の部分だけを左右に映す） */
function absPre(St){
  const T0=inter(St,gtSet(nInt(0),true));
  const out=[];
  T0.parts.forEach(function(p){
    out.push({lo:p.lo,lc:p.lc,hi:p.hi,hc:p.hc});
    out.push({lo:p.hi?nNeg(p.hi):null,lc:p.hc,hi:p.lo?nNeg(p.lo):null,hc:p.lc});
  });
  return mkSet(out);
}

/* ---------- 集合 → 文字列 ---------- */
function relS(c,mode){return mode==="tex"?(c?" \\leqq ":" \\lt "):(c?"≦":"＜");}
function gtS(c,mode){return mode==="tex"?(c?" \\geqq ":" \\gt "):(c?"≧":"＞");}
function numS(n,mode){return mode==="tex"?nTex(n):nPlain(n);}
function partStr(p,v,single,mode){
  if(isPoint(p))return v+"="+numS(p.lo,mode);
  if(!p.lo)return v+relS(p.hc,mode)+numS(p.hi,mode);
  /* 片側だけの区間は、それ1つなら「x＞3」、合併の中なら「3＜x」と書く（教科書の書き方） */
  if(!p.hi)return single?(v+gtS(p.lc,mode)+numS(p.lo,mode)):(numS(p.lo,mode)+relS(p.lc,mode)+v);
  return numS(p.lo,mode)+relS(p.lc,mode)+v+relS(p.hc,mode)+numS(p.hi,mode);
}
function setFmt(S,v,mode){
  const ps=S.parts;
  if(!ps.length)return "解なし";
  if(ps.length===1&&!ps[0].lo&&!ps[0].hi)return "すべての実数";
  if(ps.length===2&&!ps[0].lo&&ps[0].hi&&!ps[0].hc&&ps[1].lo&&!ps[1].hi&&!ps[1].lc
     &&Math.abs(ps[0].hi.v-ps[1].lo.v)<=EPS){
    return nPlain(ps[0].hi)+" 以外のすべての実数";
  }
  if(ps.length>1&&ps.every(isPoint)){
    return v+"="+ps.map(function(p){return numS(p.lo,mode);}).join(mode==="tex"?",\\ ":", ");
  }
  return ps.map(function(p){return partStr(p,v,ps.length===1,mode);}).join(mode==="tex"?",\\ ":", ");
}
/* 選択肢・記録用（純粋な式は TeX、和文を含むものは平文） */
function setStr(S,v){return setFmt(S,v||"x","tex");}
/* 問題文・平文の答え用 */
function setP(S,v){return setFmt(S,v||"x","plain");}
/* 非ASCII を含む＝平文。TeX の文字列は ASCII だけで書く約束 */
function isPlainStr(s){return /[^\x00-\x7F]/.test(String(s));}
/* 平文を画面に出す。F(a/b) と √n だけは KaTeX で描く */
function plainHtml(s){
  s=String(s);
  const re=/F\(([^()\/]+)\/([^()\/]+)\)|√(\d+)/g;
  let out="",last=0,m;
  while((m=re.exec(s))){
    out+=esc(s.slice(last,m.index));
    if(m[1]!=null)out+=T("\\dfrac{"+texA(m[1])+"}{"+texA(m[2])+"}");
    else out+=T("\\sqrt{"+m[3]+"}");
    last=re.lastIndex;
  }
  return out+esc(s.slice(last));
}
function choiceHtml(s){return isPlainStr(s)?plainHtml(s):T(s);}
function setHtml(S,v){return choiceHtml(setStr(S,v));}
function ansBox(html){return '<div class="exFml ans">'+html+"</div>";}
function fml(html){return '<div class="exFml">'+html+"</div>";}

/* ---------- 2次不等式・1次不等式を解く ---------- */
/* ax²+bx+c=0 の実数解（小さい順）。a,b,c は整数 */
function rootsQ(a,b,c){
  const D=b*b-4*a*c;
  if(D<0)return [];
  if(D===0)return [N(-b,0,1,2*a)];
  const r1=N(-b,-1,D,2*a),r2=N(-b,1,D,2*a);
  return (r1.v<r2.v)?[r1,r2]:[r2,r1];
}
/* 下に凸の放物線が rs で x 軸と交わる（接する）ときの「… op 0」の解 */
function rootsSet(rs,op){
  const gt=isGt(op),eq=isEq(op);
  if(rs.length===2)return gt?outSet(rs[0],rs[1],eq):ivSet(rs[0],rs[1],eq);
  if(rs.length===1){
    if(gt)return eq?ALLS():exSet(rs[0]);
    return eq?ptSet(rs[0]):NONES();
  }
  return gt?ALLS():NONES();
}
/* ax²+bx+c op 0 を解く（a が負なら -1 をかけて向きを変えたのと同じ） */
function solveQ(a,b,c,op){return rootsSet(rootsQ(a,b,c),(a<0)?flipDir(op):op);}
/* ax+b op 0 を解く（a=0 なら定数の大小だけで決まる） */
function solveL(a,b,op){
  if(a===0)return cmp(b,op)?ALLS():NONES();
  const t=nFr(-b,a);
  const o=(a<0)?flipDir(op):op;
  return isGt(o)?gtSet(t,isEq(o)):ltSet(t,isEq(o));
}

/* ---------- 種(seed)から作る乱数 ----------
   出題のたびに種を1つ引いて question_params に {m:タイプ, lv:レベル, s:種} で保存する。
   解き直し(?retry=1)は同じ種で生成関数を回すだけで**まったく同じ問題**が出る（CLAUDE.md 2d）。
   ⚠ 生成関数の中身を変えると、既存 pending の種から出る問題が変わる
     （params_hash は同じなので解き直し自体は成立するが、問題文は別物になる）。
   ⚠ 乱数はこの ri() 1か所に集める。Math.random を生成関数の中で直接呼ぶと種で再現できない。
     「条件に合うまで引き直す」ループも ri() だけで回すので、同じ種なら同じ回数で止まる。 */
let _rng=1;
function rngSeed(s){_rng=(s>>>0)||1;}
function rngPick(){return (Math.floor(Math.random()*4294967296)>>>0)||1;}  /* 種そのものだけは真の乱数 */
function rngNext(){let x=_rng;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;_rng=x;return x/4294967296;}
function ri(min,max){return Math.floor(rngNext()*(max-min+1))+min;}
function pick(a){return a[ri(0,a.length-1)];}
function sgn1(){return ri(0,1)?1:-1;}
function nzi(min,max){let v=0;while(v===0)v=ri(min,max);return v;}
/* ⚠ 並べ替えは sort に乱数比較を渡さない（ブラウザの sort 実装しだいで
   同じ種でも別の並びになる＝解き直しで同じ問題が出なくなる）。フィッシャー・イェーツで書く */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=ri(0,i);const t=b[i];b[i]=b[j];b[j]=t;}return b;}

/* 選択肢を作る。誤答候補から重複を除いて（N-1）個ぶん使う。
   候補は「ありがちな順」に並べて渡す（先頭から採用する）。
   集合から作った文字列は正規形なので、値として正解と同じ誤答は同じ文字列になって弾かれる。
   wide=true … 場合分けの答えのように1行が長いもの。4択にして1列で出す */
function mkChoice(cor,wrongs,wide){
  const max=wide?4:N_CHOICES;
  const seen={};seen[cor]=1;
  const w=[];
  (wrongs||[]).forEach(function(x){
    if(x==null||x==="")return;
    if(seen[x])return;
    seen[x]=1;w.push(x);
  });
  const all=shuffle([cor].concat(w.slice(0,max-1)));
  return {kind:"choice",choices:all,correct:all.indexOf(cor),wide:!!wide};
}
function mkNum(val,unit){return {kind:"num",val:val,unit:unit||""};}

/* ---------- 答えの検算（回帰テスト用。画面では使わない） ----------
   pred(x) は「もとの不等式を数値で直接調べた結果」。集合 S と、刻み 0.01 の全点と
   端点のすぐ両側で食い違いが無いかを見る。食い違ったら説明の文字列を返す。 */
function verifySet(S,pred,lo,hi,step){
  lo=(lo==null)?-15:lo;hi=(hi==null)?15:hi;step=step||1;
  const xs=[];
  for(let i=Math.round(lo*100);i<=Math.round(hi*100);i+=step)xs.push(i/100);
  S.parts.forEach(function(p){
    [p.lo,p.hi].forEach(function(e){if(e)xs.push(e.v,e.v-1e-4,e.v+1e-4);});
  });
  for(let i=0;i<xs.length;i++){
    const x=xs[i];
    const a=inSet(S,x),b=!!pred(x);
    if(a!==b)return "x="+x+" 集合:"+a+" 直接:"+b;
  }
  return "";
}
function chkSet(S,pred,lo,hi,step){return function(){return verifySet(S,pred,lo,hi,step);};}
</script>
<script>
"use strict";
/* ================================================================
   解説の図（略図）
   ・sketchQ … 下に凸の放物線と x 軸。成り立つ部分を金色にして、端の ●（含む）○（含まない）を描く。
     教科書の図と同じく「形だけ」の略図（目もりは無い。交点の値だけ書く）。
   ・numLine … 数直線に条件ごとの範囲を段にして重ね、共通部分（答え）を金色で描く。
   ⚠ 色・線は SVG の属性で書く（クラスに頼らない）。
   ================================================================ */
const C_AX="rgba(140,175,255,.55)",C_CY="#38E8FF",C_GO="#FFD166",C_BG="#0C1120",C_TX="#E9EEFB";
function svgText(x,y,s,anchor,color,size){
  return '<text x="'+x+'" y="'+y+'" fill="'+(color||C_TX)+'" font-family="DM Mono,monospace" font-size="'+(size||12)
    +'" text-anchor="'+(anchor||"middle")+'" paint-order="stroke" stroke="'+C_BG+'" stroke-width="3">'+esc(s)+"</text>";
}
function svgCirc(x,y,closed,color,r){
  return '<circle cx="'+x+'" cy="'+y+'" r="'+(r||4.6)+'" fill="'+(closed?(color||C_GO):C_BG)
    +'" stroke="'+(color||C_GO)+'" stroke-width="2"/>';
}
/* rs = 交点（0〜2個）、op = 下に凸にそろえたあとの不等号 */
function sketchQ(rs,op,v){
  v=v||"x";
  const W=320,H=150,X0=160,SX=46,SY=13,ay=118;
  const n=rs.length;
  const pos=(n===2)?[-1.3,1.3]:((n===1)?[0]:[]);
  const f=function(x){return (n===2)?(x*x-1.69):((n===1)?(x*x):(x*x+0.9));};
  const PX=function(x){return +(X0+x*SX).toFixed(1);};
  const PY=function(y){return +(ay-y*SY).toFixed(1);};
  const gt=isGt(op),eq=isEq(op);
  const ok=function(x){const y=f(x);return gt?(y>1e-9):(y<-1e-9);};
  let g='<line x1="'+PX(-3.3)+'" y1="'+ay+'" x2="'+PX(3.3)+'" y2="'+ay+'" stroke="'+C_AX+'" stroke-width="1.4"/>';
  g+=svgText(PX(3.3)+2,ay-6,v,"end","#7C86A1",12);
  /* 曲線。成り立つところは金色 */
  const NS=140,X1=-2.75,X2=2.75;
  let seg=[],segOk=null;
  const flush=function(){
    if(seg.length>1)g+='<polyline points="'+seg.join(" ")+'" fill="none" stroke="'+(segOk?C_GO:C_CY)
      +'" stroke-width="'+(segOk?3:2.2)+'"/>';
  };
  for(let i=0;i<=NS;i++){
    const x=X1+(X2-X1)*i/NS;
    const o=ok(x);
    const pt=PX(x)+","+PY(f(x));
    if(segOk===null){segOk=o;seg=[pt];continue;}
    if(o!==segOk){seg.push(pt);flush();seg=[pt];segOk=o;}
    else seg.push(pt);
  }
  flush();
  /* x 軸の上の答え */
  const edges=[-3.3].concat(pos).concat([3.3]);
  for(let i=0;i+1<edges.length;i++){
    const a=edges[i],b=edges[i+1];
    if(ok((a+b)/2))g+='<line x1="'+PX(a)+'" y1="'+ay+'" x2="'+PX(b)+'" y2="'+ay+'" stroke="'+C_GO+'" stroke-width="4" stroke-linecap="round"/>';
  }
  pos.forEach(function(x,i){
    const near=ok(x-0.05)||ok(x+0.05);
    if(eq)g+=svgCirc(PX(x),ay,true);
    else if(near)g+=svgCirc(PX(x),ay,false);
    else g+='<circle cx="'+PX(x)+'" cy="'+ay+'" r="3.4" fill="'+C_CY+'"/>';
    const lab=nLab(rs[i]);
    if(n===2)g+=svgText(PX(x)+(i===0?-7:7),ay+19,lab,(i===0)?"end":"start");
    else g+=svgText(PX(x),ay+19,lab,"middle");
  });
  if(n===0)g+=svgText(X0,ay+19,"x 軸と交わらない","middle","#7C86A1",11);
  return '<div class="exFig"><svg viewBox="0 0 '+W+" "+H+'" xmlns="http://www.w3.org/2000/svg" role="img">'+g+"</svg>"
    +'<div class="cap">金色の部分が「'+esc(OPP[op])+' 0」を満たすところ（● は端を含む・○ は含まない）</div></div>';
}
/* 数直線。rows=[{S:集合, name:"①"}]、res=答えの集合 */
const ROW_COL=["#38E8FF","#A78BFA","#FF8FB1","#7EE0A0"];
function numLine(rows,res,v){
  v=v||"x";
  const pts=[];
  const add=function(n){if(!n)return;if(!pts.some(function(q){return Math.abs(q.v-n.v)<=EPS;}))pts.push(n);};
  rows.forEach(function(r){r.S.parts.forEach(function(p){add(p.lo);add(p.hi);});});
  res.parts.forEach(function(p){add(p.lo);add(p.hi);});
  pts.sort(function(a,b){return a.v-b.v;});
  const W=340,pad=40,rowH=15;
  const ay=14+rows.length*rowH+8;
  const H=ay+30;
  const xOf=function(n){
    if(!pts.length)return W/2;
    let i=0;pts.forEach(function(q,k){if(Math.abs(q.v-n.v)<=EPS)i=k;});
    return (pts.length===1)?W/2:+(pad+(W-2*pad)*i/(pts.length-1)).toFixed(1);
  };
  let g='<line x1="6" y1="'+ay+'" x2="'+(W-6)+'" y2="'+ay+'" stroke="'+C_AX+'" stroke-width="1.4"/>';
  g+=svgText(W-4,ay-6,v,"end","#7C86A1",12);
  rows.forEach(function(r,i){
    const y=14+i*rowH, col=ROW_COL[i%ROW_COL.length];
    r.S.parts.forEach(function(p){
      if(isPoint(p)){
        g+='<line x1="'+xOf(p.lo)+'" y1="'+y+'" x2="'+xOf(p.lo)+'" y2="'+ay+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="2 3"/>';
        g+=svgCirc(xOf(p.lo),y,true,col,3.6);
        return;
      }
      const x1=p.lo?xOf(p.lo):6, x2=p.hi?xOf(p.hi):(W-6);
      g+='<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="'+col+'" stroke-width="2.4"/>';
      [[p.lo,p.lc,x1],[p.hi,p.hc,x2]].forEach(function(e){
        if(!e[0])return;
        g+='<line x1="'+e[2]+'" y1="'+y+'" x2="'+e[2]+'" y2="'+ay+'" stroke="'+col+'" stroke-width="1" stroke-dasharray="2 3"/>';
        g+=svgCirc(e[2],y,e[1],col,3.6);
      });
    });
  });
  res.parts.forEach(function(p){
    if(isPoint(p)){g+=svgCirc(xOf(p.lo),ay,true);return;}
    const x1=p.lo?xOf(p.lo):6, x2=p.hi?xOf(p.hi):(W-6);
    g+='<line x1="'+x1+'" y1="'+ay+'" x2="'+x2+'" y2="'+ay+'" stroke="'+C_GO+'" stroke-width="4.5" stroke-linecap="round"/>';
    if(p.lo)g+=svgCirc(x1,ay,p.lc);
    if(p.hi)g+=svgCirc(x2,ay,p.hc);
  });
  pts.forEach(function(n){g+=svgText(xOf(n),ay+19,nLab(n),"middle");});
  const cap=rows.map(function(r,i){
    return '<span style="color:'+ROW_COL[i%ROW_COL.length]+'">━ '+esc(r.name)+"</span>";
  }).join("")+'<span style="color:'+C_GO+'">━ 答え（共通部分）</span>';
  return '<div class="exFig"><svg viewBox="0 0 '+W+" "+H+'" xmlns="http://www.w3.org/2000/svg" role="img">'+g+"</svg>"
    +'<div class="cap">'+cap+"</div></div>";
}

/* ---------- 解説の決まり文句 ----------
   下に凸（x² の係数が正）にそろえたあと、交点 rs と不等号 op から答えを読む3〜4行。 */
function exDecide(rs,op,S,v){
  v=v||"x";
  const V=T(v), L=[], gt=isGt(op), eq=isEq(op);
  const rel="「"+T(OPT[op].trim()+" 0")+"」";
  if(rs.length===2){
    L.push("グラフは下に凸の放物線で、"+V+" 軸と "+T(v+"="+nTex(rs[0]))+"、"+T(v+"="+nTex(rs[1]))+" の2点で交わる。");
    L.push(rel+" は、グラフが "+V+" 軸より<b>"+(gt?"上":"下")+"</b>にある部分 → <b>2つの解の"
      +(gt?"外側":"間")+"</b>"+(eq?"（「＝」があるので端も入る）":"（端は入らない）")+"。");
  }else if(rs.length===1){
    const h=T(v+"="+nTex(rs[0]));
    L.push("グラフは下に凸の放物線で、"+V+" 軸と "+h+" で<b>接する</b>（それ以外のところでは "+V+" 軸より上）。");
    L.push({">":rel+" は "+V+" 軸より上の部分 → 接点 "+h+" だけが成り立たない。",
            ">=":rel+" は "+V+" 軸より上か "+V+" 軸上 → どこでも成り立つ。",
            "<":rel+" は "+V+" 軸より下の部分 → そんな部分は無い。",
            "<=":rel+" は "+V+" 軸より下か "+V+" 軸上 → 接点だけ。"}[op]);
  }else{
    L.push("グラフは下に凸の放物線で、"+V+" 軸と共有点をもたない＝<b>グラフ全体が "+V+" 軸より上</b>。");
    L.push(gt?(rel+" は どんな "+V+" でも成り立つ。"):(rel+" を満たす "+V+" は1つも無い。"));
  }
  L.push(sketchQ(rs,op,v));
  L.push(ansBox(setHtml(S,v)));
  return L;
}
/* x² の係数が負のときの1行目（-1 をかけて向きを変える） */
function exFlip(a,b,c,op,v){
  return "<b>"+T((v||"x")+"^2")+" の係数が負</b>なので、両辺に "+T("-1")+" をかけて正にする（<b>不等号の向きが逆になる</b>）。"
    +fml(T(qIneq(-a,-b,-c,flipDir(op),v)));
}
/* 図モードへのリンク情報（範囲に収まるときだけ） */
function figKaiInfo(a,b,c,op){
  if(Math.abs(a)>3||Math.abs(b)>10||Math.abs(c)>12)return null;
  return {t:"kai",a:a,b:b,c:c,op:OPS.indexOf(op)};
}
</script>
<script>
"use strict";
/* ---------- タイプ台帳 ----------
   k = question_key（そのまま question_catalog に登録する）

const MODEMAP={};MODES.forEach(m=>{MODEMAP[m.k]=m;});
const MAXLV=3;
/* そのタイプが持つレベル数（発展を持たないタイプは2） */
function lvCount(k){const m=MODEMAP[k];return (m&&m.lv)?m.lv.length:1;}
/* ミックスの初期セット＝教科書の基本にあたる4タイプ */
const BASIC4=["inshi","koushiki","tokushu","renritsu"];

const GENS={};

/* ================================================================
   ① 因数分解で解く
   lv1: (x-α)(x-β) ≷ 0 ／ lv2: 展開された形（移項が要るものも）／ lv3: x² の係数が負・1でない
   ================================================================ */
/* 2つの解の外側・内側・符号・端の取りちがえ（ありがちな順） */
function qWrongs(a,b,c,op){
  return [
    solveQ(a,b,c,flipDir(op)),             /* 内側と外側の取りちがえ（a＜0 で向きを変え忘れも同じ） */
    solveQ(a,b,c,togEq(op)),               /* 端の「＝」の付けまちがい */
    solveQ(a,-b,c,op),                     /* 解の符号ミス（因数分解の読みちがい） */
    solveQ(a,b,c,flipDir(togEq(op))),
    solveQ(a,-b,c,flipDir(op))
  ].map(function(S){return setStr(S);});
}
/* 区間の片側だけ「＝」をつけた誤答 */
function halfWrongs(rs,op){
  if(rs.length!==2)return [];
  if(isGt(op))return [setStr(mkSet([{lo:null,hi:rs[0],hc:true},{lo:rs[1],lc:false,hi:null}]))];
  return [setStr(ivSet(rs[0],rs[1],true,false)),setStr(ivSet(rs[0],rs[1],false,true))];
}
GENS.inshi=function(lv){
  const op=pick(OPS);
  if(lv===1){
    let al,be;
    if(ri(0,4)===0){
      if(ri(0,1)){al=0;be=ri(1,6);}else{al=-ri(1,6);be=0;}
    }else{
      al=ri(-6,4);be=al+ri(1,6);
    }
    const b=-(al+be),c=al*be;
    const ft=facTex(1,shuffle([[1,al],[1,be]]));
    const S=solveQ(1,b,c,op);
    const rs=[nInt(al),nInt(be)];
    return {
      lead:"次の2次不等式を解け。",
      disp:ft+OPT[op]+"0",
      ans:mkChoice(setStr(S),qWrongs(1,b,c,op).concat(halfWrongs(rs,op))),
      plainQ:"2次不等式 "+ft+OPP[op]+"0 を解け。",
      ex:[
        "左辺を "+T("y")+" とおいたグラフで考える。"+T("y=0")+" になるのは "+T("x="+al)+" と "+T("x="+be)
          +"（かっこの中が 0 になるとき）。",
        "⚠ "+T("(x-\\alpha)")+" の形なら解は "+T("x=\\alpha")+"。<b>かっこの中の符号と逆</b>になる。"
      ].concat(exDecide(rs,op,S)),
      chk:chkSet(S,function(x){return cmp((x-al)*(x-be),op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  if(lv===2){
    const al=ri(-7,5),be=al+ri(1,7);
    const b=-(al+be),c=al*be;
    const S=solveQ(1,b,c,op);
    const rs=[nInt(al),nInt(be)];
    /* 3回に1回は「x² ＜ 3x+10」のように移項が要る形で出す */
    const moved=(ri(0,2)===0)&&(b!==0||c!==0);
    const disp=moved?("x^2"+OPT[op]+poly([[-b,"x"],[-c,""]])):qIneq(1,b,c,op);
    const dispP=moved?("x²"+OPP[op]+poly([[-b,"x"],[-c,""]])):qIneqP(1,b,c,op);
    const ex=[];
    if(moved)ex.push("まず移項して、右辺を 0 にする。"+fml(T(qIneq(1,b,c,op))));
    ex.push("左辺を因数分解する（たして "+T(String(b))+"、かけて "+T(String(c))+" になる2数をさがす）。"
      +fml(T(facTex(1,[[1,al],[1,be]])+OPT[op]+"0")));
    return {
      lead:"次の2次不等式を解け。",
      disp:disp,
      ans:mkChoice(setStr(S),qWrongs(1,b,c,op).concat(halfWrongs(rs,op))),
      plainQ:"2次不等式 "+dispP+" を解け。",
      ex:ex.concat(exDecide(rs,op,S)),
      chk:chkSet(S,function(x){return cmp(x*x+b*x+c,op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  /* lv3 … x² の係数が負（v=0）、1でない（v=1）、その両方（v=2） */
  const v=ri(0,2);
  let a,b,c,fs,rs;
  if(v===0){
    const al=ri(-6,4),be=al+ri(1,6);
    a=-1;b=al+be;c=-al*be;
    fs=[[1,al],[1,be]];rs=[nInt(al),nInt(be)];
  }else{
    /* (px-q)(rx-s) … たすきがけ */
    const p=pick([2,3]), r=pick([1,1,2,3]);
    let q=nzi(-5,5),s=ri(-5,5),guard=0;
    while((gcd(q,p)!==1||gcd(s,r)!==1||q*r===s*p)&&guard<40){q=nzi(-5,5);s=ri(-5,5);guard++;}
    if(gcd(q,p)!==1||gcd(s,r)!==1||q*r===s*p){q=1;s=-3;}
    const sgm=(v===2)?-1:1;
    a=sgm*p*r;b=-sgm*(p*s+q*r);c=sgm*q*s;
    fs=[[p,q],[r,s]];
    const r1=nFr(q,p),r2=nFr(s,r);
    rs=(r1.v<r2.v)?[r1,r2]:[r2,r1];
  }
  const S=solveQ(a,b,c,op);
  const A=Math.abs(a), op2=(a<0)?flipDir(op):op;
  const ex=[];
  if(a<0)ex.push(exFlip(a,b,c,op));
  ex.push((A===1?"左辺を因数分解する。":"左辺を<b>たすきがけ</b>で因数分解する。")
    +fml(T(quad(A,Math.sign(a)*b,Math.sign(a)*c,"x","^2")+"="+facTex(1,fs))));
  ex.push(T(facTex(1,fs)+"=0")+" の解は "+T("x="+nTex(rs[0]))+"、"+T(nTex(rs[1]))+"。");
  return {
    lead:"次の2次不等式を解け。",
    disp:qIneq(a,b,c,op),
    ans:mkChoice(setStr(S),qWrongs(a,b,c,op).concat(halfWrongs(rs,op2))),
    plainQ:"2次不等式 "+qIneqP(a,b,c,op)+" を解け。",
    ex:ex.concat(exDecide(rs,op2,S)),
    chk:chkSet(S,function(x){return cmp(a*x*x+b*x+c,op);}),
    fig:figKaiInfo(a,b,c,op)
  };
};

/* ================================================================
   ② 解の公式で解く（因数分解できない＝解に √ が出る）
   lv1: x²+2b'x+c（b' の公式）／ lv2: x の係数が奇数 ／ lv3: x² の係数が負・1でない
   ================================================================ */
const NONSQ=[2,3,5,6,7,8,10,11,12,13,15,17,19,20,21];
function isSq(n){if(n<0)return false;const r=Math.round(Math.sqrt(n));return r*r===n;}
/* 解の公式まわりの誤答（2で割り忘れ・符号ミス・外側と内側） */
function koushikiWrongs(a,b,c,op){
  const A=(a<0)?-a:a,B=(a<0)?-b:b,C=(a<0)?-c:c;
  const D=B*B-4*A*C, op2=(a<0)?flipDir(op):op;
  const halfR=[N(-B,-1,D,A),N(-B,1,D,A)].sort(function(x,y){return x.v-y.v;});      /* 2a の 2 を忘れる */
  const sgnR=[N(B,-1,D,2*A),N(B,1,D,2*A)].sort(function(x,y){return x.v-y.v;});     /* -b の符号を忘れる */
  return qWrongs(a,b,c,op).slice(0,2).concat([
    setStr(rootsSet(halfR,op2)),
    setStr(rootsSet(sgnR,op2)),
    setStr(rootsSet(halfR,flipDir(op2))),
    setStr(rootsSet(sgnR,flipDir(op2)))
  ]);
}
GENS.koushiki=function(lv){
  const op=pick(OPS);
  if(lv===1){
    const h=nzi(-5,5);
    let k=pick(NONSQ),guard=0;
    while(Math.abs(h*h-k)>20&&guard<20){k=pick(NONSQ);guard++;}
    const b=2*h,c=h*h-k;
    const rs=rootsQ(1,b,c);
    const S=solveQ(1,b,c,op);
    const dHalfR=[N(-h,-1,k,2),N(-h,1,k,2)];                                    /* 2 で割ってしまう */
    return {
      lead:"次の2次不等式を解け。",
      disp:qIneq(1,b,c,op),
      ans:mkChoice(setStr(S),qWrongs(1,b,c,op).slice(0,3).concat([
        setStr(rootsSet(dHalfR,op)),setStr(rootsSet(dHalfR,flipDir(op))),
        setStr(rootsSet([N(h,-1,k,1),N(h,1,k,1)],flipDir(op)))
      ])),
      plainQ:"2次不等式 "+qIneqP(1,b,c,op)+" を解け。",
      ex:[
        "左辺は整数の範囲で因数分解できない。そこで "+T(quad(1,b,c,"x","^2")+"=0")+" の解を求める。",
        T("x")+" の係数が "+T("2\\times"+par(h))+" と<b>偶数</b>なので、"+T("b'="+h)+" として "
          +T("x=-b'\\pm\\sqrt{b'^2-ac}")+" が使える。",
        fml(T("x=-"+par(h)+"\\pm\\sqrt{"+par(h)+"^2-1\\cdot "+par(c)+"}="+pmTex(-h,k,1))),
        "⚠ 2で割るのは "+T("b")+" の公式（"+T("\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}")+"）のとき。"+T("b'")+" の公式では割らない。"
      ].concat(exDecide(rs,op,S)),
      chk:chkSet(S,function(x){return cmp(x*x+b*x+c,op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  if(lv===2){
    const b=pick([-7,-5,-3,-1,1,3,5,7]);
    let c=ri(-9,9),guard=0;
    while(!(b*b-4*c>0&&!isSq(b*b-4*c))&&guard<40){c=ri(-9,9);guard++;}
    if(!(b*b-4*c>0&&!isSq(b*b-4*c)))c=-1;               /* b²+4 は平方数にならない */
    const D=b*b-4*c;
    const rs=rootsQ(1,b,c);
    const S=solveQ(1,b,c,op);
    return {
      lead:"次の2次不等式を解け。",
      disp:qIneq(1,b,c,op),
      ans:mkChoice(setStr(S),koushikiWrongs(1,b,c,op)),
      plainQ:"2次不等式 "+qIneqP(1,b,c,op)+" を解け。",
      ex:[
        "左辺は因数分解できないので、"+T(quad(1,b,c,"x","^2")+"=0")+" を解の公式で解く。",
        fml(T("x=\\dfrac{-b\\pm\\sqrt{b^2-4ac}}{2a}=\\dfrac{"+(-b)+"\\pm\\sqrt{"+par(b)+"^2-4\\cdot 1\\cdot "+par(c)+"}}{2}="+pmTex(-b,D,2))),
        "小さいほうが "+T(nTex(rs[0]))+"、大きいほうが "+T(nTex(rs[1]))+"。"
      ].concat(exDecide(rs,op,S)),
      chk:chkSet(S,function(x){return cmp(x*x+b*x+c,op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  /* lv3 … x² の係数が負・1でない */
  let a=pick([-3,-2,-1,2,3]),b=ri(-7,7),c=ri(-7,7),guard=0;
  const good=function(){const D=b*b-4*a*c;return D>0&&D<=90&&!isSq(D)&&gcd(gcd(a,b),c)===1;};
  while(!good()&&guard<80){a=pick([-3,-2,-1,2,3]);b=ri(-7,7);c=ri(-7,7);guard++;}
  if(!good()){a=-2;b=4;c=1;}
  const A=Math.abs(a),B=(a<0)?-b:b,C=(a<0)?-c:c,D=B*B-4*A*C;
  const op2=(a<0)?flipDir(op):op;
  const rs=rootsQ(a,b,c);
  const S=solveQ(a,b,c,op);
  const ex=[];
  if(a<0)ex.push(exFlip(a,b,c,op));
  ex.push(T(quad(A,B,C,"x","^2")+"=0")+" を解の公式で解く。");
  ex.push(fml(T("x=\\dfrac{"+(-B)+"\\pm\\sqrt{"+par(B)+"^2-4\\cdot "+A+"\\cdot "+par(C)+"}}{"+(2*A)+"}="+pmTex(-B,D,2*A))));
  ex.push("⚠ 分母の "+T("2a")+" は "+T(String(2*A))+"。約分できるときは分子の全部の項を同じ数で割る。");
  return {
    lead:"次の2次不等式を解け。",
    disp:qIneq(a,b,c,op),
    ans:mkChoice(setStr(S),koushikiWrongs(a,b,c,op)),
    plainQ:"2次不等式 "+qIneqP(a,b,c,op)+" を解け。",
    ex:ex.concat(exDecide(rs,op2,S)),
    chk:chkSet(S,function(x){return cmp(a*x*x+b*x+c,op);}),
    fig:figKaiInfo(a,b,c,op)
  };
};

/* ================================================================
   ③ D≦0 の不等式（すべての実数・解なし・x=p・p 以外のすべての実数）
   lv1: (x-p)² の形 ／ lv2: D＜0（x 軸と共有点なし）／ lv3: 係数が1でない・負
   ⚠ 答えの4つの形（すべての実数 / 解なし / x=p / p 以外のすべての実数）は必ず選択肢に並べる。
     どれになるかを見分けることそのものが、このタイプの練習だから。
   ================================================================ */
function formsAround(h){
  return [ALLS(),NONES(),ptSet(h),exSet(h),ptSet(nNeg(h)),exSet(nNeg(h)),gtSet(h,false),ltSet(h,false)]
    .map(function(S){return setStr(S);});
}
/* (x-h)² op 0 を読む1行（h は TeX） */
function exSqLine(hT,op){
  return {
    ">":"「"+T("\\gt 0")+"」: 2乗は "+T("x="+hT)+" のときだけ 0 で、それ以外は正 → "+T(hT)+" <b>以外のすべての実数</b>。",
    ">=":"「"+T("\\geqq 0")+"」: 2乗はいつも 0 以上 → <b>すべての実数</b>。",
    "<":"「"+T("\\lt 0")+"」: 2乗が負になることはない → <b>解なし</b>。",
    "<=":"「"+T("\\leqq 0")+"」: 2乗が 0 以下になるのは 0 になるときだけ → <b>"+T("x="+hT)+"</b>。"
  }[op];
}
GENS.tokushu=function(lv){
  const op=pick(OPS);
  if(lv===1){
    const p=nzi(-6,6);
    const b=-2*p,c=p*p;
    const S=solveQ(1,b,c,op);
    const h=nInt(p);
    return {
      lead:"次の2次不等式を解け。",
      disp:qIneq(1,b,c,op),
      ans:mkChoice(setStr(S),formsAround(h)),
      plainQ:"2次不等式 "+qIneqP(1,b,c,op)+" を解け。",
      ex:[
        "左辺は "+T("(x"+sg(-p)+")^2")+" と因数分解できる（"+T(quad(1,b,c,"x","^2")+"=0")+" は<b>重解</b> "
          +T("x="+p)+" をもつ＝"+T("D=0")+"）。",
        fml(T("(x"+sg(-p)+")^2"+OPT[op]+"0")),
        exSqLine(String(p),op),
        sketchQ([h],op),
        ansBox(setHtml(S))
      ],
      chk:chkSet(S,function(x){return cmp((x-p)*(x-p),op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  if(lv===2){
    const b=ri(-6,6),c=Math.floor(b*b/4)+ri(1,5);
    const D=b*b-4*c;
    const S=solveQ(1,b,c,op);
    const h=nFr(-b,2);
    const vtx=(b===0)?("x^2"+sg(c)):("\\left(x"+fracSgTex(b,2)+"\\right)^2"+fracSgTex(4*c-b*b,4));
    return {
      lead:"次の2次不等式を解け。",
      disp:qIneq(1,b,c,op),
      ans:mkChoice(setStr(S),formsAround(h)),
      plainQ:"2次不等式 "+qIneqP(1,b,c,op)+" を解け。",
      ex:[
        "左辺は因数分解できない。まず判別式を調べる。",
        fml(T("D="+par(b)+"^2-4\\cdot 1\\cdot "+par(c)+"="+D+" \\lt 0")),
        T("D \\lt 0")+" なので、グラフは "+T("x")+" 軸と<b>共有点をもたない</b>。"
          +"平方完成しても "+T(quad(1,b,c,"x","^2")+"="+vtx)+" で、つねに正。"
      ].concat(exDecide([],op,S)),
      chk:chkSet(S,function(x){return cmp(x*x+b*x+c,op);}),
      fig:figKaiInfo(1,b,c,op)
    };
  }

  /* lv3 … (px-q)² の定数倍（D=0）か、x² の係数が1でない D＜0 */
  let a,b,c,h,ex;
  if(ri(0,1)===1){
    const p=pick([2,3]);let q=nzi(-5,5),guard=0;
    while(gcd(q,p)!==1&&guard<20){q=nzi(-5,5);guard++;}
    if(gcd(q,p)!==1)q=1;
    const sgm=sgn1();
    a=sgm*p*p;b=-2*sgm*p*q;c=sgm*q*q;h=nFr(q,p);
    const op2=(a<0)?flipDir(op):op;
    ex=[];
    if(a<0)ex.push(exFlip(a,b,c,op));
    ex.push("左辺は "+T(quad(p*p,-2*p*q,q*q,"x","^2")+"=("+lin(p,-q)+")^2")+" と因数分解できる（"+T("D=0")+"）。");
    ex.push(exSqLine(nTex(h),op2));
    ex.push(sketchQ([h],op2));
    ex.push(ansBox(setHtml(solveQ(a,b,c,op))));
  }else{
    a=pick([-3,-2,2,3]);b=ri(-6,6);c=ri(-6,6);let guard=0;
    while(!(b*b-4*a*c<0)&&guard<60){b=ri(-6,6);c=ri(-6,6);guard++;}
    if(!(b*b-4*a*c<0)){b=1;c=(a>0)?1:-1;}
    h=nFr(-b,2*a);
    const op2=(a<0)?flipDir(op):op;
    const D=b*b-4*a*c;
    ex=[];
    if(a<0)ex.push(exFlip(a,b,c,op));
    ex.push("判別式を調べる（"+T("-1")+" をかけても "+T("D")+" は変わらない）。"
      +fml(T("D="+par(b)+"^2-4\\cdot "+par(a)+"\\cdot "+par(c)+"="+D+" \\lt 0")));
    ex.push(T("D \\lt 0")+" なので、グラフは "+T("x")+" 軸と共有点をもたない。");
    ex=ex.concat(exDecide([],op2,solveQ(a,b,c,op)));
  }
  const S=solveQ(a,b,c,op);
  return {
    lead:"次の2次不等式を解け。",
    disp:qIneq(a,b,c,op),
    ans:mkChoice(setStr(S),formsAround(h)),
    plainQ:"2次不等式 "+qIneqP(a,b,c,op)+" を解け。",
    ex:ex,
    chk:chkSet(S,function(x){return cmp(a*x*x+b*x+c,op);}),
    fig:figKaiInfo(a,b,c,op)
  };
};
