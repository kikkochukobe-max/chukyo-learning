          '<div class="exFml">'+T("x^2+("+(2*m)+"-x)^2=2x^2-"+(4*m)+"x+"+(4*m*m))+"</div>",
          "平方完成すると "+T("2(x-"+m+")^2+"+(2*m*m))+"。",
          T("x="+m)+"（このとき "+T("y="+m)+"）で最小値 "+T(String(2*m*m))+"。"
        ]
      };
    }
    return {
      lead:T("x+y="+(2*m))+" のとき、"+T("xy")+" の最大値を求めよ。",
      ans:mkNum(m*m),
      plainQ:"x+y="+(2*m)+" のとき、xy の最大値を求めよ。",
      ex:[
        T("y="+(2*m)+"-x")+" を代入して1文字消す。",
        '<div class="exFml">'+T("xy=x("+(2*m)+"-x)=-(x-"+m+")^2+"+(m*m))+"</div>",
        "上に凸なので "+T("x="+m)+" で最大値 "+T(String(m*m))+"。",
        "⚠ "+T("x")+" に変域が付いていないので、頂点がそのまま答えになる。"
      ]
    };
  }

  const t=ri(0,2);
  if(t===0){
    const v=ri(2,6);
    return {
      lead:T("x+2y="+(4*v))+"、"+T("x \\geqq 0")+"、"+T("y \\geqq 0")+" のとき、"+T("xy")+" の最大値を求めよ。",
      ans:mkNum(2*v*v),
      plainQ:"x+2y="+(4*v)+"、x≧0、y≧0 のとき、xy の最大値を求めよ。",
      ex:[
        T("x="+(4*v)+"-2y")+" を代入して "+T("y")+" だけの式にする。",
        '<div class="exFml">'+T("xy=("+(4*v)+"-2y)y=-2(y-"+v+")^2+"+(2*v*v))+"</div>",
        "⚠ 変域を先に出す: "+T("x \\geqq 0")+" より "+T("y \\leqq "+(2*v))+"、"+T("y \\geqq 0")+" と合わせて "
          +T("0 \\leqq y \\leqq "+(2*v))+"。",
        "軸 "+T("y="+v)+" はこの範囲の中にあるので頂点が最大。",
        '<div class="exFml">最大値 '+T(String(2*v*v))+"（"+T("x="+(2*v))+"、"+T("y="+v)+"）</div>"
      ]
    };
  }
  if(t===1){
    /* 軸（x=S/2）が変域の外に来るように m を取る＝答えは端の値になる */
    const S=ri(6,12);
    const m=Math.min(S-2,Math.floor(S/2)+ri(1,3));
    return {
      lead:T("x+y="+S)+"、"+T("x \\geqq "+m)+" のとき、"+T("xy")+" の最大値を求めよ。",
      ans:mkNum(m*(S-m)),
      plainQ:"x+y="+S+"、x≧"+m+" のとき、xy の最大値を求めよ。",
      ex:[
        T("y="+S+"-x")+" を代入して "+T("xy=x("+S+"-x)=-\\left(x-"+fracTex(S,2)+"\\right)^2+"+fracTex(S*S,4))+"。",
        "上に凸で軸は "+T("x="+fracTex(S,2))+"。ところが変域は "+T("x \\geqq "+m)+" で、"
          +"<b>軸は変域の外（左側）</b>にある。",
        "変域の中では右下がりなので、<b>いちばん左の端</b> "+T("x="+m)+" で最大。",
        '<div class="exFml">最大値 '+T(m+"\\times "+(S-m)+"="+(m*(S-m)))+"</div>",
        "⚠ 頂点の値をそのまま答えない。軸が変域の外にあるときは<b>端</b>を見る。"
      ]
    };
  }
  const S=ri(3,9);
  return {
    lead:T("x+y="+S)+"、"+T("x \\geqq 0")+"、"+T("y \\geqq 0")+" のとき、"+T("x^2+y^2")+" の最大値を求めよ。",
    ans:mkNum(S*S),
    plainQ:"x+y="+S+"、x≧0、y≧0 のとき、x²+y² の最大値を求めよ。",
    ex:[
      T("y="+S+"-x")+" を代入すると "+T("x^2+("+S+"-x)^2=2x^2-"+(2*S)+"x+"+(S*S)),
      "変域は "+T("0 \\leqq x \\leqq "+S)+"（"+T("y \\geqq 0")+" から出る）。",
      "下に凸で軸は "+T("x="+fracTex(S,2))+"（変域のまん中）。最大は<b>軸から遠い端</b>＝両端。",
      '<div class="exFml">'+T("x=0")+" または "+T("x="+S)+" のとき 最大値 "+T(String(S*S))+"</div>",
      "⚠ 最小値（頂点）と聞きまちがえないこと。ここは<b>最大</b>なので端を見る。"
    ]
  };
};
</script>
<script>
"use strict";
/* ================================================================
   状態・画面まわり
   ================================================================ */
/* 共通モジュールが無い環境（file:// / 未ログイン）でも落ちないようにする窓口。
   divp-core 側にも guard があるが、モジュール自体が読めていない場合もあるため */
function safeDivp(fn){
  try{
    if(window.Divp&&typeof Divp[fn]==="function"){
      return Divp[fn].apply(Divp,[].slice.call(arguments,1));
    }
  }catch(e){}
  return undefined;
}

/* XP・レベルはツール側で持たない（save_answer.php が確定し、マイページが算出する）。
   RANK と STREAK はその場の励ましなので画面だけで持つ（保存しない＝開き直すとD/0から） */
let view="train";
let mode="kansuu", lv=1, cur=null, graded=false;
let selChoice=-1, numStr="";
/* 学習記録用: いま出ている問題のタイプ・レベル・種と開始時刻 */
let curMode="kansuu", curLv=1, curSeed=0, qStart=0;
let streak=0, lastRank="—";
const perfectRuns={};              /* タイプごとの「連続 全問正解セット」数 */
let mixSet=new Set(BASIC4);
/* 解き直しモード(?retry=1)のキュー。null = 通常出題 */
let retryQ=null, retryTotal=0, retryDone=0;

/* ---------- 10問ごとの評価（共通モジュール divp-result.js）----------
   終わりのない練習ツールなので、10問ごとにランク付きの結果画面を出す。
   まちがえた問題は種を持っているので、そのまま解き直しラウンドにできる
   （同じ種＝同じ問題＝params_hash も同じなので、2連続正解でマスターになる）。
   ⚠ 結果画面は「10問目を解いた瞬間」ではなく、その次のボタンで出す（解説を隠さないため）。 */
const ROUND_N=10;
let roundMarks=[], roundTotal=ROUND_N, roundRetry=false;
function hasResultCard(){return !!(window.Divp&&typeof Divp.resultPush==="function");}
function roundStart(total,retry){
  roundMarks=[];
  roundTotal=(total>0)?total:ROUND_N;
  roundRetry=!!retry;
}
function roundInit(){
  safeDivp("resultInit",{
    total:ROUND_N,
    questionKey:mode,                 /* 連続全問正解はタイプごとに数える */
    masterLabel:"2次関数マスター",
    labels:{next:"つぎの%d問へ",wrong:"↻ まちがえた %n 問を解き直す",
            modes:"タイプをえらび直す",home:"学習ツール一覧へ"},
    onNext:function(){newQuestion();},
    onRetryWrong:startWrongRound,
    onModes:function(){try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}},
    home:"/learning/"
  });
  roundStart(ROUND_N,false);
}
function showRoundResult(){
  if(!hasResultCard()){roundStart(ROUND_N,false);return false;}
  const marks=roundMarks.slice();
  updateRank(marks);
  safeDivp("resultStart",{total:marks.length,retry:roundRetry,questionKey:mode});
  marks.forEach(m=>safeDivp("resultPush",m.ok,m.item));
  roundStart(ROUND_N,false);
  return true;
}
/* HUD の RANK は divp-result と同じ判定で出す（画面の2箇所で違う評価が出ないように） */
function updateRank(marks){
  if(!marks.length)return;
  if(roundRetry||marks.length<ROUND_N){lastRank="—";updHUD();return;}
  const ok=marks.filter(m=>m.ok).length;
  const rate=ok/marks.length;
  const key=mode;
  if(ok===marks.length)perfectRuns[key]=(perfectRuns[key]||0)+1;
  else perfectRuns[key]=0;
  const run=perfectRuns[key]||0;
  if(run>=3)lastRank="SSS";
  else if(run===2)lastRank="SS";
  else if(run===1)lastRank="S";
  else if(rate>=0.9)lastRank="A";
  else if(rate>=0.7)lastRank="B";
  else if(rate>=0.5)lastRank="C";
  else lastRank="D";
  updHUD();
}
/* 「まちがえた N 問を解き直す」。10問の中の誤答を同じ種で出し直す */
function startWrongRound(items){
  const use=(items||[]).filter(it=>it&&GENS[it.m]);
  if(!use.length){retryQ=null;newQuestion();return;}
  retryQ=use.map(it=>({m:it.m,lv:it.lv||1,s:it.s}));
  retryTotal=retryQ.length;retryDone=0;
  roundStart(retryTotal,true);
  newQuestion();
}

/* ---------- HUD / セレクタ ---------- */
function updHUD(){
  document.getElementById("rankVal").textContent=lastRank;
  document.getElementById("streakVal").textContent=String(streak);
}
function buildTypeChips(){
  const box=document.getElementById("typeChips");
  box.innerHTML=MODES.map(m=>
    '<button class="chip'+(m.k===mode?" on":"")+'" data-mode="'+m.k+'">'+esc(m.n)+"<small>"+esc(m.s)+"</small></button>"
  ).join("")+'<button class="chip mix'+(mode==="mix"?" on":"")+'" data-mode="mix">ミックス<small>えらんだタイプから</small></button>';
}
function buildMixGrid(){
  const g=document.getElementById("mixGrid");
  g.innerHTML=MODES.map(m=>
    '<label><input type="checkbox" data-mix="'+m.k+'"'+(mixSet.has(m.k)?" checked":"")+">"+esc(m.n)+"</label>"
  ).join("");
}
/* レベルの数はタイプごとに違う（発展を持たないタイプは2つまで）。
   持っていないレベルのボタンは押せなくし、選択中のレベルがはみ出していたら引き下げる。 */
function maxLvOf(k){return (k==="mix")?MAXLV:lvCount(k);}
function updLvSeg(){
  const n=maxLvOf(mode);
  if(lv>n)lv=n;
  document.querySelectorAll("#lvSeg .lvbtn").forEach(b=>{
    const v=parseInt(b.dataset.lv,10)||1;
    b.disabled=(v>n);
    b.classList.toggle("on",v===lv);
  });
}
function updLvDesc(){
  const d=document.getElementById("lvDesc");
  if(mode==="mix"){
    d.innerHTML="えらんだタイプから <b>レベル"+lv+"</b> の問題をランダムに出します"
      +"<i>（そのレベルを持たないタイプは、いちばん上のレベルで出ます）</i>";
    return;
  }
  const m=MODEMAP[mode];
  d.innerHTML="<b>"+esc(m.n)+"</b>（"+esc(m.grp)+"） ／ "+esc(m.lv[lv-1])
    +" <i>"+esc(m.ex)+"</i>";
}
function setMixAll(fn){
  mixSet=new Set(MODES.filter(m=>fn(m.k)).map(m=>m.k));
  buildMixGrid();
}
function banner(msg){
  const old=document.getElementById("noticeBanner");
  if(old)old.remove();
  const d=document.createElement("div");
  d.id="noticeBanner";d.className="banner";d.textContent=msg;
  const pane=document.getElementById("view-train");
  pane.insertBefore(d,pane.firstChild);
  setTimeout(()=>{if(d.parentNode)d.remove();},9000);
}

/* ---------- 出題 ---------- */
function newQuestion(){
  safeDivp("resultClose");
  clearEffects();
  graded=false;selChoice=-1;numStr="";
  const v=document.getElementById("verdict");
  v.textContent="";v.className="verdict";
  document.getElementById("explain").style.display="none";
  document.getElementById("toast").textContent="";
  document.getElementById("checkBtn").disabled=false;
  document.getElementById("nextBtn").textContent="次の問題 ➜";

  let m=null,l=lv,s=0;
  if(retryQ){
    if(retryQ.length){
      const it=retryQ.shift();
      m=it.m;l=it.lv;s=it.s;retryDone++;
    }else{
      retryQ=null;
      banner("解き直しはここまで！ このまま通常の出題に戻ります");
      roundStart(ROUND_N,false);
    }
  }
  if(m===null){
    if(mode==="mix"){
      const list=Array.from(mixSet);
      if(!list.length){noMix();return;}
      /* ミックスのタイプ選びは種の外（記録はその問題のタイプで残す） */
      m=list[Math.floor(Math.random()*list.length)];
    }else{
      m=mode;
    }
    l=lv;s=rngPick();
  }
  if(!GENS[m])m="kansuu";
  /* そのタイプが持たないレベルを指定されたら、いちばん上のレベルに寄せる
     （ミックスで「発展」を選んだとき、発展を持たないタイプが混ざるため） */
  if(!(l>=1))l=1;
  if(l>lvCount(m))l=lvCount(m);

  curMode=m;curLv=l;curSeed=s;
  rngSeed(s);
  cur=GENS[m](l);
  qStart=Date.now();
  renderQuestion();
}
function noMix(){
  cur=null;
  document.getElementById("qLead").innerHTML="出題するタイプが1つも選ばれていません。上の「ミックス」の内訳から、練習したいタイプにチェックを入れてください。";
  document.getElementById("qDisp").style.display="none";
  document.getElementById("qSub").innerHTML="";
  document.getElementById("ansArea").innerHTML="";
  document.getElementById("checkBtn").disabled=true;
}
function renderQuestion(){
  const md=MODEMAP[curMode];
  document.getElementById("qType").textContent=md?md.n:curMode;
  document.getElementById("qLv").textContent="LV."+curLv;
  const total=roundTotal||ROUND_N;
  document.getElementById("qNum").textContent=
    (retryQ?("解き直し "+retryDone+" / "+retryTotal):((roundMarks.length+1)+" / "+total));

  document.getElementById("qLead").innerHTML=cur.lead||"";
  const disp=document.getElementById("qDisp");
  if(cur.disp){disp.style.display="";disp.innerHTML=TD(cur.disp);}
  else{disp.style.display="none";disp.innerHTML="";}
  document.getElementById("qSub").innerHTML=cur.sub||"";

  const area=document.getElementById("ansArea");
  const a=cur.ans;
  if(a.kind==="choice"){
    /* 場合分けの答えは1行が長いので1列（wide）で出す */
    area.innerHTML='<div class="choices'+(a.wide?" wide":"")+'" id="choices">'+a.choices.map((c,i)=>
      '<button class="choiceBtn" data-i="'+i+'"><span class="cno">'+"ABCDEF".charAt(i)+"</span>"
      +"<span>"+(a.plain?esc(c):T(c))+"</span></button>"
    ).join("")+"</div>";
  }else{
    const unit=a.unit?('<span class="numunit">'+esc(a.unit)+"</span>"):"";
    area.innerHTML='<div class="numwrap">'
      +'<div style="display:flex;align-items:center;gap:8px">'
      +'<div class="numdisp empty" id="numDisp" style="flex:1">数字を入力</div>'+unit
      +"</div>"
      +'<div class="keypad" id="keypad">'
      +[1,2,3,4,5,6,7,8,9].map(n=>'<button class="key" data-k="'+n+'">'+n+"</button>").join("")
      +'<button class="key fn" data-k="-">±</button>'
      +'<button class="key" data-k="0">0</button>'
      +'<button class="key fn" data-k="bs">⌫</button>'
      +"</div></div>";
  }
  renderTexIn(document.getElementById("card"));
  refreshNum();
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){}
}
function refreshNum(){
  const d=document.getElementById("numDisp");
  if(!d)return;
  if(numStr===""){d.textContent="数字を入力";d.classList.add("empty");}
  else{d.textContent=numStr;d.classList.remove("empty");}
}

/* ---------- 判定 ---------- */
function check(){
  if(graded||!cur)return;
  const a=cur.ans;
  let ok=false,userStr="";
  if(a.kind==="choice"){
    if(selChoice<0){toast("答えを1つ選んでください");return;}
    ok=(selChoice===a.correct);
    userStr=a.choices[selChoice];
    /* 答え合わせ表示（正解=緑 / 選んだ誤答=朱 / 選ばなかった正解に「正解」バッジ） */
    safeDivp("markChoices","#ansArea .choiceBtn",{correct:a.correct,selected:selChoice,dimOthers:true});
    document.querySelectorAll("#ansArea .choiceBtn").forEach(b=>{b.disabled=true;});
  }else{
    if(numStr===""||numStr==="-"){toast("答えを入力してください");return;}
    ok=(parseInt(numStr,10)===a.val);
    userStr=numStr;
    document.querySelectorAll("#keypad .key").forEach(b=>{b.disabled=true;});
  }
  graded=true;
  document.getElementById("checkBtn").disabled=true;

  const v=document.getElementById("verdict");
  const correctStr=cur.plainA||((a.kind==="choice")?a.choices[a.correct]:(String(a.val)+(a.unit||"")));
  const correctDisp=(a.kind==="choice")
    ?(a.plain?esc(a.choices[a.correct]):T(a.choices[a.correct]))
    :esc(String(a.val)+(a.unit||""));
  if(ok){
    streak++;
    v.className="verdict ok";v.textContent="正解";
    toast(streak>=3?("連続 "+streak+" 問正解"):"");
    correctEffect();
  }else{
    streak=0;
    v.className="verdict ng";v.innerHTML="正解は "+correctDisp;
    renderTexIn(v);
    toast("");
    incorrectEffect();
    const card=document.getElementById("card");
    card.classList.remove("shake");void card.offsetWidth;card.classList.add("shake");
  }
  updHUD();
  showExplain();

  /* ── 学習記録（判定直後に1行）──────────────────────────────
     question_key はタイプ名そのまま（CLAUDE.md 設計判断3）。
     question_params は {m:タイプ, lv:レベル, s:種} だけで、この3つがあれば
     ?retry=1 で同じ問題を作り直せる（復元用のロジックはPHP側に置かない）。
     未ログイン・file:// では divp-core が黙ってスキップする。 */
  const qSec=qStart?Math.max(1,Math.round((Date.now()-qStart)/1000)):0;
  safeDivp("answer",ok,{
    question_key:curMode,
    question_params:{m:curMode,lv:curLv,s:curSeed},
    question_text:plainQuestion(),
    /* 選択式は選択肢ごと解き直しプリントに出す（紙で同じ問題が解けるように） */
    question_choices:(a.kind==="choice")?a.choices.map(c=>({t:"tex",v:c})):null,
    correct_answer:correctStr,
    wrong_answer:userStr,
    /* 離席ぶんを混ぜないよう10分超は記録しない */
    time_taken_sec:(qSec>0&&qSec<=600)?qSec:null
  });

  /* 10問ごとの評価用に1問ぶん記録。結果画面は解説を隠さないよう次のボタンで出す */
  roundMarks.push({ok:ok,item:{m:curMode,lv:curLv,s:curSeed}});
  if(hasResultCard()&&roundDone()){
    document.getElementById("nextBtn").textContent="採点結果へ ➜";
  }
}
/* このラウンドを解き終わったか。
   ⚠ retryQ は空配列でも truthy なので、length まで見ないと
     解き直しラウンドの結果画面が一度も出ない */
function roundDone(){
  if(retryQ)return retryQ.length===0;
  return roundMarks.length>=roundTotal;
}
/* 記録用の問題文。**^ _ { } \ を入れない**（和文が混ざるので、1文字でもあると
   講師画面が文字列ぜんぶを TeX として描いて和文が斜体で崩れる）。
   2乗は「²」、ルートは「√」の文字で書く。 */
function plainQuestion(){
  if(!cur)return "";
  let s=cur.plainQ||stripTags(cur.lead||"");
  s="【レベル"+curLv+"】"+s;
  return s.replace(/\s+/g," ").trim();
}
function showExplain(){
  const ex=document.getElementById("explain");
  const body=document.getElementById("exBody");
  let html=(cur.ex||[]).map(l=>(/^<div/.test(l)?l:'<div class="exLine">'+l+"</div>")).join("");
  if(cur.fig){
    html+='<button class="figLink" data-fig=\''+esc(JSON.stringify(cur.fig))+'\'>▶ この問題を図で見る</button>';
  }
  body.innerHTML=html;
  renderTexIn(body);
  ex.style.display="block";
}
function toast(s){document.getElementById("toast").textContent=s||"";}

/* 正解=はんこ / 誤答=「ナイスチャレンジ！」バッジ（js/jh共通 divp-correct-jh.js）。
   第1引数のセレクタは必須。#card は overflow:visible にしてある
   （はんこは直径171pxで、hidden だと切れる）。
   ⚠ はんこは既定で自動では消えない（カードを innerHTML で作り直すツール前提の作り）。
     このツールは #card の中身だけ差し替えるので消えずに残る。
     fadeMs を渡して自分で引っ込めさせ、次の問題でも clearEffects() で片付ける。 */
function clearEffects(){
  document.querySelectorAll("#card .divp-hanko,#card .divp-nice").forEach(e=>e.remove());
}
function correctEffect(){
  if(window.Divp&&typeof Divp.correct==="function")Divp.correct("#card",{fadeMs:1400});
}
function incorrectEffect(){
  if(window.Divp&&typeof Divp.incorrect==="function")Divp.incorrect("#card");
}

/* ---------- 解き直しモード(?retry=1) ----------
   マイページの「解き直し」から ?retry=1 付きで開かれたときだけ動く。
   question_params の {m:タイプ, lv:レベル, s:種} で生成関数を回すと同じ問題が出るので、
   pending をその順に消化する。判定後は通常どおり Divp.answer が飛ぶ＝
   params_hash も同じなので、2連続正解で save_answer.php が mastered にする。
   ⚠ Divp.getRetries() は Promise を返す（戻り値をそのまま配列として使わない）。 */
function initRetry(){
  if(!(window.Divp&&typeof Divp.getRetries==="function"))return;
  Divp.getRetries().then(items=>{
    const use=(items||[]).filter(it=>{
      const p=it&&it.question_params;
      return p&&GENS[p.m]&&typeof p.s==="number";
    }).map(it=>({m:it.question_params.m,lv:it.question_params.lv||1,s:it.question_params.s}));
    if(!use.length){
      banner("解き直せる問題はまだありません。これからまちがえた問題がここに入ります");
      return;
    }
    retryQ=use.slice();retryTotal=retryQ.length;retryDone=0;
    roundStart(retryTotal,true);          /* 解き直しはランクを付けないラウンド */
    banner("解き直しモード: まちがえた "+retryTotal+" 問を、同じ問題で出し直します");
    newQuestion();
  }).catch(()=>{});
}
</script>
<script>
"use strict";
/* ================================================================
   図モード
   「平行移動で頂点がどう動くか」「軸と定義域の位置で最大・最小がどこに来るか」
   「軸が動くと最小値の場所が切り替わる」「絶対値のグラフの折れ目」の4つを、
   値を動かしながら見る。
   ⚠ 図の色・線は**属性**で書く（クラスに頼らない）。このツールでは紙にも記録にも
     出さないが、あとで question_figure に回しても同じ図が使えるようにしておく。
   ================================================================ */
const FIG_TYPES=[
  {k:"idou",  n:"平行移動",          s:"y=a(x-p)²+q"},
  {k:"kukan", n:"定義域と最大・最小",s:"軸と区間"},
  {k:"ugoku", n:"軸が動く",          s:"場合分け"},
  {k:"zettai",n:"絶対値のグラフ",    s:"|x-p|+|x-q|"}
];
const FIG_CTRL={
  idou:[{k:"a",lb:"a",min:-3,max:3,skip0:true},
        {k:"p",lb:"p",min:-6,max:6},
        {k:"q",lb:"q",min:-6,max:6}],
  kukan:[{k:"ka",lb:"a",min:-2,max:2,skip0:true},
         {k:"kk",lb:"軸",min:-5,max:5},
         {k:"kq",lb:"q",min:-6,max:6},
         {k:"ks",lb:"左端",min:-8,max:7},
         {k:"ke",lb:"右端",min:-7,max:8}],
  ugoku:[{k:"ua",lb:"軸a",min:-4,max:8},
         {k:"uc",lb:"c",min:-6,max:8},
         {k:"ut",lb:"右端",min:1,max:6}],
  zettai:[{k:"zp",lb:"p",min:-6,max:3},
          {k:"zq",lb:"q",min:-3,max:6}]
};
const FIG_LEAD={
  idou:"放物線は<b>形（a の値）を変えずに頂点だけが動く</b>のが平行移動です。"
      +"うすい線がもとの y=ax²、こい線が y=a(x-p)²+q。p と q を動かして、"
      +"式の中の符号と動く向きの関係を見てください。",
  kukan:"定義域がつくと、最大・最小は<b>頂点か、定義域の端か</b>のどちらかで起こります。"
       +"軸を動かして定義域の中に入れたり外に出したりすると、答えの場所が入れかわります。",
  ugoku:"軸 <b>x=a</b> が動き、定義域 <b>0≦x≦t</b> は動かない形（発展の「軸が動く」）。"
       +"a を動かすと、最小値をとる場所が 左端 → 頂点 → 右端 と切りかわります。"
       +"その切りかわる瞬間が、答案の<b>場合分けの境目</b>です。",
  zettai:"絶対値は<b>中身が 0 になるところで折れる</b>のが特徴です。"
       +"p と q を動かすと、2つの折れ目の間が<b>水平</b>になり、そこがまるごと最小になることが分かります。"
};
let figType="idou";
const figV={a:1,p:2,q:-3, ka:1,kk:1,kq:-4,ks:-2,ke:4, ua:1,uc:3,ut:4, zp:-1,zq:3};

function fmt(v){
  const r=Math.round(v*100)/100;
  return (Math.abs(r-Math.round(r))<1e-9)?String(Math.round(r)):r.toFixed(2);
}
/* 座標平面の下地。x,y それぞれの表示範囲を渡す（放物線は縦に伸びるので正方形にしない） */
function plot2(x0,x1,y0,y1){
  const W=440,H=420,pad=20;
  const kx=(W-2*pad)/(x1-x0), ky=(H-2*pad)/(y1-y0);
  const X=function(x){return +(pad+(x-x0)*kx).toFixed(1);};
  const Y=function(y){return +(H-pad-(y-y0)*ky).toFixed(1);};
  let g="";
  const sx=((x1-x0)<=14)?1:2, sy=((y1-y0)<=16)?2:4;
  let v;
  for(v=Math.ceil(x0/sx)*sx;v<=x1;v+=sx){
    g+='<line x1="'+X(v)+'" y1="'+Y(y0)+'" x2="'+X(v)+'" y2="'+Y(y1)+'" stroke="rgba(140,175,255,.08)" stroke-width="1"/>';
    if(v!==0)g+='<text x="'+X(v)+'" y="'+(Y(0)+13)+'" fill="#6B7590" font-family="DM Mono,monospace" font-size="10" text-anchor="middle">'+v+"</text>";
  }
  for(v=Math.ceil(y0/sy)*sy;v<=y1;v+=sy){
    g+='<line x1="'+X(x0)+'" y1="'+Y(v)+'" x2="'+X(x1)+'" y2="'+Y(v)+'" stroke="rgba(140,175,255,.08)" stroke-width="1"/>';
    if(v!==0)g+='<text x="'+(X(0)-6)+'" y="'+(Y(v)+4)+'" fill="#6B7590" font-family="DM Mono,monospace" font-size="10" text-anchor="end">'+v+"</text>";
  }
  g+='<line x1="'+X(x0)+'" y1="'+Y(0)+'" x2="'+X(x1)+'" y2="'+Y(0)+'" stroke="rgba(140,175,255,.5)" stroke-width="1.3"/>';
  g+='<line x1="'+X(0)+'" y1="'+Y(y0)+'" x2="'+X(0)+'" y2="'+Y(y1)+'" stroke="rgba(140,175,255,.5)" stroke-width="1.3"/>';
  g+='<text x="'+(X(0)-6)+'" y="'+(Y(0)+14)+'" fill="#7C86A1" font-family="DM Mono,monospace" font-size="11" text-anchor="end">O</text>';
  return {W:W,H:H,X:X,Y:Y,g:g,x0:x0,x1:x1,y0:y0,y1:y1};
}
function plotEnd(p,extra){
  return '<svg viewBox="0 0 '+p.W+" "+p.H+'" xmlns="http://www.w3.org/2000/svg" role="img">'+p.g+extra+"</svg>";
}
/* 関数のグラフ。表示範囲の外に出たところで線を切る（枠の外にはみ出させない） */
function curveSvg(p,f,color,width,dash,xa,xb){
  const from=(xa==null)?p.x0:Math.max(p.x0,xa);
  const to=(xb==null)?p.x1:Math.min(p.x1,xb);
  const N=200, segs=[];
  let cur=[];
  for(let i=0;i<=N;i++){
    const x=from+(to-from)*i/N;
    const y=f(x);
    if(y>=p.y0&&y<=p.y1){cur.push(p.X(x)+","+p.Y(y));}
    else if(cur.length){segs.push(cur);cur=[];}
  }
  if(cur.length)segs.push(cur);
  return segs.filter(function(s){return s.length>1;}).map(function(s){
    return '<polyline points="'+s.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="'+(width||2.2)+'"'
      +(dash?(' stroke-dasharray="'+dash+'"'):"")+"/>";
  }).join("");
}
function svgDot(p,x,y,color){
  return '<circle cx="'+p.X(x)+'" cy="'+p.Y(y)+'" r="5.2" fill="'+(color||"#FFD166")+'" stroke="#0C1120" stroke-width="1.5"/>';
}
function svgVline(p,x,color,dash){
  return '<line x1="'+p.X(x)+'" y1="'+p.Y(p.y0)+'" x2="'+p.X(x)+'" y2="'+p.Y(p.y1)+'" stroke="'+color
    +'" stroke-width="1.6"'+(dash?(' stroke-dasharray="'+dash+'"'):"")+"/>";
}
function svgLabel(p,x,y,txt,color,anchor){
  return '<text x="'+p.X(x)+'" y="'+p.Y(y)+'" fill="'+(color||"#E9EEFB")
    +'" font-family="DM Mono,monospace" font-size="12" text-anchor="'+(anchor||"middle")
    +'" paint-order="stroke" stroke="#0C1120" stroke-width="3">'+esc(txt)+"</text>";
}

/* ---------- ① 平行移動 ---------- */
function figIdou(){
  const a=figV.a,p=figV.p,q=figV.q;
  const pl=plot2(-8,8,-8,10);
  const f0=function(x){return a*x*x;};
  const f1=function(x){return a*(x-p)*(x-p)+q;};
  let g=curveSvg(pl,f0,"rgba(167,139,250,.45)",2,"5 5");
  g+=curveSvg(pl,f1,"#38E8FF",2.6);
  g+='<line x1="'+pl.X(0)+'" y1="'+pl.Y(0)+'" x2="'+pl.X(p)+'" y2="'+pl.Y(q)
    +'" stroke="#FFD166" stroke-width="1.8" stroke-dasharray="4 4"/>';
  g+=svgDot(pl,0,0,"#A78BFA")+svgDot(pl,p,q);
  g+=svgLabel(pl,p,q+1.1,"("+p+", "+q+")","#FFD166");
  const b=-2*a*p, c=a*p*p+q;
  const read="<div>もとの放物線　"+T("y="+vert(a,0,0,"^2"))+"</div>"
    +"<div>移動後　"+T("y="+vert(a,p,q,"^2"))+"</div>"
    +"<div>展開すると　"+T("y="+quad(a,b,c,"x","^2"))+"</div>"
    +"<div>頂点　"+T(ptTex(p,q))+"　軸　"+T("x="+p)+"</div>";
  const judge=T("x")+" 軸方向に <b>"+p+"</b>、"+T("y")+" 軸方向に <b>"+q+"</b> だけ平行移動"
    +"（式では "+T("x")+" が "+T("x"+sg(-p))+" に変わる＝<b>符号が逆</b>）";
  return {svg:plotEnd(pl,g),read:read,judge:judge};
}

/* ---------- ② 定義域と最大・最小 ---------- */
function figKukan(){
  const a=figV.ka,k=figV.kk,q=figV.kq;
  let s=figV.ks,e=figV.ke;
  if(s>=e)e=s+1;
  const f=function(x){return a*(x-k)*(x-k)+q;};
  const lo=Math.min(-8,q-2), hi=Math.max(10,q+2);
  const pl=plot2(-9,9,lo,hi);
  let g='<rect x="'+pl.X(s)+'" y="'+pl.Y(pl.y1)+'" width="'+(pl.X(e)-pl.X(s))+'" height="'
    +(pl.Y(pl.y0)-pl.Y(pl.y1))+'" fill="rgba(56,232,255,.07)"/>';
  g+=svgVline(pl,s,"rgba(56,232,255,.45)","4 4")+svgVline(pl,e,"rgba(56,232,255,.45)","4 4");
  g+=svgVline(pl,k,"rgba(255,209,102,.5)","2 4");
  g+=curveSvg(pl,f,"rgba(167,139,250,.35)",2);
  g+=curveSvg(pl,f,"#38E8FF",3,null,s,e);
  const inside=(k>=s&&k<=e);
  const cand=[[s,f(s)],[e,f(e)]];
  if(inside)cand.push([k,q]);
  let mx=cand[0],mn=cand[0];
  cand.forEach(function(c){if(c[1]>mx[1])mx=c;if(c[1]<mn[1])mn=c;});
  g+=svgDot(pl,mx[0],mx[1],"#FF7A80")+svgDot(pl,mn[0],mn[1],"#7EE0A0");
  g+=svgLabel(pl,mx[0],mx[1]+1.2,"最大 "+fmt(mx[1]),"#FF7A80");
  g+=svgLabel(pl,mn[0],mn[1]-1.6,"最小 "+fmt(mn[1]),"#7EE0A0");
  const read="<div>"+T("y="+vert(a,k,q,"^2"))+"</div>"
    +"<div>軸　"+T("x="+k)+"　頂点　"+T(ptTex(k,q))+"</div>"
    +"<div>定義域　"+T(s+" \\leqq x \\leqq "+e)+"</div>"
    +"<div>"+T("f("+s+")="+fmt(f(s)))+"　"+T("f("+e+")="+fmt(f(e)))+"</div>"
    +"<div>軸は定義域の <b>"+(inside?"中":"外")+"</b></div>";
  const judge="最大値 <b>"+fmt(mx[1])+"</b>（"+T("x="+mx[0])+"）　/　最小値 <b>"+fmt(mn[1])+"</b>（"+T("x="+mn[0])+"）"
    +"<br>"+(inside?("頂点が定義域に入っているので、"+(a>0?"最小":"最大")+"は頂点。反対側は<b>軸から遠いほうの端</b>。")
                  :"軸が定義域の外なので、<b>最大も最小も端</b>で起こる。");
  return {svg:plotEnd(pl,g),read:read,judge:judge};
}

/* ---------- ③ 軸が動く（発展83） ---------- */
function figUgoku(){
  const A=figV.ua,c=figV.uc,t=figV.ut;
  const f=function(x){return x*x-2*A*x+c;};
  const vtx=c-A*A;
  const lo=Math.min(-8,vtx-2), hi=Math.max(12,c+4);
  const pl=plot2(-6,10,lo,hi);
  let g='<rect x="'+pl.X(0)+'" y="'+pl.Y(pl.y1)+'" width="'+(pl.X(t)-pl.X(0))+'" height="'
    +(pl.Y(pl.y0)-pl.Y(pl.y1))+'" fill="rgba(56,232,255,.07)"/>';
  g+=svgVline(pl,0,"rgba(56,232,255,.45)","4 4")+svgVline(pl,t,"rgba(56,232,255,.45)","4 4");
  g+=svgVline(pl,A,"rgba(255,209,102,.55)","2 4");
  g+=svgLabel(pl,A,pl.y1-1,"軸 x="+A,"#FFD166");
  g+=curveSvg(pl,f,"rgba(167,139,250,.35)",2);
  g+=curveSvg(pl,f,"#38E8FF",3,null,0,t);
  let mx,mv,cs;
  if(A<0){mx=0;mv=c;cs="① 軸が左にはみ出す（a＜0）→ 左端 x=0 が最小";}
  else if(A<=t){mx=A;mv=vtx;cs="② 軸が定義域の中（0≦a≦"+t+"）→ 頂点が最小";}
  else{mx=t;mv=f(t);cs="③ 軸が右にはみ出す（"+t+"＜a）→ 右端 x="+t+" が最小";}
  g+=svgDot(pl,mx,mv,"#7EE0A0");
  g+=svgLabel(pl,mx,mv-1.6,"最小 "+fmt(mv),"#7EE0A0");
  const read="<div>"+T("y=x^2-2ax"+sg(c))+"　→　"+T("y=(x-a)^2-a^2"+sg(c))+"</div>"
    +"<div>いまの軸　"+T("a="+A)+"　頂点　"+T(ptTex(A,vtx))+"</div>"
    +"<div>定義域　"+T("0 \\leqq x \\leqq "+t)+"</div>"
    +"<div>"+T("f(0)="+c)+"　"+T("f("+t+")="+fmt(f(t)))+"　頂点の値 "+T(String(vtx))+"</div>";
  const judge=esc(cs)+"<br>最小値は <b>"+fmt(mv)+"</b>（"+T("x="+mx)+"）";
  return {svg:plotEnd(pl,g),read:read,judge:judge};
}

/* ---------- ④ 絶対値のグラフ（発展78） ---------- */
function figZettai(){
  let p=figV.zp,q=figV.zq;
  if(p>q){const w=p;p=q;q=w;}
  const f=function(x){return Math.abs(x-p)+Math.abs(x-q);};
  const pl=plot2(-9,9,-2,14);
  let g=curveSvg(pl,f,"#38E8FF",2.8);
  g+=svgVline(pl,p,"rgba(167,139,250,.35)","3 4")+svgVline(pl,q,"rgba(167,139,250,.35)","3 4");
  g+=svgDot(pl,p,q-p)+svgDot(pl,q,q-p);
  g+=svgLabel(pl,(p+q)/2,q-p+1.4,"最小 "+(q-p),"#7EE0A0");
  const read="<div>"+T("y=\\left|x"+sg(-p)+"\\right|+\\left|x"+sg(-q)+"\\right|")+"</div>"
    +"<div>折れ目　"+T("x="+p)+" と "+T("x="+q)+"</div>"
    +"<div>"+T("x \\lt "+p)+"　"+T("y="+poly([[-2,"x"],[p+q,""]]))+"（右下がり）</div>"
    +"<div>"+T(p+" \\leqq x \\leqq "+q)+"　"+T("y="+(q-p))+"（水平）</div>"
    +"<div>"+T(q+" \\lt x")+"　"+T("y="+poly([[2,"x"],[-(p+q),""]]))+"（右上がり）</div>";
  const judge=T(p+" \\leqq x \\leqq "+q)+" のとき 最小値 <b>"+(q-p)+"</b>"
    +"<br>2点からの距離の和なので、<b>2点の間ならどこでも同じ</b>（最小）になる。";
  return {svg:plotEnd(pl,g),read:read,judge:judge};
}

function figRender(){
  let out;
  if(figType==="idou")out=figIdou();
  else if(figType==="kukan")out=figKukan();
  else if(figType==="ugoku")out=figUgoku();
  else out=figZettai();
  document.getElementById("figSvg").innerHTML=out.svg;
  const read=document.getElementById("figRead");
  const judge=document.getElementById("figJudge");
  read.innerHTML=out.read;judge.innerHTML=out.judge;
  renderTexIn(read);renderTexIn(judge);
}
function buildFigChips(){
  document.getElementById("figChips").innerHTML=FIG_TYPES.map(f=>
    '<button class="chip'+(f.k===figType?" on":"")+'" data-fig="'+f.k+'">'+esc(f.n)+"<small>"+esc(f.s)+"</small></button>"
  ).join("");
  document.getElementById("figLead").innerHTML=FIG_LEAD[figType]||"";
}
function buildFigCtrl(){
  document.getElementById("figCtrl").innerHTML=(FIG_CTRL[figType]||[]).map(c=>
    '<div class="stepper"><span class="lb">'+esc(c.lb)+'</span>'
    +'<button class="sbtn" data-p="'+c.k+'" data-dir="-1">−</button>'
    +'<span class="sval" id="sv_'+c.k+'">'+figV[c.k]+"</span>"
    +'<button class="sbtn" data-p="'+c.k+'" data-dir="1">＋</button></div>'
  ).join("");
}
function figSetVal(key,v){
  figV[key]=v;
  const el=document.getElementById("sv_"+key);
  if(el)el.textContent=v;
}
function figStep(key,dir){
  const c=(FIG_CTRL[figType]||[]).filter(x=>x.k===key)[0];
  if(!c)return;
  let v=figV[key]+dir;
  if(c.skip0&&v===0)v+=dir;          /* a=0 は放物線にならないので飛ばす */
  if(v<c.min)v=c.min;
  if(v>c.max)v=c.max;
  figSetVal(key,v);
  /* 定義域は左端＜右端をたもつ（押した側を優先して相手をずらす） */
  if(figType==="kukan"&&figV.ks>=figV.ke){
    if(key==="ks")figSetVal("ke",Math.min(8,figV.ks+1));
    else figSetVal("ks",Math.max(-8,figV.ke-1));
  }
  figRender();
}
/* 解説の「▶ この問題を図で見る」から呼ぶ */
function openFigFrom(info){
  if(!info||!info.t)return;
  const cl=function(v,lo,hi){return Math.max(lo,Math.min(hi,v));};
  figType=info.t;
  if(info.t==="idou"){
    figSetVal("a",cl(info.a,-3,3));figSetVal("p",cl(info.p,-6,6));figSetVal("q",cl(info.q,-6,6));
  }else if(info.t==="kukan"){
    figV.ka=cl(info.a,-2,2);figV.kk=cl(info.k,-5,5);figV.kq=cl(info.q,-6,6);
    figV.ks=cl(info.s,-8,7);figV.ke=cl(info.e,-7,8);
    if(figV.ks>=figV.ke)figV.ke=Math.min(8,figV.ks+1);
  }else if(info.t==="ugoku"){
    figV.ua=cl(info.k,-4,8);figV.uc=cl(info.c,-6,8);figV.ut=cl(info.tt,1,6);
  }else{
    figV.zp=cl(info.p,-6,3);figV.zq=cl(info.q,-3,6);
  }
  setView("fig");
  buildFigChips();buildFigCtrl();figRender();
}

/* ================================================================
   練習プリント（A4・別ウィンドウ）
   いま選んでいるタイプ×レベルで10問作り、「問題」→改ページ→「解答」を出す。
   ⚠ 画面の出題を壊さないこと。GENS[] は cur を触らないが乱数は進むので、
     1問作るごとに rngSeed(rngPick()) を張り直す。
   ⚠ 数式は**親ウィンドウの KaTeX で HTML に焼いてから**流し込む
     （子ウィンドウで katex を動かすと読み込み待ちが要り、印刷ダイアログのほうが
     先に出て数式が生テキストのまま紙になる）。子には CSS だけ読ませる。
   ================================================================ */
/* 1枚に入る問題数はタイプで違う。A4の本文枠は約1016px で、実測（Chrome・本文幅672px）だと
   1問あたり **選択肢つき 160〜230px / テンキー（数値入力）70〜100px**。
   そこで選択肢つきは5問、数値入力は10問にする＝「問題1枚＋解答1枚」がくずれない。
   ⚠ 一律10問にすると、場合分けの選択肢を持つ⑥などが2枚目にあふれる（実測1869px）。 */
const PRT_N=10, PRT_N_TEXT=8, PRT_N_CHOICE=5, PRT_N_LONG=4;
function prtCount(){
  const pool=(mode==="mix")?Array.from(mixSet):[mode];
  let kind=0;                       /* 0=数値入力 1=選択肢 2=長い選択肢 */
  let longQ=false;                  /* 文章題のように問題文そのものが長い */
  pool.forEach(function(m){
    if(!GENS[m])return;
    rngSeed(rngPick());
    try{
      const q=GENS[m](Math.min(lv,lvCount(m)));
      const a=q.ans;
      if((q.plainQ||"").length>=60)longQ=true;
      if(a.kind!=="choice")return;
      if(kind<1)kind=1;
      /* 場合分け（wide）・分数・長い和文の選択肢は1問で紙を大きく食う */
      const long=a.wide||a.choices.some(function(c){
        return /dfrac/.test(String(c))||String(c).length>=20;
      });
      if(long)kind=2;
    }catch(e){}
  });
  if(kind===0)return longQ?PRT_N_TEXT:PRT_N;    /* 文章題（⑨）は1問が3行になる */
  return (kind===1)?PRT_N_CHOICE:PRT_N_LONG;
}
function prtTex(html){
  const box=document.createElement("div");
  box.innerHTML=html||"";
  renderTexIn(box);
  return box.innerHTML;
}
function prtPick(n){
  const pool=(mode==="mix")?Array.from(mixSet):[mode];
  const out=[],seen={};
  if(!pool.length)return out;
  for(let t=0;t<n*40&&out.length<n;t++){
    const m=pool[Math.floor(Math.random()*pool.length)];
    if(!GENS[m])continue;
    rngSeed(rngPick());
    const q=GENS[m](Math.min(lv,lvCount(m)));
    const a=(q.ans.kind==="choice")?q.ans.choices[q.ans.correct]:String(q.ans.val);
    const sig=[m,q.lead||"",q.disp||"",q.sub||"",a].join("");
    if(seen[sig])continue;
    seen[sig]=1;out.push({m:m,q:q});
  }
  return out;
}
function prtAnsHtml(q){
  if(q.ans.kind==="choice")
    return '<span class="mk">'+"ABCDEF".charAt(q.ans.correct)+"</span>"
      +(q.ans.plain?esc(q.ans.choices[q.ans.correct]):prtTex(T(q.ans.choices[q.ans.correct])));
  return "<b>"+esc(String(q.ans.val))+"</b>"+(q.ans.unit?('<span class="un">'+esc(q.ans.unit)+"</span>"):"");
}
function prtHtml(items){
  const md=MODEMAP[mode];
  const label=(mode==="mix"?"ミックス":(md?md.n:mode))+"　LEVEL "+lv+"　全"+items.length+"問";
  const d=new Date();
  const date=d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  const wmCss=(window.ChukyoPrint&&ChukyoPrint.css)?ChukyoPrint.css():"";
  const wmImg=(window.ChukyoPrint&&ChukyoPrint.img)?ChukyoPrint.img():"";
  const head=function(t){
    return '<div class="ph"><div><div class="pb">中京個別指導学院</div><div class="pt">'+esc(t)+"</div></div>"
      +'<div class="pr"><div>名前：<span class="nm"></span></div><div class="dt">'+date+"</div></div></div>";
  };
  const probs=items.map(function(it,i){
    const q=it.q;
    let s='<div class="p"><div class="q"><span class="no">('+(i+1)+")</span><span>"+prtTex(q.lead||"")+"</span></div>";
    if(q.disp)s+='<div class="dp">'+prtTex(TD(q.disp))+"</div>";
    if(q.sub)s+='<div class="sb">'+prtTex(q.sub)+"</div>";
    if(q.ans.kind==="choice")
      s+='<div class="ch'+(q.ans.wide?" wd":"")+'">'+q.ans.choices.map(function(c,j){
        return "<span><i>"+"ABCDEF".charAt(j)+"</i>"+(q.ans.plain?esc(c):prtTex(T(c)))+"</span>";
      }).join("")+"</div>";
    s+='<div class="al">答'+(q.ans.kind==="choice"?'<span class="bx"></span>':'<span class="ln"></span>')+"</div>";
    return s+"</div>";
  }).join("");
  const answ=items.map(function(it,i){
    return '<div class="a"><span class="no">('+(i+1)+")</span>"+prtAnsHtml(it.q)+"</div>";
  }).join("");
  return '<!DOCTYPE html><html lang="ja"><head><meta charset="UTF-8">'
    +'<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">'
    +"<title>2次関数マスター 練習プリント｜中京個別指導学院</title><style>"
    +"@page{size:A4 portrait;margin:14mm 16mm;}"
    +"*{box-sizing:border-box;margin:0;padding:0;}"
    +'body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;color:#111;font-size:10pt;}'
    /* ⚠ KaTeX の display 数式は既定で上下 1em の余白を持つ。1問ごとに 7mm 以上
       食うので必ず 0 にする（これが無いと10問で1枚に収まらない） */
    +".katex-display{margin:0;}"
    +"@media print{body{-webkit-print-color-adjust:exact;print-color-adjust:exact;}}"
    +wmCss
    +".wm{position:fixed;}"
    +".ph{display:flex;justify-content:space-between;align-items:flex-end;"
      +"border-bottom:2.5px solid #0a1628;padding-bottom:7px;margin-bottom:10px;}"
    +".pb{font-size:8pt;letter-spacing:.2em;color:#4a5568;}"
    +".pt{font-size:13pt;font-weight:700;margin-top:2px;}"
    +".pr{text-align:right;font-size:9pt;}"
    +".nm{display:inline-block;width:32mm;border-bottom:1px solid #333;}"
    +".dt{color:#666;font-size:8pt;margin-top:4px;}"
    +".p{border-bottom:1px dotted #bbb;padding:6px 0 7px;break-inside:avoid;page-break-inside:avoid;}"
    +".q{display:flex;gap:6px;line-height:1.7;}"
    +".no{font-weight:700;color:#2C5F8A;flex:0 0 auto;}"
    +".dp{text-align:center;margin:4px 0;font-size:11pt;}"
    +".sb{font-size:9pt;color:#444;margin-top:2px;}"
    +".ch{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:4px;font-size:9.5pt;}"
    +".ch span{display:flex;align-items:center;gap:4px;}"
    /* 場合分けの選択肢は1行が長いので、紙でも1つずつ改行して出す */
    +".ch.wd{flex-direction:column;gap:2px;}"
    +".ch i{font-style:normal;font-size:8pt;color:#fff;background:#2C5F8A;border-radius:3px;padding:0 4px;}"
    +".al{margin-top:5px;font-size:9pt;color:#555;display:flex;align-items:center;gap:6px;}"
    +".bx{display:inline-block;width:16mm;height:6mm;border:1px solid #333;}"
    +".ln{display:inline-block;width:46mm;border-bottom:1px solid #333;height:5mm;}"
    +".pg{page-break-before:always;}"
    +".a{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dotted #ddd;font-size:10pt;}"
    +".mk{font-weight:700;color:#C73E2E;margin-right:4px;}"
    +".un{font-size:8pt;color:#666;margin-left:3px;}"
    +"</style></head><body>"
    +wmImg+head(label)+probs
    +'<div class="pg">'+wmImg+head(label+"　解答")+answ+"</div>"
    +"</body></html>";
}
function printSheet(){
  const items=prtPick(prtCount());
  if(!items.length){toast("印刷する問題を作れませんでした");return;}
  const w=window.open("","_blank");
  if(!w){toast("ポップアップがブロックされました");return;}
  w.document.write(prtHtml(items));
  w.document.close();
  w.focus();
  setTimeout(function(){try{w.print();}catch(e){}},700);
}

/* ---------- 画面の切り替え ---------- */
function setView(v){
  view=v;
  document.getElementById("view-train").style.display=(v==="train")?"block":"none";
  document.getElementById("view-fig").style.display=(v==="fig")?"block":"none";
  document.querySelectorAll(".vtab").forEach(b=>b.classList.toggle("on",b.dataset.view===v));
  if(v==="train")safeDivp("resultClose");
  try{window.scrollTo({top:0,behavior:"smooth"});}catch(e){window.scrollTo(0,0);}
}

/* ---------- イベント ---------- */
document.querySelector(".viewtabs").addEventListener("click",function(e){
  const b=e.target.closest(".vtab");if(!b)return;
  setView(b.dataset.view);
  if(b.dataset.view==="fig")figRender();   /* 非表示中は幅0で描かれているので描き直す */
});
document.getElementById("typeChips").addEventListener("click",function(e){
  const c=e.target.closest(".chip");if(!c)return;
  mode=c.dataset.mode;
  retryQ=null;                                  /* タイプを選び直したら解き直しモードを抜ける */
  document.querySelectorAll("#typeChips .chip").forEach(x=>x.classList.toggle("on",x===c));
  document.getElementById("mixBox").style.display=(mode==="mix")?"block":"none";
  roundStart(ROUND_N,false);                    /* ラウンドも数え直し（連続はタイプごと） */
  safeDivp("resultClose");
  updLvSeg();updLvDesc();
  newQuestion();
});
document.getElementById("lvSeg").addEventListener("click",function(e){
  const b=e.target.closest(".lvbtn");if(!b||b.disabled)return;
  lv=parseInt(b.dataset.lv,10)||1;
  retryQ=null;
  roundStart(ROUND_N,false);
  safeDivp("resultClose");
  updLvSeg();updLvDesc();
  newQuestion();
});
document.getElementById("mixGrid").addEventListener("change",function(e){
  const cb=e.target.closest("input[data-mix]");if(!cb)return;
  if(cb.checked)mixSet.add(cb.dataset.mix);else mixSet.delete(cb.dataset.mix);
  if(mode==="mix"&&!cur)newQuestion();
});
document.getElementById("mixAll").addEventListener("click",function(){setMixAll(()=>true);if(mode==="mix"&&!cur)newQuestion();});
document.getElementById("mixNone").addEventListener("click",function(){setMixAll(()=>false);});
document.getElementById("mixBasicBtn").addEventListener("click",function(){
  setMixAll(k=>BASIC4.indexOf(k)>=0);
  if(mode==="mix"&&!cur)newQuestion();
});
document.getElementById("prtBtn").addEventListener("click",printSheet);
document.getElementById("foldBtn").addEventListener("click",function(){
  const box=document.getElementById("selbox"),b=document.getElementById("foldBtn");
  const fold=!box.classList.contains("folded");
  box.classList.toggle("folded",fold);
  b.textContent=fold?"ひらく":"とじる";
  b.setAttribute("aria-expanded",fold?"false":"true");
});
/* 選択肢・テンキーはクリック委任だけで受ける（touch リスナーを足さない＝
   高速連打のタッチミス対策。touch-action:manipulation は body に指定済み） */
document.getElementById("ansArea").addEventListener("click",function(e){
  const c=e.target.closest(".choiceBtn");
  if(c&&!graded){
    selChoice=parseInt(c.dataset.i,10);
    document.querySelectorAll("#ansArea .choiceBtn").forEach(b=>b.classList.toggle("sel",b===c));
    return;
  }
  const k=e.target.closest(".key");
  if(k&&!graded){
    const v=k.dataset.k;
    if(v==="bs")numStr=numStr.slice(0,-1);
    else if(v==="-")numStr=(numStr.charAt(0)==="-")?numStr.slice(1):("-"+numStr);
    else if(numStr.replace("-","").length<9)numStr+=v;
    refreshNum();
  }
});
document.getElementById("checkBtn").addEventListener("click",check);
document.getElementById("nextBtn").addEventListener("click",function(){
  /* ラウンドを解き終わっていたら、次の問題ではなく結果画面を先に出す */
  if(graded&&roundDone()){
    const drained=!!(retryQ&&retryQ.length===0);
    if(showRoundResult()){
      if(drained)retryQ=null;
      return;
    }
    if(drained)retryQ=null;
  }
  newQuestion();
});
document.getElementById("exBody").addEventListener("click",function(e){
  const b=e.target.closest("[data-fig]");if(!b)return;
  let info=null;
  try{info=JSON.parse(b.dataset.fig);}catch(err){}
  if(info)openFigFrom(info);
});
document.getElementById("figChips").addEventListener("click",function(e){
  const b=e.target.closest(".chip");if(!b)return;
  figType=b.dataset.fig;
  buildFigChips();buildFigCtrl();figRender();
});
document.getElementById("figCtrl").addEventListener("click",function(e){
  const b=e.target.closest(".sbtn");if(!b)return;
  figStep(b.dataset.p,parseInt(b.dataset.dir,10));
});
/* キーボード（PCで解く生徒向け）。数字・マイナス・BS・Enter だけ */
document.addEventListener("keydown",function(e){
  if(view!=="train")return;
  if(e.target&&/^(INPUT|TEXTAREA)$/.test(e.target.tagName))return;
  if(e.key==="Enter"){
    e.preventDefault();
    if(graded)document.getElementById("nextBtn").click();
    else check();
    return;
  }
  if(!cur||graded||cur.ans.kind!=="num")return;
  if(/^[0-9]$/.test(e.key)){
    if(numStr.replace("-","").length<9)numStr+=e.key;refreshNum();
  }else if(e.key==="-"){
    numStr=(numStr.charAt(0)==="-")?numStr.slice(1):("-"+numStr);refreshNum();
  }else if(e.key==="Backspace"){
    e.preventDefault();numStr=numStr.slice(0,-1);refreshNum();
  }
});
/* KaTeX は defer 読み込みなので、来てからもう一度描き直す */
window.addEventListener("load",function(){
  renderTexIn(document.body);
  if(view==="fig")figRender();
});

/* ---------- 起動 ---------- */
/* 学習記録の開始（セッション・学習時間・ハートビートは divp-core にまかせる） */
safeDivp("init",UNIT_KEY);
buildTypeChips();
buildMixGrid();
buildFigChips();
buildFigCtrl();
roundInit();
updLvSeg();
updLvDesc();
updHUD();
newQuestion();
figRender();
/* マイページの「解き直し」から来たときだけ、pending を同じ問題で出し直す */
if(/[?&]retry=1/.test(location.search)){try{initRetry();}catch(e){}}
/* ?fig=kukan のように直リンクで図モードを開けるようにしておく（授業で見せる用） */
(function(){
  const m=/[?&]fig=([a-z]+)/i.exec(location.search);
  if(m&&FIG_CTRL[m[1]]){figType=m[1];buildFigChips();buildFigCtrl();setView("fig");figRender();}
})();
</script>
