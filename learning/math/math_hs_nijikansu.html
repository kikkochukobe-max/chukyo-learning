<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2次関数マスター | 中京個別指導学院</title>
<meta name="description" content="高校数学I「2次関数」の章をまるごと練習できるツール。関数の値と値域・平方完成と頂点・放物線の平行移動・対称移動・最大最小（定義域つき）・定義域や軸が動く最大最小・2次関数の決定・最大値から係数決定・最大最小の文章題・絶対値を含む1次関数のグラフ・条件式がある場合の最大最小の11タイプを、基本／標準／発展のレベル別に出題します。図モードでは平行移動・定義域と軸・絶対値のグラフを動かしながら確かめられます。中京個別指導学院。">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- ⚠ 共通モジュール（divp-header.js など）は <head> ではなく <body> 開始直後に置く。
     ヘッダーは document.currentScript の位置に自分を挿し込むので、head に書くと
     header 要素が head の中に入って画面に一切出ない（エラーは出ない）。 -->
<style>
/* ================================================================
   2次関数マスター — 数列完全マスター / 漸化式マスター / 円と方程式マスターと
   同じ「高校生向け・暗い紺地＋シアン／バイオレット」でそろえる（同じ生徒が行き来する）。
   共通モジュールの色は :root の変数で上書きする（var()のフォールバック方式なので
   読み込み順に関係なくツール側が勝つ）。
   ================================================================ */
:root{
  --bg:#070A12;
  --bg2:#0C1120;
  --panel:rgba(255,255,255,.045);
  --line:rgba(140,175,255,.16);
  --line2:rgba(140,175,255,.30);
  --ink:#E9EEFB;
  --ink2:#B7C1DA;
  --muted:#7C86A1;
  --cy:#38E8FF;
  --cy2:#0E9EC0;
  --vi:#A78BFA;
  --vi2:#7C5CFA;
  --gold:#FFD166;
  --ok:#7EE0A0;
  --ng:#FF7A80;
  --jp:"Zen Kaku Gothic New",system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* ── 答え合わせ表示（divp-choice-mark.js）────────────────────────
     正解の緑は #3E8E5A に統一するのが原則だが、このツールは暗背景なので
     science_js3_ionlab / 漸化式マスター / 円と方程式マスターと同じ
     明るい緑の例外側にそろえる。 */
  --divp-mark-ok:#7ee0a0;
  --divp-mark-ok-bg:rgba(126,224,160,.16);
  --divp-mark-ok-bg-soft:rgba(126,224,160,.10);
  --divp-mark-ok-text:#bfe6cf;
  --divp-mark-ng:#ff7a80;
  --divp-mark-ng-bg:rgba(255,122,128,.16);
  --divp-mark-dim-opacity:.38;
  /* ── 10問ごとの評価（divp-result.js）を暗配色に寄せる。
     ランクの色（--divp-result-grade-*）は既定の派手な配色のまま（ランクは目立ってよい） */
  --divp-result-bg:#0C1222;
  --divp-result-ink:#E9EEFB;
  --divp-result-sub:#7C86A1;
  --divp-result-accent:#38E8FF;
  --divp-result-accent-ink:#04121A;
  --divp-result-sub-btn:rgba(255,255,255,.07);
  --divp-result-wrong-btn:#7C5CFA;
  --divp-result-ok:#7ee0a0;
  --divp-result-ok-bg:rgba(126,224,160,.14);
  --divp-result-ng:#ff7a80;
  --divp-result-ng-bg:rgba(255,122,128,.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
/* html 側にも地の色を置く（body の背景は fixed なので、端まで引っ張られたときに
   ここが無いと白地が出て、ほぼ白の文字 --ink が読めなくなる） */
html{background:#070A12;}
body{
  background:
    radial-gradient(1200px 760px at 82% -12%, rgba(56,232,255,.10), transparent 60%),
    radial-gradient(900px 700px at 4% 6%, rgba(167,139,250,.11), transparent 58%),
    linear-gradient(180deg,var(--bg2),var(--bg) 46%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:var(--jp);
  font-feature-settings:"palt";
  touch-action:manipulation;
  -webkit-text-size-adjust:100%;
}
/* ⚠ body を flex/grid にしない。共通ヘッダーは .wrap の兄弟として body に挿されるので、
   flex にすると横に並んで画面左端に縦長の帯になる（中央寄せは .wrap 側の margin で行う）。 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    repeating-linear-gradient(90deg, rgba(140,175,255,.045) 0 1px, transparent 1px 56px),
    repeating-linear-gradient(0deg,  rgba(140,175,255,.045) 0 1px, transparent 1px 56px);
  mask-image:radial-gradient(1000px 700px at 50% 0%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(1000px 700px at 50% 0%, #000 30%, transparent 78%);
}
.wrap{position:relative;z-index:1;padding:14px 12px 96px;}
a{color:var(--cy);}

/* ---------- ヘッダー ---------- */
header.dv-head{
  max-width:920px;margin:0 auto 12px;display:flex;align-items:flex-end;justify-content:space-between;
  gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:1px solid var(--line);
}
h1{font-size:1.42rem;font-weight:900;letter-spacing:.02em;line-height:1.18;display:flex;flex-direction:column;gap:5px;}
h1 .sub{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.26em;color:var(--cy);text-transform:uppercase;}
h1 .ttl{background:linear-gradient(92deg,#fff 12%,var(--cy) 58%,var(--vi) 96%);
  -webkit-background-clip:text;background-clip:text;color:transparent;}
.stats{display:flex;gap:8px;}
.stat{min-width:74px;text-align:center;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:7px 10px;}
.stat b{display:block;font-family:var(--mono);font-size:1.12rem;line-height:1.1;color:#fff;}
.stat span{display:block;font-size:.56rem;letter-spacing:.18em;color:var(--muted);margin-top:3px;}
#rankBadge b{background:linear-gradient(92deg,var(--gold),#FFF1C2);-webkit-background-clip:text;background-clip:text;color:transparent;}

/* ---------- 上段タブ ---------- */
.viewtabs{max-width:920px;margin:0 auto 14px;display:flex;gap:8px;}
.vtab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;
  border:1px solid var(--line);border-radius:14px;background:var(--panel);
  padding:10px 8px;color:var(--ink2);cursor:pointer;font-family:inherit;
  transition:border-color .18s, box-shadow .18s, background .18s, color .18s;
}
.vtab b{font-size:.94rem;font-weight:700;}
.vtab i{font-style:normal;font-family:var(--mono);font-size:.56rem;letter-spacing:.24em;color:var(--muted);}
.vtab.on{
  color:#fff;border-color:var(--cy);
  background:linear-gradient(140deg,rgba(56,232,255,.16),rgba(167,139,250,.14));
  box-shadow:0 0 0 1px rgba(56,232,255,.28), 0 14px 30px -18px rgba(56,232,255,.85);
}
.vtab.on i{color:var(--cy);}

/* ---------- 出題タイプ / レベル ---------- */
.pane{max-width:920px;margin:0 auto;}
.selbox{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px;margin-bottom:12px;}
.selhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px;}
.selhead h2{font-family:var(--mono);font-size:.62rem;font-weight:500;letter-spacing:.22em;color:var(--cy);text-transform:uppercase;}
.selacts{display:flex;align-items:center;gap:7px;}
.foldBtn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:.7rem;padding:4px 12px;cursor:pointer;}
.foldBtn.prt{color:var(--gold);border-color:rgba(255,209,102,.38);}
.foldBtn.prt:hover{background:rgba(255,209,102,.12);}
.selbox.folded .chips,.selbox.folded .mixbox{display:none;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{
  border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.03);
  color:var(--ink2);font-family:inherit;font-size:.76rem;padding:7px 13px;cursor:pointer;
  display:flex;align-items:center;gap:6px;line-height:1.2;
  transition:border-color .16s, box-shadow .16s, background .16s, color .16s;
}
.chip small{font-family:var(--mono);font-size:.58rem;color:var(--muted);}
.chip:hover{border-color:var(--line2);color:var(--ink);}
.chip.on{
  color:#fff;border-color:var(--cy);
  background:linear-gradient(135deg,rgba(56,232,255,.20),rgba(167,139,250,.16));
  box-shadow:0 0 0 1px rgba(56,232,255,.26), 0 10px 24px -16px rgba(56,232,255,.9);
}
.chip.on small{color:#CFF6FF;}
.chip.mix{border-style:dashed;}
.chip.mix.on{border-style:solid;border-color:var(--vi);
  box-shadow:0 0 0 1px rgba(167,139,250,.3), 0 10px 24px -16px rgba(167,139,250,.9);}
.lvrow{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap;}
.lvlabel{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;color:var(--muted);}
.lvseg{display:flex;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px;background:rgba(0,0,0,.22);}
.lvbtn{border:0;border-radius:9px;background:transparent;color:var(--ink2);font-family:inherit;
  font-size:.76rem;padding:6px 13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:background .16s,color .16s;}
.lvbtn u{text-decoration:none;font-family:var(--mono);font-size:.66rem;color:var(--muted);}
.lvbtn.on{background:linear-gradient(135deg,var(--cy2),var(--vi2));color:#fff;}
.lvbtn.on u{color:#DFF6FF;}
/* そのタイプに無いレベル（発展を持たないタイプ）は押せなくする。
   ボタンごと消すと段組みが動いて押しまちがえるので、薄くして残す */
.lvbtn[disabled]{opacity:.28;cursor:default;}
#lvDesc{font-size:.74rem;color:var(--ink2);}
#lvDesc b{color:var(--cy);font-weight:700;}
#lvDesc i{font-style:normal;color:var(--muted);}
.mixbox{margin-top:11px;border-top:1px dashed var(--line);padding-top:10px;}
.mixgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px;}
.mixgrid label{display:flex;align-items:center;gap:7px;font-size:.74rem;color:var(--ink2);
  border:1px solid transparent;border-radius:9px;padding:5px 7px;cursor:pointer;}
.mixgrid label:hover{background:rgba(255,255,255,.04);}
.mixgrid input{accent-color:var(--cy);width:15px;height:15px;}
.mixbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.miniBtn{border:1px solid var(--line);border-radius:999px;background:transparent;color:var(--ink2);
  font-family:inherit;font-size:.68rem;padding:5px 11px;cursor:pointer;}
.miniBtn:hover{border-color:var(--line2);color:#fff;}

/* ---------- 問題カード ---------- */
/* ⚠ overflow は visible のまま（正解はんこは直径171pxで、hidden だと切れる） */
#card{
  position:relative;overflow:visible;border:1px solid var(--line);border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.062),rgba(255,255,255,.018));
  padding:16px 16px 18px;box-shadow:0 30px 60px -50px #000;
}
#card::before{content:"";position:absolute;left:22px;right:22px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--cy),var(--vi),transparent);opacity:.75;}
#card.shake{animation:shk .34s;}
@keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.qmeta .tag{font-family:var(--mono);font-size:.6rem;letter-spacing:.14em;color:var(--cy);
  border:1px solid rgba(56,232,255,.34);border-radius:999px;padding:3px 9px;}
.qmeta .tag.vi{color:var(--vi);border-color:rgba(167,139,250,.38);}
.qmeta .tag.pl{color:var(--muted);border-color:var(--line);}
.qmeta .grow{flex:1;}
.qlead{font-size:.94rem;line-height:1.72;color:var(--ink);}
.qsub{margin-top:9px;font-size:.82rem;color:var(--ink2);line-height:1.8;}
.qdisp{margin:14px 0 4px;padding:14px 8px;text-align:center;font-size:1.22rem;color:#fff;
  border-radius:14px;background:rgba(0,0,0,.28);border:1px solid var(--line);overflow-x:auto;}
.qdisp .katex{color:#fff;}
.qdisp .katex-display{margin:.24em 0;}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px;}
@media (max-width:560px){.choices{grid-template-columns:1fr;}}
.choiceBtn{
  display:flex;align-items:center;gap:10px;text-align:left;
  border:1px solid var(--line);border-radius:13px;background:rgba(255,255,255,.035);
  color:var(--ink);font-family:inherit;font-size:.96rem;padding:12px;cursor:pointer;
  min-height:56px;transition:border-color .15s,background .15s,transform .08s;
}
.choiceBtn:hover:not([disabled]){border-color:var(--line2);background:rgba(255,255,255,.06);}
.choiceBtn:active:not([disabled]){transform:scale(.985);}
.choiceBtn .cno{flex:0 0 26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-family:var(--mono);font-size:.76rem;color:var(--cy);
  border:1px solid rgba(56,232,255,.32);background:rgba(56,232,255,.08);}
.choiceBtn.sel{border-color:var(--cy);background:rgba(56,232,255,.12);box-shadow:0 0 0 1px rgba(56,232,255,.3);}
.choiceBtn .katex{color:inherit;}
/* 場合分けの答え（発展の「軸が動く」など）は1行が長いので、選択肢は1列にして折り返す */
.choices.wide{grid-template-columns:1fr;}
.choices.wide .choiceBtn{font-size:.88rem;line-height:1.7;}
.numwrap{margin-top:14px;}
.numdisp{height:58px;border-radius:13px;border:1px solid var(--line);background:rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:flex-end;padding:0 16px;
  font-family:var(--mono);font-size:1.62rem;color:#fff;letter-spacing:.04em;}
.numdisp.empty{color:var(--muted);font-size:1rem;letter-spacing:.14em;}
.numunit{font-size:.8rem;color:var(--muted);margin-left:8px;font-family:var(--jp);}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px;max-width:330px;}
.key{height:52px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.05);
  color:#fff;font-family:var(--mono);font-size:1.2rem;cursor:pointer;transition:background .12s,border-color .12s,transform .06s;}
.key:hover{background:rgba(255,255,255,.09);border-color:var(--line2);}
.key:active{transform:scale(.95);background:rgba(56,232,255,.2);}
.key.fn{font-size:.92rem;color:var(--ink2);}
.verdict{margin-top:13px;font-size:.9rem;font-weight:700;min-height:1.3em;}
.verdict.ok{color:var(--ok);}
.verdict.ng{color:var(--ng);}
#explain{display:none;margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;}
.exHead{font-family:var(--mono);font-size:.6rem;letter-spacing:.22em;color:var(--vi);margin-bottom:8px;}
.exLine{font-size:.86rem;line-height:1.95;color:var(--ink2);padding:1px 0;}
.exLine .katex{color:#fff;}
.exFml{margin:8px 0;padding:9px 11px;border-left:2px solid var(--vi);
  background:rgba(167,139,250,.08);border-radius:0 10px 10px 0;font-size:.9rem;color:var(--ink);}
.exFml .katex{color:#fff;}
.figLink{display:inline-flex;align-items:center;gap:6px;margin-top:10px;
  border:1px solid rgba(167,139,250,.4);border-radius:999px;background:rgba(167,139,250,.1);
  color:#D8CCFF;font-family:inherit;font-size:.74rem;padding:6px 13px;cursor:pointer;}
.figLink:hover{background:rgba(167,139,250,.2);}
.actions{max-width:920px;margin:14px auto 0;display:flex;gap:9px;}
.btn{flex:1;border:0;border-radius:14px;font-family:inherit;font-size:1rem;font-weight:700;
  padding:15px 12px;cursor:pointer;color:#04121A;
  background:linear-gradient(135deg,var(--cy),#7FF0FF);box-shadow:0 16px 34px -22px rgba(56,232,255,.95);}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid var(--line);box-shadow:none;}
.btn[disabled]{opacity:.4;cursor:default;box-shadow:none;}
#toast{max-width:920px;margin:10px auto 0;text-align:center;font-size:.8rem;color:var(--cy);
  min-height:1.2em;font-family:var(--mono);letter-spacing:.06em;}
.banner{max-width:920px;margin:0 auto 12px;border:1px solid rgba(255,209,102,.4);
  background:rgba(255,209,102,.08);border-radius:12px;padding:10px 13px;font-size:.79rem;color:#FFE9AE;line-height:1.6;}

/* ================================================================
   図モード
   「平行移動で頂点がどう動くか」「定義域と軸の位置で最大・最小がどこに来るか」
   「絶対値のグラフの折れ目」の3つを、値を動かしながら見る。
   ⚠ 図は JS が SVG を組み立てて innerHTML で入れる。色・線は**属性**で書いてあるが、
     図モードの図は紙にも記録にも出ない（question_figure には使わない）ので
     解き直しプリントの制約とは無関係。演習側の問題は全部テキストで解ける。
   ================================================================ */
#view-fig{display:none;}
.glead{max-width:920px;margin:0 auto 12px;font-size:.84rem;color:var(--ink2);line-height:1.8;}
.glead b{color:var(--cy);}
.ctrlbox{border:1px solid var(--line);border-radius:16px;background:var(--panel);
  padding:11px 12px;margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.stepper{display:flex;align-items:center;gap:6px;}
.stepper > span.lb{font-size:.8rem;color:var(--ink2);min-width:2.4em;}
.stepper .sbtn{width:30px;height:30px;border:1px solid var(--line);border-radius:9px;
  background:rgba(255,255,255,.05);color:#fff;font-family:var(--mono);font-size:1rem;cursor:pointer;}
.stepper .sbtn:hover{background:rgba(56,232,255,.16);border-color:var(--line2);}
.stepper .sval{min-width:46px;text-align:center;font-family:var(--mono);font-size:1.02rem;color:var(--cy);
  border:1px solid var(--line);border-radius:9px;padding:4px 6px;background:rgba(0,0,0,.28);}
.gwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:10px;align-items:start;}
@media (max-width:760px){.gwrap{grid-template-columns:1fr;}}
.gcard{border:1px solid var(--line);border-radius:16px;background:rgba(0,0,0,.3);padding:10px;overflow:hidden;}
.gcard h3{font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;color:var(--vi);margin-bottom:6px;text-transform:uppercase;}
/* 図は正方形の viewBox なので、幅いっぱいにすると縦にも同じだけ伸びる。
   画面の高さを食いすぎないよう上限をつけて中央に置く */
.gcard svg{width:100%;height:auto;display:block;max-width:460px;margin:0 auto;}
.greadout{font-size:.86rem;line-height:2.05;color:var(--ink2);}
.greadout .katex{color:#fff;}
.greadout b{color:#fff;}
.gjudge{margin-top:8px;border-radius:12px;padding:10px 12px;font-size:.92rem;font-weight:700;
  border:1px solid rgba(56,232,255,.34);background:rgba(56,232,255,.1);color:#CFF6FF;line-height:1.6;}
footer{max-width:920px;margin:22px auto 0;text-align:center;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.18em;color:var(--muted);}
@media (max-width:560px){
  h1{font-size:1.16rem;}
  .qdisp{font-size:1.04rem;}
  .stat{min-width:64px;padding:6px 8px;}
}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
}
/* 紙に共通ヘッダーは出さない（モジュール側でも消しているが、HTMLだけ先に上げても
   紙に出ないようツール側にも同じ1行を持たせる） */
@media print{
  .divp-header{display:none!important;}
}
</style>
</head>

<!-- 共通モジュール（file:// では divp-core が自動で黙る）

<script>
"use strict";
/* ================================================================
   math_hs_nijikansu.html  2次関数マスター
   unit_key = math_hs_nijikansu
   出題範囲 = 数学I「2次関数」章まるごと（チャート式の例題63〜85にあたる範囲）
   modes(=question_key):
     関数とグラフ     … kansuu(関数の値・値域・係数決定)
     2次関数のグラフ  … heihei(平方完成と頂点) / heikou(平行移動) / taisho(対称移動)
     最大・最小       … saidai(最大値・最小値) / ugoku(定義域や軸が動く) /
                        keisu(最大値から係数決定) / bunsho(文章題)
     2次関数の決定    … kettei(頂点・3点・最大最小の条件)
     発展             … zettai(絶対値を含む1次関数のグラフ) / joken(条件式がある場合)
     ＋ mix（えらんだタイプからランダム。記録はその問題のタイプで残すので "mix" は飛ばない）
   レベル(1基本/2標準/3発展)は question_key を増やさず question_params の lv に持つ
     ＝カルテはタイプ単位で読める。params_hash には lv も種も入るので
     「同じ問題」の判定はレベルごとに成立する。
   ⚠ レベルの数はタイプごとに違う（発展を持たないタイプは2つまで）。
     MODES[].lv の長さがそのタイプのレベル数で、画面のボタンはそれに合わせて出し分ける。
   共通処理:
     ・学習記録 … Divp.answer（判定直後に1行）
     ・正解エフェクト … divp-correct-jh（js/jh共通のはんこ）
     ・解き直し … ?retry=1 で question_params の種から同じ問題を作り直す（CLAUDE.md 2d）
     ・図 … 問題は全部テキストだけで解ける（式も座標も本文に出る）ので
            question_figure は使わない。選択式は question_choices を渡して
            解き直しプリントに選択肢ごと出す。
   ⚠ 記録に載せる文字列の書き分け（CLAUDE.md 2a）:
     ・question_text（問題文）は和文が混ざるので **^ _ { } \ を1文字も入れない**
       （1文字でもあると講師画面が文字列ぜんぶを TeX として描き、和文が斜体で崩れる）。
       2乗は「²」、ルートは「√」の文字で書く。
     ・correct_answer と question_choices は、和文を含まない純粋な式のときだけ
       **TeX のまま**渡す（講師画面が丸ごと KaTeX で描く＝きれいに出る）。
       「x=2 で最小値 -3」のように和文を含む答えは TeX を使わず素の文字で書く
       （ans.plain=true のタイプ。画面側も KaTeX に通さない）。
     ・不等号は **生の「<」を1文字も書かない**（CLAUDE.md 2f。api/save_answer.php が
       question_choices を丸ごと捨てる）。TeX では \lt / \gt、素の文字では
       全角の「＜」「＞」と「≦」を使う。
   ================================================================ */

/* ---------- 小道具 ---------- */
const N_CHOICES=6;
const UNIT_KEY="math_hs_nijikansu";
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
/* 本文中に数式を混ぜる用（KaTeXはあとで renderTexIn がまとめて描く） */
function T(tex){return '<span class="tex" data-tex="'+esc(tex)+'"></span>';}
function TD(tex){return '<span class="tex" data-d="1" data-tex="'+esc(tex)+'"></span>';}
function renderTexIn(root){
  if(!root)return;
  root.querySelectorAll(".tex").forEach(el=>{
    const s=el.dataset.tex;
    if(s==null)return;
    if(window.katex){
      try{katex.render(s,el,{throwOnError:false,displayMode:el.dataset.d==="1"});}
      catch(e){el.textContent=s;}
    }else{
      /* KaTeX が来る前でも読めるように、記号だけ落とした素の文字を出しておく */
      el.textContent=s.replace(/\\[a-zA-Z]+/g," ").replace(/[{}]/g,"");
    }
  });
}
function stripTags(html){
  const d=document.createElement("div");d.innerHTML=String(html==null?"":html);
  d.querySelectorAll(".tex").forEach(el=>{el.textContent=" ";});
  return (d.textContent||"").replace(/\s+/g," ").trim();
}

/* ---------- 数の見せ方 ---------- */
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){const t=a%b;a=b;b=t;}return a||1;}
/* 符号つきの数。0 のときは空文字（「+0」を出さない） */
function sg(v){return (v===0)?"":((v<0)?("-"+Math.abs(v)):("+"+v));}
function fracTex(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);n/=g;d/=g;
  if(d===1)return String(n);
  return (n<0?"-":"")+"\\dfrac{"+Math.abs(n)+"}{"+d+"}";
}
/* 記録用・和文まじりの答え用（TeX を使わない分数表記） */
function fracPlain(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);n/=g;d/=g;
  if(d===1)return String(n);
  return n+"/"+d;
}
function ptTex(x,y){return "("+x+",\\ "+y+")";}
function ptPlain(x,y){return "("+x+", "+y+")";}
/* (n/d)x の項を符号つきで返す（平方完成の途中式用。約分して 1x は x と書く） */
function fracTermTex(n,d,v){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);let nn=n/g;const dd=d/g;
  const s=(nn<0)?"-":"+";nn=Math.abs(nn);
  if(dd===1)return s+((nn===1)?v:(nn+v));
  return s+"\\dfrac{"+nn+"}{"+dd+"}"+v;
}
/* 符号つきの分数（必ず先頭に +/- が付く。平方完成の途中式で「x+b/2a」を書く用。
   ⚠ fracTermTex(n,d,"") は約分して ±1 になると文字が消えるので、定数にはこちらを使う */
function fracSgTex(n,d){
  if(d<0){n=-n;d=-d;}
  const g=gcd(n,d);const nn=n/g,dd=d/g;
  return (nn<0?"-":"+")+((dd===1)?String(Math.abs(nn)):("\\dfrac{"+Math.abs(nn)+"}{"+dd+"}"));
}
/* 分数座標の点。n1/d1, n2/d2 */
function ptFracTex(n1,d1,n2,d2){
  return "\\left("+fracTex(n1,d1)+",\\ "+fracTex(n2,d2)+"\\right)";
}
function ptFracPlain(n1,d1,n2,d2){
  return "("+fracPlain(n1,d1)+", "+fracPlain(n2,d2)+")";
}
/* 項を並べて多項式にする。terms=[[係数,"x^2"],[係数,"x"],[係数,""]]
   ⚠ 先頭が負のときだけ "-"、2項目以降は必ず符号を付ける（"+"の付け忘れ防止） */
function poly(terms){
  let s="";
  terms.forEach(function(t){
    const c=t[0],v=t[1];
    if(c===0)return;
    const a=Math.abs(c);
    const body=(v==="")?String(a):((a===1)?v:(String(a)+v));
    s+=(s===""?(c<0?"-":""):(c<0?"-":"+"))+body;
  });
  return s||"0";
}
/* ax²+bx+c。sup は画面/TeX なら "^2"、記録用の平文なら "²" */
function quad(a,b,c,v,sup){return poly([[a,v+sup],[b,v],[c,""]]);}
/* y=a(x-p)²+q の右辺。sup は "^2" か "²" */
function vert(a,p,q,sup){
  const core=(p===0)?("x"+sup):("(x"+sg(-p)+")"+sup);
  const head=(a===1)?core:((a===-1)?("-"+core):(String(a)+core));
  return head+((q===0)?"":sg(q));
}
/* 1次式 ax+b */
function lin(a,b,v){return poly([[a,v],[b,""]]);}
/* 「a²-4a+3」のように、文字 a についての2次式を素の文字で書く（場合分けの答え用） */
function quadA(p,q,r){return poly([[p,"a²"],[q,"a"],[r,""]]);}
/* 素の文字で作った式を TeX に持ち込むときの変換。
   ⚠ KaTeX は「²」のような素の上つき文字を知らないので、そのまま渡すと赤字で出る。 */
function texA(s){return String(s).replace(/²/g,"^2");}
/* 不等号。plain=true なら全角（生の「<」は question_choices が捨てられるので使わない） */
function ltP(l,r){return l+"＜"+r;}
function leP(l,r){return l+"≦"+r;}

/* ---------- 種(seed)から作る乱数 ----------
   出題のたびに種を1つ引いて question_params に {m:タイプ, lv:レベル, s:種} で保存する。
   解き直し(?retry=1)は同じ種で生成関数を回すだけで**まったく同じ問題**が出る（CLAUDE.md 2d）。
   ⚠ 生成関数の中身を変えると、既存 pending の種から出る問題が変わる
     （params_hash は同じなので解き直し自体は成立するが、問題文は別物になる）。
   ⚠ 乱数はこの ri() 1か所に集める。Math.random を生成関数の中で直接呼ぶと種で再現できない。 */
let _rng=1;
function rngSeed(s){_rng=(s>>>0)||1;}
function rngPick(){return (Math.floor(Math.random()*4294967296)>>>0)||1;}  /* 種そのものだけは真の乱数 */
function rngNext(){let x=_rng;x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;_rng=x;return x/4294967296;}
function ri(min,max){return Math.floor(rngNext()*(max-min+1))+min;}
function pick(a){return a[ri(0,a.length-1)];}
function sgn1(){return ri(0,1)?1:-1;}
function nzi(min,max){let v=0;while(v===0)v=ri(min,max);return v;}
/* ⚠ 並べ替えは sort に乱数比較を渡さない（ブラウザの sort 実装しだいで
   同じ種でも別の並びになる＝解き直しで同じ問題が出なくなる）。フィッシャー・イェーツで書く */
function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=ri(0,i);const t=b[i];b[i]=b[j];b[j]=t;}return b;}

/* 選択肢を作る。誤答候補から重複を除いて（N-1）個ぶん使う。
   ⚠ 誤答候補に「値としては正解と同じもの」を混ぜないこと。
     式は poly / vert で表記が一意になるので、同じ値なら同じ文字列になり
     この seen で弾ける（＝正解が2つある選択肢にはならない）。
   plain=true … KaTeX に通さない素の文字（和文を含む選択肢）
   wide=true … 場合分けの答えのように1行が長いもの。4択にして1列で出す */
function mkChoice(cor,wrongs,plain,wide){
  const max=wide?4:N_CHOICES;
  const seen={};seen[cor]=1;
  const w=[];
  (wrongs||[]).forEach(x=>{
    if(x==null||x==="")return;
    if(seen[x])return;
    seen[x]=1;w.push(x);
  });
  const all=shuffle([cor].concat(w.slice(0,max-1)));
  return {kind:"choice",choices:all,correct:all.indexOf(cor),plain:!!plain,wide:!!wide};
}
function mkNum(val,unit){return {kind:"num",val:val,unit:unit||""};}
</script>
<script>
"use strict";
/* ---------- タイプ台帳 ----------
   k = question_key（そのまま question_catalog に登録する）
   lv = レベルごとの中身（画面の説明にも出す）。**配列の長さ＝そのタイプのレベル数**
   ex = もとになった例題番号（生徒がチャート式と行き来できるように出す） */
const MODES=[
  {k:"kansuu", n:"① 関数の値と値域", s:"f(a)・値域", grp:"関数とグラフ", ex:"例題63〜65",
   lv:["関数の式と関数の値","1次関数の値域・最大最小","値域の条件から係数決定"]},
  {k:"heihei", n:"② 平方完成と頂点", s:"y=a(x-p)²+q", grp:"2次関数のグラフ", ex:"例題66〜68",
   lv:["頂点形から頂点と軸を読む","一般形を平方完成する","分数が出る平方完成"]},
  {k:"heikou", n:"③ 平行移動", s:"頂点がどう動くか", grp:"2次関数のグラフ", ex:"例題69・70・79",
   lv:["移動した放物線の式","どう動かせば重なるか","移動する前の係数を求める"]},
  {k:"taisho", n:"④ 対称移動", s:"x軸・y軸・原点", grp:"2次関数のグラフ", ex:"例題80",
   lv:["頂点形で対称移動","一般形で対称移動"]},
  {k:"saidai", n:"⑤ 最大値・最小値", s:"頂点と端をくらべる", grp:"最大・最小", ex:"例題71・72",
   lv:["定義域なし（頂点そのもの）","定義域あり（軸が内側）","定義域あり（軸が外側）"]},
  {k:"ugoku", n:"⑥ 動く最大・最小", s:"場合分け", grp:"最大・最小", ex:"例題82〜84",
   lv:["定義域の一端が動く","軸が動く","定義域の両端が動く"]},
  {k:"kettei", n:"⑦ 2次関数の決定", s:"条件から式をつくる", grp:"2次関数の決定", ex:"例題75〜77",
   lv:["頂点と通る1点","通る3点","軸・最大最小の条件"]},
  {k:"keisu", n:"⑧ 最大値から係数決定", s:"a の値を求める", grp:"最大・最小", ex:"例題73",
   lv:["定義域なし","定義域あり"]},
  {k:"bunsho", n:"⑨ 最大・最小の文章題", s:"面積・売上・高さ", grp:"最大・最小", ex:"例題74・81",
   lv:["和と積・面積・高さ","定義域がつく文章題"]},
  {k:"zettai", n:"⑩ 絶対値のグラフ", s:"y=|x-p|+q", grp:"発展", ex:"例題78",
   lv:["折れ目と最小値","絶対値2つの和"]},
  {k:"joken", n:"⑪ 条件式つきの最大・最小", s:"1文字を消す", grp:"発展", ex:"例題85",
   lv:["条件式を代入する","変域がつく場合"]}
];
const MODEMAP={};MODES.forEach(m=>{MODEMAP[m.k]=m;});
const MAXLV=3;
/* そのタイプが持つレベル数（発展を持たないタイプは2） */
function lvCount(k){const m=MODEMAP[k];return (m&&m.lv)?m.lv.length:1;}
/* ミックスの初期セット＝教科書の基本にあたる4タイプ */
const BASIC4=["kansuu","heihei","saidai","kettei"];

const GENS={};
</script>
<script>
"use strict";
/* ================================================================
   ① 関数の値と値域（例題63・64・65）
   lv1: f(k) の値 ／ lv2: 1次関数の値域 ／ lv3: 値域の条件から係数決定
   ================================================================ */
GENS.kansuu=function(lv){
  if(lv===1){
    const k=nzi(-4,4);
    if(ri(0,3)>0){                       /* 4回に3回は2次関数 */
      const a=nzi(-3,3), b=ri(-6,6), c=ri(-9,9);
      const t1=a*k*k, t2=b*k, val=t1+t2+c;
      return {
        lead:"関数 "+T("f(x)="+quad(a,b,c,"x","^2"))+" について、"+T("f("+k+")")+" の値を求めよ。",
        ans:mkNum(val),
        plainQ:"関数 f(x)="+quad(a,b,c,"x","²")+" について、f("+k+") の値を求めよ。",
        ex:[
          T("f("+k+")")+" は、"+T("x")+" のところに "+T(String(k))+" を代入した値。",
          (k<0)?("⚠ 負の数を代入するときは<b>かっこを付けて</b>から2乗する: "+T("("+k+")^2="+(k*k)))
               :(""+T("x^2")+" の部分は "+T(k+"^2="+(k*k))+" になる。"),
          '<div class="exFml">'+T("f("+k+")="+poly([[t1,""],[t2,""],[c,""]])+"="+val)+"</div>"
        ]
      };
    }
    const a=nzi(-5,5), b=ri(-9,9);
    const val=a*k+b;
    return {
      lead:"関数 "+T("f(x)="+lin(a,b,"x"))+" について、"+T("f("+k+")")+" の値を求めよ。",
      ans:mkNum(val),
      plainQ:"関数 f(x)="+lin(a,b,"x")+" について、f("+k+") の値を求めよ。",
      ex:[
        T("x")+" のところに "+T(String(k))+" を代入する。",
        '<div class="exFml">'+T("f("+k+")="+poly([[a*k,""],[b,""]])+"="+val)+"</div>"
      ]
    };
  }

  if(lv===2){
    const a=nzi(-4,4), b=ri(-8,8);
    const p=ri(-4,2), q=p+ri(1,5);
    const y1=a*p+b, y2=a*q+b;
    const lo=Math.min(y1,y2), hi=Math.max(y1,y2);
    const rng=function(l,h){return l+" \\leqq y \\leqq "+h;};
    const w1=Math.min(a*p,a*q), w2=Math.max(a*p,a*q);           /* b の足し忘れ */
    const v1=-a*p+b, v2=-a*q+b;                                  /* 傾きの符号ミス */
    const u=a*(q+1)+b;                                           /* 右端の読みちがい */
    return {
      lead:"1次関数 "+T("y="+lin(a,b,"x"))+"　"+T("("+p+" \\leqq x \\leqq "+q+")")+" の値域を求めよ。",
      ans:mkChoice(rng(lo,hi),[
        rng(p,q), rng(hi,lo), rng(w1,w2), rng(Math.min(v1,v2),Math.max(v1,v2)),
        rng(Math.min(lo,u),Math.max(lo,u)), rng(lo-1,hi+1)
      ]),
      plainQ:"1次関数 y="+lin(a,b,"x")+" ("+p+"≦x≦"+q+") の値域を求めよ。",
      plainA:lo+"≦y≦"+hi,
      ex:[
        "1次関数は<b>右上がりか右下がりのまっすぐな線</b>なので、"
        +"値域の両端は<b>定義域の両端の値</b>でしか起こらない。",
        T("x="+p)+" のとき "+T("y="+y1)+"、"+T("x="+q)+" のとき "+T("y="+y2),
        (a>0)?("傾き "+T(String(a))+" は正 → 右上がり。"+T("x")+" が大きいほど "+T("y")+" も大きい。")
             :("傾き "+T(String(a))+" は負 → 右下がり。"+T("x")+" が大きいほど "+T("y")+" は小さい。"),
        '<div class="exFml">'+T(rng(lo,hi))+"</div>"
      ]
    };
  }

  /* lv3 … 値域などの条件から1次関数の係数決定（例題65） */
  const a=nzi(1,4)*sgn1();
  const b=nzi(-6,6);
  const p=ri(-3,2), q=p+ri(2,5);
  const y1=a*p+b, y2=a*q+b;
  const lo=Math.min(y1,y2), hi=Math.max(y1,y2);
  const cor="a="+a+",\\ b="+b;
  const cond=(a>0)?"正の数":"負の数";
  return {
    lead:"1次関数 "+T("y=ax+b")+"　"+T("("+p+" \\leqq x \\leqq "+q+")")+" の値域が "
        +T(lo+" \\leqq y \\leqq "+hi)+" であるとき、定数 "+T("a,\\ b")+" の値を求めよ。"
        +"ただし "+T("a")+" は"+cond+"とする。",
    ans:mkChoice(cor,[
      "a="+(-a)+",\\ b="+b,
      "a="+a+",\\ b="+(-b),
      "a="+(-a)+",\\ b="+(-b),
      "a="+b+",\\ b="+a,
      "a="+a+",\\ b="+(b+1),
      "a="+(a+sgn1())+",\\ b="+b
    ]),
    plainQ:"1次関数 y=ax+b ("+p+"≦x≦"+q+") の値域が "+lo+"≦y≦"+hi+" であるとき、"
      +"定数 a, b の値を求めよ。ただし a は"+cond+"とする。",
    plainA:"a="+a+", b="+b,
    ex:[
      (a>0)?("傾きが正なら右上がりなので、"+T("x="+p)+" のとき最小 "+T("y="+lo)+"、"
             +T("x="+q)+" のとき最大 "+T("y="+hi)+"。")
           :("傾きが負なら右下がりなので、"+T("x="+p)+" のとき最大 "+T("y="+hi)+"、"
             +T("x="+q)+" のとき最小 "+T("y="+lo)+"。"),
      "この2組を "+T("y=ax+b")+" に代入すると、"+T("a,\\ b")+" についての連立方程式になる。",
      '<div class="exFml">'+T("a\\times("+p+")+b="+y1)+"　/　"+T("a\\times("+q+")+b="+y2)+"</div>",
      "辺々ひくと "+T((q-p)+"a="+(y2-y1))+" → "+T("a="+a)+"、代入して "+T("b="+b),
      '<div class="exFml">'+T(cor)+"</div>"
    ]
  };
};

/* ================================================================
   ② 平方完成と頂点（例題66・67・68）
   lv1: 頂点形から頂点・軸 ／ lv2: 一般形を平方完成 ／ lv3: 分数が出る平方完成
   ================================================================ */
GENS.heihei=function(lv){
  if(lv===1){
    const a=pick([-3,-2,-1,1,2,3]);
    const p=nzi(-5,5), q=nzi(-6,6);
    const cor="頂点 ("+p+", "+q+")、軸 x="+p;
    return {
      lead:"次の2次関数のグラフの頂点の座標と軸を求めよ。",
      disp:"y="+vert(a,p,q,"^2"),
      ans:mkChoice(cor,[
        "頂点 ("+(-p)+", "+q+")、軸 x="+(-p),
        "頂点 ("+p+", "+(-q)+")、軸 x="+p,
        "頂点 ("+(-p)+", "+(-q)+")、軸 x="+(-p),
        "頂点 ("+q+", "+p+")、軸 x="+q,
        "頂点 ("+p+", "+q+")、軸 y="+q,
        "頂点 ("+(-p)+", "+q+")、軸 x="+p
      ],true),
      plainQ:"2次関数 y="+vert(a,p,q,"²")+" のグラフの頂点の座標と軸を求めよ。",
      plainA:cor,
      ex:[
        T("y=a(x-p)^2+q")+" のグラフは、頂点 "+T("(p,\\ q)")+"、軸は直線 "+T("x=p")+"。",
        "⚠ 頂点の "+T("x")+" 座標は<b>かっこの中の符号と逆</b>: "
          +T((p===0?"x^2":"(x"+sg(-p)+")^2"))+" → "+T("x="+p),
        T("a="+a)+" は "+((a>0)?"正なので<b>下に凸</b>（最小値をとる形）。":"負なので<b>上に凸</b>（最大値をとる形）。"),
        '<div class="exFml">頂点 '+T(ptTex(p,q))+"、軸は直線 "+T("x="+p)+"</div>"
      ],
      fig:{t:"idou",a:a,p:p,q:q}
    };
  }

  if(lv===2){
    const a=sgn1();                       /* ±1 */
    const p=nzi(-5,5), q=ri(-8,8);
    const b=-2*a*p, c=a*p*p+q;
    return {
      lead:"次の2次関数を "+T("y=a(x-p)^2+q")+" の形に変形し、頂点の座標を求めよ。",
      disp:"y="+quad(a,b,c,"x","^2"),
      ans:mkChoice(ptTex(p,q),[
        ptTex(-p,q), ptTex(p,-q), ptTex(-p,-q), ptTex(q,p), ptTex(p,c), ptTex(b,c)
      ]),
      plainQ:"2次関数 y="+quad(a,b,c,"x","²")+" のグラフの頂点の座標を求めよ。",
      ex:(a===1?[
        "① "+T("x")+" の係数 "+T(String(b))+" の<b>半分</b> "+T(String(b/2))+" の2乗 "+T(String(p*p))
          +" を<b>たしてひく</b>（同じ数をひくので式の値は変わらない）。",
        '<div class="exFml">'+T("y=\\left(x^2"+sg(b)+"x"+sg(p*p)+"\\right)"+sg(-p*p)+sg(c))+"</div>",
        "② かっこの中が "+T("(x"+sg(-p)+")^2")+" にまとまる。残りの定数をまとめる。",
        '<div class="exFml">'+T("y="+vert(a,p,q,"^2"))+"</div>"
      ]:[
        "① "+T("x^2")+" の係数 "+T("-1")+" で<b>2次の項と1次の項だけ</b>をくくる。",
        '<div class="exFml">'+T("y=-\\left(x^2"+sg(-b)+"x\\right)"+sg(c))+"</div>",
        "② かっこの中は "+T("x")+" の係数 "+T(String(-b))+" の<b>半分</b> "+T(String(-b/2))
          +" の2乗 "+T(String(p*p))+" をたしてひく。",
        '<div class="exFml">'+T("y=-\\left\\{(x"+sg(-p)+")^2"+sg(-p*p)+"\\right\\}"+sg(c))+"</div>",
        "③ かっこをはずす（"+T("-1")+" をかけるので中の符号が変わる）。",
        '<div class="exFml">'+T("y="+vert(a,p,q,"^2"))+"</div>"
      ]).concat([
        "よって頂点は "+T(ptTex(p,q))+"、軸は直線 "+T("x="+p)+"。",
        "検算: "+T("x="+p)+" を代入すると "+T("y="+q)+" になる。"
      ]),
      fig:{t:"idou",a:a,p:p,q:q}
    };
  }

  /* lv3 … 係数が1でなく、頂点が分数になる平方完成（例題68） */
  const a=pick([-3,-2,2,3]);
  let b=nzi(-9,9); if(b%2===0)b+=(b>0?1:-1);      /* b は奇数 → 頂点が分数になる */
  const c=ri(-6,6);
  const cor=ptFracTex(-b,2*a,4*a*c-b*b,4*a);
  const sqTex="\\left(x"+fracSgTex(b,2*a)+"\\right)^2";   /* (x + b/2a)² */
  return {
    lead:"次の2次関数のグラフの頂点の座標を求めよ。",
    disp:"y="+quad(a,b,c,"x","^2"),
    ans:mkChoice(cor,[
      ptFracTex(b,2*a,4*a*c-b*b,4*a),
      ptFracTex(-b,2*a,b*b-4*a*c,4*a),
      ptFracTex(b,2*a,b*b-4*a*c,4*a),
      ptFracTex(-b,2*a,4*a*c-b*b,2*a),
      ptFracTex(-b,2*a,4*a*c+b*b,4*a),
      ptFracTex(-b,a,4*a*c-b*b,4*a)
    ]),
    plainQ:"2次関数 y="+quad(a,b,c,"x","²")+" のグラフの頂点の座標を求めよ。",
    plainA:ptFracPlain(-b,2*a,4*a*c-b*b,4*a),
    ex:[
      "① "+T("x^2")+" の係数 "+T(String(a))+" で<b>2次の項と1次の項だけ</b>をくくる。",
      '<div class="exFml">'+T("y="+a+"\\left(x^2"+fracTermTex(b,a,"x")+"\\right)"+sg(c))+"</div>",
      "② かっこの中は "+T("x")+" の係数 "+T(fracTex(b,a))+" の<b>半分</b> "+T(fracTex(b,2*a))
        +" の2乗 "+T(fracTex(b*b,4*a*a))+" をたしてひく。",
      '<div class="exFml">'+T("y="+a+"\\left\\{"+sqTex+fracSgTex(-b*b,4*a*a)+"\\right\\}"+sg(c))+"</div>",
      "③ かっこをはずす（中身に "+T(String(a))+" をかける）。",
      '<div class="exFml">'+T("y="+a+sqTex+fracSgTex(-b*b,4*a)+sg(c))+"</div>",
      (c===0)?("④ 定数項は "+T(fracTex(-b*b,4*a))+" だけ。")
             :("④ 定数項をまとめる。"+T(fracTex(-b*b,4*a)+sg(c)+"="+fracTex(4*a*c-b*b,4*a))),
      '<div class="exFml">'+T("y="+a+sqTex+fracSgTex(4*a*c-b*b,4*a))+"</div>",
      "かっこの中の符号と<b>逆</b>にして、頂点の "+T("x")+" 座標は "+T(fracTex(-b,2*a))
        +"、軸は直線 "+T("x="+fracTex(-b,2*a))+"。",
      '<div class="exFml">頂点 '+T(cor)+"</div>"
    ]
  };
};

/* ================================================================
   ③ 平行移動（例題69・70・79）
   lv1: 移動後の式 ／ lv2: どう動かせば重なるか ／ lv3: 移動前の係数を求める
   ================================================================ */
GENS.heikou=function(lv){
  if(lv===1){
    const a=pick([-3,-2,-1,1,2,3]);
    const p=ri(-4,4), q=ri(-5,5);
    const s=nzi(-4,4), t=nzi(-5,5);
    const cor="y="+vert(a,p+s,q+t,"^2");
    return {
      lead:"放物線 "+T("y="+vert(a,p,q,"^2"))+" を、"+T("x")+" 軸方向に "+T(String(s))
          +"、"+T("y")+" 軸方向に "+T(String(t))+" だけ平行移動して得られる放物線の方程式を求めよ。",
      ans:mkChoice(cor,[
        "y="+vert(a,p-s,q+t,"^2"),
        "y="+vert(a,p+s,q-t,"^2"),
        "y="+vert(a,p-s,q-t,"^2"),
        "y="+vert(-a,p+s,q+t,"^2"),
        "y="+vert(a,p,q,"^2"),
        "y="+vert(a,q+t,p+s,"^2")
      ]),
      plainQ:"放物線 y="+vert(a,p,q,"²")+" を x軸方向に "+s+"、y軸方向に "+t
        +" だけ平行移動して得られる放物線の方程式を求めよ。",
      ex:[
        "平行移動しても<b>形（"+T("x^2")+" の係数）は変わらない</b>。動くのは頂点だけ。",
        "もとの頂点 "+T(ptTex(p,q))+" を "+T("("+s+",\\ "+t+")")+" だけ動かすと "+T(ptTex(p+s,q+t))+"。",
        '<div class="exFml">'+T(cor)+"</div>",
        "⚠ 式では "+T("x")+" 軸方向の移動が<b>逆の符号</b>で入る（"+T("x")+" を "+T("x-"+(s>=0?s:"("+s+")"))+" に置きかえる）。"
      ],
      fig:{t:"idou",a:a,p:p+s,q:q+t}
    };
  }

  if(lv===2){
    const a=pick([-2,-1,1,2]);
    const p1=ri(-4,3), q1=ri(-5,5);
    let p2=ri(-4,4), q2=ri(-6,6);
    if(p2===p1)p2=p1+nzi(1,3);
    if(q2===q1)q2=q1+nzi(1,3);
    const b1=-2*a*p1, c1=a*p1*p1+q1;
    const b2=-2*a*p2, c2=a*p2*p2+q2;
    const dx=p2-p1, dy=q2-q1;
    const cor="x軸方向に "+dx+"、y軸方向に "+dy;
    return {
      lead:"放物線 "+T("y="+quad(a,b1,c1,"x","^2"))+" を平行移動して、放物線 "
          +T("y="+quad(a,b2,c2,"x","^2"))+" に重ねたい。どのように平行移動すればよいか。",
      ans:mkChoice(cor,[
        "x軸方向に "+(-dx)+"、y軸方向に "+dy,
        "x軸方向に "+dx+"、y軸方向に "+(-dy),
        "x軸方向に "+(-dx)+"、y軸方向に "+(-dy),
        "x軸方向に "+dy+"、y軸方向に "+dx,
        "x軸方向に "+(p1-p2)+"、y軸方向に "+(q2-q1+1)
      ],true),
      plainQ:"放物線 y="+quad(a,b1,c1,"x","²")+" を平行移動して放物線 y="+quad(a,b2,c2,"x","²")
        +" に重ねるには、どのように平行移動すればよいか。",
      plainA:cor,
      ex:[
        "平行移動の量は<b>頂点どうしを見くらべる</b>だけで分かる。両方とも平方完成する。",
        '<div class="exFml">'+T("y="+vert(a,p1,q1,"^2"))+"　頂点 "+T(ptTex(p1,q1))+"</div>",
        '<div class="exFml">'+T("y="+vert(a,p2,q2,"^2"))+"　頂点 "+T(ptTex(p2,q2))+"</div>",
        "頂点の差が移動量: "+T("("+p2+")-("+p1+")="+dx)+"、"+T("("+q2+")-("+q1+")="+dy),
        '<div class="exFml">'+esc(cor)+" だけ平行移動する</div>"
      ],
      fig:{t:"idou",a:a,p:p2,q:q2}
    };
  }

  /* lv3 … 平行移動してできた式から、もとの係数を逆算する（例題79） */
  const s=nzi(-4,4), t=nzi(-5,5);
  const p2=ri(-4,4), q2=ri(-6,6);
  const B=-2*p2, C=p2*p2+q2;                 /* 移動後 y=x²+Bx+C */
  const p1=p2-s, q1=q2-t;                    /* 移動前の頂点 */
  const A=-2*p1, D=p1*p1+q1;                 /* 移動前 y=x²+ax+b */
  const cor="a="+A+",\\ b="+D;
  const pw=p2+s, qw=q2+t;                    /* 逆向きに動かしてしまった場合 */
  return {
    lead:"放物線 "+T("y=x^2+ax+b")+" を、"+T("x")+" 軸方向に "+T(String(s))+"、"
        +T("y")+" 軸方向に "+T(String(t))+" だけ平行移動すると、放物線 "
        +T("y="+quad(1,B,C,"x","^2"))+" に重なる。定数 "+T("a,\\ b")+" の値を求めよ。",
    ans:mkChoice(cor,[
      "a="+(-2*pw)+",\\ b="+(pw*pw+qw),
      "a="+(-2*pw)+",\\ b="+(pw*pw+q1),
      "a="+(-2*p1)+",\\ b="+(p1*p1+qw),
      "a="+B+",\\ b="+C,
      "a="+(-A)+",\\ b="+D
    ]),
    plainQ:"放物線 y=x²+ax+b を x軸方向に "+s+"、y軸方向に "+t+" だけ平行移動すると、"
      +"放物線 y="+quad(1,B,C,"x","²")+" に重なる。定数 a, b の値を求めよ。",
    plainA:"a="+A+", b="+D,
    ex:[
      "移動<b>後</b>の放物線を平方完成して頂点を出す。",
      '<div class="exFml">'+T("y="+vert(1,p2,q2,"^2"))+"　頂点 "+T(ptTex(p2,q2))+"</div>",
      "移動前の頂点は、そこから<b>逆向きに</b>動かした点: "
        +T(ptTex(p2,q2))+" → "+T(ptTex(p1,q1)),
      "よって移動前は "+T("y="+vert(1,p1,q1,"^2"))+" = "+T("y="+quad(1,A,D,"x","^2")),
      '<div class="exFml">'+T(cor)+"</div>"
    ]
  };
};

/* ================================================================
   ④ 対称移動（例題80）
   lv1: 頂点形 ／ lv2: 一般形
   x軸 → y を -y に（全体の符号が反転）／ y軸 → x を -x に ／ 原点 → 両方
   ================================================================ */
/* ⚠ 和文は TeX に入れない（KaTeX は「軸」を知らず赤字で出る）。
   軸の文字だけ T() で描き、和文はその外に置く。 */
const SYM=[T("x")+" 軸",T("y")+" 軸","原点"];
const SYM_P=["x軸","y軸","原点"];
GENS.taisho=function(lv){
  const kind=ri(0,2);
  if(lv===1){
    const a=pick([-3,-2,-1,1,2,3]);
    const p=nzi(-5,5), q=nzi(-6,6);
    const res=[[-a,p,-q],[a,-p,q],[-a,-p,-q]];           /* x軸 / y軸 / 原点 */
    const r=res[kind];
    const cor="y="+vert(r[0],r[1],r[2],"^2");
    const wrongs=[];
    res.forEach(function(x,i){if(i!==kind)wrongs.push("y="+vert(x[0],x[1],x[2],"^2"));});
    wrongs.push("y="+vert(-a,p,q,"^2"));
    wrongs.push("y="+vert(a,p,-q,"^2"));
    wrongs.push("y="+vert(a,-p,-q,"^2"));
    return {
      lead:"放物線 "+T("y="+vert(a,p,q,"^2"))+" を "+SYM[kind]
          +" に関して対称移動して得られる放物線の方程式を求めよ。",
      ans:mkChoice(cor,wrongs),
      plainQ:"放物線 y="+vert(a,p,q,"²")+" を "+SYM_P[kind]+" に関して対称移動して得られる放物線の方程式を求めよ。",
      ex:[
        "頂点 "+T(ptTex(p,q))+" が "+SYM[kind]+" に関してどこへ移るかを考える。",
        (kind===0)?("x 軸に関して対称 → "+T("x")+" はそのまま、"+T("y")+" の符号が変わる。"
                    +"頂点は "+T(ptTex(p,-q))+"、上に凸と下に凸も<b>入れかわる</b>。")
        :((kind===1)?("y 軸に関して対称 → "+T("y")+" はそのまま、"+T("x")+" の符号が変わる。"
                    +"頂点は "+T(ptTex(-p,q))+"、"+T("x^2")+" の係数は<b>変わらない</b>。")
                   :("原点に関して対称 → "+T("x")+" も "+T("y")+" も符号が変わる。"
                    +"頂点は "+T(ptTex(-p,-q))+"、"+T("x^2")+" の係数の符号も変わる。")),
        '<div class="exFml">'+T(cor)+"</div>"
      ]
    };
  }

  /* lv2 … 一般形のまま置きかえる */
  const a=pick([-2,-1,1,2]), b=nzi(-6,6), c=nzi(-8,8);
  const res=[[-a,-b,-c],[a,-b,c],[-a,b,-c]];
  const r=res[kind];
  const cor="y="+quad(r[0],r[1],r[2],"x","^2");
  const wrongs=[];
  res.forEach(function(x,i){if(i!==kind)wrongs.push("y="+quad(x[0],x[1],x[2],"x","^2"));});
  wrongs.push("y="+quad(a,b,-c,"x","^2"));
  wrongs.push("y="+quad(-a,-b,c,"x","^2"));
  wrongs.push("y="+quad(a,-b,-c,"x","^2"));
  return {
    lead:"放物線 "+T("y="+quad(a,b,c,"x","^2"))+" を "+SYM[kind]
        +" に関して対称移動して得られる放物線の方程式を求めよ。",
    ans:mkChoice(cor,wrongs),
    plainQ:"放物線 y="+quad(a,b,c,"x","²")+" を "+SYM_P[kind]+" に関して対称移動して得られる放物線の方程式を求めよ。",
    ex:[
      (kind===0)?("x 軸に関して対称移動は "+T("y")+" を "+T("-y")+" に置きかえる → 両辺に "+T("-1")+" をかけて "+T("y=-f(x)")+"。")
      :((kind===1)?("y 軸に関して対称移動は "+T("x")+" を "+T("-x")+" に置きかえる → "+T("y=f(-x)")+"。"
                   +T("x^2")+" の項は変わらず、"+T("x")+" の項の符号だけ変わる。")
                 :("原点に関して対称移動は "+T("x")+" を "+T("-x")+"、"+T("y")+" を "+T("-y")+" に置きかえる → "+T("y=-f(-x)")+"。")),
      '<div class="exFml">'+T(cor)+"</div>",
      "検算: 頂点で確かめる。もとの頂点は "+T("y="+quad(a,b,c,"x","^2"))+" を平方完成して求められる。"
    ]
  };
};

<script>
"use strict";
/* ================================================================
   ⑤ 最大値・最小値（例題71・72）
   lv1: 定義域なし（頂点そのもの）
   lv2: 定義域あり・軸が定義域の内側（頂点と端を両方見る）
   lv3: 定義域あり・軸が定義域の外側（端と端をくらべる）
   ⚠ 答えは和文まじりなので plain（TeX に通さない）。不等号は使わない書き方にしてある。
   ================================================================ */
/* 「x=2 で最小値 -3、最大値はない」 */
function mmOne(x,val,isMax){
  return "x="+x+" で"+(isMax?"最大値 ":"最小値 ")+val+"、"+(isMax?"最小値":"最大値")+"はない";
}
/* 「x=4 で最大値 5、x=2 で最小値 -3」 */
function mmBoth(xmax,vmax,xmin,vmin){
  return "x="+xmax+" で最大値 "+vmax+"、x="+xmin+" で最小値 "+vmin;
}
GENS.saidai=function(lv){
  if(lv===1){
    const a=pick([-3,-2,-1,1,2,3]);
    const p=nzi(-5,5), q=nzi(-8,8);
    const b=-2*a*p, c=a*p*p+q;
    const up=(a>0);                       /* 下に凸 = 最小値をもつ */
    const cor=mmOne(p,q,!up);
    return {
      lead:"次の2次関数の最大値・最小値を求めよ。",
      disp:"y="+quad(a,b,c,"x","^2"),
      ans:mkChoice(cor,[
        mmOne(-p,q,!up), mmOne(p,-q,!up), mmOne(p,q,up),
        mmOne(q,p,!up), mmOne(p,c,!up), mmOne(-p,-q,!up)
      ],true),
      plainQ:"2次関数 y="+quad(a,b,c,"x","²")+" の最大値・最小値を求めよ。",
      plainA:cor,
      ex:[
        "まず平方完成して<b>頂点</b>を出す。",
        '<div class="exFml">'+T("y="+vert(a,p,q,"^2"))+"　頂点 "+T(ptTex(p,q))+"</div>",
        T("x^2")+" の係数 "+T(String(a))+" が"+(up?"正 → <b>下に凸</b>。頂点で<b>最小</b>になり、上へはいくらでも伸びるので最大値はない。"
                                              :"負 → <b>上に凸</b>。頂点で<b>最大</b>になり、下へはいくらでも伸びるので最小値はない。"),
        '<div class="exFml">'+esc(cor)+"</div>"
      ],
      fig:{t:"idou",a:a,p:p,q:q}
    };
  }

  const a=pick([-2,-1,1,2]);
  const p=ri(-3,3), q=ri(-6,6);
  const b=-2*a*p, c=a*p*p+q;
  const up=(a>0);
  let s,e;
  if(lv===2){
    /* 軸が定義域の内側。端までの距離を変えて「遠い端」を1つに決める */
    let dl=ri(1,4), dr=ri(1,4);
    if(dl===dr)dr=dl+1;
    s=p-dl;e=p+dr;
  }else{
    /* 軸が定義域の外側（左か右にまとめて置く） */
    const gap=ri(1,3), len=ri(1,4);
    if(sgn1()>0){s=p+gap;e=s+len;}
    else{e=p-gap;s=e-len;}
  }
  const fs=a*(s-p)*(s-p)+q, fe=a*(e-p)*(e-p)+q;
  const farX=(Math.abs(s-p)>Math.abs(e-p))?s:e;
  const farV=(Math.abs(s-p)>Math.abs(e-p))?fs:fe;
  const nearX=(farX===s)?e:s;
  const nearV=(farX===s)?fe:fs;
  let cor,wrongs;
  if(lv===2){
    /* 頂点が定義域の中 → 凸の向きの側は頂点、反対側は遠い端 */
    cor=up?mmBoth(farX,farV,p,q):mmBoth(p,q,farX,farV);
    wrongs=up?[
      mmBoth(p,q,farX,farV),                 /* 最大と最小の取りちがえ */
      mmBoth(nearX,nearV,p,q),               /* 近い端を最大にしてしまう */
      mmBoth(farX,farV,nearX,nearV),         /* 頂点を見ずに両端だけで答える */
      mmBoth(farX,farV,p,-q)
    ]:[
      mmBoth(farX,farV,p,q),
      mmBoth(p,q,nearX,nearV),
      mmBoth(nearX,nearV,farX,farV),
      mmBoth(p,-q,farX,farV)
    ];
  }else{
    /* 頂点が定義域の外 → 最大も最小も端で起こる */
    const hiX=(fs>fe)?s:e, hiV=Math.max(fs,fe);
    const loX=(fs>fe)?e:s, loV=Math.min(fs,fe);
    cor=mmBoth(hiX,hiV,loX,loV);
    wrongs=[
      mmBoth(loX,loV,hiX,hiV),                       /* 入れかえ */
      up?mmBoth(hiX,hiV,p,q):mmBoth(p,q,loX,loV),    /* 定義域の外の頂点を答えてしまう */
      mmBoth(hiV,hiX,loV,loX),                       /* x と値の取りちがえ */
      mmBoth(loX,hiV,hiX,loV)                        /* 端と値の組み合わせちがい */
    ];
  }
  return {
    lead:"次の2次関数について、定義域 "+T(s+" \\leqq x \\leqq "+e)+" における最大値・最小値を求めよ。",
    disp:"y="+quad(a,b,c,"x","^2"),
    ans:mkChoice(cor,wrongs,true,true),
    plainQ:"2次関数 y="+quad(a,b,c,"x","²")+" ("+s+"≦x≦"+e+") の最大値・最小値を求めよ。",
    plainA:cor,
    ex:[
      "平方完成すると "+T("y="+vert(a,p,q,"^2"))+"　軸は "+T("x="+p)+"、頂点 "+T(ptTex(p,q))+"。",
      (lv===2)?("軸 "+T("x="+p)+" は定義域 "+T(s+" \\leqq x \\leqq "+e)+" の<b>中にある</b> → "
                +(up?"最小は頂点、最大は<b>軸から遠いほうの端</b>。":"最大は頂点、最小は<b>軸から遠いほうの端</b>。"))
              :("軸 "+T("x="+p)+" は定義域 "+T(s+" \\leqq x \\leqq "+e)+" の<b>外にある</b> → "
                +"定義域の中でグラフは<b>一方向にしか動かない</b>ので、最大も最小も端で起こる。"),
      "両端の値: "+T("x="+s)+" のとき "+T("y="+fs)+"、"+T("x="+e)+" のとき "+T("y="+fe),
      '<div class="exFml">'+esc(cor)+"</div>"
    ],
    fig:{t:"kukan",a:a,k:p,q:q,s:s,e:e}
  };
};

/* ================================================================
   ⑥ 動く最大・最小（例題82・83・84）
   lv1: 定義域の一端が動く ／ lv2: 軸が動く ／ lv3: 定義域の両端が動く
   ⚠ 答えは場合分けの組そのもの。1行が長いので wide（4択・1列）で出す。
   ⚠ 不等号は全角「＜」「≦」で書く（生の「<」は question_choices が
     丸ごと捨てられる。CLAUDE.md 2f）。
   ================================================================ */
GENS.ugoku=function(lv){
  if(lv===1){
    /* f(x)=x²-2kx+c を 0≦x≦a で見る。軸は x=k（固定）、右端 a が動く */
    const k=ri(1,4), c=ri(-6,8);
    const vtx=c-k*k;                          /* 頂点の y 座標 */
    const fa=quadA(1,-2*k,c);                 /* f(a)=a²-2ka+c */
    const isMax=(ri(0,1)===1);
    let cor,wrongs;
    if(isMax){
      /* f(0)=c と f(a) をくらべる。境目は a=2k */
      cor="0＜a≦"+(2*k)+" のとき "+c+"、"+(2*k)+"＜a のとき "+fa;
      wrongs=[
        "0＜a≦"+k+" のとき "+c+"、"+k+"＜a のとき "+fa,
        "0＜a≦"+(2*k)+" のとき "+fa+"、"+(2*k)+"＜a のとき "+c,
        "0＜a＜"+k+" のとき "+fa+"、"+k+"≦a のとき "+vtx,
        "0＜a≦"+(2*k)+" のとき "+vtx+"、"+(2*k)+"＜a のとき "+fa
      ];
    }else{
      /* 頂点が定義域に入るかどうか。境目は a=k */
      cor="0＜a＜"+k+" のとき "+fa+"、"+k+"≦a のとき "+vtx;
      wrongs=[
        "0＜a＜"+(2*k)+" のとき "+fa+"、"+(2*k)+"≦a のとき "+vtx,
        "0＜a＜"+k+" のとき "+vtx+"、"+k+"≦a のとき "+fa,
        "0＜a＜"+k+" のとき "+fa+"、"+k+"≦a のとき "+c,
        "0＜a＜"+k+" のとき "+quadA(1,2*k,c)+"、"+k+"≦a のとき "+vtx
      ];
    }
    return {
      lead:"2次関数 "+T("y="+quad(1,-2*k,c,"x","^2"))+"　"+T("(0 \\leqq x \\leqq a)")
          +" の"+(isMax?"最大値":"最小値")+"を、正の定数 "+T("a")+" の値で場合分けして求めよ。",
      ans:mkChoice(cor,wrongs,true,true),
      plainQ:"2次関数 y="+quad(1,-2*k,c,"x","²")+" (0≦x≦a、a は正の定数) の"
        +(isMax?"最大値":"最小値")+"を a の値で場合分けして求めよ。",
      plainA:cor,
      ex:[
        "平方完成すると "+T("y="+vert(1,k,vtx,"^2"))+"　軸は "+T("x="+k)+"（<b>動かない</b>）。",
        "動くのは定義域の右端 "+T("a")+" のほう。グラフの<b>どこを切り取るか</b>が変わる。",
        isMax?("下に凸なので最大は<b>端</b>で起こる。"+T("f(0)="+c)+" と "+T("f(a)="+texA(fa))
               +" をくらべると、境目は "+T("a="+(2*k))+"（軸 "+T("x="+k)+" の2倍）。")
             :("下に凸なので、<b>軸が定義域に入れば頂点が最小</b>。入らなければ右端 "+T("x=a")+" が最小。"
               +"境目は "+T("a="+k)+"。"),
        '<div class="exFml">'+esc(cor)+"</div>",
        "⚠ 場合分けの境目は<b>どちらか一方に「=」を付ける</b>（両方に付けない・どちらにも付けないのは×）。"
      ],
      fig:{t:"kukan",a:1,k:k,q:vtx,s:0,e:Math.max(1,k+1)}
    };
  }

  if(lv===2){
    /* f(x)=x²-2ax+c を 0≦x≦t で見る。軸 x=a が動く（例題83） */
    const t=pick([2,4,6]), c=ri(-5,8);
    const ft=quadA(0,-2*t,t*t+c);             /* f(t)=t²-2at+c */
    const vtxA=quadA(-1,0,c);                 /* 頂点の値 = -a²+c */
    const isMax=(ri(0,1)===1);
    let cor,wrongs;
    if(isMax){
      cor="a＜"+(t/2)+" のとき "+ft+"、"+(t/2)+"≦a のとき "+c;
      wrongs=[
        "a＜"+t+" のとき "+ft+"、"+t+"≦a のとき "+c,
        "a＜"+(t/2)+" のとき "+c+"、"+(t/2)+"≦a のとき "+ft,
        "a＜0 のとき "+c+"、0≦a≦"+t+" のとき "+vtxA+"、"+t+"＜a のとき "+ft,
        "a＜"+(t/2)+" のとき "+vtxA+"、"+(t/2)+"≦a のとき "+c
      ];
    }else{
      cor="a＜0 のとき "+c+"、0≦a≦"+t+" のとき "+vtxA+"、"+t+"＜a のとき "+ft;
      wrongs=[
        "a＜0 のとき "+c+"、0≦a≦"+t+" のとき "+quadA(1,0,c)+"、"+t+"＜a のとき "+ft,
        "a＜0 のとき "+ft+"、0≦a≦"+t+" のとき "+vtxA+"、"+t+"＜a のとき "+c,
        "a＜"+(t/2)+" のとき "+ft+"、"+(t/2)+"≦a のとき "+c,
        "0≦a≦"+t+" のとき "+vtxA+"、それ以外のとき "+c
      ];
    }
    return {
      lead:"2次関数 "+T("y=x^2-2ax"+sg(c))+"　"+T("(0 \\leqq x \\leqq "+t+")")
          +" の"+(isMax?"最大値":"最小値")+"を、定数 "+T("a")+" の値で場合分けして求めよ。",
      ans:mkChoice(cor,wrongs,true,true),
      plainQ:"2次関数 y=x²-2ax"+sg(c)+" (0≦x≦"+t+") の"+(isMax?"最大値":"最小値")
        +"を、定数 a の値で場合分けして求めよ。",
      plainA:cor,
      ex:[
        "平方完成すると "+T("y=(x-a)^2-a^2"+sg(c))+"　軸は "+T("x=a")+"（<b>動く</b>）、定義域は "
          +T("0 \\leqq x \\leqq "+t)+"（<b>動かない</b>）。",
        isMax?("最大は<b>軸から遠いほうの端</b>で起こる。"+T("f(0)="+c)+" と "+T("f("+t+")="+texA(ft))
               +" のどちらが大きいかは、軸が定義域の<b>まん中 "+T("x="+(t/2))+"</b> より左か右かで決まる。")
             :("下に凸なので、<b>軸が定義域の中にあれば頂点が最小</b>。"
               +"軸が左にはみ出せば "+T("x=0")+"、右にはみ出せば "+T("x="+t)+" が最小になる。"),
        '<div class="exFml">'+esc(cor)+"</div>",
        "⚠ 場合分けの境目は軸 "+T("x=a")+" が<b>定義域の端に重なるとき</b>"
          +(isMax?"ではなく、まん中に来るとき":"")+"。"
      ],
      fig:{t:"ugoku",k:1,c:c,tt:t}
    };
  }

  /* lv3 … 定義域の両端が動く（例題84）。幅 w は固定のまま平行にずれていく */
  const k=ri(1,4), c=ri(-6,8), w=pick([2,3]);
  const vtx=c-k*k;
  const left=quadA(1,2*(w-k),w*w-2*k*w+c);    /* f(a+w) */
  const right=quadA(1,-2*k,c);                /* f(a) */
  const cor="a＜"+(k-w)+" のとき "+left+"、"+(k-w)+"≦a≦"+k+" のとき "+vtx+"、"+k+"＜a のとき "+right;
  return {
    lead:"2次関数 "+T("y="+quad(1,-2*k,c,"x","^2"))+"　"+T("(a \\leqq x \\leqq a+"+w+")")
        +" の最小値を、定数 "+T("a")+" の値で場合分けして求めよ。",
    ans:mkChoice(cor,[
      "a＜"+(k-w)+" のとき "+right+"、"+(k-w)+"≦a≦"+k+" のとき "+vtx+"、"+k+"＜a のとき "+left,
      "a＜"+k+" のとき "+left+"、"+k+"≦a≦"+(k+w)+" のとき "+vtx+"、"+(k+w)+"＜a のとき "+right,
      "a＜"+(k-w)+" のとき "+left+"、"+(k-w)+"≦a≦"+k+" のとき "+c+"、"+k+"＜a のとき "+right,
      "a＜"+(k-w)+" のとき "+left+"、"+k+"＜a のとき "+right
    ],true,true),
    plainQ:"2次関数 y="+quad(1,-2*k,c,"x","²")+" (a≦x≦a+"+w+") の最小値を、"
      +"定数 a の値で場合分けして求めよ。",
    plainA:cor,
    ex:[
      "平方完成すると "+T("y="+vert(1,k,vtx,"^2"))+"　軸は "+T("x="+k)+"（動かない）。",
      "定義域は幅 "+T(String(w))+" のまま<b>まるごと左右に動く</b>。軸をまたぐかどうかで3通りに分かれる。",
      "① 定義域が軸より左（"+T("a+"+w+" \\lt "+k)+" つまり "+T("a \\lt "+(k-w))+"）→ 右端 "
        +T("x=a+"+w)+" が最小 → "+T(texA(left)),
      "② 軸が定義域の中（"+T((k-w)+" \\leqq a \\leqq "+k)+"）→ 頂点が最小 → "+T(String(vtx)),
      "③ 定義域が軸より右（"+T(k+" \\lt a")+"）→ 左端 "+T("x=a")+" が最小 → "+T(texA(right)),
      '<div class="exFml">'+esc(cor)+"</div>"
    ],
    fig:{t:"kukan",a:1,k:k,q:vtx,s:k-w,e:k}
  };
};
</script>
<script>
"use strict";
/* ================================================================
   ⑦ 2次関数の決定（例題75・76・77）
   lv1: 頂点と通る1点 ／ lv2: 通る3点 ／ lv3: 軸・最大最小の条件
   ================================================================ */
GENS.kettei=function(lv){
  if(lv===1){
    const a=pick([-3,-2,-1,1,2,3]);
    const p=ri(-4,4), q=ri(-6,6);
    const d=pick([-2,-1,1,2]);
    const x0=p+d, y0=q+a*d*d;
    const cor="y="+vert(a,p,q,"^2");
    return {
      lead:"頂点が "+T(ptTex(p,q))+" で、点 "+T(ptTex(x0,y0))+" を通る2次関数を求めよ。",
      ans:mkChoice(cor,[
        "y="+vert(-a,p,q,"^2"),
        "y="+vert(a,-p,q,"^2"),
        "y="+vert(a,p,-q,"^2"),
        "y="+vert(a,-p,-q,"^2"),
        "y="+vert(2*a,p,q,"^2"),
        "y="+vert(a,x0,y0,"^2")
      ]),
      plainQ:"頂点が "+ptPlain(p,q)+" で、点 "+ptPlain(x0,y0)+" を通る2次関数を求めよ。",
      ex:[
        "頂点が分かっているので "+T("y=a(x-p)^2+q")+" とおく。",
        '<div class="exFml">'+T("y=a"+((p===0)?"x^2":"(x"+sg(-p)+")^2")+sg(q))+"</div>",
        "通る点 "+T(ptTex(x0,y0))+" を代入して "+T("a")+" を求める: "
          +T(a+"\\times("+d+")^2"+sg(q)+"="+y0),
        '<div class="exFml">'+T(cor)+"</div>"
      ],
      fig:{t:"idou",a:a,p:p,q:q}
    };
  }

  if(lv===2){
    const a=pick([-2,-1,1,2]), b=nzi(-6,6), c=nzi(-8,8);
    const xs=shuffle([0,1,-1,2,-2]).slice(0,3);
    const f=function(x){return a*x*x+b*x+c;};
    /* ⚠ 「、」を TeX の中に入れない（KaTeX が和文を知らず赤字で出る）。
       点ごとに T() を作って、区切りの「、」はその外側に置く。 */
    const pts=xs.map(function(x){return T(ptTex(x,f(x)));}).join("、");
    const cor="y="+quad(a,b,c,"x","^2");
    return {
      lead:"3点 "+pts+" を通る2次関数を求めよ。",
      ans:mkChoice(cor,[
        "y="+quad(a,-b,c,"x","^2"),
        "y="+quad(-a,b,c,"x","^2"),
        "y="+quad(a,b,-c,"x","^2"),
        "y="+quad(b,a,c,"x","^2"),
        "y="+quad(a,c,b,"x","^2"),
        "y="+quad(-a,-b,c,"x","^2")
      ]),
      plainQ:"3点 "+xs.map(function(x){return ptPlain(x,f(x));}).join("、")+" を通る2次関数を求めよ。",
      ex:[
        "頂点は分からないので "+T("y=ax^2+bx+c")+" とおき、3点を代入して連立方程式にする。",
        '<div class="exFml">'+xs.map(function(x){
            return T("a\\times("+x+")^2+b\\times("+x+")+c="+f(x));
          }).join("　/　")+"</div>",
        (xs.indexOf(0)>=0)?(""+T("x=0")+" の式からすぐ "+T("c="+c)+" が出る。残り2つで "+T("a,\\ b")+" を解く。")
                          :("3つの式を組み合わせて文字を1つずつ消していく。"),
        '<div class="exFml">'+T(cor)+"</div>"
      ]
    };
  }

  /* lv3 … 最大・最小の条件、または軸と2点の条件（例題76） */
  if(ri(0,1)===1){
    const isMax=(ri(0,1)===1);
    const a=isMax?pick([-3,-2,-1]):pick([1,2,3]);
    const p=ri(-4,4), q=ri(-6,6);
    const d=pick([-2,-1,1,2]);
    const x0=p+d, y0=q+a*d*d;
    const cor="y="+vert(a,p,q,"^2");
    return {
      lead:T("x="+p)+" で"+(isMax?"最大値":"最小値")+" "+T(String(q))+" をとり、点 "
          +T(ptTex(x0,y0))+" を通る2次関数を求めよ。",
      ans:mkChoice(cor,[
        "y="+vert(-a,p,q,"^2"),
        "y="+vert(a,-p,q,"^2"),
        "y="+vert(a,p,-q,"^2"),
        "y="+vert(a,q,p,"^2"),
        "y="+vert(2*a,p,q,"^2"),
        "y="+vert(a,-p,-q,"^2"),
        /* p=0 や q=0 のときに符号ちがいの候補が正解と同じ文字列になって消えるので、
           必ず別物になる候補も足しておく（選択肢が3つに減らないように） */
        "y="+vert(a,p+1,q,"^2"),
        "y="+vert(-2*a,p,q,"^2")
      ]),
      plainQ:"x="+p+" で"+(isMax?"最大値":"最小値")+" "+q+" をとり、点 "+ptPlain(x0,y0)
        +" を通る2次関数を求めよ。",
      ex:[
        "「"+T("x="+p)+" で"+(isMax?"最大":"最小")+"」＝<b>頂点が "+T(ptTex(p,q))+"</b> ということ。",
        T("y=a"+((p===0)?"x^2":"(x"+sg(-p)+")^2")+sg(q))+" とおいて点 "+T(ptTex(x0,y0))+" を代入する。",
        isMax?("最大値をもつので "+T("a")+" は<b>負</b>（上に凸）。"+T("a="+a))
             :("最小値をもつので "+T("a")+" は<b>正</b>（下に凸）。"+T("a="+a)),
        '<div class="exFml">'+T(cor)+"</div>"
      ],
      fig:{t:"idou",a:a,p:p,q:q}
    };
  }
  const a=pick([-2,-1,1,2]);
  const p=ri(-3,3), q=ri(-6,6);
  let d1=pick([-3,-2,-1,1,2,3]), d2=pick([-3,-2,-1,1,2,3]);
  if(Math.abs(d1)===Math.abs(d2))d2=(Math.abs(d1)===3)?1:(Math.abs(d1)+1);
  const x1=p+d1, y1=q+a*d1*d1, x2=p+d2, y2=q+a*d2*d2;
  const cor="y="+vert(a,p,q,"^2");
  return {
    lead:"軸が直線 "+T("x="+p)+" で、2点 "+T(ptTex(x1,y1))+"、"+T(ptTex(x2,y2))
        +" を通る2次関数を求めよ。",
    ans:mkChoice(cor,[
      "y="+vert(a,-p,q,"^2"),
      "y="+vert(-a,p,q,"^2"),
      "y="+vert(a,p,-q,"^2"),
      "y="+vert(2*a,p,q,"^2"),
      "y="+vert(a,p,q+1,"^2"),
      "y="+vert(a,-p,-q,"^2")
    ]),
    plainQ:"軸が直線 x="+p+" で、2点 "+ptPlain(x1,y1)+"、"+ptPlain(x2,y2)+" を通る2次関数を求めよ。",
    ex:[
      "軸が "+T("x="+p)+" と分かっているので "+T("y=a(x-p)^2+q")+" の "+T("p")+" は決まっている。",
      '<div class="exFml">'+T("y=a"+((p===0)?"x^2":"(x"+sg(-p)+")^2")+"+q")+"</div>",
      "2点を代入: "+T(a*d1*d1+"+q="+y1)+"　/　"+T(a*d2*d2+"+q="+y2)+" の形になる2式を解く。",
      '<div class="exFml">'+T(cor)+"</div>"
    ],
    fig:{t:"idou",a:a,p:p,q:q}
  };
};

/* ================================================================
   ⑧ 最大値・最小値から係数決定（例題73）
   lv1: 定義域なし（頂点の値＝与えられた最大・最小）
   lv2: 定義域あり（軸が中にあるか、外にあるかで代入する場所が変わる）
   ⚠ 答えは整数の a。テンキーで入力する。
   ================================================================ */
GENS.keisu=function(lv){
  if(lv===1){
    const a=ri(1,5), c=ri(-6,8);
    const isMax=(ri(0,1)===1);
    /* 上に凸: y=-x²+2ax+c → 最大値 a²+c ／ 下に凸: y=x²-2ax+c → 最小値 c-a² */
    const val=isMax?(a*a+c):(c-a*a);
    const fx=isMax?("y=-x^2+2ax"+sg(c)):("y=x^2-2ax"+sg(c));
    const fp=isMax?("y=-x²+2ax"+sg(c)):("y=x²-2ax"+sg(c));
    return {
      lead:"2次関数 "+T(fx)+" の"+(isMax?"最大値":"最小値")+"が "+T(String(val))
          +" であるとき、正の定数 "+T("a")+" の値を求めよ。",
      ans:mkNum(a),
      plainQ:"2次関数 "+fp+" の"+(isMax?"最大値":"最小値")+"が "+val+" であるとき、正の定数 a の値を求めよ。",
      ex:[
        "平方完成して頂点の "+T("y")+" 座標を "+T("a")+" で表す。",
        '<div class="exFml">'+T(isMax?("y=-(x-a)^2+a^2"+sg(c)):("y=(x-a)^2-a^2"+sg(c)))+"</div>",
        "定義域が無いので"+(isMax?"最大値":"最小値")+"は頂点の値そのもの: "
          +T(isMax?("a^2"+sg(c)+"="+val):("-a^2"+sg(c)+"="+val)),
        T("a^2="+(a*a))+" で "+T("a")+" は正だから "+T("a="+a)
      ]
    };
  }

  /* lv2 … 定義域つき。軸が中にある場合と、はみ出して端で決まる場合 */
  const N=pick([2,3,4,5]);
  const c=ri(-5,8);
  const type=ri(0,2);
  if(type===0){
    /* 下に凸・軸が定義域の中 → 最小値は頂点 */
    const a=ri(1,N-1)||1;
    const val=c-a*a;
    return {
      lead:"2次関数 "+T("y=x^2-2ax"+sg(c))+"　"+T("(0 \\leqq x \\leqq "+N+")")+" の最小値が "
          +T(String(val))+" であるとき、定数 "+T("a")+" の値を求めよ。ただし "
          +T("0 \\lt a \\lt "+N)+" とする。",
      ans:mkNum(a),
      plainQ:"2次関数 y=x²-2ax"+sg(c)+" (0≦x≦"+N+") の最小値が "+val
        +" であるとき、定数 a の値を求めよ。ただし 0＜a＜"+N+" とする。",
      ex:[
        "平方完成すると "+T("y=(x-a)^2-a^2"+sg(c))+"　軸は "+T("x=a")+"。",
        "条件より軸は定義域の<b>中</b>にあるので、最小値は<b>頂点の値</b>。",
        '<div class="exFml">'+T("-a^2"+sg(c)+"="+val)+" → "+T("a^2="+(a*a))+"</div>",
        T("0 \\lt a \\lt "+N)+" だから "+T("a="+a)
      ]
    };
  }
  if(type===1){
    /* 下に凸・軸が定義域より右 → 最小値は右端 x=N */
    const a=N+ri(1,3);
    const val=N*N-2*a*N+c;
    return {
      lead:"2次関数 "+T("y=x^2-2ax"+sg(c))+"　"+T("(0 \\leqq x \\leqq "+N+")")+" の最小値が "
          +T(String(val))+" であるとき、定数 "+T("a")+" の値を求めよ。ただし "
          +T(N+" \\lt a")+" とする。",
      ans:mkNum(a),
      plainQ:"2次関数 y=x²-2ax"+sg(c)+" (0≦x≦"+N+") の最小値が "+val
        +" であるとき、定数 a の値を求めよ。ただし "+N+"＜a とする。",
      ex:[
        "軸 "+T("x=a")+" は定義域より<b>右</b>にあるので、グラフは定義域の中で右下がり。",
        "つまり最小値は<b>右端 "+T("x="+N)+"</b> の値。",
        '<div class="exFml">'+T(N*N+"-2a\\times "+N+sg(c)+"="+val)+"</div>",
        T((-2*N)+"a="+(val-N*N-c))+" より "+T("a="+a)
      ]
    };
  }
  /* 上に凸・軸が定義域の中 → 最大値は頂点 */
  const a=ri(1,N-1)||1;
  const val=a*a+c;
  return {
    lead:"2次関数 "+T("y=-x^2+2ax"+sg(c))+"　"+T("(0 \\leqq x \\leqq "+N+")")+" の最大値が "
        +T(String(val))+" であるとき、定数 "+T("a")+" の値を求めよ。ただし "
        +T("0 \\lt a \\lt "+N)+" とする。",
    ans:mkNum(a),
    plainQ:"2次関数 y=-x²+2ax"+sg(c)+" (0≦x≦"+N+") の最大値が "+val
      +" であるとき、定数 a の値を求めよ。ただし 0＜a＜"+N+" とする。",
    ex:[
      "平方完成すると "+T("y=-(x-a)^2+a^2"+sg(c))+"　上に凸で軸は "+T("x=a")+"。",
      "軸が定義域の中にあるので、最大値は頂点の値。",
      '<div class="exFml">'+T("a^2"+sg(c)+"="+val)+" → "+T("a^2="+(a*a))+"</div>",
      T("0 \\lt a \\lt "+N)+" だから "+T("a="+a)
    ]
  };
};

/* ================================================================
   ⑨ 最大・最小の文章題（例題74・81）
   lv1: 和と積・長方形の面積・投げ上げ
   lv2: 定義域がつく文章題（動く点・値下げと売上）
   ⚠ 答えは整数。単位は ans.unit に持たせる（記録の correct_answer にも付く）
   ================================================================ */
GENS.bunsho=function(lv){
  if(lv===1){
    const t=ri(0,2);
    if(t===0){
      const m=ri(4,12);
      return {
        lead:"和が "+T(String(2*m))+" である2つの数について、その積の最大値を求めよ。",
        ans:mkNum(m*m),
        plainQ:"和が "+(2*m)+" である2つの数について、その積の最大値を求めよ。",
        ex:[
          "一方を "+T("x")+" とすると、もう一方は "+T((2*m)+"-x")+"。",
          '<div class="exFml">'+T("y=x("+(2*m)+"-x)=-x^2+"+(2*m)+"x=-(x-"+m+")^2+"+(m*m))+"</div>",
          "上に凸なので "+T("x="+m)+"（2つの数が等しいとき）に最大。",
          '<div class="exFml">最大値 '+T(String(m*m))+"</div>"
        ]
      };
    }
    if(t===1){
      const m=ri(5,14);
      return {
        lead:"周の長さが "+T(String(4*m))+" cm である長方形のうち、面積が最大になるものの面積を求めよ。",
        ans:mkNum(m*m,"cm²"),
        plainQ:"周の長さが "+(4*m)+" cm である長方形のうち、面積が最大になるものの面積を求めよ。",
        ex:[
          "たての長さを "+T("x")+" cm とすると、たて＋よこ＝"+T(String(2*m))+" なのでよこは "+T((2*m)+"-x")+" cm。",
          '<div class="exFml">'+T("S=x("+(2*m)+"-x)=-(x-"+m+")^2+"+(m*m))+"</div>",
          "定義域は "+T("0 \\lt x \\lt "+(2*m))+"。その中に軸 "+T("x="+m)+" があるので、"
            +"<b>正方形のとき</b>に最大。",
          '<div class="exFml">最大値 '+T(String(m*m))+" cm²</div>"
        ]
      };
    }
    const k=ri(2,6);
    return {
      lead:"地面から真上に投げ上げたボールの "+T("t")+" 秒後の高さが "
          +T("h=-5t^2+"+(10*k)+"t")+"（m）で表されるとき、最も高くなったときの高さを求めよ。",
      ans:mkNum(5*k*k,"m"),
      plainQ:"地面から真上に投げ上げたボールの t 秒後の高さが h=-5t²+"+(10*k)
        +"t（m）で表されるとき、最も高くなったときの高さを求めよ。",
      ex:[
        T("t^2")+" の係数が負なので上に凸。頂点が最高点。",
        '<div class="exFml">'+T("h=-5(t^2-"+(2*k)+"t)=-5(t-"+k+")^2+"+(5*k*k))+"</div>",
        T("t="+k)+" 秒後に最高点 "+T(String(5*k*k))+" m。",
        "⚠ 高さを聞かれているので、答えるのは "+T("t")+" ではなく "+T("h")+" のほう。"
      ]
    };
  }

  /* lv2 … 定義域がつく文章題 */
  if(ri(0,1)===1){
    const m=ri(3,6);                     /* AB=2m、P は毎秒1cm */
    const n=2*m+2*ri(0,3);               /* BC=n（毎秒2cm の Q が届く長さ） */
    const askArea=(ri(0,1)===1);
    return {
      lead:"長方形 ABCD で "+T("AB="+(2*m))+" cm、"+T("BC="+n)+" cm である。"
          +"点 P は A を出発して辺 AB 上を B まで毎秒 1cm で、点 Q は B を出発して辺 BC 上を C まで毎秒 2cm で動く。"
          +"2点が同時に出発してから "+T("t")+" 秒後の三角形 PBQ について、"
          +(askArea?"面積の最大値を求めよ。":"面積が最大になるのは何秒後か求めよ。"),
      ans:askArea?mkNum(m*m,"cm²"):mkNum(m,"秒後"),
      plainQ:"長方形 ABCD で AB="+(2*m)+" cm、BC="+n+" cm である。点 P は A を出発して辺 AB 上を B まで"
        +"毎秒 1cm で、点 Q は B を出発して辺 BC 上を C まで毎秒 2cm で動く。2点が同時に出発してから t 秒後の"
        +"三角形 PBQ について、"+(askArea?"面積の最大値を求めよ。":"面積が最大になるのは何秒後か求めよ。"),
      ex:[
        T("t")+" 秒後、"+T("PB="+(2*m)+"-t")+" cm、"+T("BQ=2t")+" cm。",
        '<div class="exFml">'+T("S=\\dfrac{1}{2}("+(2*m)+"-t)\\times 2t=-t^2+"+(2*m)+"t=-(t-"+m+")^2+"+(m*m))+"</div>",
        "動ける範囲は P が B に着くまで（"+T("t \\leqq "+(2*m))+"）、Q が C に着くまで（"
          +T("t \\leqq "+(n/2))+"）なので "+T("0 \\leqq t \\leqq "+Math.min(2*m,n/2))+"。",
        "軸 "+T("t="+m)+" はこの範囲の中にあるので、そこが最大。",
        '<div class="exFml">'+(askArea?("最大値 "+T(String(m*m))+" cm²"):(T("t="+m)+" 秒後"))+"</div>"
      ]
    };
  }
  const p=ri(20,40), n=p-2*ri(3,8);       /* 価格 10p 円・個数 20n 個。p-n は偶数 */
  const x=(p-n)/2;
  const price=10*(p-x);
  return {
    lead:"ある商品を1個 "+T(String(10*p))+" 円で売ると1日に "+T(String(20*n))+" 個売れる。"
        +"1個につき 10 円値下げするごとに、売れる個数は1日に 20 個ずつ増えるという。"
        +"1日の売上金額を最大にするには、1個いくらで売ればよいか。",
    ans:mkNum(price,"円"),
    plainQ:"ある商品を1個 "+(10*p)+" 円で売ると1日に "+(20*n)+" 個売れる。1個につき 10 円値下げするごとに、"
      +"売れる個数は1日に 20 個ずつ増える。1日の売上金額を最大にするには、1個いくらで売ればよいか。",
    ex:[
      "値下げの回数を "+T("x")+" 回とすると、値段は "+T((10*p)+"-10x")+" 円、個数は "+T((20*n)+"+20x")+" 個。",
      '<div class="exFml">'+T("y=("+(10*p)+"-10x)("+(20*n)+"+20x)=200("+p+"-x)("+n+"+x)")+"</div>",
      "上に凸の2次関数で、"+T("y=0")+" になるのは "+T("x="+p)+" と "+T("x="+(-n))
        +"。軸はその<b>ちょうどまん中</b>: "+T("x=\\dfrac{"+p+"+("+(-n)+")}{2}="+x),
      T("x="+x)+" 回値下げするので、値段は "+T((10*p)+"-10\\times "+x+"="+price)+" 円。",
      "⚠ 聞かれているのは<b>値段</b>。"+T("x")+" の値のまま答えない。"
    ]
  };
};

/* ================================================================
   ⑩ 絶対値を含む1次関数のグラフ（例題78）
   lv1: y=a|x-p|+q の折れ目と最大・最小
   lv2: y=|x-p|+|x-q| の最小値（場合分けして直線をつなぐ）
   ================================================================ */
GENS.zettai=function(lv){
  if(lv===1){
    const a=pick([-2,-1,1,2]);
    const p=nzi(-5,5), q=nzi(-6,6);
    const head=(a===1)?"":((a===-1)?"-":String(a));
    const fx="y="+head+"\\left|x"+sg(-p)+"\\right|"+sg(q);
    const fp="y="+head+"|x"+sg(-p)+"|"+sg(q);
    const cor=mmOne(p,q,a<0);
    return {
      lead:"次の関数の最大値・最小値を求めよ。",
      disp:fx,
      ans:mkChoice(cor,[
        mmOne(-p,q,a<0), mmOne(p,-q,a<0), mmOne(p,q,a>0),
        mmOne(q,p,a<0), mmOne(-p,-q,a<0), mmOne(p,q+a,a<0)
      ],true),
      plainQ:"関数 "+fp+" の最大値・最小値を求めよ。",
      plainA:cor,
      ex:[
        T("\\left|x"+sg(-p)+"\\right|")+" は "+T("x="+p)+" のとき 0 で、それ以外では<b>必ず正</b>。",
        "グラフは "+T("x="+p)+" で折れ曲がる"+(a<0?"<b>上下逆の Λ 字</b>":"<b>V 字</b>")+"になる。",
        (a>0)?("係数 "+T(String(a))+" が正なので、折れ目が<b>いちばん下</b>。"+T("x="+p)+" で最小値 "+T(String(q))+"。")
             :("係数 "+T(String(a))+" が負なので、折れ目が<b>いちばん上</b>。"+T("x="+p)+" で最大値 "+T(String(q))+"。"),
        '<div class="exFml">'+esc(cor)+"</div>"
      ]
    };
  }

  const p=ri(-5,2), q=p+ri(2,6);
  const cor=p+"≦x≦"+q+" のとき 最小値 "+(q-p);
  return {
    lead:"次の関数の最小値と、そのときの "+T("x")+" の値の範囲を求めよ。",
    disp:"y=\\left|x"+sg(-p)+"\\right|+\\left|x"+sg(-q)+"\\right|",
    ans:mkChoice(cor,[
      "x="+p+" のとき 最小値 "+(q-p),
      "x="+q+" のとき 最小値 "+(q-p),
      p+"≦x≦"+q+" のとき 最小値 "+(q+p),
      p+"≦x≦"+q+" のとき 最小値 0",
      p+"≦x≦"+q+" のとき 最小値 "+(Math.abs(p)+Math.abs(q))
    ],true,true),
    plainQ:"関数 y=|x"+sg(-p)+"|+|x"+sg(-q)+"| の最小値と、そのときの x の値の範囲を求めよ。",
    plainA:cor,
    ex:[
      "絶対値が2つあるので、外れる場所 "+T("x="+p)+" と "+T("x="+q)+" で3つに分けて考える。",
      "① "+T("x \\lt "+p)+" のとき　"+T("y=-(x"+sg(-p)+")-(x"+sg(-q)+")="+poly([[-2,"x"],[p+q,""]])),
      "② "+T(p+" \\leqq x \\leqq "+q)+" のとき　"+T("y=(x"+sg(-p)+")-(x"+sg(-q)+")="+(q-p))+"（<b>一定</b>）",
      "③ "+T(q+" \\lt x")+" のとき　"+T("y=(x"+sg(-p)+")+(x"+sg(-q)+")="+poly([[2,"x"],[-(p+q),""]])),
      "①は右下がり、③は右上がり、②は水平。だから<b>まん中の区間ぜんぶで最小</b>になる。",
      '<div class="exFml">'+esc(cor)+"</div>"
    ]
  };
};

/* ================================================================
