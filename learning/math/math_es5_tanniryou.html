<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="color-scheme" content="only light">
<title>単位量あたりマスター｜小5算数 単位量あたりの大きさ・速さ｜中京個別指導学院</title>
<meta name="description" content="小5算数の単位量あたりの大きさを練習。こみぐあい（1m²あたりの数）、人口密度、いろいろな単位量あたり（1Lで走る道のり・1mのねだん）、速さ（時速・分速・秒速、道のり・時間）、速さの単位の変え方。解説は2本の数直線つき。中京個別指導学院(神丘)の学習ツール。">
<!-- 本番(Heteml)ではサブセット自己ホストに差し替え -->
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<!-- 印刷シートのロゴ透かし（ChukyoPrint） -->
<script src="/assets/print-watermark.js"></script>
<style>
  :root{
    --paper:#FBFAF6;
    --grid:#ECE9E0;
    --sumi:#33312B;
    --usuzumi:#8B877C;
    --shu:#C73E2E;
    --kin:#C9A227;
    --ai:#2C5F8A;
    /* 答え合わせの色は共通モジュール(divp-choice-mark.js)の既定にそろえる */
    --divp-mark-ok:#3E8E5A;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html{ scrollbar-gutter:stable; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:24px 24px;
    color:var(--sumi);
    font-family:"Zen Kaku Gothic New", sans-serif;
    min-height:100dvh;
    display:flex;
    flex-direction:column;     /* ⚠ 横並び(row)にしない。共通ヘッダーが左端に縦長の帯になる */
    touch-action:manipulation;
  }
  .app{
    width:100%;
    max-width:560px;
    margin:0 auto;
    padding:12px 14px calc(90px + env(safe-area-inset-bottom));
    display:flex;
    flex-direction:column;
    gap:12px;
    flex:1;
  }

  /* ---- ヘッダー ---- */
  header{ display:flex; align-items:center; gap:8px; }
  header h1{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:15px; font-weight:700; margin:0;
    white-space:nowrap;          /* 名前が長いので 17px だと スマホで「マスタ／ー」と 折れた */
    letter-spacing:.04em;
  }
  header h1 .sub{
    display:block;
    font-size:11px; font-weight:500; color:var(--usuzumi);
    letter-spacing:.1em;
  }
  .mode-back{
    margin-left:auto;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:11px; font-weight:700;
    color:var(--ai);
    border:1.5px solid var(--ai);
    background:#fff;
    border-radius:8px;
    padding:5px 9px;
    cursor:pointer;
    white-space:nowrap;
  }
  .mode-back.next-to{ margin-left:6px; }

  /* ---- スコア ---- */
  .score{
    display:flex; align-items:baseline; gap:12px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:12px; font-weight:700; color:var(--usuzumi);
  }
  .score b{ color:var(--shu); font-size:17px; }
  .score .streak b{ color:var(--kin); }
  .score .qno{ margin-left:auto; color:var(--ai); }

  /* ---- 問題カード ---- */
  .card{
    position:relative;
    background:#fff;
    border:1.5px solid var(--grid);
    border-radius:16px;
    box-shadow:0 2px 0 rgba(51,49,43,.06);
    padding:16px 16px 14px;
  }
  .card .qtag{
    display:inline-block;
    font-size:11px; font-weight:700;
    color:var(--ai);
    border:1.2px solid var(--ai);
    border-radius:999px;
    padding:2px 10px;
    margin-bottom:8px;
    letter-spacing:.06em;
  }
  .card .qtext{
    font-size:16px; line-height:1.85;
    letter-spacing:.02em;
  }
  .card .qtext b{ color:var(--shu); }

  /* ---- 問題の 表（くらべる問題） ---- */
  .dtbl{ overflow-x:auto; margin:8px 0 6px; }
  .dtbl table{
    border-collapse:collapse;
    margin:0 auto;
    font-family:"Zen Maru Gothic", sans-serif;
    background:#fff;
  }
  .dtbl th, .dtbl td{
    border:1.5px solid #CFC9B8;
    padding:4px 12px;
    text-align:center;
    white-space:nowrap;
    line-height:1.3;
  }
  .dtbl th{
    background:#F5F2EA;
    font-size:12px; font-weight:700;
    color:#6B675D;
  }
  .dtbl th small{ display:block; font-size:10.5px; font-weight:500; }
  .dtbl td{ font-size:15px; font-weight:700; min-width:2.4em; }
  .dtbl td.lb{ background:#F5F2EA; font-size:14px; color:#6B675D; }

  /* ---- 解答パーツ ---- */
  .part{ display:flex; flex-direction:column; gap:8px; }
  .p-label{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700;
    color:var(--ai);
    letter-spacing:.04em;
  }
  .opts{ display:flex; flex-wrap:wrap; gap:8px; }
  .optBtn{
    position:relative;          /* 「正解」バッジの基準（divp-choice-mark.js） */
    flex:1 1 calc(50% - 4px);
    min-width:120px;
    min-height:58px;
    padding:8px 12px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:3px solid #D8D4C8;
    border-radius:11px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:21px; font-weight:700;
    color:var(--sumi);
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    line-height:1.4;
  }
  /* くらべる問題（A・B・C の 3択）は 1列に 3つ */
  .opts.three .optBtn{ flex:1 1 calc(33.3% - 6px); min-width:0; padding:8px 6px; }
  .optBtn .u{ font-size:.68em; margin-left:3px; color:var(--usuzumi); }
  .optBtn .u.pre{ margin:0 4px 0 0; }
  .optBtn.on{
    background:#FDECE9;
    border-color:var(--shu);
    border-bottom-color:var(--shu);
    color:var(--shu);
  }
  .optBtn.on .u{ color:var(--shu); }
  .optBtn:active{ transform:translateY(2px); border-bottom-width:1.5px; }
  .optBtn:disabled{ cursor:default; transform:none; }
  .optBtn:focus-visible{ outline:3px solid var(--ai); outline-offset:2px; }

  /* ---- フィードバック ---- */
  .feedback{ display:none; }
  .feedback.show{ display:flex; flex-direction:column; gap:10px; }
  .fb-msg{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:18px; font-weight:700;
    text-align:center;
    letter-spacing:.06em;
  }
  .fb-msg.good{ color:var(--shu); }
  .fb-msg.bad{ color:var(--ai); }
  .expl{
    background:#fff;
    border:1.5px dashed var(--kin);
    border-radius:12px;
    padding:12px 14px;
    font-size:14px; line-height:2.05;
  }
  .expl b{ color:var(--shu); }
  .expl .ttl{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13px; font-weight:700; color:var(--kin);
    letter-spacing:.08em;
    display:block; margin-bottom:4px;
  }
  .expl .step{ display:block; }
  .expl .fig{ display:flex; justify-content:center; margin:6px 0 0; }
  .expl .fig svg{ width:100%; max-width:330px; height:auto; background:#FFFDF7; border-radius:10px; }
  .expl .cap{
    display:block;
    font-size:12px; line-height:1.6;
    color:var(--usuzumi);
    text-align:center;
    margin-top:2px;
  }
  .expl .kufu{
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--grid);
    font-size:13px; color:var(--ai);
  }
  .toast{
    text-align:center;
    font-size:13px; font-weight:700; color:var(--ai);
    min-height:20px;
  }

  /* ---- 下の大きなボタン ---- */
  .bottom{
    position:fixed;
    left:0; right:0; bottom:0;
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, var(--paper) 62%, rgba(251,250,246,0));
    z-index:20;
  }
  .bottom .inner{ max-width:560px; margin:0 auto; }
  .bigBtn{
    width:100%;
    height:54px;
    border:none;
    border-radius:13px;
    background:var(--shu);
    color:#fff;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:18px; font-weight:700;
    letter-spacing:.2em; text-indent:.2em;
    box-shadow:0 3px 0 #9E2F22;
    cursor:pointer;
  }
  .bigBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 #9E2F22; }
  .bigBtn.next{ background:var(--ai); box-shadow:0 3px 0 #1E466A; }
  .bigBtn.next:active{ box-shadow:0 1px 0 #1E466A; }
  .bigBtn:focus-visible{ outline:3px solid var(--ai); outline-offset:2px; }

  /* ---- モード選択画面（平均マスターと同じ作り） ---- */
  .mode-screen{ display:none; }
  body.choosing .app,
  body.choosing .bottom{ display:none; }
  body.choosing .mode-screen{
    display:flex;
    flex-direction:column;
    gap:10px;
    width:100%;
    max-width:520px;
    margin:0 auto;
    padding:34px 18px 48px;
  }
  .m-logo{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:25px; font-weight:700;
    text-align:center;
    letter-spacing:.08em;
  }
  .m-sub{
    text-align:center;
    font-size:13px; color:var(--usuzumi);
    margin-bottom:8px;
  }
  .m-card{
    display:flex; align-items:center; gap:13px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:4px solid #D8D4C8;
    border-radius:16px;
    padding:14px 16px;
    cursor:pointer;
    text-align:left;
    font-family:inherit;
    color:inherit;
    width:100%;
  }
  .m-card:active{ transform:translateY(2px); border-bottom-width:1.5px; }
  .m-card.chal{ border-color:#BFD4C6; border-bottom-color:#8FB9A0; background:#F7FBF8; }
  .m-card.mix{ border-color:var(--kin); border-bottom-color:var(--kin); }
  .m-sep{
    display:flex; align-items:center; gap:8px;
    margin-top:14px;
    font-size:11.5px; color:var(--usuzumi); letter-spacing:.06em;
  }
  .m-sep::before, .m-sep::after{
    content:""; flex:1; height:1px; background:var(--grid);
  }
  .m-body{ display:flex; flex-direction:column; gap:2px; min-width:0; }
  .m-name{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:17px; font-weight:700;
  }
  .m-desc{ font-size:11.5px; color:var(--usuzumi); line-height:1.5; }

  /* 解き直し(?retry=1)の案内帯 */
  #retryBanner{
    background:#FBF3E0;
    border:1.5px solid var(--kin);
    border-radius:10px;
    padding:9px 12px;
    font-size:12.5px; line-height:1.6;
    color:#6E5518;
  }

  /* 積もったキラキラ(divp-correct-kirakira の pile, z-index:5)にうもれないように。
     モジュール側の :where() は詳細度0で、div/span だけで組んだ帯は
     セレクタから漏れるため、画面の直下の子をまとめて前面に出しておく */
  .divp-header{ position:relative; z-index:11; }
  .app > *, .mode-screen > *, .feedback > *{ position:relative; z-index:10; }

  /* ---- モード画面の「プリントを 印刷する」 ---- */
  .m-print{
    background:#fff;
    border:1.5px dashed #CFC9B8;
    border-radius:16px;
    padding:12px 14px 14px;
  }
  .m-print-ttl{
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:15px; font-weight:700;
    margin-bottom:9px;
  }
  .m-print-ttl span{
    display:block;
    font-family:"Zen Kaku Gothic New", sans-serif;
    font-size:11px; font-weight:500; color:var(--usuzumi);
    margin-top:1px;
  }
  .m-print-btns{ display:flex; flex-wrap:wrap; gap:7px; }
  .m-print-btns button{
    flex:1 1 calc(33% - 7px);
    min-width:92px; min-height:40px;
    background:#fff;
    border:1.5px solid var(--grid);
    border-bottom:3px solid #D8D4C8;
    border-radius:10px;
    font-family:"Zen Maru Gothic", sans-serif;
    font-size:13.5px; font-weight:700;
    color:var(--sumi);
    cursor:pointer;
  }
  .m-print-btns button:active{ transform:translateY(2px); border-bottom-width:1.5px; }

  /* ---- 印刷シート ---- */
  .print-area{ display:none; }
  @media print{
    @page{ size:A4 portrait; margin:10mm 11mm; }
    /* 共通ヘッダーは紙に出さない（assets/divp-header.js と同じ方針） */
    .divp-header{ display:none !important; }
    .mode-screen, .app, .bottom,
    #divp-kk-layer, #divp-kk-pile, .divp-kk-layer, .divp-kk-canvas, .divp-kk-text{ display:none !important; }
    html, body{ background:#fff !important; min-height:0 !important; }
    body{ display:block !important; }
    .print-area{ display:block !important; color:#222; font-family:"Zen Kaku Gothic New", sans-serif; }
    .sheet{ position:relative; page-break-after:always; break-after:page;
      -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sheet:last-child{ page-break-after:auto; break-after:auto; }
    .p-head{ position:relative; z-index:1; display:flex; justify-content:space-between; align-items:flex-end;
      border-bottom:2px solid #33312B; padding-bottom:4px; margin-bottom:6px; }
    .p-school{ font-size:11px; font-weight:700; color:#555; }
    .p-title{ font-family:"Zen Maru Gothic", sans-serif; font-weight:700; font-size:20px; margin-top:1px; }
    .p-title small{ font-size:13px; margin-left:8px; color:#555; }
    .p-name{ font-size:12px; white-space:nowrap; }
    .p-name span{ display:inline-block; border-bottom:1px solid #000; min-width:170px; margin-left:6px; }
    .p-inst{ position:relative; z-index:1; font-size:11.5px; margin:0 0 6px; }
    /* ⚠ くらべる問題は 4行の 表が 入って 背が高い。1行に 2問 並ぶので、
       2つ 並ぶ 行が あっても 1枚に 入るように すき間を 詰めてある */
    .p-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:3mm 7mm; }
    .p-item{ break-inside:avoid; page-break-inside:avoid; padding:1mm 1mm 0; }
    .p-no{ display:inline-block; font-weight:700; font-size:12px; background:#33312B; color:#fff;
      border-radius:5px; padding:0 7px; margin-right:4px; }
    .p-tag{ font-size:9.5px; color:#777; }
    .p-q{ font-size:12px; line-height:1.65; margin:2px 0 0; min-height:15mm; }
    .p-q b{ color:#222; }
    .p-q .dtbl{ margin:3px 0 3px; overflow:visible; }
    .p-q .dtbl table{ margin:0; }
    .p-q .dtbl th, .p-q .dtbl td{ border:1px solid #888; padding:1px 7px; }
    .p-q .dtbl th{ font-size:9.5px; background:#f2f2f2; color:#333; }
    .p-q .dtbl th small{ display:inline; font-size:8.5px; }
    .p-q .dtbl td{ font-size:12px; min-width:2em; }
    .p-q .dtbl td.lb{ font-size:11px; background:#f2f2f2; color:#333; }
    .p-ans{ display:flex; align-items:flex-end; gap:6px; margin-top:1.5mm; font-size:11px; color:#555; }
    .p-ans i{ flex:1; border-bottom:1px solid #333; height:6.5mm; font-style:normal; }
    .a-grid{ position:relative; z-index:1; display:grid; grid-template-columns:1fr 1fr; gap:2.5mm 7mm; }
    .a-item{ break-inside:avoid; font-size:12px; line-height:1.6; border-bottom:1px dashed #ccc; padding:1.5mm 0 2mm; }
    .a-item .a-v{ font-family:"Zen Maru Gothic", sans-serif; font-size:16px; font-weight:700; color:#C73E2E; margin-left:4px; }
    .a-item .a-v .u{ font-size:.75em; margin:0 2px; }
    .a-item .a-how{ display:block; font-size:10.5px; color:#555; line-height:1.55; margin-top:1px; }
  }
</style>
</head>
<body class="choosing" data-theme="es" data-effect="kirakira">

<!-- 共通ヘッダー(ロゴ・ログイン窓)の差し込み先。script は body 直後に置くこと -->
<div class="divp-header"></div>
<!-- 学習記録システム共通モジュール -->
<script src="/assets/divp-core.js" defer></script>
<script src="/assets/divp-header.js" defer></script>
<!-- 小学生ツールなので正解演出は星バースト。
     data-effect="kirakira" なので、都道府県マスターと同じ星が
     そのまま画面の下に積もっていく（divp-core.js より後ろに置くこと） -->
<script src="/assets/divp-correct-kirakira.js" defer></script>
<!-- 選択肢の答え合わせ表示（正解=緑 / 選んだ誤答=朱） -->
<script src="/assets/divp-choice-mark.js" defer></script>

<div class="mode-screen" id="modeScreen">
  <div class="m-logo">単位量あたりマスター</div>
  <div class="m-sub">小5 算数 ／ れんしゅうしたいものを えらんでね</div>
  <div id="retryBannerSlot"></div>

  <button type="button" class="m-card" data-mode="komi">
    <span class="m-body"><span class="m-name">こみぐあい</span>
    <span class="m-desc">1m² あたりの 数、1人 あたりの 広さ。
    広さも 数も ちがう 部屋は どこが いちばん こんでいる？</span></span>
  </button>

  <button type="button" class="m-card" data-mode="jinko">
    <span class="m-body"><span class="m-name">人口密度</span>
    <span class="m-desc">1km² あたりの 人口 ＝ 人口 ÷ 面積。
    四捨五入して 整数に する 問題も</span></span>
  </button>

  <button type="button" class="m-card" data-mode="iroiro">
    <span class="m-body"><span class="m-name">いろいろな 単位量あたり</span>
    <span class="m-desc">1L で 走る 道のり、1m の ねだん、1m² で とれる 量。
    1あたり・全体・いくつ分を 求める</span></span>
  </button>

  <button type="button" class="m-card" data-mode="hayasa">
    <span class="m-body"><span class="m-name">速さ</span>
    <span class="m-desc">速さ ＝ 道のり ÷ 時間。道のり・時間も 求める。
    いちばん 速いのは だれ？</span></span>
  </button>

  <button type="button" class="m-card chal" data-mode="kansan">
    <span class="m-body"><span class="m-name">時速・分速・秒速（チャレンジ）</span>
    <span class="m-desc">時速 54km は 秒速 何m？ 1時間 ＝ 60分、1分 ＝ 60秒、
    1km ＝ 1000m で 考える</span></span>
  </button>

  <button type="button" class="m-card mix" data-mode="mix">
    <span class="m-body"><span class="m-name">ランダム</span>
    <span class="m-desc">ぜんぶの 種類を ごちゃまぜで 出題（しあげ用）</span></span>
  </button>

  <div class="m-sep">プリントで れんしゅうしたいときは</div>

  <div class="m-print">
    <div class="m-print-ttl">🖨 プリントを 印刷する<span>A4・10問＋答えのページ／押すたびに ちがう問題</span></div>
    <div class="m-print-btns" id="printBtns">
      <button type="button" data-mode="komi">こみぐあい</button>
      <button type="button" data-mode="jinko">人口密度</button>
      <button type="button" data-mode="iroiro">いろいろ</button>
      <button type="button" data-mode="hayasa">速さ</button>
      <button type="button" data-mode="kansan">時速・分速・秒速</button>
      <button type="button" data-mode="mix">ランダム</button>
    </div>
  </div>
</div>

<div class="app" id="app">
  <header>
    <h1>単位量あたりマスター<span class="sub" id="modeLabel">こみぐあい</span></h1>
    <button type="button" class="mode-back" id="printBtn" title="このモードのプリントを印刷">🖨 プリント</button>
    <button type="button" class="mode-back next-to" id="homeBtn">ホームに戻る</button>
  </header>

  <div class="score">
    <span>せいかい <b id="scoreOk">0</b> / <span id="scoreAll">0</span></span>
    <span class="streak">れんぞく <b id="scoreStreak">0</b></span>
    <span class="qno" id="qNo"></span>
  </div>

  <div class="card">
    <span class="qtag" id="qTag">問題</span>
    <div class="qtext" id="qText"></div>
  </div>

  <div id="partArea" style="display:flex;flex-direction:column;gap:14px"></div>

  <div class="toast" id="toast"></div>

<script>
"use strict";
/* =====================================================================
   単位量あたりマスター（算数・小5「単位量あたりの大きさ」）
   unit_key = math_es5_tanniryou
   ※ 2020年度からの 教科書では「速さ」も 小5の この単元に 入っている。

   ■ モードと question_key
     こみぐあい         → komi（1m² あたりの 数・1人 あたりの 広さ）/
                          komi_hikaku（3つの 部屋で いちばん こんでいる・すいている）
     人口密度           → jinko（人口 ÷ 面積。3問に1問は 四捨五入して 整数）/
                          jinko_hikaku（3つの 市で いちばん 高い・低い）
     いろいろな単位量あたり → iroiro_tanni（1あたり ＝ 全体 ÷ いくつ分）/
                          iroiro_zentai（全体 ＝ 1あたり × いくつ分）/
                          iroiro_ikutsu（いくつ分 ＝ 全体 ÷ 1あたり）/
                          iroiro_hikaku（3つの 中で いちばん 安い・多い）
     速さ               → hayasa_motomeru / hayasa_michinori / hayasa_jikan /
                          hayasa_hikaku（3人・3台で いちばん 速い・おそい）
     時速・分速・秒速    → hayasa_kansan（6とおりの 変え方）
     ランダム           → 上の ぜんぶ（question_key は実際に出た種類）
     日本語ラベルは db/seeds/seed_math_es5_tanniryou.sql で question_catalog へ。

   ■ 解き直し（?retry=1）は「種(seed)方式」＝ CLAUDE.md 2d（平均マスターと同じ）
     乱数は ri()/pick()/shuffle() に一本化してあり、出題のたびに種を1つ引いて
     question_params:{m:question_key, s:種} だけを保存する。
     ⚠ 生成関数の中身を変えると、既存 pending の種から出る問題が変わる
       （params_hash は同じままなので解き直し自体は成立する）。
     ⚠ 生成関数の中で Math.random() を 直接 呼ばないこと（種で 再現できなくなる）。

   ■ 数は「100分の1 を 単位に した 整数」で 持つ（1.5人 → 150）。
     表示の ときだけ 小数に もどすので、0.1＋0.2 の ような 誤差が 出ない。

   ■ 図（question_figure）は 渡さない
     問題は 文章と 表だけで 解ける（表の 数は question_text にも ならべて 入れる）。
     解説の「2本の 数直線」は 説明用。
   ===================================================================== */

var UNIT_KEY = "math_es5_tanniryou";

/* ---------- 共通モジュールの安全呼び出し（未読込でも壊れない） ---------- */
function safeDivp(fn){
  try{
    if(window.Divp && typeof window.Divp[fn] === "function"){
      return window.Divp[fn].apply(window.Divp, [].slice.call(arguments,1));
    }
  }catch(e){}
  return null;
}

/* ---------- RNG（xorshift32・種から決まった順に出る） ---------- */
var _rngState = 1;
function rngSeed(s){ _rngState = (s>>>0) || 1; }
function rngPick(){ return (Math.floor(Math.random()*4294967296)>>>0) || 1; }  /* 種そのものだけ真の乱数 */
function rngNext(){
  var x = _rngState;
  x ^= x<<13; x >>>= 0; x ^= x>>>17; x ^= x<<5; x >>>= 0;
  _rngState = x;
  return x/4294967296;
}
function ri(min,max){ return Math.floor(rngNext()*(max-min+1))+min; }
function pick(arr){ return arr[ri(0,arr.length-1)]; }
function shuffle(arr){
  var a = arr.slice();
  for(var i=a.length-1;i>0;i--){ var j=ri(0,i); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ---------- 数のあつかい ---------- */
function isInt(v){ return Math.abs(v-Math.round(v)) < 1e-9; }
/* 小数（1.5）→ 100分の1 単位の 整数（150） */
function H(x){ return Math.round(x*100); }
/* 100分の1 単位の 整数 → 表示（150 → "1.5"） */
function d100(v){ return String(Math.round(v)/100); }
/* 大きな 整数に 3けたごとの 「,」（人口） */
function fmtC(n){ return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ","); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function nowMs(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
/* 画面用の HTML から 記録用の 1行を 作る（タグと 分かち書きの 空白を 取る） */
function plainOf(html){
  return String(html).replace(/<br>/g,"").replace(/<[^>]+>/g,"").replace(/ /g,"");
}
function st(s){ return '<span class="step">'+s+'</span>'; }

/* ---------- 選択肢 ----------
   選択肢は {html, plain, key, ok}。数は 100分の1 単位の 整数で 受け取る。
   pre は 速さの「時速」「分速」「秒速」（数の 前に 付く）。
   0以下・100分の1で わりきれない 数（2.333…）は ok=false で はじく。 */
function optNum(v,u,pre){
  var ok = v > 0 && isInt(v);
  v = Math.round(v);
  return { html: (pre ? '<span class="u pre">'+pre+'</span>' : "") + d100(v) + (u ? '<span class="u">'+u+'</span>' : ""),
           plain: (pre ? pre+" " : "") + d100(v) + (u ? " "+u : ""),
           key: "n"+v, ok: ok };
}
/* くらべる問題の 選択肢（A・B・C）。tail は「の 部屋」「さん」など */
function optLetter(L, tail){
  return { html: L + '<span class="u">'+tail+'</span>', plain: L + tail.replace(/ /g,""), key: L, ok: true };
}
/* 正解1つ＋まちがい3つ。cands（ねらった まちがい）を先に使い、足りなければ fb で うめる */
function buildChoices(cor, cands, fb){
  var out = [cor], seen = {}, i;
  seen[cor.key] = 1;
  function add(c){
    if(out.length >= 4 || !c || !c.ok || seen[c.key]) return;
    seen[c.key] = 1; out.push(c);
  }
  var cs = shuffle(cands);
  for(i=0;i<cs.length;i++) add(cs[i]);
  for(i=0;i<fb.length;i++) add(fb[i]);
  var arr = shuffle(out);
  return { options: arr, correct: arr.indexOf(cor) };
}
/* 数の答えの うめ草（正解の となりの数） */
function numFallback(ans, step, u, pre){
  var a = [];
  for(var k=1;k<=6;k++){ a.push(optNum(ans+step*k,u,pre)); a.push(optNum(ans-step*k,u,pre)); }
  return a;
}
/* うめ草の 刻み：答えの いちばん下の 位に そろえる（60 → 1、59.6 → 0.1、6.25 → 0.01） */
function stepOf(v){ return v % 100 === 0 ? 100 : v % 10 === 0 ? 10 : 1; }

/* 問題を くみたてる（全種類 共通）。o.options があれば その順の まま（くらべる問題） */
function mk(o){
  var ch = o.options ? { options:o.options, correct:o.correct } : buildChoices(o.cor, o.cands, o.fb);
  return {
    key: o.key, tag: o.tag,
    qHtml: o.q, plainQ: o.plain,
    label: o.label, u: o.u || "", pre: o.pre || "",
    options: ch.options, correct: ch.correct,
    ansText: ch.options[ch.correct].plain,
    expl: '<span class="ttl">とき方</span>' + o.expl
        + (o.kufu ? '<div class="kufu">💡 ' + o.kufu + '</div>' : ""),
    chk: o.chk || null
  };
}

/* =====================================================================
   2本の 数直線（解説用 SVG）。色・線は 属性で 書く（CLAUDE.md 2b と同じ流儀）
     上の線 = 全体の 量（道のり・人数・代金…）、下の線 = いくつ分（時間・面積・長さ…）
     左から 0 ／ 1 ／ いくつ分。わからない ところは 朱の □。
     弧の 矢印（×3 ／ ÷3）は 上と 下で 同じ＝「同じ 倍に なる」

var SVGFONT = "Zen Maru Gothic,Hiragino Maru Gothic ProN,HGMaruGothicMPRO,sans-serif";
var COL = { shu:"#C73E2E", ai:"#2C5F8A", ink:"#33312B", sub:"#8B877C" };
function svgText(x,y,s,color,anchor,size,weight){
  return '<text x="'+x+'" y="'+y+'" fill="'+color+'" font-size="'+(size||12)+'" font-weight="'+(weight||700)
       + '" text-anchor="'+(anchor||"middle")+'" font-family="'+SVGFONT+'">'+esc(s)+'</text>';
}
function dnlArc(xa, xb, y, cy, rev, op, top){
  var a = xa + 14, b = xb - 14, mx = (xa + xb)/2;
  var s = '<path d="M'+a+' '+y+' Q'+mx+' '+cy+' '+b+' '+y+'" fill="none" stroke="'+COL.shu+'" stroke-width="1.5"/>';
  /* 矢じり：終わりの 点での 向き（終点 − 制御点） */
  var ex = rev ? a : b, dx = ex - mx, dy = y - cy, L = Math.sqrt(dx*dx + dy*dy);
  dx /= L; dy /= L;
  var px = -dy, py = dx, r1 = function(v){ return Math.round(v*10)/10; };
  s += '<polygon points="'+r1(ex)+','+y+' '+r1(ex-dx*7+px*4)+','+r1(y-dy*7+py*4)+' '+r1(ex-dx*7-px*4)+','+r1(y-dy*7-py*4)
     + '" fill="'+COL.shu+'"/>';
  var peak = (y + cy)/2;
  s += svgText(mx, top ? peak-5 : peak+15, op, COL.shu, "middle", 12.5);
  return s;
}
function dnl(o){
  var X0 = 90, XA = 180, XB = 292, XE = 322, YT = 62, YB = 104;
  var s = '', i, xs = [X0, XA, XB];
  s += '<line x1="'+X0+'" y1="'+YT+'" x2="'+XE+'" y2="'+YT+'" stroke="'+COL.ink+'" stroke-width="1.4"/>';
  s += '<line x1="'+X0+'" y1="'+YB+'" x2="'+XE+'" y2="'+YB+'" stroke="'+COL.ink+'" stroke-width="1.4"/>';
  for(i=0;i<xs.length;i++){
    s += '<line x1="'+xs[i]+'" y1="'+(YT-5)+'" x2="'+xs[i]+'" y2="'+(YT+5)+'" stroke="'+COL.ink+'" stroke-width="1.4"/>';
    s += '<line x1="'+xs[i]+'" y1="'+(YB-5)+'" x2="'+xs[i]+'" y2="'+(YB+5)+'" stroke="'+COL.ink+'" stroke-width="1.4"/>';
  }
  s += '<line x1="'+XA+'" y1="'+(YT+7)+'" x2="'+XA+'" y2="'+(YB-7)+'" stroke="'+COL.sub+'" stroke-width="1" stroke-dasharray="3 3"/>';
  s += '<line x1="'+XB+'" y1="'+(YT+7)+'" x2="'+XB+'" y2="'+(YB-7)+'" stroke="'+COL.sub+'" stroke-width="1" stroke-dasharray="3 3"/>';
  s += svgText(X0-10, YT+4, o.tn+"("+o.tu+")", COL.ai, "end", 11);
  s += svgText(X0-10, YB+4, o.bn+"("+o.bu+")", COL.ai, "end", 11);
  s += svgText(X0, YT-10, "0", COL.sub, "middle", 12);
  s += svgText(X0, YB+20, "0", COL.sub, "middle", 12);
  function val(x, y, v){
    var q = v === "□";
    return svgText(x, y, v, q ? COL.shu : COL.ink, "middle", q ? 15 : 13);
  }
  s += val(XA, YT-10, o.ta) + val(XB, YT-10, o.tb) + val(XA, YB+20, o.ba) + val(XB, YB+20, o.bb);
  if(o.op){
    s += dnlArc(XA, XB, YT-26, YT-52, o.rev, o.op, true);
    s += dnlArc(XA, XB, YB+30, YB+56, o.rev, o.op, false);
  }
  return '<div class="fig"><svg viewBox="0 0 330 172" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="2本の数直線">'
       + s + '</svg></div>'
       + '<span class="cap">上と 下は いつも 同じ 倍（'+esc(o.op)+'）に なる</span>';
}

/* =====================================================================
   くらべる問題（3つの 中で いちばん ○○ なのは どれ？）の 共通部品
   ===================================================================== */
var LET = ["A","B","C"];
/* 一番 大きい（max=true）／小さい ものの 番号。同じ値が 2つ以上 あれば -1 */
function argBy(rs, f, max){
  var bi = 0, i;
  for(i=1;i<rs.length;i++) if(max ? rs[i][f] > rs[bi][f] : rs[i][f] < rs[bi][f]) bi = i;
  for(i=0;i<rs.length;i++) if(i !== bi && rs[i][f] === rs[bi][f]) return -1;
  return bi;
}
function allDiff(rs, f){
  return rs[0][f] !== rs[1][f] && rs[1][f] !== rs[2][f] && rs[0][f] !== rs[2][f];
}
/* 条件に 合う 組が 見つからず 予備の 決まった 表を 使った ときの 印。
   ⚠ 予備ばかり 出ると 毎回 同じ 表に なる（電車で 実際に 起きた）。テストで 0回を 見張る */
function withFb(fb, q){ q.fallback = !!fb; return q; }
/* o: key, tag, lead, c1/c2（列の 見出し {h,u}）, rows（{v1,v2,calc,per}）, ask, label,
      tail（「の 部屋」）, how（くらべ方の 1行）, perPre, perU, which（「多い」）, best, kufu */
function mkHikaku(o){
  var tb = '<div class="dtbl"><table><tr><th></th>'
         + '<th>'+o.c1.h+'<small>('+o.c1.u+')</small></th>'
         + '<th>'+o.c2.h+'<small>('+o.c2.u+')</small></th></tr>';
  o.rows.forEach(function(r,i){
    tb += '<tr><td class="lb">'+LET[i]+'</td><td>'+r.v1+'</td><td>'+r.v2+'</td></tr>';
  });
  tb += '</table></div>';
  var plainRows = o.rows.map(function(r,i){
    return LET[i]+"："+r.v1+o.c1.u+"・"+r.v2+o.c2.u;
  }).join("、");
  var ex = st(o.how);
  o.rows.forEach(function(r,i){
    ex += st(LET[i]+'： '+r.calc+' ＝ '+(o.perPre ? o.perPre+' ' : '')+r.per+' '+o.perU);
  });
  ex += st('いちばん '+o.which+'のは <b>'+LET[o.best]+(o.tail.charAt(0) === "の" ? " " : "")+o.tail+'</b>');
  return mk({
    key:o.key, tag:o.tag,
    q:o.lead + tb + o.ask,
    plain:plainOf(o.ask) + plainRows,
    label:o.label, u:"",
    options:LET.map(function(L){ return optLetter(L, o.tail); }),
    correct:o.best,
    expl:ex,
    kufu:o.kufu

}

/* =====================================================================
   ① こみぐあい（1m² あたりの 数 ／ 1人 あたりの 広さ）
   ===================================================================== */
var KOMI_CTX = [
  { a:[4,5,6,8,10,12], p:[3,30], an:"面積", au:"m²", pn:"うさぎ", pu:"ひき",
    intro:"{a}m²の 小屋に うさぎが {p}ひき います。",
    ask1:"1m² あたり 何びき ですか。", l1:"1m² あたり 何びき？",
    f1:"1m² あたりの 数 ＝ うさぎの 数 ÷ 面積",
    ask2:"うさぎ 1ぴき あたり 何m² ですか。", l2:"1ぴき あたり 何m²？",

    f1:"たたみ 1まい あたりの 人数 ＝ 人数 ÷ たたみの 数",
    ask2:"子ども 1人 あたり たたみ 何まい ですか。", l2:"1人 あたり 何まい？",
    f2:"1人 あたりの たたみ ＝ たたみの 数 ÷ 人数" },
  { a:[4,5,8,10,12,15,20], p:[10,80], an:"面積", au:"m²", pn:"球根", pu:"こ",
    intro:"{a}m²の 花だんに チューリップの 球根を {p}こ うえます。",
    ask1:"1m² あたり 何こ うえる ことに なりますか。", l1:"1m² あたり 何こ？",
    f1:"1m² あたりの 数 ＝ 球根の 数 ÷ 面積",
    ask2:null },
  { a:[20,24,25,30,40,50], p:[8,40], an:"面積", au:"m²", pn:"子ども", pu:"人",
    intro:"{a}m²の すな場で 子どもが {p}人 遊んで います。",
    ask1:"1m² あたり 何人 ですか。", l1:"1m² あたり 何人？",
    f1:"1m² あたりの 人数 ＝ 人数 ÷ 面積",
    ask2:"子ども 1人 あたり 何m² ですか。", l2:"1人 あたり 何m²？",
    f2:"1人 あたりの 面積 ＝ 面積 ÷ 人数" }
];
function gen_komi(){
  var c = pick(KOMI_CTX);
  var dir = (c.ask2 && ri(1,3) === 1) ? 2 : 1;
  var a = 0, p = 0, t, good = false;
  for(t=0;t<400 && !good;t++){
    a = pick(c.a); p = ri(c.p[0], c.p[1]);
    if(a === p) continue;
    good = dir === 1 ? (p*100) % a === 0 : (a*100) % p === 0;
  }
  if(!good){ dir = 1; a = c.a[0]; p = a*2; }
  var num = dir === 1 ? p : a, den = dir === 1 ? a : p;
  var A = num*100/den;
  var u = dir === 1 ? c.pu : c.au;
  var q = c.intro.replace("{a}", a).replace("{p}", p) + "<br>" + (dir === 1 ? c.ask1 : c.ask2);
  return mk({
    key:"komi", tag:"こみぐあい",
    q:q, plain:plainOf(q),
    label: dir === 1 ? c.l1 : c.l2, u:u,
    cor:optNum(A, u),
    cands:[
      optNum(den*100/num, u),                 /* 反対に わった */
      optNum(num*den*100, u),                 /* かけ算に した */
      optNum(A*10, u),                        /* 小数点の 位置を まちがえた */
      optNum(A/10, u),
      optNum((num-den)*100, u)                /* ひき算に した */
    ],
    fb:numFallback(A, stepOf(A), u),

        +dnl(dir === 1
          ? { tn:c.pn, tu:c.pu, ta:"□", tb:String(p), bn:c.an, bu:c.au, ba:"1", bb:String(a), op:"÷"+a, rev:true }
          : { tn:c.an, tu:c.au, ta:"□", tb:String(a), bn:c.pn, bu:c.pu, ba:"1", bb:String(p), op:"÷"+p, rev:true }),
    kufu: dir === 1
      ? "1あたりの 数が 大きいほど こんで いる。広さが ちがう ものどうしも、1あたりに そろえれば くらべられる。"
      : "1人（1ぴき）あたりの 広さが せまいほど こんで いる。こちらは 数が 小さいほど こんで いる ことに 注意。",
    chk:{ ans:A/100 }

}

var KOMI_H_CTX = [
  { obj:"部屋", tail:"の 部屋", lead:"3つの 部屋の たたみの 数と、そこに いる 子どもの 人数です。",

function gen_komi_hikaku(){
  var c = pick(KOMI_H_CTX);
  var crowd = ri(1,3) !== 1;               /* こんでいる（多め）／すいている */
  var R = null, best = -1, t, i;
  for(t=0;t<800 && !R;t++){
    var rs = [];
    for(i=0;i<3;i++){
      /* 電車（c.d）は 1両 あたりの 人数を 先に 決めて 人数を 作る（1両 あたりが 整数に なる）。
         人数を でたらめに 引いて わりきれるのを 待つと、3両ぶん そろう 確率が 低すぎて
         予備の 決まった 表ばかり 出た */
      var a = pick(c.a), p = c.d ? ri(c.d[0], c.d[1])*a : ri(c.p[0], c.p[1]);
      rs.push({ a:a, p:p, d:p*100/a });
    }
    if(!rs.every(function(r){ return (r.p*100) % r.a === 0; })) continue;
    if(!allDiff(rs, "d")) continue;
    best = argBy(rs, "d", crowd);
    /* 人数だけ（広さだけ）で 見ても 答えが 出て しまう 組は さける */
    if(best === argBy(rs, "p", crowd)) continue;
    if(t < 500 && best === argBy(rs, "a", !crowd)) continue;
    R = rs;
  }
  var fb = !R;                             /* 予備（テストで 0回で あることを 見る） */
  if(!R){
    R = [{a:16,p:20,d:125},{a:8,p:16,d:200},{a:5,p:9,d:180}];
    if(c.d) R = [{a:10,p:600,d:6000},{a:4,p:320,d:8000},{a:5,p:350,d:7000}];
    best = argBy(R, "d", crowd);
  }
  var w = crowd ? "こんで いる" : "すいて いる";
  return withFb(fb, mkHikaku({
    key:"komi_hikaku", tag:"こみぐあいを くらべる",
    lead:c.lead, c1:c.c1, c2:c.c2,
    rows:R.map(function(r){ return { v1:String(r.a), v2:String(r.p), calc:r.p+' ÷ '+r.a, per:d100(r.d) }; }),
    ask:"いちばん "+w+" "+c.obj+"は どれですか。",
    label:"いちばん "+w+"のは？",
    tail:c.tail,
    how:c.per+"で くらべる（"+c.pc+"）",
    perU:c.pu, which: crowd ? "大きい" : "小さい", best:best,
    kufu:"数だけ、広さだけを 見て くらべると まちがえる。どちらも ちがう ときは、"
        +"「1あたり」に そろえて くらべる。1あたりの 数が "+(crowd ? "大きい" : "小さい")+"ほど "+(crowd ? "こんで いる" : "すいて いる")+"。"
  }));
}

/* =====================================================================
   ② 人口密度（1km² あたりの 人口）
   ===================================================================== */
function gen_jinko(){
  var round = ri(1,3) === 1;
  var a = 0, d = 0, pop = 0, t;
  for(t=0;t<300;t++){
    a = ri(15,320); d = ri(12,480)*5; pop = d*a;
    if(pop >= 3000 && pop <= 400000) break;
  }
  if(pop < 3000 || pop > 400000){ a = 40; d = 1300; pop = 52000; }
  var ans = d, q10 = 0, rUp = false;
  if(round){
    pop += ri(1, a-1);
    var qq = Math.floor(pop/a), rem = pop - qq*a;
    q10 = Math.floor(rem*10/a);                         /* 小数第1位 */
    rUp = rem*2 >= a;
    ans = rUp ? qq+1 : qq;
  }
  var town = pop >= 50000 ? "市" : "町";
  var q = "ある "+town+"の 人口は <b>"+fmtC(pop)+"人</b>、面積は <b>"+a+"km²</b> です。<br>"
        + "この "+town+"の 人口密度を 求めましょう。"
        + (round ? "<br>答えは 四捨五入して 整数で 求めましょう。" : "");
  var A = ans*100;
  var cands = [ optNum(A*10, "人"), optNum(A/10, "人"), optNum(Math.round(ans/10)*100, "人") ];
  if(round) cands.push(optNum(rUp ? A-100 : A+100, "人"));       /* 四捨五入の 向きを まちがえた */
  var ex = st('人口密度 ＝ 人口 ÷ 面積（1km² あたりの 人口）');
  if(round){
    var qq2 = Math.floor(pop/a), exact = ((pop - qq2*a)*10) % a === 0;
    ex += st(fmtC(pop)+' ÷ '+a+' ＝ '+qq2+'.'+q10+(exact ? '' : '…'))
        + st('小数第1位の '+q10+'を 四捨五入して <b>'+ans+' 人</b>');
  }else{
    ex += st(fmtC(pop)+' ÷ '+a+' ＝ <b>'+ans+' 人</b>');
  }
  ex += dnl({ tn:"人口", tu:"人", ta:"□", tb:fmtC(pop), bn:"面積", bu:"km²", ba:"1", bb:String(a), op:"÷"+a, rev:true });
  return mk({
    key:"jinko", tag: round ? "人口密度（四捨五入）" : "人口密度",
    q:q, plain:plainOf(q),
    label:"1km² あたり 何人？", u:"人",
    cor:optNum(A, "人"),
    cands:cands,
    fb:numFallback(A, round ? 100 : 1000, "人"),
    expl:ex,
    kufu:"人口密度は「1km² あたり 何人 住んで いるか」。人口密度が 高いほど こみあって いる。"
        +(round ? "四捨五入は 小数第1位を 見て、5以上なら 1 上げる。" : ""),
    chk:{ ans:ans }
  });
}

function gen_jinko_hikaku(){
  var high = ri(1,3) !== 1;
  var R = null, best = -1, t, i;
  for(t=0;t<800 && !R;t++){
    var rs = [];
    for(i=0;i<3;i++){
      var a = ri(20,150), d = ri(8,250)*10;
      rs.push({ a:a, p:a*d, d:d });
    }
    if(!allDiff(rs, "d") || !allDiff(rs, "p")) continue;
    best = argBy(rs, "d", high);
    if(best === argBy(rs, "p", high)) continue;           /* 人口だけで 決まる 組は さける */
    if(t < 500 && best === argBy(rs, "a", !high)) continue;
    R = rs;
  }

  if(!R){ R = [{a:40,p:52000,d:1300},{a:120,p:96000,d:800},{a:25,p:45000,d:1800}]; best = argBy(R, "d", high); }
  var w = high ? "高い" : "低い";
  return withFb(fb, mkHikaku({
    key:"jinko_hikaku", tag:"人口密度で くらべる",
    lead:"3つの 市の 面積と 人口です。",
    c1:{h:"面積", u:"km²"}, c2:{h:"人口", u:"人"},

}

function gen_iroiro(kind){
  var c = pick(IRO_CTX);
  var p100 = 0, n10 = 0, t;
  for(t=0;t<100;t++){
    p100 = H(pick(c.per)); n10 = Math.round(pick(c.n)*10);
    if((p100*n10) % 10 === 0) break;
  }
  var T100 = p100*n10/10, n100 = n10*10;
  var pS = d100(p100), nS = d100(n100), TS = d100(T100);
  var q = c[kind].replace("{p}", pS).replace("{n}", nS).replace("{T}", TS);
  var tag = { tanni:"1あたりを 求める", zentai:"全体を 求める", ikutsu:"いくつ分を 求める" }[kind];
  var base = { key:"iroiro_"+kind, tag:tag, q:q, plain:plainOf(q) };
  if(kind === "tanni"){
    base.label = c.one+" あたり 何"+c.au+"？"; base.u = c.au;
    base.cor = optNum(p100, c.au);
    base.cands = [
      optNum(n100*100/T100, c.au),              /* 反対に わった */
      optNum(T100*n100/100, c.au),              /* かけ算に した */
      optNum(p100*10, c.au), optNum(p100/10, c.au),
      optNum(T100 - n100, c.au)                 /* ひき算に した */
    ];
    base.fb = numFallback(p100, stepOf(p100), c.au);
    base.expl = st(c.one+' あたりの 量 ＝ 全体の 量 ÷ いくつ分')
              + st(TS+' ÷ '+nS+' ＝ <b>'+pS+' '+c.au+'</b>')
              + dnl({ tn:c.tn, tu:c.au, ta:"□", tb:TS, bn:c.bn, bu:c.cu, ba:"1", bb:nS, op:"÷"+nS, rev:true });
    base.kufu = "「"+c.one+" あたり」は、全体を いくつ分で わる。わる数と わられる数を 反対に しない ように 数直線で たしかめよう。";
    base.chk = { ans:p100/100 };
  }else if(kind === "zentai"){
    base.label = "何"+c.au+"？"; base.u = c.au;
    base.cor = optNum(T100, c.au);
    base.cands = [
      optNum(p100 + n100, c.au),                /* たし算に した */
      optNum(p100*100/n100, c.au),              /* わり算に した */
      optNum(T100*10, c.au), optNum(T100/10, c.au)
    ];
    base.fb = numFallback(T100, n100 % 100 ? stepOf(T100) : p100, c.au);
    base.expl = st('全体の 量 ＝ '+c.one+' あたりの 量 × いくつ分')
              + st(pS+' × '+nS+' ＝ <b>'+TS+' '+c.au+'</b>')
              + dnl({ tn:c.tn, tu:c.au, ta:pS, tb:"□", bn:c.bn, bu:c.cu, ba:"1", bb:nS, op:"×"+nS, rev:false });
    base.kufu = c.one+" あたり "+pS+c.au+" が "+nS+c.cu+" ぶん ある から かけ算。"
              + (n100 % 100 ? "いくつ分が 小数でも 同じように かけ算で 求められる。" : "");
    base.chk = { ans:T100/100 };
  }else{
    base.label = "何"+c.cu+"？"; base.u = c.cu;
    base.cor = optNum(n100, c.cu);
    base.cands = [
      optNum(T100*p100/100, c.cu),              /* かけ算に した */
      optNum(p100*100/T100, c.cu),              /* 反対に わった */
      optNum(n100*10, c.cu), optNum(n100/10, c.cu)
    ];
    base.fb = numFallback(n100, n100 % 100 ? 50 : 100, c.cu);
    base.expl = st('いくつ分 ＝ 全体の 量 ÷ '+c.one+' あたりの 量')
              + st(TS+' ÷ '+pS+' ＝ <b>'+nS+' '+c.cu+'</b>')
              + dnl({ tn:c.tn, tu:c.au, ta:pS, tb:TS, bn:c.bn, bu:c.cu, ba:"1", bb:"□", op:"×□", rev:false });
    base.kufu = "全体の 中に「"+c.one+" あたりの 量」が いくつ 入るかを 考える わり算。"
              + "たしかめ： "+pS+" × "+nS+" ＝ "+TS+"。";
    base.chk = { ans:n100/100 };
  }
  return mk(base);
}

function spdPick(){
  var c = pick(SPD_CTX), v100, t100, T100, tries;
  for(tries=0;tries<50;tries++){
    v100 = H(pick(c.v));
    t100 = H(c.td && ri(1,3) === 1 ? pick(c.td) : pick(c.t));
    T100 = v100*t100/100;
    if(isInt(T100) && T100 % 100 === 0) break;           /* 道のりは 整数に する */
  }
  return { c:c, v100:v100, t100:t100, T100:Math.round(T100),
           vS:d100(v100), tS:d100(t100), TS:d100(Math.round(T100)) };
}
function spdQ(c, tpl, s){ return c[tpl].replace("{v}", s.vS).replace("{t}", s.tS).replace("{T}", s.TS); }
var SPD_KUFU = "速さ ＝ 道のり ÷ 時間、道のり ＝ 速さ × 時間、時間 ＝ 道のり ÷ 速さ。";

function gen_hayasa_motomeru(){
  var s = spdPick(), c = s.c, q = spdQ(c, "mot", s);
  return mk({
    key:"hayasa_motomeru", tag:"速さを 求める",
    q:q, plain:plainOf(q),
    label:c.pre+" 何"+c.du+"？", u:c.du, pre:c.pre,
    cor:optNum(s.v100, c.du, c.pre),
    cands:[
      optNum(s.T100*s.t100/100, c.du, c.pre),   /* かけ算に した */
      optNum(s.t100*100/s.T100, c.du, c.pre),   /* 反対に わった */
      optNum(s.v100*10, c.du, c.pre), optNum(s.v100/10, c.du, c.pre),
      optNum(s.T100 - s.t100, c.du, c.pre)      /* ひき算に した */
    ],
    fb:numFallback(s.v100, stepOf(s.v100), c.du, c.pre),
    expl:st('速さ ＝ 道のり ÷ 時間')
        +st(s.TS+' ÷ '+s.tS+' ＝ '+s.vS+'　→　<b>'+c.pre+' '+s.vS+' '+c.du+'</b>')
        +dnl({ tn:"道のり", tu:c.du, ta:"□", tb:s.TS, bn:"時間", bu:c.tu, ba:"1", bb:s.tS, op:"÷"+s.tS, rev:true }),
    kufu:c.pre+"は「1"+c.tu+" あたりに 進む 道のり」。"+SPD_KUFU,
    chk:{ ans:s.v100/100 }
  });
}
function gen_hayasa_michinori(){

}
function gen_hayasa_jikan(){

var SPD_H_CTX = [
  { lead:"3人が 歩いた 道のりと、かかった 時間です。", c1:{h:"道のり", u:"m"}, c2:{h:"時間", u:"分"},
    v:[55,60,64,65,70,72,75,78,80,84,90], t:[8,10,12,15,16,18,20,25], pre:"分速", du:"m", tail:"さん", people:true },
  { lead:"3人が 走った 道のりと、かかった 時間です。", c1:{h:"道のり", u:"m"}, c2:{h:"時間", u:"秒"},
    v:[4,4.5,5,5.5,6,6.5,7,7.5,8], t:[10,12,14,15,16,18,20], pre:"秒速", du:"m", tail:"さん", people:true },
  { lead:"3台の 自動車が 走った 道のりと、かかった 時間です。", c1:{h:"道のり", u:"km"}, c2:{h:"時間", u:"時間"},
    v:[35,40,45,50,55,60,65,70,75,80], t:[2,3,4,5], pre:"時速", du:"km", tail:"の 自動車", people:false }
];
function gen_hayasa_hikaku(){
  var c = pick(SPD_H_CTX);
  var fast = ri(1,3) !== 1;
  var R = null, best = -1, t, i;
  for(t=0;t<800 && !R;t++){
    var rs = [];
    for(i=0;i<3;i++){
      var v = H(pick(c.v)), tt = pick(c.t);
      rs.push({ v:v, t:tt, T:v*tt });
    }
    if(!rs.every(function(r){ return r.T % 100 === 0; })) continue;
    if(!allDiff(rs, "v")) continue;
    best = argBy(rs, "v", fast);
    if(best === argBy(rs, "T", fast)) continue;            /* 道のりだけで 決まる 組は さける */
    if(t < 500 && best === argBy(rs, "t", !fast)) continue; /* 時間だけで 決まる 組も */
    R = rs;
  }
  var fb = !R;
  if(!R){ R = [{v:7000,t:15,T:105000},{v:6000,t:20,T:120000},{v:7500,t:12,T:90000}];
          best = argBy(R, "v", fast); }
  var w = fast ? "速い" : "おそい";
  var unitOne = c.c2.u === "時間" ? "1時間" : "1"+c.c2.u;
  return withFb(fb, mkHikaku({
    key:"hayasa_hikaku", tag:"速さを くらべる",
    lead:c.lead, c1:c.c1, c2:c.c2,
    rows:R.map(function(r){ return { v1:d100(r.T), v2:String(r.t), calc:d100(r.T)+' ÷ '+r.t, per:d100(r.v) }; }),
    ask:"いちばん "+w+(c.people ? "のは だれですか。" : " 自動車は どれですか。"),
    label:"いちばん "+w+"のは？",
    tail:c.tail,
    how:unitOne+" あたりに 進む 道のり（"+c.pre+" ＝ 道のり ÷ 時間）で くらべる",
    perPre:c.pre, perU:c.du, which:w, best:best,
    kufu:"道のりも 時間も ちがう ときは、"+unitOne+" あたりに 進む 道のり（"+c.pre+"）に そろえて くらべる。"
        +"いちばん 長く 進んだ "+(c.people ? "人" : "自動車")+"が いちばん 速いとは かぎらない。"
  }));
}

/* =====================================================================
   ⑤ 時速・分速・秒速（速さの 単位を かえる）
   ===================================================================== */
function gen_hayasa_kansan(){
  var k = ri(1,6), v, v100, m, ans, from, fu, to, tu, steps, fig, cands;
  function o(x){ return optNum(x, tu, to); }
  if(k === 1){                                           /* 時速 km → 分速 m */
    v = pick([30,36,42,45,48,54,60,72,90]); from = "時速"; fu = "km"; to = "分速"; tu = "m";
    m = v*1000; ans = m*100/60;
    steps = st('時速 '+v+'km は、1時間（60分）に '+v+'km ＝ '+m+'m 進む 速さ')
          + st(m+' ÷ 60 ＝ '+d100(ans)+'　→　<b>分速 '+d100(ans)+' m</b>');
    fig = { tn:"道のり", tu:"m", ta:"□", tb:String(m), bn:"時間", bu:"分", ba:"1", bb:"60", op:"÷60", rev:true };
    cands = [ o(m*100), o(v*100*100/60), o(m*100/3600), o(v*60*100) ];
  }else if(k === 2){                                     /* 分速 m → 秒速 m */
    v = pick([60,72,90,120,150,180,240,300]); from = "分速"; fu = "m"; to = "秒速"; tu = "m";
    ans = v*100/60;
    steps = st('分速 '+v+'m は、1分（60秒）に '+v+'m 進む 速さ')
          + st(v+' ÷ 60 ＝ '+d100(ans)+'　→　<b>秒速 '+d100(ans)+' m</b>');
    fig = { tn:"道のり", tu:"m", ta:"□", tb:String(v), bn:"時間", bu:"秒", ba:"1", bb:"60", op:"÷60", rev:true };
    cands = [ o(v*60*100), o(v*100), o(v*100/6), o(ans*10) ];
  }else if(k === 3){                                     /* 秒速 m → 分速 m */
    v100 = H(pick([1.5,2,2.5,3,4,5,8,10,15])); v = d100(v100); from = "秒速"; fu = "m"; to = "分速"; tu = "m";
    ans = v100*60;
    steps = st('秒速 '+v+'m は、1秒に '+v+'m 進む 速さ')
          + st('1分（60秒）では '+v+' × 60 ＝ '+d100(ans)+'　→　<b>分速 '+d100(ans)+' m</b>');
    fig = { tn:"道のり", tu:"m", ta:v, tb:"□", bn:"時間", bu:"秒", ba:"1", bb:"60", op:"×60", rev:false };
    cands = [ o(v100/60), o(v100), o(v100*3600), o(v100*6) ];
  }else if(k === 4){                                     /* 分速 m → 時速 km */
    v = pick([50,60,70,80,150,200,250,300,500,750,1000]); from = "分速"; fu = "m"; to = "時速"; tu = "km";
    m = v*60; ans = m/10;
    steps = st('1時間（60分）では '+v+' × 60 ＝ '+m+'m 進む')
          + st(m+'m ＝ '+d100(ans)+'km　→　<b>時速 '+d100(ans)+' km</b>');
    fig = { tn:"道のり", tu:"m", ta:String(v), tb:"□", bn:"時間", bu:"分", ba:"1", bb:"60", op:"×60", rev:false };
    cands = [ o(m*100), o(v*100), o(v*100/60), o(ans*10), o(ans/10) ];
  }else if(k === 5){                                     /* 時速 km → 秒速 m */
    v = pick([18,36,54,72,90,108,144]); from = "時速"; fu = "km"; to = "秒速"; tu = "m";
    m = v*1000; ans = m*100/3600;
    steps = st('時速 '+v+'km は、1時間（3600秒）に '+v+'km ＝ '+m+'m 進む 速さ')
          + st(m+' ÷ 3600 ＝ '+d100(ans)+'　→　<b>秒速 '+d100(ans)+' m</b>');
    fig = { tn:"道のり", tu:"m", ta:"□", tb:String(m), bn:"時間", bu:"秒", ba:"1", bb:"3600", op:"÷3600", rev:true };
    cands = [ o(m*100/60), o(v*100), o(v*360), o(ans*10) ];
  }else{                                                 /* 秒速 m → 時速 km */
    v = pick([5,10,15,20,25,30]); from = "秒速"; fu = "m"; to = "時速"; tu = "km";
    m = v*3600; ans = m/10;
    steps = st('1時間（3600秒）では '+v+' × 3600 ＝ '+m+'m 進む')
          + st(m+'m ＝ '+d100(ans)+'km　→　<b>時速 '+d100(ans)+' km</b>');
    fig = { tn:"道のり", tu:"m", ta:String(v), tb:"□", bn:"時間", bu:"秒", ba:"1", bb:"3600", op:"×3600", rev:false };
    cands = [ o(v*60*100), o(m*100), o(v*100), o(ans/10) ];
  }
  var q = from+" "+v+fu+" は、"+to+" 何"+tu+"ですか。";
  return mk({
    key:"hayasa_kansan", tag:"速さの 単位を かえる",
    q:q, plain:plainOf(q),
    label:to+" 何"+tu+"？", u:tu, pre:to,
    cor:o(ans),
    cands:cands,
    fb:numFallback(ans, stepOf(ans), tu, to),
    expl:steps + dnl(fig),
    kufu:"1時間 ＝ 60分 ＝ 3600秒、1km ＝ 1000m。秒速 → 分速 → 時速 は ×60 ずつ、"
        +"反対は ÷60 ずつ。km と m の ちがいにも 気をつけよう。",
    chk:{ ans:ans/100 }
  });
}

var MODE = "komi";

var score = 0, total = 0, streak = 0, qStart = 0;

/* 解き直し（?retry=1） */
var retryQ = null, retryTotal = 0, retryDone = 0;

function $(id){ return document.getElementById(id); }

function makeQ(key, seed){
  rngSeed(seed);                       /* ここから先の乱数は種で決まる */
  return GENS[key]();
}

function newQuestion(){
  graded = false; sel = -1;
  $("feedback").classList.remove("show");
  $("toast").textContent = "";
  $("checkBtn").style.display = "block";
  $("nextBtn").style.display = "none";

  var useKey, seed;
  if(retryQ){
    /* 解き直しを1周した。モード選択にもどって、案内帯を そこに 出す */
    if(!retryQ.length){
      retryQ = null;
      backHome();
      showRetryBanner("解き直し おつかれさま！ 同じ問題に 2回つづけて 正解すると リストから 消えるよ");
      return;
    }
    var it = retryQ.shift();
    retryDone++;
    useKey = it.question_params.m;
    seed = it.question_params.s>>>0;
  }else{
    useKey = pick(MODE_KEYS[MODE] || MODE_KEYS.komi);
    seed = rngPick();
  }

  curKey = useKey;
  curSeed = seed;
  cur = makeQ(useKey, seed);

  /* 種類バッヂ。ランダムは 種類名が そのまま ヒントに なるので 出さない */
  var tagText = retryQ ? ("解き直し "+retryDone+" / "+retryTotal+" ・ "+cur.tag)
                       : (MODE === "mix" ? "" : cur.tag);
  $("qTag").textContent = tagText;
  $("qTag").style.display = tagText ? "" : "none";
  $("qNo").textContent = retryQ ? "" : ("第 "+(total+1)+" 問");
  $("qText").innerHTML = cur.qHtml;
  renderOptions();
  qStart = nowMs();
  try{ window.scrollTo({ top:0, behavior:"smooth" }); }catch(e){ window.scrollTo(0,0); }
}

function renderOptions(){
  var host = $("partArea");
  host.innerHTML = "";
  var wrap = document.createElement("div");
  wrap.className = "part";

  var lab = document.createElement("div");
  lab.className = "p-label";
  lab.textContent = cur.label;
  wrap.appendChild(lab);

  var opts = document.createElement("div");
  opts.className = "opts" + (cur.options.length === 3 ? " three" : "");
  cur.options.forEach(function(o, oi){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "optBtn";
    b.dataset.idx = oi;
    b.innerHTML = o.html;          /* 中身は この画面で 組み立てた 数字と 単位だけ */
    b.addEventListener("click", function(){ tapOption(oi); });
    opts.appendChild(b);
  });
  wrap.appendChild(opts);
  host.appendChild(wrap);
}

function tapOption(oi){
  if(graded) return;
  sel = oi;
  $("toast").textContent = "";
  document.querySelectorAll(".optBtn").forEach(function(b){
    b.classList.toggle("on", Number(b.dataset.idx) === oi);
  });
}

function check(){
  if(graded || !cur) return;
  if(sel < 0){ $("toast").textContent = "答えを えらんでね"; return; }

  graded = true;
  var ok = (sel === cur.correct);
  var btns = document.querySelectorAll(".optBtn");
  safeDivp("markChoices", btns, { correct:cur.correct, selected:sel,
                                  dimOthers:true, label:"正解" });
  btns.forEach(function(b){ b.disabled = true; });

  total++;
  if(ok){ score++; streak++; } else { streak = 0; }
  renderScore();

  var sec = Math.round((nowMs()-qStart)/1000);
  /* 学習記録（未ログイン・ローカルでは黙ってスキップされる） */
  safeDivp("answer", ok, {
    question_key: curKey,
    question_params: { m: curKey, s: curSeed },     /* 種方式：この2つで同じ問題を作り直せる */
    question_text: cur.plainQ,
    correct_answer: cur.ansText,
    wrong_answer: ok ? null : cur.options[sel].plain,
    time_taken_sec: (sec > 0 && sec < 600) ? sec : null
  });

  $("fbMsg").className = "fb-msg " + (ok ? "good" : "bad");
  $("fbMsg").textContent = ok ? "せいかい！ よくできました" : "おしい！ とき方を 見てみよう";
  $("expl").innerHTML = cur.expl;
  $("feedback").classList.add("show");
  $("checkBtn").style.display = "none";
  $("nextBtn").style.display = "block";
  $("toast").textContent = "";

  /* 正解エフェクト（キラキラ）。pileBottom で「山の床」を ボタンの帯の 上に する
     （わたさないと 画面下の #bottom が 積もりはじめを かくす） */
  if(ok) safeDivp("correct", { pileBottom: "#bottom" });
}

function renderScore(){
  $("scoreOk").textContent = score;
  $("scoreAll").textContent = total;
  $("scoreStreak").textContent = streak;
}

/* ---------- モード選択 ---------- */
function startMode(m){
  if(!MODE_KEYS[m]) return;
  MODE = m;
  retryQ = null;
  score = 0; total = 0; streak = 0;
  renderScore();
  $("modeLabel").textContent = MODE_LABEL[m] || "";
  document.body.classList.remove("choosing");
  newQuestion();
}
function backHome(){
  document.body.classList.add("choosing");
  retryQ = null;
  cur = null;
  try{ window.scrollTo(0,0); }catch(e){}
}

/* ---------- 解き直し（?retry=1） ---------- */
function showRetryBanner(msg){
  var slot = $("retryBannerSlot");
  var e = $("retryBanner");
  if(!e){
    e = document.createElement("div");
    e.id = "retryBanner";
    slot.appendChild(e);
  }
  e.textContent = msg;
}
function initRetry(){
  if(!(window.Divp && typeof Divp.getRetries === "function")) return;
  Divp.getRetries().then(function(items){
    var use = (items||[]).filter(function(it){
      var p = it && it.question_params;
      return p && GENS[p.m] && typeof p.s === "number";
    });
    if(!use.length){
      showRetryBanner("解き直せる 問題は まだ ありません。まちがえた 問題が ここに たまっていくよ。");
      return;
    }
    retryQ = use.slice();
    retryTotal = retryQ.length;
    retryDone = 0;
    MODE = "retry";
    score = 0; total = 0; streak = 0;
    renderScore();
    $("modeLabel").textContent = "まちがえた問題の 解き直し";
    document.body.classList.remove("choosing");
    newQuestion();
  }).catch(function(){});
}

/* =====================================================================
   印刷（A4・10問＋答え）。紙は 毎回 ちがう 問題で よいので 1問ごとに 種を 引く。
   画面の 問題と 同じ 生成関数を 使うので、問題の 中身・答え・とき方は 画面と 一致する。
   ⚠ makeQ() は 乱数の 状態を 書きかえるが、画面の 問題(cur)は 作り終わっているので 影響しない。
   ===================================================================== */
function printItems(mode){
  var keys = PRINT_KEYS[mode] || PRINT_KEYS.mix, seen = {}, seenTpl = {}, out = [];
  keys.forEach(function(k){
    /* 同じ問題は 2つ 並べない。できれば 同じ場面（数字だけ ちがう 文章題）も さける */
    var q = null, best = null;
    for(var t=0; t<30; t++){
      q = makeQ(k, rngPick());
      if(seen[q.plainQ]) continue;
      if(!best) best = q;
      if(!seenTpl[q.plainQ.replace(/[\d.,]+/g, "#")]){ best = q; break; }
    }
    q = best || q;
    seen[q.plainQ] = 1;
    seenTpl[q.plainQ.replace(/[\d.,]+/g, "#")] = 1;
    out.push(q);
  });
  return out;
}
/* 答えのページに出す 「とき方」＝ 画面の 解説の 手順だけ（図・ポイントは のぞく） */
function printHow(q){
  var box = document.createElement("div");
  box.innerHTML = q.expl;
  var rm = box.querySelectorAll(".ttl, .kufu, .fig, .cap");
  for(var i=0;i<rm.length;i++) rm[i].parentNode.removeChild(rm[i]);
  var steps = box.querySelectorAll(".step"), s = [];
  for(i=0;i<steps.length;i++) s.push(steps[i].innerHTML.replace(/<\/?b>/g, ""));
  return s.join(" → ");
}
function buildPrint(mode){
  var items = printItems(mode);
  var d = new Date();
  var dateStr = d.getFullYear()+"年"+(d.getMonth()+1)+"月"+d.getDate()+"日";
  var label = MODE_LABEL[mode] || MODE_LABEL.mix;
  function head(sub){
    return '<div class="p-head"><div><div class="p-school">中京個別指導学院</div>'
      + '<div class="p-title">単位量あたりマスター<small>'+esc(label)+'　'+sub+'</small></div></div>'
      + '<div class="p-name">'+dateStr+'　名前<span></span></div></div>';
  }
  var qh = items.map(function(q,i){
    return '<div class="p-item"><span class="p-no">'+(i+1)+'</span><span class="p-tag">'+esc(q.tag)+'</span>'
      + '<div class="p-q">'+q.qHtml+'</div>'
      + '<div class="p-ans">答え'+(q.pre ? '　'+esc(q.pre) : '')+'<i></i>'+esc(q.u)+'</div></div>';
  }).join("");
  var ah = items.map(function(q,i){
    return '<div class="a-item"><span class="p-no">'+(i+1)+'</span>'
      + '<span class="a-v">'+q.options[q.correct].html+'</span>'
      + '<span class="a-how">'+printHow(q)+'</span></div>';
  }).join("");
  var wm = window.ChukyoPrint ? ChukyoPrint.img() : "";
  return wm
    + '<div class="sheet">'+head("問題")+'<p class="p-inst">'+esc(PRINT_INST[mode] || PRINT_INST.mix)+'</p>'
    + '<div class="p-grid">'+qh+'</div></div>'
    + '<div class="sheet">'+head("答え")+'<div class="a-grid">'+ah+'</div></div>';
}
function printSheet(mode){
  if(!PRINT_KEYS[mode]) mode = "mix";
  var area = $("printArea");
  /* 透かしは position:fixed で 1枚だけ 置く＝印刷では どのページにも 同じ位置に 出る */
  var wmCss = window.ChukyoPrint ? '<style>'+ChukyoPrint.css({ zIndex:0 })+'.wm{position:fixed;}</style>' : "";
  area.innerHTML = wmCss + buildPrint(mode);
  /* 透かし画像の デコードを 待ってから 印刷する（直後に print() するとロゴが 抜けることがある） */
  if(window.ChukyoPrint && ChukyoPrint.print) ChukyoPrint.print(area);
  else window.print();
}

/* ---------- イベント ---------- */
document.querySelectorAll("#printBtns button").forEach(function(b){
  b.addEventListener("click", function(){ printSheet(b.dataset.mode); });
});
$("printBtn").addEventListener("click", function(){ printSheet(MODE); });
document.querySelectorAll(".m-card").forEach(function(b){
  b.addEventListener("click", function(){ startMode(b.dataset.mode); });
});
$("homeBtn").addEventListener("click", backHome);
$("checkBtn").addEventListener("click", check);
$("nextBtn").addEventListener("click", newQuestion);

/* divp-core は defer で読まれるので、DOM構築後に初期化する */
window.addEventListener("DOMContentLoaded", function(){
  safeDivp("init", UNIT_KEY);
  if(/[?&]retry=1/.test(location.search)){
    try{ initRetry(); }catch(e){}
  }
});
</script>
