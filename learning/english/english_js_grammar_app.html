<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中学英文法</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#3B82F6;--g1l:#EFF6FF;--g1b:#1D4ED8;
  --g2:#10B981;--g2l:#ECFDF5;--g2b:#047857;
  --g3:#8B5CF6;--g3l:#F5F3FF;--g3b:#5B21B6;
  --gold:#F59E0B;--goldl:#FFFBEB;
  --ok:#16A34A;--okl:#DCFCE7;
  --ng:#DC2626;--ngl:#FEE2E2;
  --bg:#F8FAFC;--card:#fff;
  --text:#1E293B;--muted:#64748B;--border:#E2E8F0;
  --rad:12px;--rads:8px;
  --gc:var(--g1);--gcl:var(--g1l);--gcb:var(--g1b);
}
body{font-family:'Helvetica Neue',Arial,'Hiragino Kaku Gothic ProN',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
#landing{display:flex;flex-direction:column;align-items:center;padding:3rem 1rem;gap:1.5rem}
#landing h1{font-size:1.6rem;font-weight:800;text-align:center}
#landing p{color:var(--muted);text-align:center;font-size:.95rem}
.grade-cards{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:.5rem}
.grade-card{background:var(--card);border:2px solid var(--border);border-radius:var(--rad);padding:2rem 2.5rem;cursor:pointer;transition:.2s;text-align:center;min-width:140px}
.grade-card:hover{transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.grade-card.g1{border-color:var(--g1)}.grade-card.g1 h2{color:var(--g1)}
.grade-card.g2{border-color:var(--g2)}.grade-card.g2 h2{color:var(--g2)}
.grade-card.g3{border-color:var(--g3)}.grade-card.g3 h2{color:var(--g3)}
.grade-card h2{font-size:2.2rem;font-weight:800}
.grade-card p{font-size:.82rem;color:var(--muted);margin-top:.3rem}
#app{display:none;height:100vh;flex-direction:column;overflow:hidden}
#topbar{display:flex;align-items:center;gap:.75rem;padding:.6rem 1rem;border-bottom:1px solid var(--border);background:var(--card);flex-shrink:0}
.back-btn{background:none;border:1px solid var(--border);border-radius:var(--rads);padding:.3rem .7rem;cursor:pointer;font-size:.82rem;color:var(--muted)}
.grade-badge{font-weight:700;font-size:.9rem;padding:.3rem .75rem;border-radius:20px}
.gb1{background:var(--g1l);color:var(--g1b)}
.gb2{background:var(--g2l);color:var(--g2b)}
.gb3{background:var(--g3l);color:var(--g3b)}
#layout{display:flex;flex:1;overflow:hidden}
#sidebar{width:210px;min-width:210px;overflow-y:auto;border-right:1px solid var(--border);background:var(--card)}
.unit-btn{display:block;width:100%;text-align:left;background:none;border:none;padding:.55rem 1rem;font-size:.82rem;cursor:pointer;color:var(--text);border-left:3px solid transparent;line-height:1.4}
.unit-btn:hover{background:var(--bg)}
.unit-btn.active{border-left-color:var(--gc);background:var(--gcl);font-weight:600;color:var(--gcb)}
.sidebar-group{font-size:.7rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:.75rem 1rem .2rem}
#content{flex:1;overflow-y:auto;padding:1.25rem 1.5rem}
#unit-title{font-size:1.2rem;font-weight:700;margin-bottom:1rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1.1rem;flex-wrap:wrap}
.tab-btn{background:none;border:1px solid var(--border);border-radius:20px;padding:.35rem .85rem;font-size:.82rem;cursor:pointer;color:var(--muted);transition:.15s}
.tab-btn.active{background:var(--gc);border-color:var(--gc);color:#fff;font-weight:600}
.part-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:1rem 1.1rem;margin-bottom:.85rem}
.part-label{font-size:.7rem;font-weight:700;color:var(--gc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
.grammar-point{font-size:1rem;font-weight:700;margin-bottom:.4rem}
.explanation{font-size:.875rem;color:var(--muted);margin-bottom:.65rem;line-height:1.65}
.examples{list-style:none;display:flex;flex-direction:column;gap:.35rem}
.examples li{font-size:.875rem;padding:.35rem .7rem;background:var(--bg);border-radius:var(--rads);border-left:3px solid var(--gc)}
.examples .ja{display:block;font-size:.78rem;color:var(--muted);margin-top:.1rem}
.gfc-box{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:1.1rem;margin-bottom:.85rem}
.gfc-label{font-size:.7rem;font-weight:700;color:var(--gc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.3rem}
.gfc-title{font-size:1rem;font-weight:700;margin-bottom:.5rem}
.gfc-rule{font-size:.875rem;background:var(--gcl);border:1px solid var(--gc);border-radius:var(--rads);padding:.7rem .9rem;margin-bottom:.75rem;line-height:1.7;color:var(--gcb)}
.form-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:.4rem 0}
.form-table th,.form-table td{padding:.35rem .55rem;border:1px solid var(--border);text-align:left}
.form-table th{background:var(--bg);font-weight:600}
.key-list{display:flex;flex-direction:column;gap:.45rem}
.key-item{background:var(--card);border:1px solid var(--border);border-radius:var(--rads);padding:.55rem .85rem}
.key-en{font-size:.875rem;font-weight:500}
.key-ja{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.progress-wrap{background:var(--border);border-radius:10px;height:5px;margin-bottom:1.1rem}
.progress-bar{height:5px;border-radius:10px;background:var(--gc);transition:width .3s}
.problem-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:1.1rem 1.2rem;margin-bottom:.85rem}
.problem-meta{display:flex;gap:.4rem;align-items:center;margin-bottom:.65rem;flex-wrap:wrap}
.prob-num{font-size:.75rem;color:var(--muted)}
.prob-jump{font-size:1em;font-weight:700;color:var(--gc);border:1.5px solid var(--gc);border-radius:6px;padding:2px 6px;margin:0 3px;background:var(--card);cursor:pointer;-webkit-appearance:menulist}
.prob-type{font-size:.7rem;padding:.18rem .55rem;border-radius:12px;font-weight:700}
.pt-fill{background:#E0F2FE;color:#0369A1}
.pt-sort{background:#FEF3C7;color:#92400E}
.idiom-badge{font-size:.68rem;padding:.18rem .55rem;border-radius:12px;background:var(--goldl);color:#92400E;font-weight:700}
.prompt-text{font-size:.9rem;margin-bottom:.85rem;color:var(--muted)}
.fill-sentence{font-size:1rem;line-height:2.2;word-break:break-word}
.fill-input{border:none;border-bottom:2.5px solid var(--gc);background:transparent;font-size:.95rem;width:110px;text-align:center;outline:none;color:var(--text);padding:0 .2rem;margin:0 .15rem}
.fill-input:focus{border-bottom-color:var(--gcb)}
.fill-input.correct{border-bottom-color:var(--ok);background:var(--okl);border-radius:4px 4px 0 0}
.fill-input.wrong{border-bottom-color:var(--ng);background:var(--ngl);border-radius:4px 4px 0 0}
.sort-label{font-size:.75rem;color:var(--muted);margin-bottom:.3rem;font-weight:600}
.tile-bank,.answer-area{display:flex;flex-wrap:wrap;gap:.4rem;min-height:42px;padding:.4rem .5rem;border-radius:var(--rads);margin-bottom:.4rem}
.tile-bank{background:var(--bg);border:1px dashed var(--border)}
.answer-area{background:var(--gcl);border:2px dashed var(--gc)}
.tile{padding:.3rem .65rem;border-radius:var(--rads);border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:.875rem;user-select:none;transition:.12s;white-space:nowrap}
.tile:hover{border-color:var(--gc);background:var(--gcl)}
.submit-btn{background:var(--gc);color:#fff;border:none;border-radius:var(--rads);padding:.55rem 1.4rem;font-size:.9rem;font-weight:700;cursor:pointer;margin-top:.6rem;transition:.15s}
.submit-btn:hover{opacity:.9}
.submit-btn:disabled{opacity:.45;cursor:not-allowed}
.result-box{margin-top:.65rem;padding:.65rem .9rem;border-radius:var(--rads)}
.result-correct{background:var(--okl);border:1px solid var(--ok);color:var(--ok)}
.result-wrong{background:var(--ngl);border:1px solid var(--ng);color:var(--ng)}
.result-label{font-weight:700;font-size:.9rem}
.answer-reveal{font-size:.82rem;color:var(--text);margin-top:.3rem}
.idiom-reveal{margin-top:.5rem;padding:.4rem .7rem;background:var(--goldl);border:1px solid var(--gold);border-radius:var(--rads);font-size:.82rem;color:#92400E}
.idiom-reveal strong{font-weight:700}
.next-btn{background:var(--card);color:var(--gc);border:2px solid var(--gc);border-radius:var(--rads);padding:.45rem 1.2rem;font-size:.875rem;font-weight:700;cursor:pointer;margin-top:.6rem;display:inline-block;transition:.15s;margin-left:.5rem}
.next-btn:hover{background:var(--gcl)}
.done-box{text-align:center;padding:2.5rem 1.5rem;background:var(--card);border-radius:var(--rad);border:1px solid var(--border)}
.done-box h2{font-size:1.5rem;font-weight:800;margin-bottom:.5rem}
.done-box p{color:var(--muted);margin-bottom:1.2rem}
.restart-btn{background:var(--gc);color:#fff;border:none;border-radius:var(--rads);padding:.6rem 1.5rem;font-size:.9rem;font-weight:700;cursor:pointer}
.score-display{font-size:2rem;font-weight:800;color:var(--gc);margin:.5rem 0}
/* ── モバイル対応 ── */
.menu-btn{display:none;align-items:center;gap:5px;background:rgba(255,255,255,.15);border:1.5px solid var(--border);border-radius:var(--rads);padding:.3rem .7rem;font-size:.82rem;cursor:pointer;color:var(--text)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:299}
.sidebar-overlay.show{display:block}
.unit-nav{display:none;justify-content:space-between;align-items:center;padding:.6rem 0 .2rem;gap:.5rem}
.unit-nav-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--rads);padding:.4rem .9rem;font-size:.82rem;cursor:pointer;color:var(--text)}
.unit-nav-btn:disabled{opacity:.35;cursor:not-allowed}
.unit-nav-pos{font-size:.78rem;color:var(--muted);text-align:center;flex:1}
@media(max-width:768px){
  #sidebar{position:fixed;left:-220px;top:0;height:100%;z-index:300;
    transition:left .25s ease;width:210px;min-width:210px;
    box-shadow:4px 0 20px rgba(0,0,0,.25);overflow-y:auto}
  #sidebar.open{left:0}
  #content{padding:.85rem}
  .menu-btn{display:flex}
  .unit-nav{display:flex}
  #topbar{flex-wrap:wrap;gap:.3rem}
}
/* ── JS-generated class aliases ── */
.unit-item{list-style:none;padding:.55rem 1rem;font-size:.82rem;cursor:pointer;color:var(--text);border-left:3px solid transparent;line-height:1.4}
.unit-item:hover{background:var(--bg)}
.unit-item.active{border-left-color:var(--gc);background:var(--gcl);font-weight:600;color:var(--gcb)}
.unit-item strong{display:block}
.unit-item span{font-size:.75rem;color:var(--muted)}
#unit-list{padding:0;margin:0}
.grammar-cards{display:flex;flex-direction:column;gap:.85rem}
.grammar-card{background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:1rem 1.1rem}
.grammar-label{font-size:.7rem;font-weight:700;color:var(--gc);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.2rem}
.grammar-point{font-size:1rem;font-weight:700;margin-bottom:.4rem}
.grammar-exp{font-size:.875rem;color:var(--muted);margin-bottom:.65rem;line-height:1.65}
.grammar-exs{display:flex;flex-direction:column;gap:.35rem}
.grammar-ex{font-size:.875rem;padding:.35rem .7rem;background:var(--bg);border-radius:var(--rads);border-left:3px solid var(--gc)}
.ex-en{font-weight:500}
.ex-ja{font-size:.78rem;color:var(--muted);margin-top:.1rem}
.gfc-table{width:100%;border-collapse:collapse;font-size:.82rem;margin:.4rem 0}
.gfc-table th,.gfc-table td{padding:.35rem .55rem;border:1px solid var(--border);text-align:left}
.gfc-table th{background:var(--bg);font-weight:600}
.prob-card{position:relative;overflow:visible;background:var(--card);border:1px solid var(--border);border-radius:var(--rad);padding:1.1rem 1.2rem;margin-bottom:.85rem}
.prob-header{display:flex;align-items:center;gap:.4rem;margin-bottom:.65rem}
.prob-q{font-size:.9rem;color:var(--muted);background:var(--card);border-left:3px solid var(--gc);border-radius:4px;padding:.3rem .6rem;margin-bottom:.45rem}
.prob-shuffle{margin-left:auto;font-size:.75rem;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:3px 10px;background:var(--card);cursor:pointer;white-space:nowrap}
.prob-shuffle.on{color:#fff;background:var(--gc);border-color:var(--gc);font-weight:700}
.prob-prompt{font-size:.9rem;margin-bottom:.85rem;color:var(--muted)}
.prob-tmpl{font-size:1rem;line-height:2.4;word-break:break-word;margin-bottom:.6rem}
.prob-actions{margin-top:.6rem;display:flex;gap:.5rem;flex-wrap:wrap}
.prob-result{margin-top:.65rem}
.btn-submit{background:var(--gc);color:#fff;border:none;border-radius:var(--rads);padding:.55rem 1.4rem;font-size:.9rem;font-weight:700;cursor:pointer}
.btn-submit:disabled{opacity:.45;cursor:not-allowed}
/* ── 画面QWERTYキーボード（穴埋め用・端末キーボードと併用）── */
.kbd{margin:.7rem 0 .2rem;display:flex;flex-direction:column;gap:5px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.kbd-row{display:flex;gap:5px;justify-content:center}
.kbd .key{flex:1 1 0;min-width:0;height:44px;background:#fff;border:1.5px solid var(--border);border-bottom:3px solid rgba(0,0,0,.14);border-radius:9px;font-family:inherit;font-size:1rem;font-weight:700;color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.kbd .key:active{background:var(--gc);border-color:var(--gc);color:#fff;border-bottom-width:1.5px;transform:translateY(2px)}
.kbd .key.wide{flex:2 1 0}
.kbd .key.caps.on{background:var(--gcb);border-color:var(--gcb);color:#fff}
.kbd .key.util{font-size:.82rem;color:var(--muted)}
.btn-next{background:var(--card);color:var(--gc);border:2px solid var(--gc);border-radius:var(--rads);padding:.45rem 1.2rem;font-size:.875rem;font-weight:700;cursor:pointer}
.btn-reset{background:none;color:var(--muted);border:1px solid var(--border);border-radius:var(--rads);padding:.45rem 1rem;font-size:.875rem;cursor:pointer}
.result-badge{display:inline-block;padding:.3rem .8rem;border-radius:var(--rads);font-weight:700;font-size:.9rem;margin-bottom:.4rem}
.result-ok{background:var(--okl);color:var(--ok)}
.result-ng{background:var(--ngl);color:var(--ng)}
.result-ans{font-size:.85rem;color:var(--text);margin:.3rem 0}
.idiom-meaning{margin-top:.5rem;padding:.4rem .7rem;background:var(--goldl);border:1px solid var(--gold);border-radius:var(--rads);font-size:.82rem;color:#92400E}
.sort-bank{display:flex;flex-wrap:wrap;gap:.4rem;min-height:42px;padding:.4rem .5rem;border-radius:var(--rads);margin-bottom:.4rem;background:var(--bg);border:1px dashed var(--border)}
.sort-answer{display:flex;flex-wrap:wrap;gap:.4rem;min-height:46px;padding:.4rem .5rem;border-radius:var(--rads);margin-bottom:.4rem;background:var(--gcl);border:2px dashed var(--gc)}
.sort-tile{padding:.3rem .65rem;border-radius:var(--rads);border:1.5px solid var(--border);background:var(--card);cursor:pointer;font-size:.875rem;user-select:none;white-space:nowrap}
.sort-tile:hover{border-color:var(--gc);background:var(--gcl)}
.sort-tile-ans{background:var(--gcl);border-color:var(--gc);color:var(--gcb)}

/* ── 名前入力 & 管理パネル ── */
.name-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:3000;display:flex;align-items:center;justify-content:center}
.name-box{background:white;border-radius:16px;padding:32px 28px;max-width:340px;width:90%;text-align:center;box-shadow:0 8px 40px rgba(0,0,0,.3)}
.name-box h2{font-size:18px;font-weight:800;color:#1e3a5f;margin-bottom:6px}
.name-box p{font-size:12px;color:#64748b;margin-bottom:18px}
.name-input{width:100%;padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-size:16px;outline:none;margin-bottom:14px;box-sizing:border-box}
.name-input:focus{border-color:var(--gc)}
.name-btn{background:#1e3a5f;color:white;border:none;border-radius:10px;padding:11px 0;width:100%;font-size:15px;font-weight:700;cursor:pointer}
.name-display{font-size:11px;color:var(--muted);margin-left:6px}
.admin-btn-header{background:rgba(255,255,255,.15);border:1.5px solid var(--border);color:var(--text);padding:5px 14px;border-radius:50px;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap;margin-left:auto}
.admin-btn-header:hover{background:var(--gcl)}
.admin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:3100;display:none;align-items:flex-start;justify-content:center;overflow-y:auto}
.admin-overlay.show{display:flex}
.admin-box{background:white;border-radius:16px;margin:20px;max-width:760px;width:100%;padding:24px;box-shadow:0 8px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;max-height:90vh}
.admin-box h3{font-size:18px;color:#1e3a5f;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;font-weight:800}
.admin-close{background:none;border:none;font-size:24px;cursor:pointer;color:#64748b}
.admin-meta{font-size:13px;color:#475569;margin-bottom:10px;flex-shrink:0}
.admin-actions{display:flex;gap:8px;margin-bottom:10px;flex-shrink:0;flex-wrap:wrap}
.admin-btn-sm{background:#1e3a5f;color:white;border:none;border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-weight:700}
.admin-table-wrap{overflow-y:auto;flex:1;border:1px solid #e2e8f0;border-radius:8px}
.admin-table{width:100%;border-collapse:collapse;font-size:14px}
.admin-table thead{position:sticky;top:0;z-index:1}
.admin-table th{background:#1e3a5f;color:white;padding:10px 12px;text-align:left;font-weight:600}
.admin-table td{padding:9px 12px;border-bottom:1px solid #e2e8f0}
.admin-table tr:hover td{background:#f8fafc}
.admin-table .high{color:#2e7d32;font-weight:700}
.admin-table .mid{color:#f57f17;font-weight:700}
.admin-table .low{color:#b71c1c;font-weight:700}

/* ── サイトヘッダーバナー ── */
.site-header{background:linear-gradient(135deg,#1e3a5f 0%,#2563eb 100%);color:white;padding:0;position:sticky;top:0;z-index:200;box-shadow:0 4px 20px rgba(26,46,86,.4)}
.header-inner{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.site-logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px;color:white;text-decoration:none;white-space:nowrap}
.site-logo span{font-size:18px}
.logo-badge{background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);border-radius:8px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:1px;white-space:nowrap}
.header-name{font-size:12px;color:rgba(255,255,255,.85);white-space:nowrap}
</style>
</head>
<body>

<!-- 共通モジュール（ヘッダー＋ログイン窓 / 中学生用 正解スタンプ / 学習記録クライアント）-->
<script src="/assets/divp-header.js"></script>
<script src="/assets/divp-correct-jh.js"></script>
<script src="/assets/divp-core.js"></script>
<script>if(window.Divp&&Divp.init)Divp.init('english_js_grammar');</script>


<div id="landing">
  <h1>英文法練習アプリ</h1>
  <p>ニューホライズン（東京書籍）準拠 ─ 学年を選んでください</p>
  <div class="grade-cards">
    <div class="grade-card g1" onclick="startGrade(0)">
      <h2>中1</h2><p>Unit 0〜10</p>
    </div>
    <div class="grade-card g2" onclick="startGrade(1)">
      <h2>中2</h2><p>Unit 1〜7</p>
    </div>
    <div class="grade-card g3" onclick="startGrade(2)">
      <h2>中3</h2><p>Unit 1〜6</p>
    </div>
  </div>
</div>

<div id="app">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div id="topbar">
    <button class="back-btn" onclick="goHome()">← 学年選択</button>
    <button class="menu-btn" id="menu-btn" onclick="toggleSidebar()">☰ Unit</button>
    <span id="grade-badge" class="grade-badge gb1">中1</span>
    <span id="topbar-unit" style="font-size:.85rem;color:var(--muted)"></span>
  </div>
  <div id="layout">
    <div id="sidebar">
      <div id="unit-list"></div>
    </div>
    <div id="content">
      <div id="unit-title"></div>
      <div class="unit-nav" id="unit-nav">

// ═══════════════════════════════════════════════════
//  NORMALIZE & SCORING
// ═══════════════════════════════════════════════════
function expandTiles(tiles){
  const ABBR=['Mt.','Dr.','Mr.','Mrs.','Ms.','St.','Jr.','Sr.','vs.','etc.','a.m.','p.m.','U.S.','U.K.'];
  const out=[];
  tiles.forEach(t=>{
    if(ABBR.includes(t)){out.push(t);return;}
    const m=t.match(/^(.+?)([,\.!?])$/);
    if(m&&m[1].length>0){out.push(m[1],m[2]);}
    else{out.push(t);}
  });
  return out;
}
function checkSort(acc,tiles){
  const u=tiles.join(' ').replace(/ ([,\.!?])/g,'$1');
  return acc.some(a=>a===u);
}

// ── モバイル：サイドバードロワー ────────────────────────────────────────
function toggleSidebar(){
  const sb=document.getElementById('sidebar');
  const ov=document.getElementById('sidebar-overlay');
  sb.classList.toggle('open');
  ov.classList.toggle('show');
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('show');
}

// ── モバイル：Unit前後ナビ ───────────────────────────────────────────────
function moveUnit(dir){
  const g=gradeObj();
  if(!g) return;
  const units=g.units;
  const idx=units.findIndex(u=>u.id===curUnit);
  const nxt=idx+dir;
  if(nxt>=0&&nxt<units.length) openUnit(units[nxt].id);
}
function updateUnitNav(){
  const g=gradeObj();
  if(!g){return;}
  const units=g.units;
  const idx=units.findIndex(u=>u.id===curUnit);
  const pos=document.getElementById('unit-nav-pos');
  const bp=document.getElementById('btn-prev-unit');
  const bn=document.getElementById('btn-next-unit');
  if(pos) pos.textContent=(idx+1)+' / '+units.length;
  if(bp) bp.disabled=(idx<=0);
  if(bn) bn.disabled=(idx>=units.length-1);
}

let curGrade=null, curUnit=null, curTab='grammar', curProb=0, score={ok:0,total:0}, answeredMap={};
let activeProbs=null, shuffled=false;
function toggleShuffle(){
  const u=unitObj(); if(!u) return;
  if(shuffled){ activeProbs=null; shuffled=false; }
  else { activeProbs=[...(u.probs||[])].sort(()=>Math.random()-0.5); shuffled=true; }
  curProb=0; score={ok:0,total:0}; answeredMap={};
  renderPractice(u);
}
function recordAnswer(ok){
  if(answeredMap[curProb]===undefined){ if(ok) score.ok++; score.total++; }
  else if(answeredMap[curProb]!==ok){ score.ok += ok?1:-1; }
  answeredMap[curProb]=ok;
}
let sortHeld=[], sortAnswer=[];

// ─── HELPERS ───────────────────────────────────────
function norm(s,cs=false){
  let n=(s||'').trim().replace(/\s+/g,' ').replace(/['']/g,"'");
  return cs?n:n.toLowerCase();
}
function checkFill(blanks,inputs){
  return blanks.every((b,i)=>{
    const u=norm(inputs[i]||'',b.cs);
    return b.acc.some(a=>norm(a,b.cs)===u);
  });
}
function gradeObj(){return CUR.find(g=>g.grade===curGrade);}
function unitObj(){return gradeObj()?.units.find(u=>u.id===curUnit);}
function setGradeCSS(g){
  const r=document.documentElement;
  r.style.setProperty('--gc',`var(--g${g})`);
  r.style.setProperty('--gcl',`var(--g${g}l)`);
  r.style.setProperty('--gcb',`var(--g${g}b)`);
}

// ─── PANELS ────────────────────────────────────────
function showPanel(name){
  ['grammar','gfc','keys','practice'].forEach(n=>{
    document.getElementById('panel-'+n).style.display=(n===name?'':'none');
  });
}

// ─── LANDING / HOME ────────────────────────────────
function goHome(){
  document.getElementById('landing').style.display='';
  document.getElementById('app').style.display='none';
  curGrade=null; curUnit=null;
}

// ─── GRADE SELECT ──────────────────────────────────
function startGrade(idx){
  const grades=[1,2,3];
  curGrade=grades[idx];
  setGradeCSS(curGrade);
  document.getElementById('landing').style.display='none';
  document.getElementById('app').style.display='flex';
  // badge
  const badge=document.getElementById('grade-badge');
  badge.textContent=gradeObj().name;
  badge.className='grade-badge gb'+curGrade;
  buildSidebar();
  const first=gradeObj().units[0];
  openUnit(first.id);
}

// ─── SIDEBAR ───────────────────────────────────────
function buildSidebar(){
  const list=document.getElementById('unit-list');
  list.innerHTML='';
  gradeObj().units.forEach(u=>{
    const li=document.createElement('li');
    li.className='unit-item';
    li.dataset.id=u.id;
    li.innerHTML=`<strong>${u.title}</strong><span>${u.sub}</span>`;
    li.onclick=()=>openUnit(u.id);
    list.appendChild(li);
  });
}

// ─── UNIT SELECT ───────────────────────────────────
function openUnit(id){
  curUnit=id;
  closeSidebar();
  updateUnitNav();
  curTab='grammar';
  curProb=0;
  score={ok:0,total:0}; answeredMap={}; activeProbs=null; shuffled=false;
  document.querySelectorAll('.unit-item').forEach(el=>
    el.classList.toggle('active',el.dataset.id===id));
  const u=unitObj();
  document.getElementById('unit-title').innerHTML=
    `<h2 style="margin:0 0 .25rem;font-size:1.1rem">${u.title}</h2>
     <p style="margin:0;color:var(--muted);font-size:.85rem">${u.sub}</p>`;
  document.getElementById('topbar-unit').textContent=u.title;
  // highlight active tab
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick')?.includes("'"+curTab+"'"));
  });
  renderTab();
}

// ─── TAB SWITCH ────────────────────────────────────
function setTab(name){
  curTab=name;
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('onclick')?.includes("'"+name+"'"));
  });
  if(name==='practice'){curProb=0;score={ok:0,total:0};answeredMap={};activeProbs=null;shuffled=false;}
  renderTab();
}

function renderTab(){
  showPanel(curTab);
  const u=unitObj();
  if(!u) return;
  if(curTab==='grammar')  renderGrammar(u);
  else if(curTab==='gfc') renderGfc(u);
  else if(curTab==='keys') renderKeys(u);
  else if(curTab==='practice') renderPractice(u);
}

// ─── GRAMMAR ───────────────────────────────────────
function renderGrammar(u){
  const panel=document.getElementById('panel-grammar');
  let html='<div class="grammar-cards">';
  u.parts.forEach(p=>{
    html+=`<div class="grammar-card">
      <div class="grammar-label">${p.label}</div>
      <div class="grammar-point">${p.point}</div>
      <div class="grammar-exp">${p.exp.replace(/\n/g,'<br>')}</div>
      <div class="grammar-exs">`;
    p.ex.forEach(e=>{
      html+=`<div class="grammar-ex">
        <div class="ex-en">${e.en}</div>
        <div class="ex-ja">${e.ja}</div>
      </div>`;
    });
    html+='</div></div>';
  });
  html+='</div>';
  panel.innerHTML=html;
}

// ─── GfC ───────────────────────────────────────────
function renderGfc(u){
  const panel=document.getElementById('panel-gfc');
  if(!u.gfc){
    panel.innerHTML='<p style="padding:24px;color:#888">このUnitにGfCはありません。</p>';
    return;
  }
  const g=u.gfc;
  const tHead=g.table.head.map(h=>`<th>${h}</th>`).join('');
  const tRows=g.table.rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('');
  panel.innerHTML=`<div class="gfc-box">
    <div class="gfc-title">${g.title}</div>
    <div class="gfc-rule">${g.rule}</div>
    <table class="gfc-table"><thead><tr>${tHead}</tr></thead><tbody>${tRows}</tbody></table>
  </div>`;
}

// ─── KEY EXPRESSIONS ───────────────────────────────
function renderKeys(u){
  const panel=document.getElementById('panel-keys');
  let html='<ul class="key-list">';
  u.keys.forEach(k=>{
    html+=`<li class="key-item">
      <span class="key-en">${k.en}</span>
      <span class="key-ja">${k.ja}</span>
    </li>`;
  });
  html+='</ul>';
  panel.innerHTML=html;
}

// ─── PRACTICE ──────────────────────────────────────
function renderPractice(u){
  const panel=document.getElementById('panel-practice');
  const probs=activeProbs||(u&&u.probs)||[];
  if(!probs.length){
    panel.innerHTML='<p style="padding:24px;color:#888">練習問題はありません。</p>';
    return;
  }
  if(curProb>=probs.length){renderResults(panel,probs.length);return;}
  const prob=probs[curProb];
  if(prob.t==='fill') renderFill(panel,prob,curProb,probs.length);
  else renderSort(panel,prob,curProb,probs.length);
}

function probBar(cur,total){
  let opts='';
  for(let i=0;i<total;i++){opts+=`<option value="${i}"${i===cur?' selected':''}>${i+1}</option>`;}
  return `<div class="prob-header">
    <span class="prob-num">問題
      <select class="prob-jump" onchange="jumpProb(this.value)" title="問題番号を選んで移動">${opts}</select>
      / ${total}</span>
    <button class="prob-shuffle${shuffled?' on':''}" onclick="toggleShuffle()" title="出題順をシャッフル">${shuffled?'🔀 シャッフル中 → 順番に戻す':'🔀 シャッフル'}</button>
  </div>`;
}
function jumpProb(n){
  curProb=parseInt(n,10)||0;
  renderPractice(unitObj());
}

// ─── FILL ──────────────────────────────────────────
function renderFill(panel,prob,cur,total){
  sortHeld=[]; sortAnswer=[];
  let blankIdx=0;
  const tmpl=prob.tmpl.replace(/___/g,()=>{
    const i=blankIdx++;
    return `<input class="fill-input" id="fi${i}" type="text" inputmode="none" autocomplete="off" autocorrect="off" spellcheck="false">`;
  });
  panel.innerHTML=probBar(cur,total)+`
    <div class="prob-card">
      ${prob.idiom?'<div class="idiom-badge">🔑 重要熟語</div>':''}
      ${prob.q?'<div class="prob-q">Q: '+prob.q+'</div>':''}
      <div class="prob-prompt">${prob.p}</div>
      <div class="prob-tmpl">${tmpl}</div>
      ${keyboardHTML()}
      <div class="prob-actions">
        <button class="btn-submit" id="btn-submit">答え合わせ</button>
      </div>
      <div class="prob-result" id="prob-result" style="display:none"></div>
    </div>`;

  document.getElementById('btn-submit').onclick=()=>{
    const vals=prob.bl.map((_,i)=>document.getElementById('fi'+i)?.value||'');
    submitFill(prob,vals);
  };
  const last=document.getElementById('fi'+(prob.bl.length-1));
  if(last) last.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing) document.getElementById('btn-submit').click();});
  setupFillKeyboard(panel, prob.bl.length);
}

// ─── 画面QWERTYキーボード（穴埋め用・端末キーボードと併用）────────────
// 端末（PC/スマホ）の物理・ソフトキーボードはそのまま使える。加えて、この
// 画面キーボードで「今フォーカスしている入力欄」に文字を送る。テンキー配列
// ではなく英単語入力に合う QWERTY（romaji_master 配列を流用）。
let kbCaps=false, kbActiveInput=null;
function keyboardHTML(){
  const rows=['qwertyuiop','asdfghjkl','zxcvbnm'];
  let h='<div class="kbd" id="kbd">';
  rows.forEach((row,ri)=>{
    h+='<div class="kbd-row">';
    if(ri===2) h+='<button type="button" class="key caps util" data-act="caps">⇧</button>';
    for(const c of row) h+=`<button type="button" class="key" data-ch="${c}">${c}</button>`;
    if(ri===2) h+='<button type="button" class="key util wide" data-act="back">← けす</button>';
    h+='</div>';
  });
  h+='<div class="kbd-row">'
    +'<button type="button" class="key" data-ch="\'">\'</button>'
    +'<button type="button" class="key wide" data-ch=" ">スペース</button>'
    +'</div></div>';
  return h;
}
function kbInsert(ch){
  const el=kbActiveInput; if(!el||el.disabled) return;
  const s=el.selectionStart==null?el.value.length:el.selectionStart;
  const e=el.selectionEnd==null?el.value.length:el.selectionEnd;
  el.value=el.value.slice(0,s)+ch+el.value.slice(e);
  const p=s+ch.length; el.setSelectionRange(p,p); el.focus();
}
function kbBackspace(){
  const el=kbActiveInput; if(!el||el.disabled) return;
  let s=el.selectionStart, e=el.selectionEnd;
  if(s==null){ el.value=el.value.slice(0,-1); s=el.value.length; }
  else if(s!==e){ el.value=el.value.slice(0,s)+el.value.slice(e); }
  else if(s>0){ el.value=el.value.slice(0,s-1)+el.value.slice(s); s=s-1; }
  el.setSelectionRange(s,s); el.focus();
}
function setupFillKeyboard(panel, nBlanks){
  const kbd=panel.querySelector('#kbd'); if(!kbd) return;
  kbCaps=false; kbActiveInput=null;
  // フォーカス中の入力欄を記憶（未フォーカスなら先頭に送る）
  for(let i=0;i<nBlanks;i++){
    const el=panel.querySelector('#fi'+i);
    if(el) el.addEventListener('focus',()=>{ kbActiveInput=el; });
  }
  kbActiveInput=panel.querySelector('#fi0');
  const capsBtn=kbd.querySelector('[data-act="caps"]');
  // pointerdown + preventDefault で入力欄のフォーカスを奪わない
  kbd.addEventListener('pointerdown',e=>{
    const btn=e.target.closest('button'); if(!btn) return;
    e.preventDefault();
    if(!kbActiveInput || kbActiveInput.disabled){ kbActiveInput=panel.querySelector('#fi0'); }
    const act=btn.dataset.act;
    if(act==='back'){ kbBackspace(); return; }
    if(act==='caps'){ kbCaps=!kbCaps; capsBtn.classList.toggle('on',kbCaps); return; }
    let ch=btn.dataset.ch; if(ch==null) return;
    if(kbCaps && /[a-z]/.test(ch)){ ch=ch.toUpperCase(); kbCaps=false; capsBtn.classList.remove('on'); }
    kbInsert(ch);
  });
}

// ─── SORT ──────────────────────────────────────────
function renderSort(panel,prob,cur,total){
  sortAnswer=[];
  sortHeld=expandTiles([...prob.tiles]).sort(()=>Math.random()-0.5);
  panel.innerHTML=probBar(cur,total)+`
    <div class="prob-card">
      ${prob.idiom?'<div class="idiom-badge">🔑 重要熟語</div>':''}
      ${prob.q?'<div class="prob-q">Q: '+prob.q+'</div>':''}
      <div class="prob-prompt">${prob.p}</div>
      <div class="sort-answer" id="sort-answer"></div>
      <div class="sort-bank" id="sort-bank"></div>
      <div class="prob-actions">
        <button class="btn-submit" id="btn-submit">答え合わせ</button>
        <button class="btn-reset" id="btn-reset">リセット</button>
      </div>
      <div class="prob-result" id="prob-result" style="display:none"></div>
    </div>`;
  drawTiles();
  document.getElementById('btn-submit').onclick=()=>submitSort(prob);
  document.getElementById('btn-reset').onclick=()=>{
    sortAnswer=[];
    sortHeld=expandTiles([...prob.tiles]).sort(()=>Math.random()-0.5);
    drawTiles();
    document.getElementById('btn-submit').disabled=true;
  };
}

function drawTiles(){
  const bank=document.getElementById('sort-bank');
  const ans=document.getElementById('sort-answer');
  const sub=document.getElementById('btn-submit');
  if(!bank||!ans) return;
  bank.innerHTML=''; ans.innerHTML='';
  sortHeld.forEach((t,i)=>{
    const tile=document.createElement('span');
    tile.className='sort-tile';
    tile.textContent=t;
    tile.onclick=()=>{sortAnswer.push(t);sortHeld.splice(i,1);drawTiles();};
    bank.appendChild(tile);
  });
  sortAnswer.forEach((t,i)=>{
    const tile=document.createElement('span');
    tile.className='sort-tile sort-tile-ans';
    tile.textContent=t;
    tile.onclick=()=>{sortHeld.push(t);sortAnswer.splice(i,1);drawTiles();};
    ans.appendChild(tile);
  });
  if(sub) sub.disabled=(sortAnswer.length===0);
}

function submitSort(prob){
  const ok=checkSort(prob.acc,sortAnswer);
  recordAnswer(ok);
  const res=document.getElementById('prob-result');
  // 学習記録：並べ替え（unit_key=english_js_grammar / question_key=sort）
  safeDivpAnswer(ok, {
    question_key:'sort',
    question_params:{ unit:curUnit||'', prob:curProb },
    question_text:prob.p||'',
    correct_answer:prob.acc[0],
    wrong_answer:ok?'':sortAnswer.join(' '),
  });
  if(ok) safeDivpCorrect('.prob-card'); else safeDivpIncorrect('.prob-card');
  res.innerHTML=`
    <div class="result-badge ${ok?'result-ok':'result-ng'}">${ok?'✓ 正解！':'✗ 不正解'}</div>
    ${!ok?`<div class="result-ans">正解: <strong>${prob.acc[0]}</strong></div>`:''}
    ${prob.idiom?`<div class="idiom-meaning">📖 ${prob.ip} ＝ ${prob.im}</div>`:''}
    <button class="btn-next" id="btn-next">${curProb+1<unitObj().probs.length?'次の問題 →':'結果を見る'}</button>`;
  res.style.display='';
  document.getElementById('btn-submit').disabled=true;
  document.getElementById('btn-reset').disabled=true;
  document.querySelectorAll('.sort-tile,.sort-tile-ans').forEach(t=>t.style.pointerEvents='none');
  document.getElementById('btn-next').onclick=()=>{curProb++;renderPractice(unitObj());};
}

// ─── RESULTS ───────────────────────────────────────
function renderResults(panel,total){
  const answered=score.total;
  const pct=answered>0?Math.round(score.ok/answered*100):0;
  panel.innerHTML=`
    <div class="done-box">
      <h2>練習完了！</h2>

      <p>${pct}%　${pct>=80?'🎉 すばらしい！':'もう一度チャレンジしよう！'}</p>
      <button class="restart-btn" onclick="curProb=0;score={ok:0,total:0};answeredMap={};renderPractice(unitObj())">最初から</button>
    </div>`;
}
