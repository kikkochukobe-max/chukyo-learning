<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現代文　文法四択問題　総合問題編</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --sheet:#FFFFFF; --rule:#C9D6C4; --rule-strong:#8FA88A;
  --ink:#1E2B3A; --pencil:#5E6670; --red:#D0342C; --red-soft:#FBE7E4;
  --mark-bg:#F3EBB8; --ok-soft:#E5F0E2;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1F24; --sheet:#232A31; --rule:#34433A; --rule-strong:#5C7A62;
    --ink:#E7ECEF; --pencil:#A3ADB6; --red:#FF6B5F; --red-soft:#3A2522;
    --mark-bg:#4A4426; --ok-soft:#24352A;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1F24; --sheet:#232A31; --rule:#34433A; --rule-strong:#5C7A62;
  --ink:#E7ECEF; --pencil:#A3ADB6; --red:#FF6B5F; --red-soft:#3A2522;
  --mark-bg:#4A4426; --ok-soft:#24352A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.75;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
  background-attachment:local;
}
main{max-width:720px;margin:0 auto;padding:28px 18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hidden{display:none !important}

/* header */
.mast{border-left:6px solid var(--red);padding:4px 0 4px 16px;margin-bottom:28px;background:var(--paper)}
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0;letter-spacing:.04em}
.mast p{margin:6px 0 0;color:var(--pencil);font-size:15px}

/* unit list */
.units{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule-strong)}
.units li{border-top:1px solid var(--rule)}
.units li:first-child{border-top:none}
.unit-btn{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:12px;width:100%;
  text-align:left;background:none;border:none;padding:14px 16px}
.unit-btn .no{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--red);text-align:center;
  border-right:1px dashed var(--rule-strong);padding-right:10px}
.unit-btn .nm{font-weight:700;font-size:17px}
.unit-btn .sub{display:block;font-weight:400;font-size:13px;color:var(--pencil)}
.unit-btn .st{font-size:13px;color:var(--pencil);white-space:nowrap}
.unit-btn:not(:disabled):hover{background:var(--mark-bg)}
.unit-btn:disabled{cursor:default;opacity:.5}
.note{font-size:13px;color:var(--pencil);margin-top:14px}

/* unit page */
.back{background:none;border:none;padding:4px 0;color:var(--pencil);font-size:15px;margin-bottom:10px}
.back:hover{color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--rule-strong);padding:22px 20px}
.panel h2{font-family:var(--serif);font-size:26px;margin:0 0 4px;line-height:1.35}
.panel .scope{color:var(--pencil);font-size:14px;margin:0 0 18px}
.starts{display:grid;gap:10px}
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  padding:13px 16px;border:2px solid var(--ink);background:var(--sheet);text-align:left;font-weight:700}
.start small{font-weight:400;color:var(--pencil);font-size:13px}
.start.main{background:var(--ink);color:var(--sheet)}
.start.main small{color:var(--rule)}
.start:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--red)}
.cat-h{font-size:14px;color:var(--pencil);margin:22px 0 8px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cats .start{border-width:1px;font-size:15px;padding:10px 12px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:14px;color:var(--pencil)}
.bar{height:6px;background:var(--rule);margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.card{position:relative;background:var(--sheet);border:1px solid var(--rule-strong);padding:22px 20px 20px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--rule-strong);padding:0 8px;color:var(--pencil);margin-bottom:10px}
.qtext{font-weight:700;font-size:18px;margin:0 0 12px;padding-right:64px}
.sent{font-family:var(--serif);font-size:21px;line-height:1.9;background:var(--paper);border-left:4px solid var(--rule-strong);
  padding:10px 14px;margin:0 0 16px;overflow-x:auto}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:2.2em 1fr;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--sheet);border:1px solid var(--rule-strong);padding:10px 12px}
.opt .lb{font-family:var(--serif);font-weight:700;font-size:18px;width:1.9em;height:1.9em;display:grid;place-items:center;
  border:1px solid var(--ink);border-radius:50%}
.opt .tx{font-size:17px}
.opt .tx.seg{font-family:var(--serif);font-size:19px}
.opt:not(:disabled):hover{background:var(--mark-bg)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--rule-strong)}
.opt.correct .lb{background:var(--ink);color:var(--sheet)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .tx{text-decoration:line-through;text-decoration-color:var(--red)}
.cut{color:var(--red);font-family:var(--sans);font-weight:700;margin:0 .15em}
.mark{position:absolute;top:10px;right:12px;width:72px;height:72px;pointer-events:none}
.mark path,.mark circle{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round}
.mark .draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .45s ease-out forwards}
.mark .draw2{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .25s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.exp{margin-top:16px;padding:12px 14px;border:1px dashed var(--red);background:var(--sheet)}
.exp b{color:var(--red)}
.exp p{margin:4px 0 0}
.next{margin-top:16px;width:100%;padding:13px;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:700}
.next:hover{box-shadow:3px 3px 0 var(--red)}
.hint{font-size:12px;color:var(--pencil);text-align:center;margin-top:8px}

/* result */
.score{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.score .big{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1;color:var(--red)}
.score .of{font-size:18px;padding-bottom:8px}
.verdict{margin:0 0 18px;color:var(--pencil)}
.review{list-style:none;padding:0;margin:18px 0 0}
.review li{border-top:1px solid var(--rule);padding:12px 0}
.review .rq{font-weight:700}
.review .rs{font-family:var(--serif);font-size:18px}
.review .ra{font-size:15px}
.review .ra span{color:var(--red);font-weight:700}
.row{display:grid;gap:10px;margin-top:18px}
@media (min-width:560px){.row{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){
  .mark .draw,.mark .draw2{animation:none;stroke-dashoffset:0}
  .bar i{transition:none}
  .start:hover{transform:none}
}
/* 総合問題編 */
.sec-h{font-family:var(--serif);font-size:21px;margin:30px 0 4px;line-height:1.4;background:var(--paper)}
.sec-h:first-of-type{margin-top:0}
.sec-p{font-size:14px;color:var(--pencil);margin:0 0 12px;background:var(--paper)}
.mix{display:grid;gap:10px}
.mix-sub{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-top:10px}
.mix-sub .start{border-width:1px;font-size:15px;padding:10px 12px}
.passage{font-family:var(--serif);font-size:19px;line-height:2.05;background:var(--sheet);border:1px solid var(--rule-strong);
  border-left:6px solid var(--rule-strong);padding:14px 16px;margin-bottom:14px;white-space:pre-wrap}
.passage .pt{display:block;font-family:var(--sans);font-size:13px;color:var(--pencil);margin-bottom:4px;white-space:normal}
.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.ul sup{font-family:var(--sans);font-size:12px;color:var(--pencil);margin-right:1px;text-decoration:none;display:inline-block}
.ul.on{background:var(--mark-bg);text-decoration-color:var(--red);text-decoration-thickness:2.5px}
.ul.on sup{color:var(--red);font-weight:700}
.review .rp{font-size:13px;color:var(--pencil)}
.unit-btn.ps{grid-template-columns:1fr auto}
.unit-btn.ps .nm{font-family:var(--serif);font-size:19px}
</style>
</head>
<body>
<main>
  <header class="mast">
    <h1>現代文　文法四択問題<br>総合問題編</h1>
    <p>単元をまたいだ実力チェック</p>
  </header>

  <!-- ホーム -->
  <section id="home">
    <h2 class="sec-h">文章で解く総合問題</h2>
    <p class="sec-p">短い文章を読み、傍線部の文法を答えます。文の組み立て・品詞・活用・助詞・助動詞・敬語が一つの文章の中で出題されます。</p>
    <ul class="units" id="psgList"></ul>

    <h2 class="sec-h">全単元ミックステスト</h2>
    <p class="sec-p">単元1〜14の問題からランダムに出題します。解くたびに問題が入れかわります。</p>
    <div class="mix" id="mixMain"></div>
    <div class="mix-sub" id="mixSub"></div>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="hidden">
    <button class="back" id="quit">← やめてトップにもどる</button>
    <div class="qtop"><span id="qCount"></span><span id="qScore"></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="passage hidden" id="qPsg"></div>
    <div class="card" id="card">
      <span class="tag" id="qTag"></span>
      <p class="qtext" id="qText"></p>
      <div class="sent" id="qSent"></div>
      <ul class="opts" id="opts"></ul>
      <div id="markBox"></div>
      <div class="exp hidden" id="exp"></div>
      <button class="next hidden" id="next"></button>
    </div>
    <p class="hint">キーボードの 1〜4 で選択、Enter で次へ進めます。</p>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="panel">
      <h2 id="resTitle"></h2>
      <div class="score"><span class="big" id="resScore"></span><span class="of" id="resOf"></span></div>
      <p class="verdict" id="resVerdict"></p>
      <div class="row">
        <button class="start main" id="retryWrong">間違えた問題だけ解き直す</button>
        <button class="start" id="retryAll">もう一度挑戦する</button>
        <button class="start" id="toHome">トップにもどる</button>
      </div>
      <ul class="review" id="review"></ul>
    </div>
  </section>
</main>

<script>
/* ===== 単元データ（本編と共通） ===== */
const UNITS = [
{
  id:"u1", no:1, name:"文節と単語", sub:"文章・段落・文・文節・単語",
  scope:"出題範囲：言葉の単位（文章・段落・文）、文節の区切り方、単語の区切り方、複合語",
  cats:["文章・段落・文","文節","単語","文節と単語のまとめ"],
  qs:[
  // ---- 文章・段落・文
  {cat:0,q:"言葉の単位を、大きいものから順に並べたものはどれですか。",
   c:["文章 → 段落 → 文 → 文節 → 単語","文章 → 文 → 段落 → 文節 → 単語","段落 → 文章 → 文 → 単語 → 文節","文章 → 段落 → 文節 → 文 → 単語"],a:0,
   e:"いちばん大きいのが「文章」、いちばん小さいのが「単語」です。文章は段落に、段落は文に、文は文節に、文節は単語に分けられます。"},
  {cat:0,q:"「段落」の説明として正しいものはどれですか。",
   c:["文章を、内容のまとまりごとに区切ったもの。初めは一字下げて書く。","「。」などで終わる、ひと続きの言葉。","意味や発音が不自然にならない程度に、文を短く区切ったもの。","意味をもつ、最も小さな言葉の単位。"],a:0,
   e:"段落は文章の中のひと区切りのまとまりです。行を変え、初めを一字下げて書きます。ほかの選択肢は順に「文」「文節」「単語」の説明です。"},
  {cat:0,q:"「文」の説明として正しいものはどれですか。",
   c:["一つのまとまった内容を表し、「。」「？」「！」などで終わるひと続きの言葉。","あるまとまった内容を表した、最も大きな言葉の単位。","文章の中で、内容のまとまりごとに区切ったもの。","文節をさらに細かく分けた言葉の単位。"],a:0,
   e:"文はふつう「。」（句点）で終わりますが、「？」や「！」で終わることもあります。"},
  {cat:0,q:"文の終わりに付く記号として、当てはまらないものはどれですか。",
   c:["、","。","？","！"],a:0,
   e:"「、」は読点で、文の途中に打つ記号です。文の終わりには「。」「？」「！」が付きます。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"あなたは犬が好きですか？　わたしは大好きです。毎朝、近くの公園まで散歩に連れて行きます。",
   c:["2つ","3つ","4つ","6つ"],a:1,
   e:"「？」で終わる部分も一つの文です。「、」は文の途中の区切りなので数えません。「…好きですか？」「…大好きです。」「…連れて行きます。」の3つです。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"雨がやんだ。外に出ると、空気がひんやりしていた。「きれいな虹だ！」と妹が言った。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"「　」の中の「！」は会話の区切りで、「…と妹が言った。」までで一つの文です。「雨がやんだ。」「…ひんやりしていた。」「「きれいな虹だ！」と妹が言った。」の3つです。"},

  {cat:0,q:"次の文章は、いくつの段落からできていますか。",
   s:"　毎朝、わたしは犬の散歩をする。近所の公園を一周するのが日課だ。\n　ある日、公園で小さな子ねこを見つけた。わたしは急いで家に連れて帰った。\n　今では、犬と子ねこはすっかり仲よしだ。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"段落は、行を変えて一字下げたところから始まります。一字下がっている行の頭が3か所あるので、3つの段落です。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"　毎朝、わたしは犬の散歩をする。近所の公園を一周するのが日課だ。\n　ある日、公園で小さな子ねこを見つけた。わたしは急いで家に連れて帰った。\n　今では、犬と子ねこはすっかり仲よしだ。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"「。」で終わるまとまりを数えます。1段落目に2つ、2段落目に2つ、3段落目に1つで、合計5つの文です。段落の数と文の数を混同しないようにしましょう。"},
  {cat:0,q:"段落の書き始め方として、正しいものはどれですか。",
   c:["行を変え、初めを一字下げて書く。","前の行に続けて書く。","一行あけて、行の頭から書く。","初めに「　」を付けて書く。"],a:0,
   e:"段落の初めは、行を変えて（改行して）一字下げて書きます。"},
  {cat:0,q:"「意味段落」の説明として、正しいものはどれですか。",
   c:["内容のつながりのうえから、いくつかの形式段落をひとまとまりにしたもの。","行を変え、一字下げて書き始めた一つ一つのまとまり。","「。」から次の「。」までのひと続きの言葉。","「　」で囲まれた会話の部分。"],a:0,
   e:"行を変えて一字下げた一つ一つのまとまりを「形式段落」、内容のつながりから形式段落をいくつかまとめたものを「意味段落」といいます。"},
  {cat:0,q:"次の文章に、必要なところへ句点「。」を付けると、いくつの文になりますか。",
   s:"朝起きると雪が積もっていた外は一面真っ白だったぼくはすぐに着がえて庭に飛び出した",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"朝起きると雪が積もっていた。／外は一面真っ白だった。／ぼくはすぐに着がえて庭に飛び出した。の3つの文になります。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"母は「早く寝なさい。」と言った。ぼくは小さな声で返事をした。",
   c:["1つ","2つ","3つ","4つ"],a:1,
   e:"「　」の中の「。」は会話の終わりで、「…と言った。」までで一つの文です。「母は「早く寝なさい。」と言った。」「ぼくは小さな声で返事をした。」の2つです。"},

  // ---- 文節
  {cat:1,q:"文節の切れ目を見つける方法として、正しいものはどれですか。",
   c:["「ネ」「サ」「ヨ」を入れてみて、不自然にならないところで区切る。","「、」が付くところだけで区切る。","漢字とひらがなの境目で区切る。","意味のわかる最も小さな言葉ごとに区切る。"],a:0,
   e:"「ぼくはネ／友だちとネ／公園にネ／行った。」のように、「ネ・サ・ヨ」を入れて自然なところが文節の切れ目です。いちばん下の選択肢は単語の分け方です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"ぼくは友だちと公園に行った。",
   c:["ぼくは/友だちと/公園に/行った。","ぼく/は/友だち/と/公園/に/行った。","ぼくは/友だちと公園に/行った。","ぼくは/友だちと/公園に/行っ/た。"],a:0,
   e:"ぼくはネ／友だちとネ／公園にネ／行った。の4文節です。「行っ/た」のように分けると発音が不自然になります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"朝の散歩は気分がよい。",
   c:["朝/の/散歩は/気分が/よい。","朝の/散歩は/気分が/よい。","朝の散歩は/気分が/よい。","朝の/散歩/は/気分/が/よい。"],a:1,
   e:"朝のネ／散歩はネ／気分がネ／よい。の4文節です。「の」「は」「が」は前の言葉にくっつけて一文節にします。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"わたしには妹が二人います。",
   c:["わたしに/は/妹が/二人/います。","わたしには/妹が/二人います。","わたしには/妹が/二人/います。","わたし/には/妹/が/二人/います。"],a:2,
   e:"わたしにはネ／妹がネ／二人ネ／います。の4文節です。「二人」と「います」の間にも「ネ」が入ります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"本を読んでいる。",
   c:["本を/読んでいる。","本/を/読んで/いる。","本を/読ん/でいる。","本を/読んで/いる。"],a:3,
   e:"本をネ／読んでネ／いる。の3文節です。「〜て（で）いる」は「〜て（で）」と「いる」の二つの文節に分かれます。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"わたしの夢は医者になることだ。",
   c:["わたしの/夢は/医者に/なる/ことだ。","わたしの/夢は/医者に/なることだ。","わたしの/夢は/医者になる/ことだ。","わたしの/夢/は/医者に/なる/ことだ。"],a:0,
   e:"「〜こと」の前は文節の切れ目になります。わたしのネ／夢はネ／医者にネ／なるネ／ことだ。の5文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"その話はとてもおもしろかった。",
   c:["その話は/とても/おもしろかった。","その/話は/とても/おもしろかっ/た。","その/話は/とても/おもしろかった。","その/話/は/とても/おもしろかった。"],a:2,
   e:"そのネ／話はネ／とてもネ／おもしろかった。の4文節です。「その」だけでも一文節になります。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"弟は毎朝早く起きる。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"弟は／毎朝／早く／起きる。の4文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"庭に小さな赤い花が咲いている。",
   c:["4つ","5つ","6つ","7つ"],a:2,
   e:"庭に／小さな／赤い／花が／咲いて／いる。の6文節です。「咲いて／いる」で二つに分かれる点に注意しましょう。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"春休みに祖父の家へ遊びに行った。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"春休みに／祖父の／家へ／遊びに／行った。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"兄は部屋で静かに音楽を聞いていた。",
   c:["5つ","6つ","7つ","8つ"],a:1,
   e:"兄は／部屋で／静かに／音楽を／聞いて／いた。の6文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"泳ぐことができる。",
   c:["1つ","2つ","3つ","4つ"],a:2,
   e:"泳ぐ／ことが／できる。の3文節です。「〜こと」の前で区切ります。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"ノートに名前を書いておくことを忘れないでください。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"ノートに／名前を／書いて／おく／ことを／忘れないで／ください。の7文節です。「〜て（で）おく」「〜て（で）ください」も二つの文節に分かれます。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["空が/青い。","鳥が/空を/飛ぶ。","母と/買い物に/行く。","先生に/ほめ/られた。"],a:3,
   e:"「ほめられた」は「ほめ」と「られた」の間に「ネ」を入れると不自然なので、一つの文節です。正しくは「先生に/ほめられた。」です。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["雨が/降って/きた。","本を/読んで/みる。","手紙を/書き/始める。","窓を/開けて/おく。"],a:2,
   e:"「書き始める」は二つの言葉が結び付いて一語になった言葉（複合語）なので、一つの文節です。「〜て（で）きた」「〜て（で）みる」「〜て（で）おく」は二つの文節に分かれます。"},

  {cat:1,q:"「ネ」を入れて文節の切れ目を確かめたとき、正しく入れられているものはどれですか。",
   c:["妹ネはネピアノをネひく。","妹はネピアノをネひく。","妹はネピアノネをひく。","妹はネピアノをネひネく。"],a:1,
   e:"「妹はネ／ピアノをネ／ひく。」が自然な言い方です。「妹ネは」「ピアノネを」「ひネく」は不自然なので、そこは文節の切れ目ではありません。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"今日は朝から雨が降っている。",
   c:["今日は/朝から/雨が/降っている。","今日は/朝から/雨が/降って/いる。","今日/は/朝/から/雨/が/降って/いる。","今日は朝から/雨が/降って/いる。"],a:1,
   e:"今日はネ／朝からネ／雨がネ／降ってネ／いる。の5文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"静かな部屋で手紙を書いた。",
   c:["静か/な/部屋で/手紙を/書いた。","静かな/部屋で/手紙を/書い/た。","静かな/部屋で/手紙を/書いた。","静かな部屋で/手紙を/書いた。"],a:2,
   e:"静かなネ／部屋でネ／手紙をネ／書いた。の4文節です。「静かな」で一文節になります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"数学はいちばん苦手な教科です。",
   c:["数学は/いちばん/苦手な/教科/です。","数学は/いちばん/苦手な/教科です。","数学は/いちばん苦手な/教科です。","数学/は/いちばん/苦手な/教科です。"],a:1,
   e:"数学はネ／いちばんネ／苦手なネ／教科です。の4文節です。「教科ネです」は不自然なので「教科です」で一文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"姉は新しい服を買ってもらった。",
   c:["姉は/新しい/服を/買ってもらった。","姉は/新しい/服を/買って/もら/った。","姉は/新しい服を/買って/もらった。","姉は/新しい/服を/買って/もらった。"],a:3,
   e:"姉はネ／新しいネ／服をネ／買ってネ／もらった。の5文節です。「〜て（で）もらう」も二つの文節に分かれます。"},
  {cat:1,q:"次のうち、二つの文節に分けられるものはどれですか。",
   c:["行かなかった","書き始めた","走っている","美しかった"],a:2,
   e:"「走っている」は「走ってネ／いる」と分けられるので2文節です。「書き始めた」は複合語を含む一文節、「行かなかった」「美しかった」も途中に「ネ」が入らないので一文節です。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["弟は/ゆっくり/階段を/のぼった。","姉が/わたしの/弁当を/届けて/くれた。","明日の/朝に/新幹線で/出かける/予定だ。","発音は/もっと/はっきりと/大きな声で/言え。"],a:3,
   e:"「大きな声で」は「大きなネ／声でネ」と分けられるので、正しくは「発音は/もっと/はっきりと/大きな/声で/言え。」です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"ぼくは毎日犬と散歩に行く。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"ぼくは／毎日／犬と／散歩に／行く。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"明日はおそらく晴れるだろう。",
   c:["3つ","4つ","5つ","6つ"],a:0,
   e:"明日は／おそらく／晴れるだろう。の3文節です。「晴れるネだろう」は不自然なので、「晴れるだろう」で一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"彼は次々と新記録を出した。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"彼は／次々と／新記録を／出した。の4文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"この春からは中学一年生になる。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"この／春からは／中学一年生に／なる。の4文節です。「春からは」はひとまとまりで一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"毎日二時間も勉強する。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"毎日／二時間も／勉強する。の3文節です。「勉強する」は一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"庭の梅の花がきれいに咲いた。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"庭の／梅の／花が／きれいに／咲いた。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"友だちの家で数学の勉強をする。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"友だちの／家で／数学の／勉強を／する。の5文節です。「勉強を」と「する」の間には「ネ」が入ります。"},

  // ---- 単語
  {cat:2,q:"「単語」の説明として正しいものはどれですか。",
   c:["文節をさらに細かく分けた、意味をもつ最も小さな言葉の単位。","意味や発音が不自然にならない程度に、文を短く区切ったもの。","「。」などで終わる、ひと続きの言葉。","文章を、内容のまとまりごとに区切ったもの。"],a:0,
   e:"単語は、言葉の単位の中でいちばん小さいものです。ほかの選択肢は順に「文節」「文」「段落」の説明です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"花が咲いた。",
   c:["花が/咲いた。","花/が/咲いた。","花/が/咲い/た。","花/が/咲/い/た。"],a:2,
   e:"花／が／咲い／た。の4単語です。「咲いた」は「咲い」と、過去を表す「た」の二つの単語に分かれます。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"妹の部屋は広い。",
   c:["妹/の/部屋/は/広い。","妹の/部屋は/広い。","妹/の/部屋/は/広/い。","妹/の部屋/は/広い。"],a:0,
   e:"妹／の／部屋／は／広い。の5単語です。「広い」はこれ以上分けると意味がなくなるので一単語です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"大きな鳥が屋根にとまる。",
   c:["大き/な/鳥/が/屋根/に/とまる。","大きな/鳥が/屋根に/とまる。","大きな/鳥/が/屋根に/とまる。","大きな/鳥/が/屋根/に/とまる。"],a:3,
   e:"大きな／鳥／が／屋根／に／とまる。の6単語です。「大きな」は一単語です。"},
  {cat:2,q:"「知らなかった」を正しく単語に区切ったものはどれですか。",
   c:["知ら/なかった","知らなかっ/た","知ら/なかっ/た","知/ら/なかっ/た"],a:2,
   e:"知ら／なかっ／た　の3単語です。「知ら」＋打ち消しの「なかっ」＋過去の「た」に分かれます。"},
  {cat:2,q:"「食べました」を正しく単語に区切ったものはどれですか。",
   c:["食べ/ました","食べまし/た","食/べ/まし/た","食べ/まし/た"],a:3,
   e:"食べ／まし／た　の3単語です。「まし」はていねいな言い方の「ます」が形を変えたもの、「た」は過去を表します。"},
  {cat:2,q:"「読んでいる」を正しく単語に区切ったものはどれですか。",
   c:["読ん/で/いる","読んで/いる","読/んで/いる","読ん/でいる"],a:0,
   e:"読ん／で／いる　の3単語です。文節に分けると「読んで／いる」の2文節ですが、単語ではさらに「読ん」と「で」に分かれます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"わたしは学校へ行った。",
   c:["4つ","5つ","6つ","7つ"],a:2,
   e:"わたし／は／学校／へ／行っ／た。の6単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"ぼくは自転車で学校へ行く。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"ぼく／は／自転車／で／学校／へ／行く。の7単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"夏休みに海で泳いだ。",
   c:["5つ","6つ","7つ","8つ"],a:1,
   e:"夏休み／に／海／で／泳い／だ。の6単語です。「夏休み」は複合語なので一単語。「泳いだ」の「だ」は過去の「た」がにごったものです。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"道路に飛び出すと危ない。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"道路／に／飛び出す／と／危ない。の5単語です。「飛び出す」は複合語なので一単語として数えます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"富士山がよく見える場所でお茶を飲む。",
   c:["8語","9語","10語","11語"],a:1,
   e:"富士山／が／よく／見える／場所／で／お茶／を／飲む。の9単語です。「お茶」は分けずに一単語として数えます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"作文を書き直す。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"作文／を／書き直す。の3単語です。「書き直す」は「書く＋直す」が結び付いた複合語なので一単語です。"},
  {cat:2,q:"一つの単語であるものはどれですか。",
   c:["春の休み","休みの日","春休み","春が来た"],a:2,
   e:"「春休み」は「春＋休み」が結び付いてできた複合語で、一単語です。ほかはいずれも二つ以上の単語からできています。"},
  {cat:2,q:"一つの単語ではない（二つ以上の単語でできている）ものはどれですか。",
   c:["書き直す","走り出す","雨上がり","読んでいる"],a:3,
   e:"「読んでいる」は読ん／で／いる　の3単語です。ほかの三つは、二つの言葉が結び付いて一語になった複合語です。"},

  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"太陽は東から昇る。",
   c:["太陽は/東から/昇る。","太陽/は/東/から/昇る。","太/陽/は/東/から/昇る。","太陽/は/東から/昇る。"],a:1,
   e:"太陽／は／東／から／昇る。の5単語です。「太陽」は分けると意味がなくなるので一単語です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"九時から走り始める。",
   c:["九時/から/走り/始める。","九/時/から/走り始める。","九時から/走り始める。","九時/から/走り始める。"],a:3,
   e:"九時／から／走り始める。の3単語です。「走り始める」は「走る＋始める」が結び付いた複合語なので一単語です。"},
  {cat:2,q:"「行かない」を正しく単語に区切ったものはどれですか。",
   c:["行かない","行/かない","行か/ない","行かな/い"],a:2,
   e:"行か／ない　の2単語です。「ない」は打ち消しの意味をそえる単語です。"},
  {cat:2,q:"「見ました」を正しく単語に区切ったものはどれですか。",
   c:["見/まし/た","見/ました","見まし/た","見ました"],a:0,
   e:"見／まし／た　の3単語です。「食べました」と同じ形です。"},
  {cat:2,q:"「遊んだ」を正しく単語に区切ったものはどれですか。",
   c:["遊んだ","遊/んだ","遊ん/だ","遊/ん/だ"],a:2,
   e:"遊ん／だ　の2単語です。「だ」は過去の「た」がにごったものです。"},
  {cat:2,q:"「書いてください」を正しく単語に区切ったものはどれですか。",
   c:["書いて/ください","書い/て/ください","書い/てください","書/いて/くだ/さい"],a:1,
   e:"書い／て／ください　の3単語です。文節では「書いて／ください」の2文節です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"荷物を部屋に運ぶ。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"荷物／を／部屋／に／運ぶ。の5単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"ぼくは自転車からおりる。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"ぼく／は／自転車／から／おりる。の5単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"妹はかぜで学校を休む。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"妹／は／かぜ／で／学校／を／休む。の7単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"妹はずっとわたしの横にいる。",
   c:["6つ","7つ","8つ","9つ"],a:2,
   e:"妹／は／ずっと／わたし／の／横／に／いる。の8単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"今日は遠くの山がよく見える。",
   c:["6つ","7つ","8つ","9つ"],a:2,
   e:"今日／は／遠く／の／山／が／よく／見える。の8単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"わたしは学校から帰ると毎日犬の散歩に行く。",
   c:["10語","11語","12語","13語"],a:2,
   e:"わたし／は／学校／から／帰る／と／毎日／犬／の／散歩／に／行く。の12単語です。"},
  {cat:2,q:"一つの単語であるものはどれですか。",
   c:["休みの時間","休み時間","休んだ時間","時間が休み"],a:1,
   e:"「休み時間」は「休み＋時間」が結び付いてできた複合語で、一単語です。"},
  {cat:2,q:"次の文を単語に分けたとき、それだけでは意味がわからない単語はどれですか。",

  id:"u2", no:2, name:"文の成分・主語と述語", sub:"文の成分・主語・述語・主述の関係",
  scope:"出題範囲：文の成分の五種類（見分けの基本）、主語、述語、主語・述語の関係（四つの型・倒置・省略）。単元1の文節の知識も使います。",
  cats:["文の成分","主語","述語","主語・述語の関係"],
  qs:[
  {cat:0,q:"文の成分の種類として、当てはまらないものはどれですか。",
   c:["主語", "修飾語", "独立語", "単語"],a:3,
   e:"文の成分は、主語・述語・修飾語・接続語・独立語の五種類です。「単語」は言葉の単位の名前です。"},
  {cat:0,q:"文の成分は、どの言葉の単位ごとに考えますか。",
   c:["文節", "単語", "文", "段落"],a:0,
   e:"文を文節に区切り、それぞれの文節が文の中でどんな働きをしているかで、文の成分に分けます。"},
  {cat:0,q:"次の文の「ほら」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「ほら」は、ほかの文節と直接の関係がなく、相手の注意を引く言葉なので独立語です。"},
  {cat:0,q:"次の文の「暖かかったので」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "修飾語", "接続語", "独立語"],a:2,
   e:"「暖かかったので」は、花が咲いた理由を示して、あとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「白い」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「白い」は、「どんな花か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「咲いた」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「咲いた」は、「花が」に対して「どうする」に当たるので述語です。"},
  {cat:0,q:"次の文の「入れる」は、どの文の成分に当たりますか。",
   s:"かごに野菜を入れる。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「入れる」は「どうする」に当たり、文の終わりにあるので述語です。"},
  {cat:0,q:"次の文の「まあ」は、どの文の成分に当たりますか。",
   s:"まあ、大きなかばんですね。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「まあ」は感動を表し、ほかの文節と直接関係していないので独立語です。"},
  {cat:0,q:"次の文の「ゆっくりと」は、どの文の成分に当たりますか。",
   s:"鳥がゆっくりと飛び立った。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「ゆっくりと」は、「どのように飛び立ったか」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「暗いから」は、どの文の成分に当たりますか。",
   s:"暗いから、よく見えません。",
   c:["主語", "修飾語", "接続語", "独立語"],a:2,
   e:"「暗いから」は、よく見えない理由を示してあとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「雪が」は、どの文の成分に当たりますか。",
   s:"屋根の上に雪が積もる。",
   c:["主語", "述語", "修飾語", "接続語"],a:0,
   e:"「雪が」は、「何が積もるのか」の「何が」に当たるので主語です。"},
  {cat:0,q:"次の文の「言葉の」は、どの文の成分に当たりますか。",
   s:"辞書で言葉の意味を調べる。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「言葉の」は、「何の意味か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「おや」は、どの文の成分に当たりますか。",
   s:"おや、きみも来ていたのか。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「おや」は驚きを表し、ほかの文節と直接関係していないので独立語です。"},
  {cat:0,q:"「どんな」「どのように」などを表し、あとの文節をくわしく説明する文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "独立語"],a:2,
   e:"あとの文節の意味をくわしく説明する文節を修飾語といいます。"},
  {cat:0,q:"「独立語」の説明として正しいものはどれですか。",
   c:["ほかの文節と直接の関係がなく、比較的独立している文節。", "理由や条件を示したり、前後をつないだりする文節。", "「何が（だれが）」に当たる文節。", "「どうする」「どんなだ」などに当たる文節。"],a:0,
   e:"独立語は、感動・呼びかけ・応答・あいさつなどを表し、ふつう文の初めにきます。ほかの選択肢は順に接続語・主語・述語の説明です。"},
  {cat:0,q:"「接続語」の説明として正しいものはどれですか。",
   c:["「何が（だれが）」に当たる文節。", "理由や条件を示したり、前後の文や文節をつないだりする文節。", "「どのように」などとあとの文節をくわしく説明する文節。", "ほかの文節と直接の関係がない文節。"],a:1,
   e:"「寒いから、」（理由）や「だから、」（前の文を受けてつなぐ）のような文節が接続語です。"},
  {cat:1,q:"「主語」の説明として正しいものはどれですか。",
   c:["文の中で「何が（だれが）」に当たる文節。", "文の中で「どうする」「どんなだ」「何だ」などに当たる文節。", "「どのように」などとあとの文節をくわしく説明する文節。", "呼びかけや応答などを表す文節。"],a:0,
   e:"主語は「何が（だれが）」に当たる文節です。二つめは述語、三つめは修飾語、四つめは独立語の説明です。"},
  {cat:1,q:"主語の文節の形として、ふつう当てはまらないものはどれですか。",
   c:["弟が", "弟は", "弟も", "弟を"],a:3,
   e:"主語には「〜が」「〜は」のほか、「〜も」「〜こそ」「〜さえ」などの形もあります。「弟を」は「何を」に当たるので主語ではありません。"},
  {cat:1,q:"文の主語を見つけるときの手順として、適切なものはどれですか。",
   c:["まず述語を見つけ、それに対して「何が（だれが）」に当たる文節を探す。", "文の初めにある文節を主語とする。", "「は」が付いている文節を必ず主語とする。", "文の最後にある文節を主語とする。"],a:0,
   e:"述語は文の最後にあることが多いので、先に述語を見つけてから「何が（だれが）○○なのか」と考えると、主語を正しく見つけられます。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"カタカナは漢字の一部から作られた。",
   c:["カタカナは", "漢字の", "一部から", "作られた"],a:0,
   e:"述語「作られた」に対して、「何が作られたのか」→「カタカナは」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"庭のあじさいの花もとてもきれいだ。",
   c:["庭の", "あじさいの", "花も", "きれいだ"],a:2,
   e:"述語「きれいだ」に対して、「何がきれいなのか」→「花も」が主語です。「〜も」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今朝はあさがおの芽が出たよ。",
   c:["今朝は", "あさがおの", "芽が", "出たよ"],a:2,
   e:"述語「出たよ」に対して、「何が出たのか」→「芽が」が主語です。「今朝は」は「は」が付いていますが、いつなのかを表していて主語ではありません。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"中学生こそ対象としてふさわしい。",
   c:["中学生こそ", "対象と", "して", "ふさわしい"],a:0,
   e:"述語「ふさわしい」に対して、「だれがふさわしいのか」→「中学生こそ」が主語です。「〜こそ」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"明日はわたしもいっしょに行きます。",
   c:["明日は", "わたしも", "いっしょに", "行きます"],a:1,
   e:"述語「行きます」に対して、「だれが行くのか」→「わたしも」が主語です。「明日は」はいつなのかを表しています。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"父さえその答えを知らなかった。",
   c:["父さえ", "その", "答えを", "知らなかった"],a:0,
   e:"述語「知らなかった」に対して、「だれが知らなかったのか」→「父さえ」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"弟の机の上に本がある。",
   c:["弟の", "机の", "上に", "本が"],a:3,
   e:"述語「ある」に対して、「何があるのか」→「本が」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今日は午後から雨が降る。",
   c:["今日は", "午後から", "雨が", "降る"],a:2,
   e:"述語「降る」に対して、「何が降るのか」→「雨が」が主語です。「今日は」は「は」が付いていても主語ではありません。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"きみだってきっと選手になれる。",
   c:["きみだって", "きっと", "選手に", "なれる"],a:0,
   e:"述語「なれる」に対して、「だれがなれるのか」→「きみだって」が主語です。「〜だって」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくの兄は東京の大学生だ。",
   c:["ぼくの", "兄は", "東京の", "大学生だ"],a:1,
   e:"述語「大学生だ」に対して、「だれが大学生なのか」→「兄は」が主語です。「ぼくの」は「だれの兄か」を説明しています。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"大きな犬が庭で何度もほえた。",
   c:["大きな", "犬が", "庭で", "ほえた"],a:1,
   e:"述語「ほえた」に対して、「何がほえたのか」→「犬が」が主語です。"},
  {cat:1,q:"主語が省略されている文はどれですか。",
   c:["鳥が鳴く。", "昨日、山に登った。", "花がきれいだ。", "弟は中学生だ。"],a:1,
   e:"「昨日、山に登った。」には「だれが」に当たる文節がありません。主語は、わかりきっている場合などに省略されることがあります。"},
  {cat:1,q:"主語が省略されている文はどれですか。",
   c:["今朝はあさがおの芽が出た。", "雨が降る。", "パリに三年間留学する。", "わたしは人影を見た。"],a:2,
   e:"「パリに三年間留学する。」には「だれが留学するのか」に当たる文節がありません。"},
  {cat:2,q:"「述語」の説明として正しいものはどれですか。",
   c:["「どうする」「どんなだ」「何だ」「ある（いる・ない）」に当たる文節。", "「何が（だれが）」に当たる文節。", "理由や条件を示してあとにつなぐ文節。", "ほかの文節と直接の関係がない文節。"],a:0,
   e:"述語は、主語の動作・状態・性質・存在などを表す文節です。"},
  {cat:2,q:"述語は、ふつう文のどこにありますか。",
   c:["文の初め", "主語のすぐあと", "文の終わり", "文の真ん中"],a:2,
   e:"述語はふつう文の終わりにあります。ただし、倒置の文では文の終わりにこないこともあります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"白鳥が青い空を飛ぶ。",
   c:["白鳥が", "青い", "空を", "飛ぶ"],a:3,
   e:"「白鳥が」に対して「どうする」に当たる「飛ぶ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"わたしは窓から人影を見た。",
   c:["わたしは", "窓から", "人影を", "見た"],a:3,
   e:"「わたしは」に対して「どうした」に当たる「見た」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"ぼくの兄はきょうも元気だった。",
   c:["ぼくの", "兄は", "きょうも", "元気だった"],a:3,
   e:"「兄は」に対して「どんなだ」に当たる「元気だった」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"父さんはずっと二階にいる。",
   c:["父さんは", "ずっと", "二階に", "いる"],a:3,
   e:"「父さんは」に対して「いる」が述語です。存在を表す述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"この大きな魚はマグロだ。",
   c:["この", "大きな", "魚は", "マグロだ"],a:3,
   e:"「魚は」に対して「何だ」に当たる「マグロだ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"谷川の水はとても冷たい。",
   c:["谷川の", "水は", "とても", "冷たい"],a:3,
   e:"「水は」に対して「どんなだ」に当たる「冷たい」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"大きな船が港に入る。",
   c:["大きな", "船が", "港に", "入る"],a:3,
   e:"「船が」に対して「どうする」に当たる「入る」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"本当に楽しみだね、明日の運動会が。",
   c:["本当に", "楽しみだね", "明日の", "運動会が"],a:1,
   e:"「運動会が楽しみだね」の順序を入れかえた倒置の文です。述語は「楽しみだね」で、文の終わりにはありません。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"電池がない。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:3,
   e:"「ない」は存在を表すので、「ある（いる・ない）」に当たります。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"部屋があたたかい。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:1,
   e:"「あたたかい」は様子（状態）を表すので、「どんなだ」に当たります。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"ぼくが手紙を書く。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:0,
   e:"「書く」は動作を表すので、「どうする」に当たります。"},
  {cat:2,q:"述語が「どんなだ」に当たる文はどれですか。",
   c:["鳥が飛ぶ。", "空が青い。", "彼は学生だ。", "庭に池がある。"],a:1,
   e:"「青い」は様子を表すので「どんなだ」です。順に「どうする」「どんなだ」「何だ」「ある」です。"},
  {cat:2,q:"述語が「何だ」に当たる文はどれですか。",
   c:["弟が笑う。", "弟は小さい。", "弟は幼児だ。", "弟がいる。"],a:2,
   e:"「幼児だ」は「何だ」に当たります。「笑う」は「どうする」、「小さい」は「どんなだ」、「いる」は「ある（いる・ない）」です。"},
  {cat:2,q:"述語が「ある（いる・ない）」に当たる文はどれですか。",
   c:["机の上に本がある。", "兄が本を読む。", "この本はおもしろい。", "これは辞書だ。"],a:0,
   e:"「ある」は存在を表す述語です。"},
  {cat:3,q:"主語・述語の関係の基本の型として、当てはまらないものはどれですか。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何を―どうする"],a:3,
   e:"主語・述語の関係の基本の型は「何が―どうする」「何が―どんなだ」「何が―何だ」「何が―ある（いる・ない）」の四つです。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が泳ぐ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「泳ぐ」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が少ない。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「少ない」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が名物だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「名物だ」は「何だ」に当たるので「何が―何だ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"庭に池がある。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「ある」は存在を表すので「何が―ある（いる・ない）」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"父は写真家だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「写真家だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"西の空が赤い。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「赤い」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"子供が砂場で遊ぶ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「遊ぶ」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"主語・述語の関係が、次の文と同じ型のものはどれですか。",
   s:"花が咲く。",
   c:["鳥が飛ぶ。", "空が青い。", "彼は学生だ。", "本がある。"],a:0,
   e:"「花が咲く。」は「何が―どうする」の型です。同じ型は「鳥が飛ぶ。」です。"},
  {cat:3,q:"主語・述語の関係が、次の文と同じ型のものはどれですか。",
   s:"この部屋は静かだ。",
   c:["鳥が飛ぶ。", "海が広い。", "姉は医者だ。", "猫がいる。"],a:1,
   e:"「静かだ」は様子を表すので「何が―どんなだ」の型です。同じ型は「海が広い。」です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"山のふもとに学校がある。",
   c:["山の―ふもとに", "ふもとに―ある", "学校が―ある", "山の―学校が"],a:2,
   e:"述語「ある」に対して、「何があるのか」→「学校が」。「学校が―ある」が主語・述語の関係です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"家には優しい祖父がいる。",
   c:["家には―いる", "祖父が―いる", "家には―祖父が", "優しい―祖父が"],a:1,
   e:"「だれがいるのか」→「祖父が」。「家には」は場所を表していて主語ではありません。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"ぼくは走る犬を見た。",
   c:["ぼくは―見た", "犬を―見た", "ぼくは―走る", "走る―犬を"],a:0,
   e:"文の述語は「見た」で、「だれが見たのか」→「ぼくは」。「ぼくは―見た」が主語・述語の関係です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"新しい家が丘の上に建った。",
   c:["新しい―家が", "家が―建った", "上に―建った", "丘の―上に"],a:1,
   e:"「何が建ったのか」→「家が」。「家が―建った」が主語・述語の関係です。"},
  {cat:3,q:"「倒置」の説明として正しいものはどれですか。",
   c:["ふつうの語順を入れかえ、強調したい部分を前に置く表現。", "主語を省略した表現。", "同じ言葉をくり返して強める表現。", "文を二つに分けて書く表現。"],a:0,
   e:"「運動会が楽しみだね。」を「楽しみだね、運動会が。」とするように、語順を入れかえて強調する表現を倒置といいます。"},
  {cat:3,q:"倒置の文はどれですか。",
   c:["運動会が楽しみだね。", "楽しみだね、運動会が。", "明日は運動会だ。", "運動会で走る。"],a:1,
   e:"ふつうは「運動会が楽しみだね。」の順序ですが、述語を先に置いて強調しています。"},
  {cat:3,q:"次の倒置の文を、ふつうの語順に直したものはどれですか。",
   s:"咲いたよ、きれいな花が。",
   c:["きれいな花が咲いたよ。", "花がきれいに咲いたよ。", "きれいな花よ、咲いた。", "咲いた花がきれいだよ。"],a:0,
   e:"主語「花が」と述語「咲いたよ」の順序をもとにもどし、「きれいな花が咲いたよ。」とします。言葉の形は変えずに順序だけを直します。"},
  {cat:3,q:"レストランで「ぼくはカレー。」と注文するとき、省略されている文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「ぼくはカレー（にします）。」のように、述語が省略された形です。主語だけでなく述語が省略されることもあります。"},
  {cat:3,q:"自己紹介で「山田です。」と言うとき、省略されている文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "接続語"],a:0,
   e:"「（わたしは）山田です。」のように、わかりきっている主語が省略されています。"},
  {cat:0,q:"次の文の「ねえ」は、どの文の成分に当たりますか。",
   s:"ねえ、明日はいっしょに帰ろう。",
   c:["独立語", "接続語", "修飾語", "述語"],a:0,
   e:"呼びかけを表し、ほかの文節と直接の関係がないので独立語です。"},
  {cat:0,q:"次の文の「雨なので」は、どの文の成分に当たりますか。",
   s:"雨なので、試合は中止だ。",
   c:["接続語", "述語", "独立語", "主語"],a:0,
   e:"中止の理由を示してあとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「赤い」は、どの文の成分に当たりますか。",
   s:"赤い風船が空に上がる。",
   c:["修飾語", "独立語", "主語", "述語"],a:0,
   e:"「どんな風船か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「妹が」は、どの文の成分に当たりますか。",
   s:"妹が歌を歌う。",
   c:["主語", "独立語", "修飾語", "述語"],a:0,
   e:"「だれが歌うのか」の「だれが」に当たるので主語です。"},
  {cat:0,q:"次の文の「長い」は、どの文の成分に当たりますか。",
   s:"冬の夜は長い。",
   c:["述語", "接続語", "主語", "独立語"],a:0,
   e:"「夜は」に対して「どんなだ」に当たるので述語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"庭で弟が犬と遊ぶ。",
   c:["弟が", "庭で", "犬と", "遊ぶ"],a:0,
   e:"述語「遊ぶ」に対して、「だれが遊ぶのか」→「弟が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"毎朝、父は新聞を読む。",
   c:["父は", "毎朝", "新聞を", "読む"],a:0,
   e:"述語「読む」に対して、「だれが読むのか」→「父は」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくこそこのチームのキャプテンだ。",
   c:["ぼくこそ", "この", "チームの", "キャプテンだ"],a:0,
   e:"述語「キャプテンだ」に対して、「だれがキャプテンなのか」→「ぼくこそ」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"この町にも大きな公園がある。",
   c:["公園が", "この", "町にも", "大きな"],a:0,
   e:"述語「ある」に対して、「何があるのか」→「公園が」です。「町にも」は場所を表しています。"},
  {cat:1,q:"主語がない文はどれですか。",
   c:["早く寝なさい。", "母が料理を作る。", "空が青い。", "兄は高校生だ。"],a:0,
   e:"「早く寝なさい。」には「だれが」に当たる文節がありません。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"母は台所で料理を作る。",
   c:["作る", "母は", "台所で", "料理を"],a:0,
   e:"「母は」に対して「どうする」に当たる「作る」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"あの人がぼくの先生だ。",
   c:["先生だ", "あの", "人が", "ぼくの"],a:0,
   e:"「人が」に対して「何だ」に当たる「先生だ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"夕焼けの空がとても美しい。",
   c:["美しい", "夕焼けの", "空が", "とても"],a:0,
   e:"「空が」に対して「どんなだ」に当たる「美しい」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"公園に大きな木がある。",
   c:["ある", "公園に", "大きな", "木が"],a:0,
   e:"「木が」に対して「ある」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"走れ、ゴールまでもっと速く。",
   c:["走れ", "ゴールまで", "もっと", "速く"],a:0,
   e:"「もっと速く走れ」の語順を入れかえた倒置の文です。述語は「走れ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"今夜は月が明るい。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「明るい」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"弟は小学生だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「小学生だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"机の上に本がない。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「ない」は存在しないことを表すので「何が―ある（いる・ない）」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"庭で鳥が鳴く。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「鳴く」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"赤い屋根の家が見える。",
   c:["家が ― 見える", "赤い ― 屋根の", "屋根の ― 家が", "赤い ― 見える"],a:0,
   e:"「何が見えるのか」→「家が」。「家が―見える」が主語・述語の関係です。"},
  {cat:0,q:"次の文の「はい」は、どの文の成分に当たりますか。",
   s:"はい、それはぼくの本です。",
   c:["独立語", "修飾語", "主語", "接続語"],a:0,
   e:"応答を表し、ほかの文節と直接関係がないので独立語です。"},
  {cat:0,q:"次の文の「疲れたので」は、どの文の成分に当たりますか。",
   s:"疲れたので、少し休もう。",
   c:["接続語", "修飾語", "独立語", "述語"],a:0,
   e:"休む理由を示してあとにつないでいます。"},
  {cat:0,q:"次の文の「父の」は、どの文の成分に当たりますか。",
   s:"父の車は青い。",
   c:["修飾語", "主語", "独立語", "接続語"],a:0,
   e:"「だれの車か」をくわしく説明しています。"},
  {cat:0,q:"次の文の「運動会だ」は、どの文の成分に当たりますか。",
   s:"明日は運動会だ。",
   c:["述語", "主語", "独立語", "接続語"],a:0,
   e:"「何だ」に当たるので述語です。"},
  {cat:0,q:"次の文の「先生が」は、どの文の成分に当たりますか。",
   s:"先生が教室に入る。",
   c:["主語", "修飾語", "接続語", "独立語"],a:0,
   e:"「だれが入るのか」の「だれが」に当たります。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"昨日、兄が新しい自転車を買った。",
   c:["兄が", "昨日", "新しい", "自転車を"],a:0,
   e:"述語「買った」に対して「だれが買ったのか」→「兄が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"わたしにも小さな妹がいる。",
   c:["妹が", "わたしにも", "小さな", "いる"],a:0,
   e:"述語「いる」に対して「だれがいるのか」→「妹が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"川の水はとてもきれいだ。",
   c:["水は", "川の", "とても", "きれいだ"],a:0,
   e:"述語「きれいだ」に対して「何がきれいなのか」→「水は」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくだけが答えを知っている。",
   c:["ぼくだけが", "答えを", "知って", "いる"],a:0,
   e:"「だれが知っているのか」→「ぼくだけが」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今日は妹も母と出かけた。",
   c:["妹も", "今日は", "母と", "出かけた"],a:0,
   e:"「だれが出かけたのか」→「妹も」です。「〜も」の形の主語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"弟は毎朝牛乳を飲む。",
   c:["飲む", "弟は", "毎朝", "牛乳を"],a:0,
   e:"「弟は」に対して「どうする」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"この町の冬はとても寒い。",
   c:["寒い", "この", "町の", "冬は"],a:0,
   e:"「冬は」に対して「どんなだ」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"わたしの父は町の警察官だ。",
   c:["警察官だ", "わたしの", "父は", "町の"],a:0,
   e:"「父は」に対して「何だ」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"放課後の教室には誰もいない。",
   c:["いない", "放課後の", "教室には", "誰も"],a:0,
   e:"「誰も」に対して「いない」が述語です。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"庭で犬が走る。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:0,
   e:"「走る」は動作を表すので「どうする」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"バラの花は美しい。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「美しい」は様子を表します。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"この建物は図書館だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「図書館だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"公園に子どもがいる。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「いる」は存在を表します。"},
  {cat:3,q:"次の倒置の文を、ふつうの語順に直したものはどれですか。",
   s:"行こうよ、一緒に。",
   c:["一緒に行こうよ。", "一緒に行くよ。", "行こう、一緒に。", "一緒によ、行こう。"],a:0,
   e:"修飾語「一緒に」を述語の前にもどします。"},
  {cat:3,q:"倒置の文はどれですか。",
   c:["きれいだなあ、この花は。", "この花はきれいだなあ。", "この花を見る。", "きれいな花だ。"],a:0,
   e:"主語「この花は」と述語「きれいだなあ」の順序が入れかわっています。"}
  ]
},
{
  id:"u3", no:3, name:"修飾語・接続語・独立語", sub:"修飾・被修飾の関係・接続語・独立語",
  scope:"出題範囲：修飾語と被修飾語、連体修飾語・連用修飾語、接続語、独立語。単元1・2の内容（文節・主語・述語）も使います。",
  cats:["修飾語と被修飾語", "連体修飾語・連用修飾語", "接続語", "独立語"],
  qs:[
  {cat:0,q:"「修飾語」の説明として正しいものはどれですか。",
   c:["あとにくる文節をくわしく説明する文節。", "修飾語によってくわしく説明される文節。", "「何が（だれが）」に当たる文節。", "ほかの文節と直接の関係がない文節。"],a:0,
   e:"修飾語はあとの文節をくわしく説明します。説明される側の文節は「被修飾語」といいます。"},
  {cat:0,q:"「被修飾語」の説明として正しいものはどれですか。",
   c:["修飾語によってくわしく説明される文節。", "あとにくる文節をくわしく説明する文節。", "理由や条件を示してあとにつなぐ文節。", "「どうする」「どんなだ」に当たる文節。"],a:0,
   e:"「小さな声」の「声」のように、修飾語にくわしく説明される文節を被修飾語といいます。"},
  {cat:0,q:"修飾語と被修飾語の位置について、正しい説明はどれですか。",
   c:["修飾語はふつう被修飾語より前にあるが、すぐ前にあるとは限らない。", "修飾語は必ず被修飾語のすぐ前にある。", "修飾語は必ず文の初めにある。", "修飾語は必ず被修飾語よりあとにある。"],a:0,
   e:"「しっかりと地面にしるしを付ける。」の「しっかりと」→「付ける」のように、離れていることもあります。"},
  {cat:0,q:"次の文で、「ゆっくり」が修飾している文節はどれですか。",
   s:"赤い車が坂道をゆっくり走り出した。",
   c:["走り出した", "赤い", "車が", "坂道を"],a:0,
   e:"「どのように走り出したか」→「ゆっくり」。被修飾語は「走り出した」です。"},
  {cat:0,q:"次の文で、「大きな」が修飾している文節はどれですか。",
   s:"大きな手で白いボールをつかむ。",
   c:["手で", "白い", "ボールを", "つかむ"],a:0,
   e:"「どんな手か」→「大きな」。被修飾語は「手で」です。"},
  {cat:0,q:"次の文で、「とても」が修飾している文節はどれですか。",
   s:"この部屋は昼でもとても明るい。",
   c:["明るい", "この", "部屋は", "昼でも"],a:0,
   e:"「どのくらい明るいか」→「とても」。被修飾語は「明るい」です。"},
  {cat:0,q:"次の文で、「ころころ」が修飾している文節はどれですか。",
   s:"小さな石が坂をころころ転がる。",
   c:["転がる", "小さな", "石が", "坂を"],a:0,
   e:"「どのように転がるか」→「ころころ」。"},
  {cat:0,q:"次の文で、「暑い」が修飾している文節はどれですか。",
   s:"夏は暑い日が毎日続く。",
   c:["日が", "夏は", "毎日", "続く"],a:0,
   e:"「どんな日か」→「暑い」。被修飾語は「日が」です。"},
  {cat:0,q:"次の文で、「しっかりと」が修飾している文節はどれですか。",
   s:"しっかりと地面に大きなしるしを付ける。",
   c:["付ける", "地面に", "大きな", "しるしを"],a:0,
   e:"「どのように付けるか」→「しっかりと」。修飾語と被修飾語が離れている例です。"},
  {cat:0,q:"次の文で、「すいかの」が修飾している文節はどれですか。",
   s:"春に畑ですいかの苗を植える。",
   c:["苗を", "春に", "畑で", "植える"],a:0,
   e:"「何の苗か」→「すいかの」。被修飾語は「苗を」です。"},
  {cat:0,q:"次の文で、「見た」を修飾していない文節はどれですか。",
   s:"ぼくは昨日公園で大きな犬を見た。",
   c:["大きな", "昨日", "公園で", "犬を"],a:0,
   e:"「大きな」は「犬を」を修飾しています。「昨日」「公園で」「犬を」はどれも「見た」を修飾しています。"},
  {cat:1,q:"「連体修飾語」の説明として正しいものはどれですか。",
   c:["「何」を表す、物事の名前を表す言葉（体言）を修飾する修飾語。", "「どうする」「どんなだ」を表す言葉（用言）を修飾する修飾語。", "理由や条件を示す文節。", "ほかの文節と直接関係のない文節。"],a:0,

   c:["連用形","未然形","終止形","命令形"],a:0,
   e:"「着替え、」と読点で文をいったん中止しています（連用中止法）。下一段活用「着替える」の連用形です。"}
  ]
},
{
  id:"p3", title:"弟の満点", sub:"助動詞の意味・助詞の種類・副詞",
  t:"　弟は先生に[①ほめられ]て、[②うれしそうだった]。[③どうやら]、テストで満点を取った[④らしい]。母も「よく頑張った[⑤ね]。」と言った。わたしも負けて[⑥は]いられない。",
  qs:[
  {m:"①",u:13,q:"①「ほめられ」の「られ」の意味はどれですか。",
   c:["受け身","可能","自発","尊敬"],a:0,
   e:"「先生に〜される」と、ほかから動作を受ける意味なので受け身です。「〜に」が付いているのが目印です。"},
  {m:"②",u:13,q:"②「うれしそうだった」の「そうだ」の意味はどれですか。",
   c:["様態（そのような様子だ）","伝聞（人から聞いた）","推定（根拠をもとにおしはかる）","たとえ（比喩）"],a:0,
   e:"形容詞の語幹「うれし」に付いて「そのような様子に見える」という意味を表すので様態です。伝聞の「そうだ」は終止形に付きます（うれしいそうだ）。"},
  {m:"③",u:8,q:"③「どうやら」の品詞はどれですか。",
   c:["副詞","連体詞","接続詞","感動詞"],a:0,
   e:"活用しない自立語で、用言を修飾する副詞です。「どうやら〜らしい」と、決まった言い方と呼応する呼応（陳述）の副詞です。"},
  {m:"④",u:13,q:"④「らしい」と同じ使い方の「らしい」を含む文はどれですか。",
   c:["明日は雨が降るらしい。","今日は春らしい暖かな日だ。","彼はとても男らしい人だ。","かわいらしい花がさいた。"],a:0,
   e:"本文の「らしい」は推定の助動詞です。「降る＋らしい」も推定。「春らしい」「男らしい」は「〜にふさわしい」意味の接尾語、「かわいらしい」は一語の形容詞です。"},
  {m:"⑤",u:12,q:"⑤「ね」の助詞の種類はどれですか。",
   c:["終助詞","格助詞","接続助詞","副助詞"],a:0,
   e:"文の終わりに付いて、話し手の気持ち（念押し・感動）を表すので終助詞です。"},
  {m:"⑥",u:12,q:"⑥「は」の助詞の種類はどれですか。",
   c:["副助詞","格助詞","接続助詞","終助詞"],a:0,
   e:"「は」はいろいろな語に付いて、意味をそえる副助詞です。主語に付くことが多いですが、格助詞ではない点に注意しましょう。"}
  ]
},
{
  id:"p4", title:"職場体験の一日", sub:"尊敬語・謙譲語・丁寧語",
  t:"　職場体験で、わたしは店長さんの書店を[①訪ねた]。店長さんは「よく来てくれたね。」と[②言ってくださった]。しばらくすると、お客様が「料理の本はどこにありますか。」と[③聞いた]。わたしは「すぐに[④調べます]。」と答え、「こちらに[⑤あります]。」と案内した。",
  qs:[
  {m:"①",u:14,q:"①「訪ねた」を、店長さんへの敬意を表す言い方に直したものはどれですか。",
   c:["伺った","いらっしゃった","お訪ねになった","訪ねられた"],a:0,
   e:"訪ねるのは「わたし」なので、自分の動作をへりくだる謙譲語「伺う」を使います。ほかはすべて相手の動作に使う尊敬語です。"},
  {m:"②",u:14,q:"②「言ってくださった」の「くださる」は、どの種類の敬語ですか。",
   c:["尊敬語","謙譲語","丁寧語","美化語"],a:0,
   e:"「くださる」は「くれる」の尊敬語で、店長さんの動作を高めています。"},
  {m:"③",u:14,q:"③「聞いた」を、お客様への敬意を表す正しい言い方に直したものはどれですか。",
   c:["お尋ねになった","伺った","お聞きした","拝聴した"],a:0,
   e:"聞いたのはお客様なので尊敬語にします。「お尋ねになる」が正解です。「伺う」「お聞きする」「拝聴する」はどれも謙譲語です。"},
  {m:"④",u:14,q:"④「調べます」を、より敬意の伝わる言い方に直したものはどれですか。",
   c:["お調べいたします","お調べになります","調べられます","お調べになられます"],a:0,
   e:"調べるのは自分なので謙譲の「お〜いたす」を使います。「お調べになる」は尊敬語、「お調べになられる」は二重敬語です。"},
  {m:"⑤",u:14,q:"⑤「あります」を、お客様に対してさらに丁寧に言ったものはどれですか。",
   c:["ございます","いらっしゃいます","おります","参ります"],a:0,
   e:"物が「ある」ことを丁寧に言うときは「ございます」を使います。「いらっしゃる」は人に対する尊敬語です。"}
  ]
},
{
  id:"p5", title:"夏の海", sub:"文の成分・連文節・並立・補助",
  t:"　[①夏休みに]、[②わたしと妹は]海へ行った。青くて広い海が、目の前に広がっていた。妹は貝殻を[③拾ってみた]。「[④わあ]、きれい。」妹はうれしそうに声を上げた。",
  qs:[
  {m:"①",u:3,q:"①「夏休みに」は、文の成分として何にあたりますか。",
   c:["修飾語","主語","接続語","独立語"],a:0,
   e:"「いつ行った」かを説明して、述語「行った」を修飾しているので修飾語（連用修飾語）です。"},
  {m:"②",u:4,q:"②「わたしと妹は」の「わたしと」と「妹は」の文節どうしの関係はどれですか。",
   c:["並立の関係","補助の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「わたし」と「妹」が対等に並んでいるので並立の関係です。二つの文節がまとまって主部になっています。"},
  {u:4,q:"「青くて広い海が、目の前に広がっていた。」の主部はどれですか。",
   c:["青くて広い海が","海が","青くて広い","目の前に"],a:0,
   e:"二つ以上の文節がまとまって主語の働きをするとき、主部といいます。「青くて広い」が「海が」を修飾しているので、「青くて広い海が」全体が主部です。"},
  {u:4,q:"「青くて広い海が、目の前に広がっていた。」の「目の前に」が直接修飾している文節はどれですか。",
   c:["広がって","いた","海が","広い"],a:0,
   e:"「広がっていた」は「広がって／いた」の二文節です。「目の前に → 広がって」と、意味の中心である「広がって」を修飾しています。"},
  {m:"③",u:4,q:"③「拾ってみた」の「拾って」と「みた」の文節どうしの関係はどれですか。",
   c:["補助の関係","並立の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「みた」は「見る」という本来の意味ではなく、「ためしに〜する」という意味をそえています。補助の関係です。"},
  {m:"④",u:3,q:"④「わあ」は、文の成分として何にあたりますか。",
   c:["独立語","接続語","修飾語","主語"],a:0,
   e:"ほかの文節と直接関係せず、感動を表しているので独立語です。品詞は感動詞です。"}
  ]
},
{
  id:"p6", title:"不思議な石", sub:"連体詞・形容詞・形容動詞・副詞の見分け",
  t:"　[①ある]日、[②小さな]公園で、わたしは[③不思議な]形の石を見つけた。石は[④ずいぶん][⑤重く]、表面はなめらかだった。わたしはそれを[⑥大切に]持ち帰った。",
  qs:[
  {m:"①",u:8,q:"①「ある」と同じ品詞の「ある」を含む文はどれですか。",
   c:["ある人から手紙が届いた。","机の上に本がある。","壁に絵がかけてある。","明日は雨、あるいは雪だろう。"],a:0,
   e:"本文の「ある」は「日」を修飾する連体詞です。「ある人」も同じ連体詞。「本がある」は動詞、「かけてある」は補助動詞、「あるいは」は接続詞の一部です。"},
  {m:"②",u:8,q:"②「小さな」の品詞はどれですか。",
   c:["連体詞","形容詞","形容動詞","副詞"],a:0,
   e:"「小さな」は「小さだ」とは言えず、活用もしないので連体詞です。「小さい」なら形容詞です。"},
  {m:"③",u:11,q:"③「不思議な」の品詞はどれですか。",
   c:["形容動詞","連体詞","形容詞","名詞"],a:0,
   e:"「不思議だ・不思議に」と活用できるので、形容動詞「不思議だ」の連体形です。「小さな」との違いを確かめましょう。"},
  {m:"④",u:8,q:"④「ずいぶん」の品詞はどれですか。",
   c:["副詞","形容動詞","連体詞","名詞"],a:0,
   e:"活用せず、用言「重く」を修飾しているので副詞（程度の副詞）です。"},
  {m:"⑤",u:11,q:"⑤「重く」の活用形はどれですか。",
   c:["連用形","未然形","終止形","連体形"],a:0,
   e:"「重く、」と読点で文をいったん中止しているので連用形です。形容詞の連用形は「〜く（〜かっ）」になります。"},
  {m:"⑥",u:11,q:"⑥「大切に」の品詞はどれですか。",
   c:["形容動詞","副詞","名詞","形容詞"],a:0,
   e:"「大切だ・大切な」と活用できるので、形容動詞「大切だ」の連用形です。"}
  ]
},
{
  id:"p7", title:"植物のしくみ", sub:"指示語・接続語・音便・品詞",
  t:"　植物は、光を[①使って]栄養を作る。[②これ]を光合成という。光合成には、水と二酸化炭素が[③必要だ]。[④だから]、植物は根から水を吸い上げ、葉から二酸化炭素を取り入れる。[⑤つまり]、植物は自分の力で栄養を作り出しているのである。",
  qs:[
  {m:"①",u:10,q:"①「使って」に見られる音便はどれですか。",
   c:["促音便","撥音便","イ音便","ウ音便"],a:0,
   e:"「使い＋て」が「使って」と、小さい「っ」に変わっているので促音便です。"},
  {m:"②",u:5,q:"②「これ」が指している内容はどれですか。",
   c:["植物が光を使って栄養を作ること","光合成","光","水と二酸化炭素"],a:0,
   e:"指示語は、ふつう前の部分を指します。「これを光合成という」なので、直前の「植物が光を使って栄養を作ること」を指しています。"},
  {m:"③",u:11,q:"③「必要だ」の品詞はどれですか。",
   c:["形容動詞","形容詞","副詞","動詞"],a:0,
   e:"「必要な（物）」「必要に（なる）」と活用し、言い切りが「だ」なので形容動詞です。"},
  {m:"④",u:9,q:"④「だから」は、どのような関係で前後をつないでいますか。",
   c:["順接","逆接","転換","対比・選択"],a:0,
   e:"「水と二酸化炭素が必要だ」という理由から、当然の結果として「水を吸い上げ…取り入れる」が続くので順接です。"},
  {m:"⑤",u:9,q:"⑤「つまり」は、どのような働きをしていますか。",
   c:["説明・補足","並立・累加","逆接","転換"],a:0,
   e:"前の内容をまとめて言いかえているので、説明・補足の接続詞です。"}
  ]
},
{
  id:"p8", title:"一文を分解する", sub:"文節・単語・自立語と付属語・品詞",
  t:"　先生の話を聞いて、ぼくは少し考えた。",
  qs:[
  {u:1,q:"この文は、いくつの文節に分けられますか。",
   c:["5つ","6つ","7つ","8つ"],a:1,
   e:"先生の／話を／聞いて／ぼくは／少し／考えた。の6つです。"},
  {u:1,q:"この文は、いくつの単語に分けられますか。",
   c:["9つ","10","11","12"],a:2,
   e:"先生｜の｜話｜を｜聞い｜て｜ぼく｜は｜少し｜考え｜た　の11です。「聞いて」「考えた」はそれぞれ二つの単語に分かれます。"},
  {u:6,q:"この文に含まれる付属語はいくつありますか。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"の・を・て・は・た　の5つです。付属語は、単独では文節を作れず、自立語のあとに付きます。"},
  {u:6,q:"この文に含まれる用言（動詞・形容詞・形容動詞）はいくつありますか。",
   c:["1つ","2つ","3つ","4つ"],a:1,
   e:"「聞い（聞く）」と「考え（考える）」の二つの動詞です。「少し」は副詞なので用言ではありません。"},
  {u:12,q:"「聞いて」の「て」の品詞はどれですか。",
   c:["助詞","助動詞","動詞","接続詞"],a:0,
   e:"「て」は活用しない付属語なので助詞（接続助詞）です。助動詞は活用する付属語です。"}
  ]
},
{
  id:"p9", title:"新しい図書館", sub:"",
  t:"　駅前に新しい図書館ができた。週末、わたしは友達[①と]そこへ出かけた。中は広く、本も[②多い]。わたしもいつか英語の本を[③読める]ようになりたいと思った。ところが、借りたい本は[④まだ]貸し出し中で、今日は借りられ[⑤ない]。",
  qs:[
  {m:"①",u:12,q:"①「と」と同じ意味・用法の「と」を含む文はどれですか。",
   c:["兄と公園で遊んだ。","春になると桜がさく。","「はい。」と答えた。","りんごとみかんを買った。"],a:0,
   e:"本文の「と」は、いっしょに動作をする相手を表す格助詞です。「兄と遊んだ」が同じ用法です。「なると」は接続助詞、「「はい。」と」は引用、「りんごと」は並立を表す格助詞です。"},
  {m:"②",u:11,q:"②「多い」の品詞はどれですか。",
   c:["形容詞","形容動詞","副詞","動詞"],a:0,
   e:"活用する自立語で、言い切りの形が「い」で終わるので形容詞です。"},
  {m:"③",u:10,q:"③「読める」のように、「〜することができる」という意味をもつ下一段活用の動詞を何といいますか。",
   c:["可能動詞","補助動詞","自動詞","複合動詞"],a:0,
   e:"五段活用の「読む」から生まれた、「読むことができる」という意味の下一段活用の動詞を可能動詞といいます。"},
  {m:"④",u:8,q:"④「まだ」の品詞はどれですか。",
   c:["副詞","連体詞","形容動詞","接続詞"],a:0,
   e:"活用せず、「貸し出し中で」という用言を含む文節を修飾しているので副詞です。"},
  {m:"⑤",u:13,q:"⑤「ない」と同じ品詞の「ない」を含む文はどれですか。",
   c:["今日は雨が降らない。","財布にお金がない。","今朝は少しも寒くない。","あどけない顔で笑う。"],a:0,
   e:"本文の「ない」は動詞「借りる」＋助動詞「られる」に付く打ち消しの助動詞です。「降らない」も助動詞。「お金がない」は形容詞、「寒くない」は補助形容詞、「あどけない」は一語の形容詞です。見分けるときは「ぬ」に言いかえられるか確かめましょう（降らぬ）。"}
  ]
},
{
  id:"p10", title:"運動会", sub:"",
  t:"　[①いよいよ]運動会の日が来た。空はよく[②晴れていて]、[③風も]さわやかだ。わたしたちのクラスはリレーに出る。[④もし]負けても、全力で走り[⑤たい]。",
  qs:[
  {m:"①",u:8,q:"①「いよいよ」の品詞はどれですか。",c:["副詞","連体詞","接続詞","感動詞"],a:0,
   e:"活用しない自立語で、用言「来た」を修飾しているので副詞です。"},
  {m:"②",u:4,q:"②「晴れていて」の「晴れて」と「いて」の文節どうしの関係はどれですか。",c:["補助の関係","並立の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「いて」は「存在する」という本来の意味が薄れ、「晴れて」に意味をそえる補助動詞です。補助の関係です。"},
  {m:"③",u:12,q:"③「風も」の「も」の助詞の種類はどれですか。",c:["副助詞","格助詞","接続助詞","終助詞"],a:0,
   e:"「も」はいろいろな語に付いて「同じようなものがほかにもある」という意味をそえる副助詞です。"},
  {m:"④",u:8,q:"④「もし」と呼応している言葉はどれですか。",c:["負けても","全力で","走り","来た"],a:0,
   e:"「もし〜ても（ば・たら）」のように、仮定の言い方と呼応する呼応（陳述）の副詞です。"},
  {m:"⑤",u:13,q:"⑤「たい」の意味はどれですか。",c:["希望","推量","意志","伝聞"],a:0,
   e:"「〜したい」と話し手の望みを表すので、希望の助動詞です。"}
  ]
},
{
  id:"p11", title:"恩師への訪問", sub:"",
  t:"　恩師の山田先生から手紙が届いた。先生は「元気にしていますか。」と[①書いていた]。わたしは近いうちに先生のお宅へ[②行く]つもりだ。先生に旅行の写真を[③見せる]約束もしている。先生が[④食べる]ように、母の手作りのケーキも[⑤持っていく]。",
  qs:[
  {m:"①",u:14,q:"①「書いていた」を、先生への敬意を表す言い方に直したものはどれですか。",c:["お書きになっていた","お書きしていた","書いておった","書かせていただいていた"],a:0,
   e:"書いたのは先生なので、尊敬の「お〜になる」を使います。「お書きする」は謙譲語です。"},
  {m:"②",u:14,q:"②「行く」を、敬意を表す言い方に直したものはどれですか。",c:["伺う","いらっしゃる","おいでになる","行かれる"],a:0,
   e:"行くのは「わたし」なので謙譲語「伺う」を使います。ほかは尊敬語です。"},
  {m:"③",u:14,q:"③「見せる」を、敬意を表す言い方に直したものはどれですか。",c:["お目にかける","ご覧になる","お見せになる","見られる"],a:0,
   e:"見せるのは「わたし」なので、謙譲語「お目にかける（ご覧に入れる）」を使います。"},
  {m:"④",u:14,q:"④「食べる」を、敬意を表す言い方に直したものはどれですか。",c:["召し上がる","いただく","お食べする","食べさせていただく"],a:0,
   e:"食べるのは先生なので、尊敬語「召し上がる」を使います。「いただく」は謙譲語です。"},
  {m:"⑤",u:14,q:"⑤「持っていく」を、敬意を表す言い方に直したものはどれですか。",c:["お持ちする","お持ちになる","持っていかれる","持っていらっしゃる"],a:0,
   e:"持っていくのは「わたし」なので、謙譲の「お〜する」を使って「お持ちする」とします。"}
  ]
},
{
  id:"p12", title:"朝顔の観察", sub:"",
  t:"　夏休みに朝顔を[①育て]た。毎朝水を[②やれ]ば、つるはどんどん伸びる。花が[③咲く]ころには、葉も大きく[④なっ]ていた。来年も育て[⑤よう]と思う。",
  qs:[
  {m:"①",u:10,q:"①「育て」の活用形はどれですか。",c:["連用形","未然形","終止形","仮定形"],a:0,
   e:"助動詞「た」に続くのは連用形です。"},
  {m:"②",u:10,q:"②「やれ」の活用形はどれですか。",c:["仮定形","命令形","未然形","連用形"],a:0,
   e:"接続助詞「ば」に続くのは仮定形です。命令形の「やれ。」と形は同じなので、下に続く言葉で見分けます。"},
  {m:"③",u:10,q:"③「咲く」の活用形はどれですか。",c:["連体形","終止形","連用形","仮定形"],a:0,
   e:"体言「ころ」に続いているので連体形です。"},
  {m:"④",u:10,q:"④「なっ」に見られる音便はどれですか。",c:["促音便","撥音便","イ音便","ウ音便"],a:0,
   e:"「なり＋て」が「なって」と小さい「っ」に変わっているので促音便です。"},
  {m:"⑤",u:13,q:"⑤「よう」の意味はどれですか。",c:["意志","推量","勧誘","希望"],a:0,
   e:"「〜しようと思う」と自分の考えを表しているので意志です。"}
  ]
},
{
  id:"p13", title:"祭りの夜", sub:"",
  t:"　[①京都]の祭りに出かけた。[②三つ]の屋台を回り、たこ焼きと綿あめを食べた。[③あれ]が一番おいしかった。花火の[④美しさ]にも見とれた。",
  qs:[
  {m:"①",u:7,q:"①「京都」は、名詞の種類のうちどれにあたりますか。",c:["固有名詞","普通名詞","数詞","代名詞"],a:0,
   e:"地名や人名など、ただ一つのものを表す名詞は固有名詞です。"},
  {m:"②",u:7,q:"②「三つ」は、名詞の種類のうちどれにあたりますか。",c:["数詞","固有名詞","普通名詞","代名詞"],a:0,
   e:"数や量、順序を表す名詞は数詞です。"},
  {m:"③",u:7,q:"③「あれ」は、名詞の種類のうちどれにあたりますか。",c:["代名詞","普通名詞","数詞","固有名詞"],a:0,
   e:"物事を指し示す名詞は代名詞（指示代名詞）です。「あの」なら連体詞なので注意しましょう。"},
  {m:"④",u:7,q:"④「美しさ」の品詞はどれですか。",c:["名詞","形容詞","形容動詞","副詞"],a:0,
   e:"形容詞「美しい」の語幹に「さ」が付いてできた名詞（転成名詞）です。「美しさが」と主語になれます。"},
  {u:4,q:"「たこ焼きと綿あめを食べた。」の「たこ焼きと」と「綿あめを」の関係はどれですか。",c:["並立の関係","補助の関係","主・述の関係","修飾・被修飾の関係"],a:0,
   e:"「たこ焼き」と「綿あめ」が対等に並んでいるので並立の関係です。"}
  ]
},
{
  id:"p14", title:"部活動", sub:"",
  t:"　練習は厳しい[①が]、毎日が楽しい。雨の日[②さえ]休まず体育館で練習する。先輩[③から]教わったことは、ノートに[④書いておく]。大会まで、あと一か月しか[⑤ない]。",
  qs:[
  {m:"①",u:12,q:"①「が」と同じ用法の「が」を含む文はどれですか。",c:["寒かったが、外で遊んだ。","鳥が鳴いている。","雨が降り出した。","水が飲みたい。"],a:0,
   e:"本文の「が」は前後を逆接でつなぐ接続助詞です。「寒かったが」も同じ。ほかは主語や対象を示す格助詞です。"},
  {m:"②",u:12,q:"②「さえ」の助詞の種類はどれですか。",c:["副助詞","格助詞","接続助詞","終助詞"],a:0,
   e:"「雨の日でも」と、極端な例をあげて意味をそえる副助詞です。"},
  {m:"③",u:12,q:"③「から」の助詞の種類はどれですか。",c:["格助詞","接続助詞","副助詞","終助詞"],a:0,
   e:"体言「先輩」に付いて、動作の起点を表す格助詞です。「寒いから」のように活用語に付いて理由を表すのは接続助詞です。"},
  {m:"④",u:4,q:"④「書いておく」の「書いて」と「おく」の文節どうしの関係はどれですか。",c:["補助の関係","並立の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「おく」は「準備としてしておく」という意味をそえる補助動詞です。補助の関係です。"},
  {m:"⑤",u:11,q:"⑤「ない」の品詞はどれですか。",c:["形容詞","助動詞","副詞","動詞"],a:0,
   e:"「ぬ」に置きかえられない（一か月しかぬ、とは言えない）ので、存在しないことを表す形容詞です。"}
  ]
},
{
  id:"p15", title:"夏休みの読書", sub:"",
  t:"　わたしは夏休みに古い本を読んだ。",
  qs:[
  {u:1,q:"この文は、いくつの文節に分けられますか。",c:["4つ","5つ","6つ","9つ"],a:1,
   e:"わたしは／夏休みに／古い／本を／読んだ。の5つです。"},
  {u:1,q:"この文は、いくつの単語に分けられますか。",c:["7つ","8つ","9つ","10"],a:2,
   e:"わたし｜は｜夏休み｜に｜古い｜本｜を｜読ん｜だ　の9つです。「夏休み」は一語の名詞です。"},
  {u:6,q:"この文に含まれる自立語はいくつありますか。",c:["3つ","4つ","5つ","6つ"],a:2,
   e:"わたし・夏休み・古い・本・読ん　の5つです。自立語は各文節に一つずつあります。"},
  {u:10,q:"「読んだ」に見られる音便はどれですか。",c:["撥音便","促音便","イ音便","ウ音便"],a:0,
   e:"「読み＋た」が「読んだ」と「ん」に変わっているので撥音便です。"},
  {u:3,q:"「古い」が修飾している文節はどれですか。",c:["本を","読んだ","夏休みに","わたしは"],a:0,
   e:"「古い → 本を」とつなぐと意味が通ります。連体修飾語です。"}
  ]
},
{
  id:"p16", title:"切手のコレクション", sub:"",
  t:"　ドアが[①開いて]、弟が入ってきた。弟は[②集めた]切手を机の上に[③並べた]。切手は全部で百枚[④ある]。そのとき窓から風が入り、切手が[⑤散らばった]。",
  qs:[
  {m:"①",u:10,q:"①「開いて（開く）」は、どの種類の動詞ですか。",c:["自動詞","他動詞","補助動詞","可能動詞"],a:0,
   e:"「ドアが開く」と、「〜を」をとらずに主語自身の動きを表すので自動詞です。"},
  {m:"②",u:10,q:"②「集めた（集める）」の活用の種類はどれですか。",c:["下一段活用","上一段活用","五段活用","サ行変格活用"],a:0,
   e:"「ない」を付けると「集めない」で、直前がエ段の音になるので下一段活用です。"},
  {m:"③",u:10,q:"③「並べた（並べる）」と対になる自動詞はどれですか。",c:["並ぶ","並べられる","並ばせる","並べ合う"],a:0,
   e:"「切手を並べる」は他動詞、「切手が並ぶ」が対になる自動詞です。"},
  {m:"④",u:6,q:"④「ある」の品詞はどれですか。",c:["動詞","連体詞","形容詞","助動詞"],a:0,
   e:"「百枚ある」と存在を表し、言い切りがウ段なので動詞です。「ある日」の「ある」は連体詞です。"},
  {m:"⑤",u:10,q:"⑤「散らばった（散らばる）」の活用の種類はどれですか。",c:["五段活用","上一段活用","下一段活用","カ行変格活用"],a:0,
   e:"「ない」を付けると「散らばらない」で、直前がア段の音になるので五段活用です。"}
  ]
},
{
  id:"p17", title:"れる・られるの見分け", sub:"",
  t:"　わたしは早起きが得意で、毎朝五時に[①起きられる]。窓を開けると、秋の気配が[②感じられる]。祖母は子どものころ、近所の人によく[③ほめられ]た[④そうだ]。その話をすると、祖父も昔のことを[⑤話された]。",
  qs:[
  {m:"①",u:13,q:"①「起きられる」の「られる」の意味はどれですか。",c:["可能","受け身","自発","尊敬"],a:0,
   e:"「起きることができる」と言いかえられるので可能です。"},
  {m:"②",u:13,q:"②「感じられる」の「られる」の意味はどれですか。",c:["自発","可能","受け身","尊敬"],a:0,
   e:"「自然と感じる」という意味なので自発です。「感じる・思う・しのぶ」など心の動きを表す語に付くことが多いです。"},
  {m:"③",u:13,q:"③「ほめられ」の「られ」の意味はどれですか。",c:["受け身","可能","自発","尊敬"],a:0,
   e:"「近所の人に〜される」と、ほかから動作を受けているので受け身です。"},
  {m:"④",u:13,q:"④「そうだ」の意味はどれですか。",c:["伝聞","様態","推定","断定"],a:0,
   e:"終止形「ほめられた」に付いて、人から聞いたことを表しているので伝聞です。"},
  {m:"⑤",u:13,q:"⑤「話された」の「れ」の意味はどれですか。",c:["尊敬","受け身","可能","自発"],a:0,
   e:"目上の祖父の動作を高めているので尊敬です。「昔のことを話す」動作を祖父自身がしています。"}
  ]
},
{
  id:"p18", title:"卒業式", sub:"",
  t:"　卒業式で、校長先生が式辞を[①述べられた]。来賓の方々も[②いらっしゃった]。わたしたち卒業生は、「三年間ありがとう[③ございました]。」とお礼を[④申し上げた]。最後に、記念品を[⑤いただいた]。",
  qs:[
  {m:"①",u:14,q:"①「述べられた」は、どの種類の敬語ですか。",c:["尊敬語","謙譲語","丁寧語","美化語"],a:0,
   e:"校長先生の動作に尊敬の助動詞「られる」を付けているので尊敬語です。"},
  {m:"②",u:14,q:"②「いらっしゃった」は、ここではどの動詞の尊敬語として使われていますか。",c:["来る","言う","食べる","見る"],a:0,
   e:"来賓が式に「来た」ことを高めています。「いらっしゃる」は「来る・行く・いる」の尊敬語です。"},
  {m:"③",u:14,q:"③「ございました」は、どの種類の敬語ですか。",c:["丁寧語","尊敬語","謙譲語","美化語"],a:0,
   e:"聞き手に対して丁寧に言う言葉なので丁寧語です。"},
  {m:"④",u:14,q:"④「申し上げた」のもとになる動詞はどれですか。",c:["言う","する","行く","聞く"],a:0,
   e:"「申し上げる」は「言う」の謙譲語です。"},
  {m:"⑤",u:14,q:"⑤「いただいた」のもとになる動詞はどれですか。",c:["もらう","くれる","与える","見る"],a:0,
   e:"ここでは記念品を「もらった」ことを、へりくだって言っています。謙譲語です。"}
  ]
},
{
  id:"p19", title:"夕焼け", sub:"",
  t:"　夕焼けがとても[①美しかっ]た。空は[②真っ赤で]、雲が金色に光っていた。[③静かな]公園のベンチに座ると、心が[④穏やかに]なった。こんな景色がずっと続け[⑤ば]いいのに。",
  qs:[
  {m:"①",u:11,q:"①「美しかっ」の活用形はどれですか。",c:["連用形","未然形","終止形","仮定形"],a:0,
   e:"助動詞「た」に続く形容詞の連用形は「〜かっ」になります。"},
  {m:"②",u:11,q:"②「真っ赤で」の品詞はどれですか。",c:["形容動詞","名詞","形容詞","副詞"],a:0,
   e:"「真っ赤だ・真っ赤な」と活用するので、形容動詞「真っ赤だ」の連用形です。"},
  {m:"③",u:11,q:"③「静かな」の活用形はどれですか。",c:["連体形","連用形","終止形","仮定形"],a:0,
   e:"体言「公園」に続いているので連体形です。形容動詞の連体形は「〜な」です。"},
  {m:"④",u:11,q:"④「穏やかに」を言い切りの形（終止形）にしたものはどれですか。",c:["穏やかだ","穏やかい","穏やかな","穏やかする"],a:0,
   e:"形容動詞は「〜だ」で言い切ります。"},
  {m:"⑤",u:12,q:"⑤「ば」の助詞の種類はどれですか。",c:["接続助詞","格助詞","副助詞","終助詞"],a:0,
   e:"活用語の仮定形に付いて、仮定の条件を表して下につなぐ接続助詞です。"}
  ]
},
{
  id:"p20", title:"雨の帰り道", sub:"",
  t:"　[①まさか]雨は降らないだろうと思っていた。傘がないので、[②おそらく]ぬれて帰ることになる[③だろう]。[④どうか]明日は晴れてほしい。空は[⑤まるで]泣いているようだ。",
  qs:[
  {m:"①",u:8,q:"①「まさか」と呼応している言葉はどれですか。",c:["降らないだろう","雨は","思って","いた"],a:0,
   e:"「まさか〜ないだろう」と、打ち消しの推量と呼応する副詞です。"},
  {m:"②",u:8,q:"②「おそらく」の品詞はどれですか。",c:["副詞","形容詞","連体詞","接続詞"],a:0,
   e:"「おそらく〜だろう」と推量の言い方と呼応する、呼応（陳述）の副詞です。"},
  {m:"③",u:13,q:"③「だろう」の意味はどれですか。",c:["推量","断定","意志","伝聞"],a:0,
   e:"はっきりしないことをおしはかる推量の意味です。"},
  {m:"④",u:8,q:"④「どうか」と呼応している言葉はどれですか。",c:["晴れてほしい","明日は","雨は","帰る"],a:0,
   e:"「どうか〜ほしい（ください）」と、願いの言い方と呼応する副詞です。"},
  {m:"⑤",u:13,q:"⑤「まるで」と呼応する「ようだ」の意味はどれですか。",c:["たとえ（比喩）","推定","例示","様態"],a:0,
   e:"「まるで〜ようだ」は、ほかのものにたとえるときの言い方です。"}
  ]
},
{
  id:"p21", title:"道具を使う動物", sub:"",
  t:"　人間は道具を使う動物である。[①しかも]、道具を作ることもできる。[②この]力によって、人間は文明を築いてきた。[③ところで]、道具を使う動物はほかにもいる。[④例えば]、ラッコは石を使って貝を割る。",
  qs:[
  {m:"①",u:9,q:"①「しかも」は、どのような関係で前後をつないでいますか。",c:["並立・累加","逆接","順接","転換"],a:0,
   e:"前の内容に、さらに付け加えているので並立・累加の接続詞です。"},
  {m:"②",u:5,q:"②「この」が指している内容はどれですか。",c:["道具を使い、さらに作ることもできる力","文明を築く力","ラッコの力","石で貝を割る力"],a:0,
   e:"直前の二つの文の内容、「道具を使い、作ることもできる」ことを指しています。"},
  {m:"③",u:9,q:"③「ところで」は、どのような働きをしていますか。",c:["転換","順接","逆接","説明・補足"],a:0,
   e:"人間の話から「ほかの動物」の話へ、話題を変えているので転換の接続詞です。"},
  {m:"④",u:9,q:"④「例えば」は、どのような働きをしていますか。",c:["説明・補足","並立・累加","対比・選択","逆接"],a:0,
   e:"前の内容の具体例をあげて説明しているので、説明・補足の働きです。"},
  {u:2,q:"「ラッコは石を使って貝を割る。」の述語はどれですか。",c:["割る","使って","貝を","ラッコは"],a:0,
   e:"「ラッコは（何が）→ 割る（どうする）」で、文の最後にある「割る」が述語です。"}
  ]
},
{
  id:"p22", title:"夕食づくり", sub:"",
  t:"　今日は、わたしが夕食を[①料理する]ことにした。母が[②来る]前に、野菜を[③切っ]て、肉を[④焼い]た。母は「おいしい」と[⑤ほめ]てくれた。",
  qs:[
  {m:"①",u:10,q:"①「料理する」の活用の種類はどれですか。",c:["サ行変格活用","カ行変格活用","五段活用","下一段活用"],a:0,
   e:"「する」や「名詞＋する」の動詞はサ行変格活用です。"},
  {m:"②",u:10,q:"②「来る」の活用の種類はどれですか。",c:["カ行変格活用","サ行変格活用","上一段活用","五段活用"],a:0,
   e:"カ行変格活用の動詞は「来る」一語だけです。"},
  {m:"③",u:10,q:"③「切っ（切る）」の活用の種類はどれですか。",c:["五段活用","上一段活用","下一段活用","カ行変格活用"],a:0,
   e:"「切らない」と、直前がア段になるので五段活用です。「着る（着ない）」は上一段なので、まちがえないようにしましょう。"},
  {m:"④",u:10,q:"④「焼い」に見られる音便はどれですか。",c:["イ音便","促音便","撥音便","ウ音便"],a:0,
   e:"「焼き＋た」が「焼いた」と「い」に変わっているのでイ音便です。"},
  {m:"⑤",u:10,q:"⑤「ほめ（ほめる）」の活用の種類はどれですか。",c:["下一段活用","上一段活用","五段活用","サ行変格活用"],a:0,
   e:"「ほめない」と、直前がエ段になるので下一段活用です。"}
  ]
},
{
  id:"p23", title:"庭の子犬", sub:"",
  t:"　[①白い]子犬が、[②元気よく]庭を走り回っている。子犬は[③ときどき]立ち止まって、[④わたしの]顔を見る。",
  qs:[
  {m:"①",u:3,q:"①「白い」が修飾している文節はどれですか。",c:["子犬が","庭を","走り回って","いる"],a:0,
   e:"「白い → 子犬が」と、体言を含む文節を修飾しています。"},
  {m:"②",u:3,q:"②「元気よく」が修飾している文節はどれですか。",c:["走り回って","庭を","子犬が","いる"],a:0,
   e:"「元気よく → 走り回って」とつながります。「走り回っている」は「走り回って／いる」の二文節です。"},
  {m:"③",u:3,q:"③「ときどき」が修飾している文節はどれですか。",c:["立ち止まって","見る","顔を","子犬は"],a:0,
   e:"「ときどき → 立ち止まって」とつなぐと意味が通ります。"},
  {m:"④",u:3,q:"④「わたしの」が修飾している文節はどれですか。",c:["顔を","見る","立ち止まって","子犬は"],a:0,
   e:"「わたしの → 顔を」と、体言を含む文節を修飾しています。"},
  {m:"①",u:3,q:"①「白い」のように、体言を含む文節を修飾する修飾語を何といいますか。",c:["連体修飾語","連用修飾語","接続語","独立語"],a:0,
   e:"体言を修飾するのが連体修飾語、用言を修飾するのが連用修飾語です。"}
  ]
},
{
  id:"p24", title:"主語と述語の型", sub:"",
  t:"　[①兄も]野球選手だ。[②ぼくこそ]毎朝走る。きれいだね、この花は。",
  qs:[
  {m:"①",u:2,q:"①「兄も」は、文の成分として何にあたりますか。",c:["主語","修飾語","述語","独立語"],a:0,
   e:"「が」「は」以外に、「も」「こそ」などが付いても主語になります。「だれが野球選手か」にあたるので主語です。"},
  {u:2,q:"「兄も野球選手だ。」の主語と述語の関係は、どの型にあたりますか。",c:["何が―何だ","何が―どうする","何が―どんなだ","何が―ある"],a:0,
   e:"述語「野球選手だ」は名詞＋「だ」なので、「何が―何だ」の型です。"},
  {m:"②",u:2,q:"「ぼくこそ毎朝走る。」の主語と述語の関係は、どの型にあたりますか。",c:["何が―どうする","何が―何だ","何が―どんなだ","何が―いる"],a:0,
   e:"述語「走る」は動作を表す動詞なので、「何が―どうする」の型です。"},
  {u:2,q:"「きれいだね、この花は。」の主語はどれですか。",c:["この花は","きれいだね","この","花"],a:0,
   e:"「何が（は）きれいか」にあたる「この花は」が主語です。主語は文節単位で答えます。"},
  {u:2,q:"「きれいだね、この花は。」のように、主語と述語の順序を入れかえる表現を何といいますか。",c:["倒置","体言止め","対句","比喩"],a:0,
   e:"ふつうの語順を入れかえて、述語を強調する表現を倒置といいます。"}
  ]
},
{
  id:"p25", title:"呼びかけと応答", sub:"",
  t:"　「[①健太]、宿題は終わったの？」「[②はい]、終わりました。」「[③雨なので]、今日は家で遊ぼう。」[④春]、それはわたしの一番好きな季節だ。",
  qs:[
  {m:"①",u:3,q:"①「健太」は、文の成分として何にあたりますか。",c:["独立語","主語","修飾語","接続語"],a:0,
   e:"呼びかけを表し、ほかの文節と直接関係しないので独立語です。"},
  {m:"②",u:9,q:"②「はい」の品詞はどれですか。",c:["感動詞","副詞","接続詞","連体詞"],a:0,
   e:"応答を表す、活用しない自立語なので感動詞です。"},
  {m:"③",u:3,q:"③「雨なので」は、文の成分として何にあたりますか。",c:["接続語","修飾語","主語","独立語"],a:0,
   e:"「今日は家で遊ぼう」の理由を表して、あとにつないでいるので接続語です。"},
  {m:"④",u:3,q:"④「春」は、文の成分として何にあたりますか。",c:["独立語","主語","修飾語","述語"],a:0,
   e:"話題を先に示す提示の独立語です。あとの「それ」が「春」を指しています。"},
  {m:"③",u:12,q:"③「雨なので」の「ので」の品詞はどれですか。",c:["助詞","助動詞","接続詞","名詞"],a:0,
   e:"活用しない付属語で、理由を表して下につなぐ接続助詞です。"}
  ]
},
{
  id:"p26", title:"駅前のパン屋", sub:"",
  t:"　この店のパンは[①安くておいしい]。わたしは、パン[②や]牛乳を買った。店員さんは明るく[③親切だっ]た。",
  qs:[
  {m:"①",u:4,q:"①「安くておいしい」の「安くて」と「おいしい」の文節どうしの関係はどれですか。",c:["並立の関係","補助の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「安い」と「おいしい」が対等に並んでいるので並立の関係です。"},
  {m:"①",u:11,q:"①「安くて」の「安く」の活用形はどれですか。",c:["連用形","未然形","連体形","仮定形"],a:0,
   e:"接続助詞「て」に続く形容詞の連用形は「〜く」です。"},
  {m:"②",u:12,q:"②「や」の助詞の種類はどれですか。",c:["格助詞","副助詞","接続助詞","終助詞"],a:0,
   e:"体言に付いて、物事を並べあげる（並立）格助詞です。"},
  {m:"③",u:11,q:"③「親切だっ」の品詞はどれですか。",c:["形容動詞","名詞","形容詞","動詞"],a:0,
   e:"「親切な人」「親切に」と活用するので、形容動詞「親切だ」の連用形です。"},
  {u:4,q:"「店員さんは明るく親切だった。」の「明るく」と「親切だった」の関係はどれですか。",c:["並立の関係","補助の関係","主・述の関係","修飾・被修飾の関係"],a:0,
   e:"「明るい」と「親切だ」が対等に並んで、店員さんの様子を表しているので並立の関係です。"}
  ]
},
{
  id:"p27", title:"春の野原", sub:"",
  t:"　[①春]になると、空気に[②暖かさ]を感じる。野原には花が[③咲き]、子どもたちの[④遊び]が始まる。",
  qs:[
  {m:"①",u:7,q:"①「春」は、名詞の種類のうちどれにあたりますか。",c:["普通名詞","固有名詞","数詞","代名詞"],a:0,
   e:"一般的な物事の名前を表すので普通名詞です。"},
  {m:"②",u:7,q:"②「暖かさ」は、どの品詞から名詞に変わったものですか。",c:["形容詞","動詞","形容動詞","副詞"],a:0,
   e:"形容詞「暖かい」の語幹に接尾語「さ」が付いてできた名詞です。"},
  {m:"③",u:10,q:"③「咲き」の活用形はどれですか。",c:["連用形","未然形","終止形","連体形"],a:0,
   e:"「咲き、」と読点で文をいったん中止している連用形です（連用中止法）。"},
  {m:"④",u:7,q:"④「遊び」の品詞はどれですか。",c:["名詞","動詞","形容詞","副詞"],a:0,
   e:"動詞「遊ぶ」の連用形が名詞に変わったもの（転成名詞）です。「遊びが」と主語になっています。"},
  {u:3,q:"「子どもたちの」が修飾している文節はどれですか。",c:["遊びが","始まる","野原には","花が"],a:0,
   e:"「子どもたちの → 遊びが」とつながる連体修飾語です。"}
  ]
},
{
  id:"p28", title:"日曜日の山登り", sub:"",
  t:"　昨日は日曜日[①でし]た。家族で山に登り[②まし]た。山頂からの景色はとても[③きれいだっ]た。弁当を[④食べ][⑤たら]、眠くなった。",
  qs:[
  {m:"①",u:13,q:"①「でし」（です）の意味はどれですか。",c:["丁寧な断定","過去","推量","伝聞"],a:0,
   e:"「だ」を丁寧に言う、丁寧な断定の助動詞「です」の連用形です。"},
  {m:"②",u:13,q:"②「まし」（ます）の意味はどれですか。",c:["丁寧","尊敬","断定","希望"],a:0,
   e:"「ます」は動詞に付いて、丁寧の意味を表す助動詞です。"},
  {m:"③",u:11,q:"③「きれいだっ」の品詞はどれですか。",c:["形容動詞","形容詞","名詞＋助動詞","副詞"],a:0,
   e:"「きれいな景色」と活用できるので、形容動詞「きれいだ」の連用形です。「きれい」は「い」で終わりますが形容詞ではありません。"},
  {m:"④",u:10,q:"④「食べ」の活用の種類はどれですか。",c:["下一段活用","上一段活用","五段活用","カ行変格活用"],a:0,
   e:"「食べない」と、直前がエ段になるので下一段活用です。"},
  {m:"⑤",u:13,q:"⑤「たら」の品詞はどれですか。",c:["助動詞","助詞","動詞","接続詞"],a:0,
   e:"過去・完了の助動詞「た」の仮定形です。助動詞は活用する付属語です。"}
  ]
},
{
  id:"p29", title:"「だ」の見分け", sub:"",
  t:"　わたしの夢は医者[①だ]。祖父は[②元気だ][③が]、最近は病院に通う日が多い。「医者がいて[④くれ]て安心だ。」と祖父は言う。昨日、わたしは医者の伝記を[⑤読んだ]。",
  qs:[
  {m:"①",u:13,q:"①「だ」と同じ品詞・用法の「だ」を含む文はどれですか。",c:["これは兄の本だ。","部屋がとても静かだ。","昨日は海で泳いだ。","駅まで急いで走った。"],a:0,
   e:"本文の「だ」は名詞に付く断定の助動詞です。「本だ」も同じ。「静かだ」は形容動詞の一部、「泳いだ」の「だ」は過去の助動詞「た」が濁ったものです。"},
  {m:"②",u:11,q:"②「元気だ」の品詞はどれですか。",c:["形容動詞","名詞＋助動詞","形容詞","副詞"],a:0,
   e:"「元気な人」と、「〜な」の形で体言を修飾できるので形容動詞です。"},
  {m:"③",u:12,q:"③「が」の助詞の種類はどれですか。",c:["接続助詞","格助詞","副助詞","終助詞"],a:0,
   e:"「元気だ」という活用語に付いて、逆接で下につないでいるので接続助詞です。"},
  {m:"④",u:4,q:"④「くれ」と同じ使い方の「くれ」を含む文はどれですか。",c:["友達が宿題を手伝ってくれた。","兄が古い本をくれた。","祖母がお年玉をくれた。","先生が答えをくれた。"],a:0,
   e:"本文の「くれ」は「いて」に意味をそえる補助動詞です。「手伝ってくれた」も同じ。ほかは「物を与える」意味の本動詞です。"},
  {m:"⑤",u:13,q:"⑤「読んだ」の「だ」の意味はどれですか。",c:["過去","断定","推量","様態"],a:0,
   e:"撥音便「読ん」に付いて「た」が「だ」に濁ったもので、過去の助動詞です。"}
  ]
},
{
  id:"p30", title:"「の」の見分け", sub:"",
  t:"　これはわたし[①の]かばんだ。妹[②の]作ったケーキは[③おいしい]。あの赤い傘もわたし[④の]だ。",
  qs:[
  {m:"①",u:12,q:"①「の」と同じ用法の「の」を含む文はどれですか。",c:["姉の帽子を借りる。","雨の降る日は家にいる。","走るのが好きだ。","もう帰るの？"],a:0,
   e:"本文①は「わたしの → かばん」と体言を修飾する連体修飾格の「の」です。「姉の帽子」も同じ。"},
  {m:"②",u:12,q:"②「の」と同じ用法の「の」を含む文はどれですか。",c:["雨の降る日は家にいる。","姉の帽子を借りる。","走るのが好きだ。","もう帰るの？"],a:0,
   e:"本文②は「妹が作った」と「が」に言いかえられる主格の「の」です。「雨の降る日（雨が降る日）」も同じ。"},
  {m:"③",u:11,q:"③「おいしい」の品詞はどれですか。",c:["形容詞","形容動詞","副詞","連体詞"],a:0,
   e:"活用する自立語で、言い切りが「い」なので形容詞です。"},
  {m:"④",u:12,q:"④「の」と同じ用法の「の」を含む文はどれですか。",c:["大きいのがほしい。","姉の帽子を借りる。","雨の降る日は家にいる。","もう帰るの？"],a:0,
   e:"本文④は「わたしのもの」と「もの」に言いかえられる、体言の代用の「の」です。「大きいの（大きいもの）」も同じ。"},
  {u:13,q:"「妹の作った」の「た」の意味はどれですか。",c:["過去","推量","断定","伝聞"],a:0,
   e:"すでに作り終えたことを表す、過去の助動詞です。"}
  ]
},
{
  id:"p31", title:"夕立の前", sub:"",
  t:"　空が急に暗くなってきた。どうやら雨が降る[①ようだ]。走って帰ってきた弟の顔は、[②まるで]りんごの[③ようだ]。弟は[④子どもらしい]笑顔を見せた。",
  qs:[
  {m:"①",u:13,q:"①「ようだ」の意味はどれですか。",c:["推定","たとえ（比喩）","例示","様態"],a:0,
   e:"空の様子を根拠に「雨が降るらしい」とおしはかっているので推定です。"},
  {m:"②",u:8,q:"②「まるで」の品詞はどれですか。",c:["副詞","連体詞","接続詞","形容動詞"],a:0,
   e:"「まるで〜ようだ」と呼応する、呼応（陳述）の副詞です。"},
  {m:"③",u:13,q:"③「ようだ」の意味はどれですか。",c:["たとえ（比喩）","推定","例示","様態"],a:0,
   e:"「まるで」と呼応して、顔の赤さをりんごにたとえているので、たとえ（比喩）です。"},
  {m:"④",u:13,q:"④「子どもらしい」の「らしい」と同じ使い方の「らしい」を含む文はどれですか。",c:["今日は春らしい天気だ。","明日は雪が降るらしい。","兄は駅に着いたらしい。","あの店は休みらしい。"],a:0,
   e:"本文の「らしい」は「〜にふさわしい」という意味の接尾語で、「子どもらしい」で一語の形容詞です。「春らしい」も同じ。ほかは推定の助動詞です。"},
  {u:4,q:"「暗くなってきた」の「なって」と「きた」の文節どうしの関係はどれですか。",c:["補助の関係","並立の関係","修飾・被修飾の関係","主・述の関係"],a:0,
   e:"「きた」は「来る」という本来の意味ではなく、変化が進む意味をそえる補助動詞です。"}
  ]
},
{
  id:"p32", title:"夕食の相談", sub:"",
  t:"　今日は寒い。[①そのうえ]、雨も降っている。[②だから]、あたたかいものが食べたい。夕食はシチューにしよう[③か]。[④それとも]、鍋にしようか。[⑤さて]、買い物に行こう。",
  qs:[
  {m:"①",u:9,q:"①「そのうえ」は、どのような関係で前後をつないでいますか。",c:["並立・累加","逆接","順接","転換"],a:0,
   e:"「寒い」に「雨も降っている」を付け加えているので、並立・累加です。"},
  {m:"②",u:9,q:"②「だから」は、どのような関係で前後をつないでいますか。",c:["順接","逆接","説明・補足","対比・選択"],a:0,
   e:"寒くて雨という理由から、当然の結果として「あたたかいものが食べたい」が続くので順接です。"},
  {m:"③",u:12,q:"③「か」の助詞の種類はどれですか。",c:["終助詞","副助詞","格助詞","接続助詞"],a:0,
   e:"文の終わりに付いて、疑問や問いかけの気持ちを表す終助詞です。"},
  {m:"④",u:9,q:"④「それとも」は、どのような働きをしていますか。",c:["対比・選択","並立・累加","順接","転換"],a:0,
   e:"「シチュー」か「鍋」か、どちらかを選ぶ関係なので対比・選択です。"},
  {m:"⑤",u:9,q:"⑤「さて」は、どのような働きをしていますか。",c:["転換","順接","逆接","説明・補足"],a:0,
   e:"献立の相談から買い物へと、話題を変えているので転換です。"}
  ]
},
{
  id:"p33", title:"書店への電話", sub:"",
  t:"　「お電話ありがとうございます。山田書店で[①ございます]。」「注文した本は届いていますか。」「はい、届いております。いつ[②来ます]か。」「明日の午後に[③行きます]。」「[④お待ちし]て[⑤おります]。」",
  qs:[
  {m:"①",u:14,q:"①「ございます」は、どの種類の敬語ですか。",c:["丁寧語","尊敬語","謙譲語","美化語"],a:0,
   e:"「です」をさらに丁寧にした言い方で、丁寧語です。"},
  {m:"②",u:14,q:"②「来ます」を、お客様への敬意を表す正しい言い方に直したものはどれですか。",c:["いらっしゃいます","参ります","伺います","お越しします"],a:0,
   e:"来るのはお客様なので尊敬語「いらっしゃる」を使います。「参る」「伺う」は謙譲語、「お越しする」は誤った言い方です。"},
  {m:"③",u:14,q:"③「行きます」を、書店への敬意を表す言い方に直したものはどれですか。",c:["伺います","いらっしゃいます","おいでになります","行かれます"],a:0,
   e:"行くのは客である自分なので、謙譲語「伺う」を使います。"},
  {m:"④",u:14,q:"④「お待ちし」（お待ちする）は、どの種類の敬語ですか。",c:["謙譲語","尊敬語","丁寧語","美化語"],a:0,
   e:"「お〜する」は自分の動作をへりくだる謙譲語の形です。"},
  {m:"⑤",u:14,q:"⑤「おります」は、どの動詞をへりくだった言い方ですか。",c:["いる","行く","言う","する"],a:0,
   e:"「おる」は「いる」の謙譲語です。補助動詞として「〜ております」の形でよく使います。"}
  ]
},
{
  id:"p34", title:"庭の花", sub:"",
  t:"　庭に赤い花が咲いている。",
  qs:[
  {u:1,q:"この文は、いくつの文節に分けられますか。",c:["4つ","5つ","6つ","8つ"],a:1,
   e:"庭に／赤い／花が／咲いて／いる。の5つです。「咲いて」と「いる」は別の文節になります。"},
  {u:1,q:"この文は、いくつの単語に分けられますか。",c:["6つ","7つ","8つ","9つ"],a:2,
   e:"庭｜に｜赤い｜花｜が｜咲い｜て｜いる　の8つです。"},

{

{

{

{

{

{

{

/* ===== 状態 ===== */
const LABELS=["ア","イ","ウ","エ"];
const UNIT_BY_NO={};UNITS.forEach(u=>UNIT_BY_NO[u.no]=u);
/* 全単元の問題を一つの問題集にまとめる */
const BANK=[];
UNITS.forEach(u=>(u.qs||[]).forEach(q=>BANK.push(Object.assign({},q,{tag:`単元${u.no} ${u.name}｜${u.cats[q.cat]}`,unitNo:u.no}))));
function pname(p){const i=PASSAGES.indexOf(p);return "文章"+String.fromCharCode(i<20?0x2460+i:i<35?0x3251+i-20:0x32B1+i-35)}
PASSAGES.forEach(p=>p.qs.forEach(q=>{q.psg=p;q.tag=`${pname(p)}｜単元${q.u} ${UNIT_BY_NO[q.u]?UNIT_BY_NO[q.u].name:""}`}));

let list=[], idx=0, score=0, answered=false, log=[], cur=null, session=null;
const $=id=>document.getElementById(id);

function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function show(id){["home","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}
function esc(t){return t.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function seg(t){return esc(t).replace(/\//g,'<span class="cut" aria-label="区切り">/</span>').replace(/\n/g,"<br>")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function psgHTML(p,on){
  return `<span class="pt">${pname(p)}</span>`+
    esc(p.t).replace(/\[([①-⑩])([^\]]+)\]/g,(_,m,w)=>`<span class="ul${m===on?" on":""}"><sup>${m}</sup>${w}</span>`);
}
function pick(pool,n){return shuffle(pool).slice(0,Math.min(n,pool.length))}

/* ===== ホーム ===== */
const MIXES=[
  {key:"all10",label:"全範囲ランダム10問",note:"すきま時間の確認に",main:false,pool:()=>BANK,n:10},
  {key:"all30",label:"全範囲ランダム30問",note:"総仕上げの実力テスト",main:true,pool:()=>BANK,n:30},
  {key:"all50",label:"全範囲ランダム50問",note:"入試前の腕だめしに",main:false,pool:()=>BANK,n:50},
];
const RANGES=[
  {key:"r1",label:"文の組み立て",note:"単元1〜5から20問",from:1,to:5,n:20},
  {key:"r2",label:"品詞と活用",note:"単元6〜11から20問",from:6,to:11,n:20},
  {key:"r3",label:"助詞・助動詞・敬語",note:"単元12〜14から20問",from:12,to:14,n:20},
];
function renderHome(){
  const ul=$("psgList");ul.innerHTML="";
  PASSAGES.forEach((p,i)=>{
    const best=store("sogo_best_"+p.id);
    const li=document.createElement("li");
    li.innerHTML=`<button class="unit-btn ps">
      <span class="nm">${pname(p)}</span>
      <span class="st">${best!=null?`最高 ${best}%`:`${p.qs.length}問`}</span></button>`;
    li.firstElementChild.onclick=()=>start({kind:"psg",id:p.id,title:pname(p),make:()=>p.qs.slice()});
    ul.appendChild(li);
  });
  const mm=$("mixMain");mm.innerHTML="";
  MIXES.forEach(m=>{
    const best=store("sogo_best_"+m.key);
    const b=document.createElement("button");b.className="start"+(m.main?" main":"");
    b.innerHTML=`${m.label}<small>${m.note}${best!=null?`・最高 ${best}%`:""}</small>`;
    b.onclick=()=>start({kind:"mix",id:m.key,title:m.label,make:()=>pick(m.pool(),m.n)});
    mm.appendChild(b);
  });
  const ms=$("mixSub");ms.innerHTML="";
  RANGES.forEach(r=>{
    const pool=BANK.filter(q=>q.unitNo>=r.from&&q.unitNo<=r.to);
    const best=store("sogo_best_"+r.key);
    const b=document.createElement("button");b.className="start";
    b.innerHTML=`${r.label}<small>${r.note}${best!=null?`・最高 ${best}%`:""}</small>`;
    b.onclick=()=>start({kind:"mix",id:r.key,title:`${r.label}（単元${r.from}〜${r.to}）`,make:()=>pick(pool,r.n)});
    ms.appendChild(b);
  });
  show("home");
}

/* ===== 出題 ===== */
function start(s,qs,label){
  session=s;list=qs||s.make();session.label=label||s.title;
  idx=0;score=0;log=[];show("quiz");renderQ();
}
function renderQ(){
  answered=false;
  const q=list[idx];
  const order=shuffle([0,1,2,3]);
  cur={q,order};
  $("qCount").textContent=`${session.label}　${idx+1} / ${list.length}`;
  $("qScore").textContent=`正解 ${score}`;
  $("qBar").style.width=(idx/list.length*100)+"%";
  $("qPsg").classList.toggle("hidden",!q.psg);
  if(q.psg)$("qPsg").innerHTML=psgHTML(q.psg,q.m);
  $("qTag").textContent=q.tag;
  $("qText").textContent=q.q;
  $("qSent").classList.toggle("hidden",!q.s);
  if(q.s)$("qSent").innerHTML=seg(q.s);
  const ul=$("opts");ul.innerHTML="";
  order.forEach((oi,pos)=>{
    const t=q.c[oi], isSeg=t.includes("/");
    const li=document.createElement("li");
    li.innerHTML=`<button class="opt" data-oi="${oi}"><span class="lb">${LABELS[pos]}</span><span class="tx${isSeg?" seg":""}">${seg(t)}</span></button>`;
    li.firstElementChild.onclick=()=>answer(oi);
    ul.appendChild(li);
  });
  $("markBox").innerHTML="";
  $("exp").classList.add("hidden");
  $("next").classList.add("hidden");
  ul.querySelector("button").focus({preventScroll:true});
}
function answer(oi){
  if(answered)return;answered=true;
  const q=cur.q, ok=oi===q.a;
  if(ok)score++;
  log.push({q,picked:oi,ok});
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;const v=+b.dataset.oi;
    if(v===q.a)b.classList.add("correct");
    else if(v===oi)b.classList.add("wrong");
  });
  $("markBox").innerHTML=ok
    ?`<svg class="mark" viewBox="0 0 80 80" aria-label="正解"><circle class="draw" cx="40" cy="40" r="32"/></svg>`
    :`<svg class="mark" viewBox="0 0 80 80" aria-label="不正解"><path class="draw2" d="M14 14 L66 66"/><path class="draw2" style="animation-delay:.45s" d="M66 14 L14 66"/></svg>`;
  const e=$("exp");
  e.innerHTML=`<b>${ok?"正解！":"不正解…　正解は "+LABELS[cur.order.indexOf(q.a)]}</b><p>${seg(q.e)}</p>`;
  e.classList.remove("hidden");
  $("qScore").textContent=`正解 ${score}`;
  const nx=$("next");
  nx.textContent=idx+1<list.length?"次の問題へ":"結果を見る";
  nx.classList.remove("hidden");nx.focus({preventScroll:true});
}
$("next").onclick=()=>{idx++;if(idx<list.length)renderQ();else finish()};
$("quit").onclick=renderHome;

/* ===== 結果 ===== */
function finish(){
  const pct=Math.round(score/list.length*100);
  if(!session.retry){const k="sogo_best_"+session.id,b=store(k);if(b==null||pct>b)store(k,pct)}
  $("resTitle").textContent=session.label;
  $("resScore").textContent=score;
  $("resOf").textContent=`/ ${list.length}問　正答率 ${pct}%`;
  const wrong=log.filter(l=>!l.ok);
  /* 苦手単元の集計 */
  const weak={};wrong.forEach(l=>{const n=l.q.unitNo||l.q.u;weak[n]=(weak[n]||0)+1});
  const top=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,2).map(([n])=>`単元${n}「${UNIT_BY_NO[n].name}」`);
  $("resVerdict").textContent=(pct===100?"全問正解です。単元をまたいでも力がついています。"
    :pct>=80?"よくできています。間違えた問題の解説を読んで仕上げましょう。"
    :pct>=50?"あと一歩です。間違えた問題を解き直しましょう。"
    :"まずは解説を読み、苦手な単元を本編で復習してから再挑戦しましょう。")
    +(top.length?`　見直したい単元：${top.join("、")}`:"");
  $("retryWrong").classList.toggle("hidden",!wrong.length);
  $("retryWrong").onclick=()=>start(Object.assign({},session,{retry:true}),wrong.map(l=>l.q),"解き直し");
  $("retryAll").onclick=()=>start(Object.assign({},session,{retry:false}));
  const r=$("review");r.innerHTML="";
  wrong.forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`<div class="rp">${esc(l.q.tag)}</div><div class="rq">${esc(l.q.q)}</div>
      ${l.q.psg?`<div class="rs">${psgHTML(l.q.psg,l.q.m).replace(/<span class="pt">.*?<\/span>/,"")}</div>`:""}
      ${l.q.s?`<div class="rs">${seg(l.q.s)}</div>`:""}
      <div class="ra">あなたの答え：${seg(l.q.c[l.picked])}<br>正解：<span>${seg(l.q.c[l.q.a])}</span></div>
      <div class="ra">${seg(l.q.e)}</div>`;
    r.appendChild(li);
  });
  show("result");
}
$("toHome").onclick=renderHome;

/* キーボード操作 */
document.addEventListener("keydown",ev=>{
  if($("quiz").classList.contains("hidden"))return;
  if(!answered&&/^[1-4]$/.test(ev.key)){const b=document.querySelectorAll(".opt")[+ev.key-1];if(b)b.click()}
  else if(answered&&ev.key==="Enter"&&document.activeElement!==$("next")){$("next").click()}
});

renderHome();
</script>
</body>
