<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>現代文　文法四択問題</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Shippori+Mincho+B1:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFBF6; --sheet:#FFFFFF; --rule:#C9D6C4; --rule-strong:#8FA88A;
  --ink:#1E2B3A; --pencil:#5E6670; --red:#D0342C; --red-soft:#FBE7E4;
  --mark-bg:#F3EBB8; --ok-soft:#E5F0E2;
  --sans:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --serif:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1A1F24; --sheet:#232A31; --rule:#34433A; --rule-strong:#5C7A62;
    --ink:#E7ECEF; --pencil:#A3ADB6; --red:#FF6B5F; --red-soft:#3A2522;
    --mark-bg:#4A4426; --ok-soft:#24352A;
  }
}
:root[data-theme="dark"]{
  --paper:#1A1F24; --sheet:#232A31; --rule:#34433A; --rule-strong:#5C7A62;
  --ink:#E7ECEF; --pencil:#A3ADB6; --red:#FF6B5F; --red-soft:#3A2522;
  --mark-bg:#4A4426; --ok-soft:#24352A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:17px;line-height:1.75;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--rule) 35px,var(--rule) 36px);
  background-attachment:local;
}
main{max-width:720px;margin:0 auto;padding:28px 18px 64px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.hidden{display:none !important}

/* header */
.mast{border-left:6px solid var(--red);padding:4px 0 4px 16px;margin-bottom:28px;background:var(--paper)}
.mast h1{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6vw,40px);line-height:1.25;margin:0;letter-spacing:.04em}
.mast p{margin:6px 0 0;color:var(--pencil);font-size:15px}

/* unit list */
.units{list-style:none;margin:0;padding:0;background:var(--sheet);border:1px solid var(--rule-strong)}
.units li{border-top:1px solid var(--rule)}
.units li:first-child{border-top:none}
.unit-btn{display:grid;grid-template-columns:3.2em 1fr auto;align-items:center;gap:12px;width:100%;
  text-align:left;background:none;border:none;padding:14px 16px}
.unit-btn .no{font-family:var(--serif);font-size:22px;font-weight:700;color:var(--red);text-align:center;
  border-right:1px dashed var(--rule-strong);padding-right:10px}
.unit-btn .nm{font-weight:700;font-size:17px}
.unit-btn .sub{display:block;font-weight:400;font-size:13px;color:var(--pencil)}
.unit-btn .st{font-size:13px;color:var(--pencil);white-space:nowrap}
.unit-btn:not(:disabled):hover{background:var(--mark-bg)}
.unit-btn:disabled{cursor:default;opacity:.5}
.note{font-size:13px;color:var(--pencil);margin-top:14px}

/* unit page */
.back{background:none;border:none;padding:4px 0;color:var(--pencil);font-size:15px;margin-bottom:10px}
.back:hover{color:var(--ink)}
.panel{background:var(--sheet);border:1px solid var(--rule-strong);padding:22px 20px}
.panel h2{font-family:var(--serif);font-size:26px;margin:0 0 4px;line-height:1.35}
.panel .scope{color:var(--pencil);font-size:14px;margin:0 0 18px}
.starts{display:grid;gap:10px}
.start{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;
  padding:13px 16px;border:2px solid var(--ink);background:var(--sheet);text-align:left;font-weight:700}
.start small{font-weight:400;color:var(--pencil);font-size:13px}
.start.main{background:var(--ink);color:var(--sheet)}
.start.main small{color:var(--rule)}
.start:hover{transform:translate(-1px,-1px);box-shadow:3px 3px 0 var(--red)}
.cat-h{font-size:14px;color:var(--pencil);margin:22px 0 8px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.cats .start{border-width:1px;font-size:15px;padding:10px 12px}

/* quiz */
.qtop{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px;font-size:14px;color:var(--pencil)}
.bar{height:6px;background:var(--rule);margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.card{position:relative;background:var(--sheet);border:1px solid var(--rule-strong);padding:22px 20px 20px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--rule-strong);padding:0 8px;color:var(--pencil);margin-bottom:10px}
.qtext{font-weight:700;font-size:18px;margin:0 0 12px;padding-right:64px}
.sent{font-family:var(--serif);font-size:21px;line-height:1.9;background:var(--paper);border-left:4px solid var(--rule-strong);
  padding:10px 14px;margin:0 0 16px;overflow-x:auto}
.opts{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:2.2em 1fr;align-items:center;gap:10px;width:100%;text-align:left;
  background:var(--sheet);border:1px solid var(--rule-strong);padding:10px 12px}
.opt .lb{font-family:var(--serif);font-weight:700;font-size:18px;width:1.9em;height:1.9em;display:grid;place-items:center;
  border:1px solid var(--ink);border-radius:50%}
.opt .tx{font-size:17px}
.opt .tx.seg{font-family:var(--serif);font-size:19px}
.opt:not(:disabled):hover{background:var(--mark-bg)}
.opt:disabled{cursor:default}
.opt.correct{background:var(--ok-soft);border-color:var(--rule-strong)}
.opt.correct .lb{background:var(--ink);color:var(--sheet)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .tx{text-decoration:line-through;text-decoration-color:var(--red)}
.cut{color:var(--red);font-family:var(--sans);font-weight:700;margin:0 .15em}
.mark{position:absolute;top:10px;right:12px;width:72px;height:72px;pointer-events:none}
.mark path,.mark circle{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round}
.mark .draw{stroke-dasharray:240;stroke-dashoffset:240;animation:draw .45s ease-out forwards}
.mark .draw2{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .25s .25s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.exp{margin-top:16px;padding:12px 14px;border:1px dashed var(--red);background:var(--sheet)}
.exp b{color:var(--red)}
.exp p{margin:4px 0 0}
.next{margin-top:16px;width:100%;padding:13px;border:2px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:700}
.next:hover{box-shadow:3px 3px 0 var(--red)}
.hint{font-size:12px;color:var(--pencil);text-align:center;margin-top:8px}

/* result */
.score{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px}
.score .big{font-family:var(--serif);font-weight:700;font-size:64px;line-height:1;color:var(--red)}
.score .of{font-size:18px;padding-bottom:8px}
.verdict{margin:0 0 18px;color:var(--pencil)}
.review{list-style:none;padding:0;margin:18px 0 0}
.review li{border-top:1px solid var(--rule);padding:12px 0}
.review .rq{font-weight:700}
.review .rs{font-family:var(--serif);font-size:18px}
.review .ra{font-size:15px}
.review .ra span{color:var(--red);font-weight:700}
.row{display:grid;gap:10px;margin-top:18px}
@media (min-width:560px){.row{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){
  .mark .draw,.mark .draw2{animation:none;stroke-dashoffset:0}
  .bar i{transition:none}
  .start:hover{transform:none}
}
.passage{font-family:var(--serif);font-size:19px;line-height:2.05;background:var(--sheet);border:1px solid var(--rule-strong);
  border-left:6px solid var(--rule-strong);padding:14px 16px;margin-bottom:14px;white-space:pre-wrap}
.passage .pt{display:block;font-family:var(--sans);font-size:13px;color:var(--pencil);margin-bottom:4px;white-space:normal}
.ul{text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px}
.ul sup{font-family:var(--sans);font-size:12px;color:var(--pencil);margin-right:1px;text-decoration:none;display:inline-block}
.ul.on{background:var(--mark-bg);text-decoration-color:var(--red);text-decoration-thickness:2.5px}
.ul.on sup{color:var(--red);font-weight:700}
.review .rp{font-size:13px;color:var(--pencil)}
.review .rs.psg{font-size:16px;white-space:pre-wrap;line-height:1.95}
.psg-btn{flex-direction:column;align-items:flex-start;gap:2px}
#psgBtns{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.psg-btn .pn{font-family:var(--serif);font-size:17px}
</style>
</head>
<body>
<main>
  <header class="mast">
    <h1>現代文　文法四択問題</h1>
    <p>定期テスト対策問題</p>
  </header>

  <!-- 単元一覧 -->
  <section id="home">
    <ul class="units" id="unitList"></ul>
  </section>

  <!-- 単元トップ -->
  <section id="unit" class="hidden">
    <button class="back" data-go="home">← 単元一覧にもどる</button>
    <div class="panel">
      <h2 id="unitTitle"></h2>
      <p class="scope" id="unitScope"></p>
      <div class="starts">
        <button class="start main" id="startAll"></button>
        <button class="start" id="startRand"></button>
        <button class="start" id="startRand20"></button>
      </div>
      <p class="cat-h">分野をしぼって練習する</p>
      <div class="cats" id="catBtns"></div>
      <p class="cat-h">文章問題（短い文章を読んで、傍線部について答える）</p>
      <div class="starts"><button class="start" id="startPsgAll"></button></div>
      <div class="cats" id="psgBtns" style="margin-top:8px"></div>
    </div>
  </section>

  <!-- 出題 -->
  <section id="quiz" class="hidden">
    <button class="back" id="quit">← やめて単元にもどる</button>
    <div class="qtop"><span id="qCount"></span><span id="qScore"></span></div>
    <div class="bar"><i id="qBar"></i></div>
    <div class="passage hidden" id="qPsg"></div>
    <div class="card" id="card">
      <span class="tag" id="qTag"></span>
      <p class="qtext" id="qText"></p>
      <div class="sent" id="qSent"></div>
      <ul class="opts" id="opts"></ul>
      <div id="markBox"></div>
      <div class="exp hidden" id="exp"></div>
      <button class="next hidden" id="next"></button>
    </div>
    <p class="hint">キーボードの 1〜4 で選択、Enter で次へ進めます。</p>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="panel">
      <h2 id="resTitle"></h2>
      <div class="score"><span class="big" id="resScore"></span><span class="of" id="resOf"></span></div>
      <p class="verdict" id="resVerdict"></p>
      <div class="row">
        <button class="start main" id="retryWrong">間違えた問題だけ解き直す</button>
        <button class="start" id="toUnit">単元トップにもどる</button>
      </div>
      <ul class="review" id="review"></ul>
    </div>
  </section>
</main>

<script>
/* ===== 単元データ =====
   q: 問題文 / s: 対象の文（任意） / c: 選択肢4つ / a: 正解の番号(0〜3) / e: 解説
   選択肢・文中の「/」は区切り線として赤で表示されます。 */
const UNITS = [
{
  id:"u1", no:1, name:"文節と単語", sub:"文章・段落・文・文節・単語",
  scope:"出題範囲：言葉の単位（文章・段落・文）、文節の区切り方、単語の区切り方、複合語",
  cats:["文章・段落・文","文節","単語","文節と単語のまとめ"],
  qs:[
  // ---- 文章・段落・文
  {cat:0,q:"言葉の単位を、大きいものから順に並べたものはどれですか。",
   c:["文章 → 段落 → 文 → 文節 → 単語","文章 → 文 → 段落 → 文節 → 単語","段落 → 文章 → 文 → 単語 → 文節","文章 → 段落 → 文節 → 文 → 単語"],a:0,
   e:"いちばん大きいのが「文章」、いちばん小さいのが「単語」です。文章は段落に、段落は文に、文は文節に、文節は単語に分けられます。"},
  {cat:0,q:"「段落」の説明として正しいものはどれですか。",
   c:["文章を、内容のまとまりごとに区切ったもの。初めは一字下げて書く。","「。」などで終わる、ひと続きの言葉。","意味や発音が不自然にならない程度に、文を短く区切ったもの。","意味をもつ、最も小さな言葉の単位。"],a:0,
   e:"段落は文章の中のひと区切りのまとまりです。行を変え、初めを一字下げて書きます。ほかの選択肢は順に「文」「文節」「単語」の説明です。"},
  {cat:0,q:"「文」の説明として正しいものはどれですか。",
   c:["一つのまとまった内容を表し、「。」「？」「！」などで終わるひと続きの言葉。","あるまとまった内容を表した、最も大きな言葉の単位。","文章の中で、内容のまとまりごとに区切ったもの。","文節をさらに細かく分けた言葉の単位。"],a:0,
   e:"文はふつう「。」（句点）で終わりますが、「？」や「！」で終わることもあります。"},
  {cat:0,q:"文の終わりに付く記号として、当てはまらないものはどれですか。",
   c:["、","。","？","！"],a:0,
   e:"「、」は読点で、文の途中に打つ記号です。文の終わりには「。」「？」「！」が付きます。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"あなたは犬が好きですか？　わたしは大好きです。毎朝、近くの公園まで散歩に連れて行きます。",
   c:["2つ","3つ","4つ","6つ"],a:1,
   e:"「？」で終わる部分も一つの文です。「、」は文の途中の区切りなので数えません。「…好きですか？」「…大好きです。」「…連れて行きます。」の3つです。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"雨がやんだ。外に出ると、空気がひんやりしていた。「きれいな虹だ！」と妹が言った。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"「　」の中の「！」は会話の区切りで、「…と妹が言った。」までで一つの文です。「雨がやんだ。」「…ひんやりしていた。」「「きれいな虹だ！」と妹が言った。」の3つです。"},

  {cat:0,q:"次の文章は、いくつの段落からできていますか。",
   s:"　毎朝、わたしは犬の散歩をする。近所の公園を一周するのが日課だ。\n　ある日、公園で小さな子ねこを見つけた。わたしは急いで家に連れて帰った。\n　今では、犬と子ねこはすっかり仲よしだ。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"段落は、行を変えて一字下げたところから始まります。一字下がっている行の頭が3か所あるので、3つの段落です。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"　毎朝、わたしは犬の散歩をする。近所の公園を一周するのが日課だ。\n　ある日、公園で小さな子ねこを見つけた。わたしは急いで家に連れて帰った。\n　今では、犬と子ねこはすっかり仲よしだ。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"「。」で終わるまとまりを数えます。1段落目に2つ、2段落目に2つ、3段落目に1つで、合計5つの文です。段落の数と文の数を混同しないようにしましょう。"},
  {cat:0,q:"段落の書き始め方として、正しいものはどれですか。",
   c:["行を変え、初めを一字下げて書く。","前の行に続けて書く。","一行あけて、行の頭から書く。","初めに「　」を付けて書く。"],a:0,
   e:"段落の初めは、行を変えて（改行して）一字下げて書きます。"},
  {cat:0,q:"「意味段落」の説明として、正しいものはどれですか。",
   c:["内容のつながりのうえから、いくつかの形式段落をひとまとまりにしたもの。","行を変え、一字下げて書き始めた一つ一つのまとまり。","「。」から次の「。」までのひと続きの言葉。","「　」で囲まれた会話の部分。"],a:0,
   e:"行を変えて一字下げた一つ一つのまとまりを「形式段落」、内容のつながりから形式段落をいくつかまとめたものを「意味段落」といいます。"},
  {cat:0,q:"次の文章に、必要なところへ句点「。」を付けると、いくつの文になりますか。",
   s:"朝起きると雪が積もっていた外は一面真っ白だったぼくはすぐに着がえて庭に飛び出した",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"朝起きると雪が積もっていた。／外は一面真っ白だった。／ぼくはすぐに着がえて庭に飛び出した。の3つの文になります。"},
  {cat:0,q:"次の文章は、いくつの文からできていますか。",
   s:"母は「早く寝なさい。」と言った。ぼくは小さな声で返事をした。",
   c:["1つ","2つ","3つ","4つ"],a:1,
   e:"「　」の中の「。」は会話の終わりで、「…と言った。」までで一つの文です。「母は「早く寝なさい。」と言った。」「ぼくは小さな声で返事をした。」の2つです。"},

  // ---- 文節
  {cat:1,q:"文節の切れ目を見つける方法として、正しいものはどれですか。",
   c:["「ネ」「サ」「ヨ」を入れてみて、不自然にならないところで区切る。","「、」が付くところだけで区切る。","漢字とひらがなの境目で区切る。","意味のわかる最も小さな言葉ごとに区切る。"],a:0,
   e:"「ぼくはネ／友だちとネ／公園にネ／行った。」のように、「ネ・サ・ヨ」を入れて自然なところが文節の切れ目です。いちばん下の選択肢は単語の分け方です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"ぼくは友だちと公園に行った。",
   c:["ぼくは/友だちと/公園に/行った。","ぼく/は/友だち/と/公園/に/行った。","ぼくは/友だちと公園に/行った。","ぼくは/友だちと/公園に/行っ/た。"],a:0,
   e:"ぼくはネ／友だちとネ／公園にネ／行った。の4文節です。「行っ/た」のように分けると発音が不自然になります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"朝の散歩は気分がよい。",
   c:["朝/の/散歩は/気分が/よい。","朝の/散歩は/気分が/よい。","朝の散歩は/気分が/よい。","朝の/散歩/は/気分/が/よい。"],a:1,
   e:"朝のネ／散歩はネ／気分がネ／よい。の4文節です。「の」「は」「が」は前の言葉にくっつけて一文節にします。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"わたしには妹が二人います。",
   c:["わたしに/は/妹が/二人/います。","わたしには/妹が/二人います。","わたしには/妹が/二人/います。","わたし/には/妹/が/二人/います。"],a:2,
   e:"わたしにはネ／妹がネ／二人ネ／います。の4文節です。「二人」と「います」の間にも「ネ」が入ります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"本を読んでいる。",
   c:["本を/読んでいる。","本/を/読んで/いる。","本を/読ん/でいる。","本を/読んで/いる。"],a:3,
   e:"本をネ／読んでネ／いる。の3文節です。「〜て（で）いる」は「〜て（で）」と「いる」の二つの文節に分かれます。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"わたしの夢は医者になることだ。",
   c:["わたしの/夢は/医者に/なる/ことだ。","わたしの/夢は/医者に/なることだ。","わたしの/夢は/医者になる/ことだ。","わたしの/夢/は/医者に/なる/ことだ。"],a:0,
   e:"「〜こと」の前は文節の切れ目になります。わたしのネ／夢はネ／医者にネ／なるネ／ことだ。の5文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"その話はとてもおもしろかった。",
   c:["その話は/とても/おもしろかった。","その/話は/とても/おもしろかっ/た。","その/話は/とても/おもしろかった。","その/話/は/とても/おもしろかった。"],a:2,
   e:"そのネ／話はネ／とてもネ／おもしろかった。の4文節です。「その」だけでも一文節になります。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"弟は毎朝早く起きる。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"弟は／毎朝／早く／起きる。の4文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"庭に小さな赤い花が咲いている。",
   c:["4つ","5つ","6つ","7つ"],a:2,
   e:"庭に／小さな／赤い／花が／咲いて／いる。の6文節です。「咲いて／いる」で二つに分かれる点に注意しましょう。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"春休みに祖父の家へ遊びに行った。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"春休みに／祖父の／家へ／遊びに／行った。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"兄は部屋で静かに音楽を聞いていた。",
   c:["5つ","6つ","7つ","8つ"],a:1,
   e:"兄は／部屋で／静かに／音楽を／聞いて／いた。の6文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"泳ぐことができる。",
   c:["1つ","2つ","3つ","4つ"],a:2,
   e:"泳ぐ／ことが／できる。の3文節です。「〜こと」の前で区切ります。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"ノートに名前を書いておくことを忘れないでください。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"ノートに／名前を／書いて／おく／ことを／忘れないで／ください。の7文節です。「〜て（で）おく」「〜て（で）ください」も二つの文節に分かれます。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["空が/青い。","鳥が/空を/飛ぶ。","母と/買い物に/行く。","先生に/ほめ/られた。"],a:3,
   e:"「ほめられた」は「ほめ」と「られた」の間に「ネ」を入れると不自然なので、一つの文節です。正しくは「先生に/ほめられた。」です。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["雨が/降って/きた。","本を/読んで/みる。","手紙を/書き/始める。","窓を/開けて/おく。"],a:2,
   e:"「書き始める」は二つの言葉が結び付いて一語になった言葉（複合語）なので、一つの文節です。「〜て（で）きた」「〜て（で）みる」「〜て（で）おく」は二つの文節に分かれます。"},

  {cat:1,q:"「ネ」を入れて文節の切れ目を確かめたとき、正しく入れられているものはどれですか。",
   c:["妹ネはネピアノをネひく。","妹はネピアノをネひく。","妹はネピアノネをひく。","妹はネピアノをネひネく。"],a:1,
   e:"「妹はネ／ピアノをネ／ひく。」が自然な言い方です。「妹ネは」「ピアノネを」「ひネく」は不自然なので、そこは文節の切れ目ではありません。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"今日は朝から雨が降っている。",
   c:["今日は/朝から/雨が/降っている。","今日は/朝から/雨が/降って/いる。","今日/は/朝/から/雨/が/降って/いる。","今日は朝から/雨が/降って/いる。"],a:1,
   e:"今日はネ／朝からネ／雨がネ／降ってネ／いる。の5文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"静かな部屋で手紙を書いた。",
   c:["静か/な/部屋で/手紙を/書いた。","静かな/部屋で/手紙を/書い/た。","静かな/部屋で/手紙を/書いた。","静かな部屋で/手紙を/書いた。"],a:2,
   e:"静かなネ／部屋でネ／手紙をネ／書いた。の4文節です。「静かな」で一文節になります。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"数学はいちばん苦手な教科です。",
   c:["数学は/いちばん/苦手な/教科/です。","数学は/いちばん/苦手な/教科です。","数学は/いちばん苦手な/教科です。","数学/は/いちばん/苦手な/教科です。"],a:1,
   e:"数学はネ／いちばんネ／苦手なネ／教科です。の4文節です。「教科ネです」は不自然なので「教科です」で一文節です。"},
  {cat:1,q:"次の文を正しく文節に区切ったものはどれですか。",
   s:"姉は新しい服を買ってもらった。",
   c:["姉は/新しい/服を/買ってもらった。","姉は/新しい/服を/買って/もら/った。","姉は/新しい服を/買って/もらった。","姉は/新しい/服を/買って/もらった。"],a:3,
   e:"姉はネ／新しいネ／服をネ／買ってネ／もらった。の5文節です。「〜て（で）もらう」も二つの文節に分かれます。"},
  {cat:1,q:"次のうち、二つの文節に分けられるものはどれですか。",
   c:["行かなかった","書き始めた","走っている","美しかった"],a:2,
   e:"「走っている」は「走ってネ／いる」と分けられるので2文節です。「書き始めた」は複合語を含む一文節、「行かなかった」「美しかった」も途中に「ネ」が入らないので一文節です。"},
  {cat:1,q:"文節の区切り方が正しくないものはどれですか。",
   c:["弟は/ゆっくり/階段を/のぼった。","姉が/わたしの/弁当を/届けて/くれた。","明日の/朝に/新幹線で/出かける/予定だ。","発音は/もっと/はっきりと/大きな声で/言え。"],a:3,
   e:"「大きな声で」は「大きなネ／声でネ」と分けられるので、正しくは「発音は/もっと/はっきりと/大きな/声で/言え。」です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"ぼくは毎日犬と散歩に行く。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"ぼくは／毎日／犬と／散歩に／行く。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"明日はおそらく晴れるだろう。",
   c:["3つ","4つ","5つ","6つ"],a:0,
   e:"明日は／おそらく／晴れるだろう。の3文節です。「晴れるネだろう」は不自然なので、「晴れるだろう」で一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"彼は次々と新記録を出した。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"彼は／次々と／新記録を／出した。の4文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"この春からは中学一年生になる。",
   c:["3つ","4つ","5つ","6つ"],a:1,
   e:"この／春からは／中学一年生に／なる。の4文節です。「春からは」はひとまとまりで一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"毎日二時間も勉強する。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"毎日／二時間も／勉強する。の3文節です。「勉強する」は一文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"庭の梅の花がきれいに咲いた。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"庭の／梅の／花が／きれいに／咲いた。の5文節です。"},
  {cat:1,q:"次の文は、いくつの文節に区切ることができますか。",
   s:"友だちの家で数学の勉強をする。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"友だちの／家で／数学の／勉強を／する。の5文節です。「勉強を」と「する」の間には「ネ」が入ります。"},

  // ---- 単語
  {cat:2,q:"「単語」の説明として正しいものはどれですか。",
   c:["文節をさらに細かく分けた、意味をもつ最も小さな言葉の単位。","意味や発音が不自然にならない程度に、文を短く区切ったもの。","「。」などで終わる、ひと続きの言葉。","文章を、内容のまとまりごとに区切ったもの。"],a:0,
   e:"単語は、言葉の単位の中でいちばん小さいものです。ほかの選択肢は順に「文節」「文」「段落」の説明です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"花が咲いた。",
   c:["花が/咲いた。","花/が/咲いた。","花/が/咲い/た。","花/が/咲/い/た。"],a:2,
   e:"花／が／咲い／た。の4単語です。「咲いた」は「咲い」と、過去を表す「た」の二つの単語に分かれます。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"妹の部屋は広い。",
   c:["妹/の/部屋/は/広い。","妹の/部屋は/広い。","妹/の/部屋/は/広/い。","妹/の部屋/は/広い。"],a:0,
   e:"妹／の／部屋／は／広い。の5単語です。「広い」はこれ以上分けると意味がなくなるので一単語です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"大きな鳥が屋根にとまる。",
   c:["大き/な/鳥/が/屋根/に/とまる。","大きな/鳥が/屋根に/とまる。","大きな/鳥/が/屋根に/とまる。","大きな/鳥/が/屋根/に/とまる。"],a:3,
   e:"大きな／鳥／が／屋根／に／とまる。の6単語です。「大きな」は一単語です。"},
  {cat:2,q:"「知らなかった」を正しく単語に区切ったものはどれですか。",
   c:["知ら/なかった","知らなかっ/た","知ら/なかっ/た","知/ら/なかっ/た"],a:2,
   e:"知ら／なかっ／た　の3単語です。「知ら」＋打ち消しの「なかっ」＋過去の「た」に分かれます。"},
  {cat:2,q:"「食べました」を正しく単語に区切ったものはどれですか。",
   c:["食べ/ました","食べまし/た","食/べ/まし/た","食べ/まし/た"],a:3,
   e:"食べ／まし／た　の3単語です。「まし」はていねいな言い方の「ます」が形を変えたもの、「た」は過去を表します。"},
  {cat:2,q:"「読んでいる」を正しく単語に区切ったものはどれですか。",
   c:["読ん/で/いる","読んで/いる","読/んで/いる","読ん/でいる"],a:0,
   e:"読ん／で／いる　の3単語です。文節に分けると「読んで／いる」の2文節ですが、単語ではさらに「読ん」と「で」に分かれます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"わたしは学校へ行った。",
   c:["4つ","5つ","6つ","7つ"],a:2,
   e:"わたし／は／学校／へ／行っ／た。の6単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"ぼくは自転車で学校へ行く。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"ぼく／は／自転車／で／学校／へ／行く。の7単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"夏休みに海で泳いだ。",
   c:["5つ","6つ","7つ","8つ"],a:1,
   e:"夏休み／に／海／で／泳い／だ。の6単語です。「夏休み」は複合語なので一単語。「泳いだ」の「だ」は過去の「た」がにごったものです。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"道路に飛び出すと危ない。",
   c:["4つ","5つ","6つ","7つ"],a:1,
   e:"道路／に／飛び出す／と／危ない。の5単語です。「飛び出す」は複合語なので一単語として数えます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"富士山がよく見える場所でお茶を飲む。",
   c:["8語","9語","10語","11語"],a:1,
   e:"富士山／が／よく／見える／場所／で／お茶／を／飲む。の9単語です。「お茶」は分けずに一単語として数えます。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"作文を書き直す。",
   c:["2つ","3つ","4つ","5つ"],a:1,
   e:"作文／を／書き直す。の3単語です。「書き直す」は「書く＋直す」が結び付いた複合語なので一単語です。"},
  {cat:2,q:"一つの単語であるものはどれですか。",
   c:["春の休み","休みの日","春休み","春が来た"],a:2,
   e:"「春休み」は「春＋休み」が結び付いてできた複合語で、一単語です。ほかはいずれも二つ以上の単語からできています。"},
  {cat:2,q:"一つの単語ではない（二つ以上の単語でできている）ものはどれですか。",
   c:["書き直す","走り出す","雨上がり","読んでいる"],a:3,
   e:"「読んでいる」は読ん／で／いる　の3単語です。ほかの三つは、二つの言葉が結び付いて一語になった複合語です。"},

  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"太陽は東から昇る。",
   c:["太陽は/東から/昇る。","太陽/は/東/から/昇る。","太/陽/は/東/から/昇る。","太陽/は/東から/昇る。"],a:1,
   e:"太陽／は／東／から／昇る。の5単語です。「太陽」は分けると意味がなくなるので一単語です。"},
  {cat:2,q:"次の文を正しく単語に区切ったものはどれですか。",
   s:"九時から走り始める。",
   c:["九時/から/走り/始める。","九/時/から/走り始める。","九時から/走り始める。","九時/から/走り始める。"],a:3,
   e:"九時／から／走り始める。の3単語です。「走り始める」は「走る＋始める」が結び付いた複合語なので一単語です。"},
  {cat:2,q:"「行かない」を正しく単語に区切ったものはどれですか。",
   c:["行かない","行/かない","行か/ない","行かな/い"],a:2,
   e:"行か／ない　の2単語です。「ない」は打ち消しの意味をそえる単語です。"},
  {cat:2,q:"「見ました」を正しく単語に区切ったものはどれですか。",
   c:["見/まし/た","見/ました","見まし/た","見ました"],a:0,
   e:"見／まし／た　の3単語です。「食べました」と同じ形です。"},
  {cat:2,q:"「遊んだ」を正しく単語に区切ったものはどれですか。",
   c:["遊んだ","遊/んだ","遊ん/だ","遊/ん/だ"],a:2,
   e:"遊ん／だ　の2単語です。「だ」は過去の「た」がにごったものです。"},
  {cat:2,q:"「書いてください」を正しく単語に区切ったものはどれですか。",
   c:["書いて/ください","書い/て/ください","書い/てください","書/いて/くだ/さい"],a:1,
   e:"書い／て／ください　の3単語です。文節では「書いて／ください」の2文節です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"荷物を部屋に運ぶ。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"荷物／を／部屋／に／運ぶ。の5単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"ぼくは自転車からおりる。",
   c:["3つ","4つ","5つ","6つ"],a:2,
   e:"ぼく／は／自転車／から／おりる。の5単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"妹はかぜで学校を休む。",
   c:["5つ","6つ","7つ","8つ"],a:2,
   e:"妹／は／かぜ／で／学校／を／休む。の7単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"妹はずっとわたしの横にいる。",
   c:["6つ","7つ","8つ","9つ"],a:2,
   e:"妹／は／ずっと／わたし／の／横／に／いる。の8単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"今日は遠くの山がよく見える。",
   c:["6つ","7つ","8つ","9つ"],a:2,
   e:"今日／は／遠く／の／山／が／よく／見える。の8単語です。"},
  {cat:2,q:"次の文は、いくつの単語に分けることができますか。",
   s:"わたしは学校から帰ると毎日犬の散歩に行く。",
   c:["10語","11語","12語","13語"],a:2,
   e:"わたし／は／学校／から／帰る／と／毎日／犬／の／散歩／に／行く。の12単語です。"},
  {cat:2,q:"一つの単語であるものはどれですか。",
   c:["休みの時間","休み時間","休んだ時間","時間が休み"],a:1,
   e:"「休み時間」は「休み＋時間」が結び付いてできた複合語で、一単語です。"},
  {cat:2,q:"次の文を単語に分けたとき、それだけでは意味がわからない単語はどれですか。",

  id:"u2", no:2, name:"文の成分・主語と述語", sub:"文の成分・主語・述語・主述の関係",
  scope:"出題範囲：文の成分の五種類（見分けの基本）、主語、述語、主語・述語の関係（四つの型・倒置・省略）。単元1の文節の知識も使います。",
  cats:["文の成分","主語","述語","主語・述語の関係"],
  qs:[
  {cat:0,q:"文の成分の種類として、当てはまらないものはどれですか。",
   c:["主語", "修飾語", "独立語", "単語"],a:3,
   e:"文の成分は、主語・述語・修飾語・接続語・独立語の五種類です。「単語」は言葉の単位の名前です。"},
  {cat:0,q:"文の成分は、どの言葉の単位ごとに考えますか。",
   c:["文節", "単語", "文", "段落"],a:0,
   e:"文を文節に区切り、それぞれの文節が文の中でどんな働きをしているかで、文の成分に分けます。"},
  {cat:0,q:"次の文の「ほら」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「ほら」は、ほかの文節と直接の関係がなく、相手の注意を引く言葉なので独立語です。"},
  {cat:0,q:"次の文の「暖かかったので」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "修飾語", "接続語", "独立語"],a:2,
   e:"「暖かかったので」は、花が咲いた理由を示して、あとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「白い」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「白い」は、「どんな花か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「咲いた」は、どの文の成分に当たりますか。",
   s:"ほら、暖かかったので、白い花が咲いた。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「咲いた」は、「花が」に対して「どうする」に当たるので述語です。"},
  {cat:0,q:"次の文の「入れる」は、どの文の成分に当たりますか。",
   s:"かごに野菜を入れる。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「入れる」は「どうする」に当たり、文の終わりにあるので述語です。"},
  {cat:0,q:"次の文の「まあ」は、どの文の成分に当たりますか。",
   s:"まあ、大きなかばんですね。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「まあ」は感動を表し、ほかの文節と直接関係していないので独立語です。"},
  {cat:0,q:"次の文の「ゆっくりと」は、どの文の成分に当たりますか。",
   s:"鳥がゆっくりと飛び立った。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「ゆっくりと」は、「どのように飛び立ったか」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「暗いから」は、どの文の成分に当たりますか。",
   s:"暗いから、よく見えません。",
   c:["主語", "修飾語", "接続語", "独立語"],a:2,
   e:"「暗いから」は、よく見えない理由を示してあとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「雪が」は、どの文の成分に当たりますか。",
   s:"屋根の上に雪が積もる。",
   c:["主語", "述語", "修飾語", "接続語"],a:0,
   e:"「雪が」は、「何が積もるのか」の「何が」に当たるので主語です。"},
  {cat:0,q:"次の文の「言葉の」は、どの文の成分に当たりますか。",
   s:"辞書で言葉の意味を調べる。",
   c:["主語", "述語", "修飾語", "接続語"],a:2,
   e:"「言葉の」は、「何の意味か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「おや」は、どの文の成分に当たりますか。",
   s:"おや、きみも来ていたのか。",
   c:["主語", "修飾語", "接続語", "独立語"],a:3,
   e:"「おや」は驚きを表し、ほかの文節と直接関係していないので独立語です。"},
  {cat:0,q:"「どんな」「どのように」などを表し、あとの文節をくわしく説明する文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "独立語"],a:2,
   e:"あとの文節の意味をくわしく説明する文節を修飾語といいます。"},
  {cat:0,q:"「独立語」の説明として正しいものはどれですか。",
   c:["ほかの文節と直接の関係がなく、比較的独立している文節。", "理由や条件を示したり、前後をつないだりする文節。", "「何が（だれが）」に当たる文節。", "「どうする」「どんなだ」などに当たる文節。"],a:0,
   e:"独立語は、感動・呼びかけ・応答・あいさつなどを表し、ふつう文の初めにきます。ほかの選択肢は順に接続語・主語・述語の説明です。"},
  {cat:0,q:"「接続語」の説明として正しいものはどれですか。",
   c:["「何が（だれが）」に当たる文節。", "理由や条件を示したり、前後の文や文節をつないだりする文節。", "「どのように」などとあとの文節をくわしく説明する文節。", "ほかの文節と直接の関係がない文節。"],a:1,
   e:"「寒いから、」（理由）や「だから、」（前の文を受けてつなぐ）のような文節が接続語です。"},
  {cat:1,q:"「主語」の説明として正しいものはどれですか。",
   c:["文の中で「何が（だれが）」に当たる文節。", "文の中で「どうする」「どんなだ」「何だ」などに当たる文節。", "「どのように」などとあとの文節をくわしく説明する文節。", "呼びかけや応答などを表す文節。"],a:0,
   e:"主語は「何が（だれが）」に当たる文節です。二つめは述語、三つめは修飾語、四つめは独立語の説明です。"},
  {cat:1,q:"主語の文節の形として、ふつう当てはまらないものはどれですか。",
   c:["弟が", "弟は", "弟も", "弟を"],a:3,
   e:"主語には「〜が」「〜は」のほか、「〜も」「〜こそ」「〜さえ」などの形もあります。「弟を」は「何を」に当たるので主語ではありません。"},
  {cat:1,q:"文の主語を見つけるときの手順として、適切なものはどれですか。",
   c:["まず述語を見つけ、それに対して「何が（だれが）」に当たる文節を探す。", "文の初めにある文節を主語とする。", "「は」が付いている文節を必ず主語とする。", "文の最後にある文節を主語とする。"],a:0,
   e:"述語は文の最後にあることが多いので、先に述語を見つけてから「何が（だれが）○○なのか」と考えると、主語を正しく見つけられます。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"カタカナは漢字の一部から作られた。",
   c:["カタカナは", "漢字の", "一部から", "作られた"],a:0,
   e:"述語「作られた」に対して、「何が作られたのか」→「カタカナは」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"庭のあじさいの花もとてもきれいだ。",
   c:["庭の", "あじさいの", "花も", "きれいだ"],a:2,
   e:"述語「きれいだ」に対して、「何がきれいなのか」→「花も」が主語です。「〜も」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今朝はあさがおの芽が出たよ。",
   c:["今朝は", "あさがおの", "芽が", "出たよ"],a:2,
   e:"述語「出たよ」に対して、「何が出たのか」→「芽が」が主語です。「今朝は」は「は」が付いていますが、いつなのかを表していて主語ではありません。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"中学生こそ対象としてふさわしい。",
   c:["中学生こそ", "対象と", "して", "ふさわしい"],a:0,
   e:"述語「ふさわしい」に対して、「だれがふさわしいのか」→「中学生こそ」が主語です。「〜こそ」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"明日はわたしもいっしょに行きます。",
   c:["明日は", "わたしも", "いっしょに", "行きます"],a:1,
   e:"述語「行きます」に対して、「だれが行くのか」→「わたしも」が主語です。「明日は」はいつなのかを表しています。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"父さえその答えを知らなかった。",
   c:["父さえ", "その", "答えを", "知らなかった"],a:0,
   e:"述語「知らなかった」に対して、「だれが知らなかったのか」→「父さえ」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"弟の机の上に本がある。",
   c:["弟の", "机の", "上に", "本が"],a:3,
   e:"述語「ある」に対して、「何があるのか」→「本が」が主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今日は午後から雨が降る。",
   c:["今日は", "午後から", "雨が", "降る"],a:2,
   e:"述語「降る」に対して、「何が降るのか」→「雨が」が主語です。「今日は」は「は」が付いていても主語ではありません。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"きみだってきっと選手になれる。",
   c:["きみだって", "きっと", "選手に", "なれる"],a:0,
   e:"述語「なれる」に対して、「だれがなれるのか」→「きみだって」が主語です。「〜だって」の形の主語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくの兄は東京の大学生だ。",
   c:["ぼくの", "兄は", "東京の", "大学生だ"],a:1,
   e:"述語「大学生だ」に対して、「だれが大学生なのか」→「兄は」が主語です。「ぼくの」は「だれの兄か」を説明しています。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"大きな犬が庭で何度もほえた。",
   c:["大きな", "犬が", "庭で", "ほえた"],a:1,
   e:"述語「ほえた」に対して、「何がほえたのか」→「犬が」が主語です。"},
  {cat:1,q:"主語が省略されている文はどれですか。",
   c:["鳥が鳴く。", "昨日、山に登った。", "花がきれいだ。", "弟は中学生だ。"],a:1,
   e:"「昨日、山に登った。」には「だれが」に当たる文節がありません。主語は、わかりきっている場合などに省略されることがあります。"},
  {cat:1,q:"主語が省略されている文はどれですか。",
   c:["今朝はあさがおの芽が出た。", "雨が降る。", "パリに三年間留学する。", "わたしは人影を見た。"],a:2,
   e:"「パリに三年間留学する。」には「だれが留学するのか」に当たる文節がありません。"},
  {cat:2,q:"「述語」の説明として正しいものはどれですか。",
   c:["「どうする」「どんなだ」「何だ」「ある（いる・ない）」に当たる文節。", "「何が（だれが）」に当たる文節。", "理由や条件を示してあとにつなぐ文節。", "ほかの文節と直接の関係がない文節。"],a:0,
   e:"述語は、主語の動作・状態・性質・存在などを表す文節です。"},
  {cat:2,q:"述語は、ふつう文のどこにありますか。",
   c:["文の初め", "主語のすぐあと", "文の終わり", "文の真ん中"],a:2,
   e:"述語はふつう文の終わりにあります。ただし、倒置の文では文の終わりにこないこともあります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"白鳥が青い空を飛ぶ。",
   c:["白鳥が", "青い", "空を", "飛ぶ"],a:3,
   e:"「白鳥が」に対して「どうする」に当たる「飛ぶ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"わたしは窓から人影を見た。",
   c:["わたしは", "窓から", "人影を", "見た"],a:3,
   e:"「わたしは」に対して「どうした」に当たる「見た」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"ぼくの兄はきょうも元気だった。",
   c:["ぼくの", "兄は", "きょうも", "元気だった"],a:3,
   e:"「兄は」に対して「どんなだ」に当たる「元気だった」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"父さんはずっと二階にいる。",
   c:["父さんは", "ずっと", "二階に", "いる"],a:3,
   e:"「父さんは」に対して「いる」が述語です。存在を表す述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"この大きな魚はマグロだ。",
   c:["この", "大きな", "魚は", "マグロだ"],a:3,
   e:"「魚は」に対して「何だ」に当たる「マグロだ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"谷川の水はとても冷たい。",
   c:["谷川の", "水は", "とても", "冷たい"],a:3,
   e:"「水は」に対して「どんなだ」に当たる「冷たい」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"大きな船が港に入る。",
   c:["大きな", "船が", "港に", "入る"],a:3,
   e:"「船が」に対して「どうする」に当たる「入る」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"本当に楽しみだね、明日の運動会が。",
   c:["本当に", "楽しみだね", "明日の", "運動会が"],a:1,
   e:"「運動会が楽しみだね」の順序を入れかえた倒置の文です。述語は「楽しみだね」で、文の終わりにはありません。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"電池がない。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:3,
   e:"「ない」は存在を表すので、「ある（いる・ない）」に当たります。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"部屋があたたかい。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:1,
   e:"「あたたかい」は様子（状態）を表すので、「どんなだ」に当たります。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"ぼくが手紙を書く。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:0,
   e:"「書く」は動作を表すので、「どうする」に当たります。"},
  {cat:2,q:"述語が「どんなだ」に当たる文はどれですか。",
   c:["鳥が飛ぶ。", "空が青い。", "彼は学生だ。", "庭に池がある。"],a:1,
   e:"「青い」は様子を表すので「どんなだ」です。順に「どうする」「どんなだ」「何だ」「ある」です。"},
  {cat:2,q:"述語が「何だ」に当たる文はどれですか。",
   c:["弟が笑う。", "弟は小さい。", "弟は幼児だ。", "弟がいる。"],a:2,
   e:"「幼児だ」は「何だ」に当たります。「笑う」は「どうする」、「小さい」は「どんなだ」、「いる」は「ある（いる・ない）」です。"},
  {cat:2,q:"述語が「ある（いる・ない）」に当たる文はどれですか。",
   c:["机の上に本がある。", "兄が本を読む。", "この本はおもしろい。", "これは辞書だ。"],a:0,
   e:"「ある」は存在を表す述語です。"},
  {cat:3,q:"主語・述語の関係の基本の型として、当てはまらないものはどれですか。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何を―どうする"],a:3,
   e:"主語・述語の関係の基本の型は「何が―どうする」「何が―どんなだ」「何が―何だ」「何が―ある（いる・ない）」の四つです。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が泳ぐ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「泳ぐ」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が少ない。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「少ない」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"魚が名物だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「名物だ」は「何だ」に当たるので「何が―何だ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"庭に池がある。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「ある」は存在を表すので「何が―ある（いる・ない）」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"父は写真家だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「写真家だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"西の空が赤い。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「赤い」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"子供が砂場で遊ぶ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「遊ぶ」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"主語・述語の関係が、次の文と同じ型のものはどれですか。",
   s:"花が咲く。",
   c:["鳥が飛ぶ。", "空が青い。", "彼は学生だ。", "本がある。"],a:0,
   e:"「花が咲く。」は「何が―どうする」の型です。同じ型は「鳥が飛ぶ。」です。"},
  {cat:3,q:"主語・述語の関係が、次の文と同じ型のものはどれですか。",
   s:"この部屋は静かだ。",
   c:["鳥が飛ぶ。", "海が広い。", "姉は医者だ。", "猫がいる。"],a:1,
   e:"「静かだ」は様子を表すので「何が―どんなだ」の型です。同じ型は「海が広い。」です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"山のふもとに学校がある。",
   c:["山の―ふもとに", "ふもとに―ある", "学校が―ある", "山の―学校が"],a:2,
   e:"述語「ある」に対して、「何があるのか」→「学校が」。「学校が―ある」が主語・述語の関係です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"家には優しい祖父がいる。",
   c:["家には―いる", "祖父が―いる", "家には―祖父が", "優しい―祖父が"],a:1,
   e:"「だれがいるのか」→「祖父が」。「家には」は場所を表していて主語ではありません。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"ぼくは走る犬を見た。",
   c:["ぼくは―見た", "犬を―見た", "ぼくは―走る", "走る―犬を"],a:0,
   e:"文の述語は「見た」で、「だれが見たのか」→「ぼくは」。「ぼくは―見た」が主語・述語の関係です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"新しい家が丘の上に建った。",
   c:["新しい―家が", "家が―建った", "上に―建った", "丘の―上に"],a:1,
   e:"「何が建ったのか」→「家が」。「家が―建った」が主語・述語の関係です。"},
  {cat:3,q:"「倒置」の説明として正しいものはどれですか。",
   c:["ふつうの語順を入れかえ、強調したい部分を前に置く表現。", "主語を省略した表現。", "同じ言葉をくり返して強める表現。", "文を二つに分けて書く表現。"],a:0,
   e:"「運動会が楽しみだね。」を「楽しみだね、運動会が。」とするように、語順を入れかえて強調する表現を倒置といいます。"},
  {cat:3,q:"倒置の文はどれですか。",
   c:["運動会が楽しみだね。", "楽しみだね、運動会が。", "明日は運動会だ。", "運動会で走る。"],a:1,
   e:"ふつうは「運動会が楽しみだね。」の順序ですが、述語を先に置いて強調しています。"},
  {cat:3,q:"次の倒置の文を、ふつうの語順に直したものはどれですか。",
   s:"咲いたよ、きれいな花が。",
   c:["きれいな花が咲いたよ。", "花がきれいに咲いたよ。", "きれいな花よ、咲いた。", "咲いた花がきれいだよ。"],a:0,
   e:"主語「花が」と述語「咲いたよ」の順序をもとにもどし、「きれいな花が咲いたよ。」とします。言葉の形は変えずに順序だけを直します。"},
  {cat:3,q:"レストランで「ぼくはカレー。」と注文するとき、省略されている文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "独立語"],a:1,
   e:"「ぼくはカレー（にします）。」のように、述語が省略された形です。主語だけでなく述語が省略されることもあります。"},
  {cat:3,q:"自己紹介で「山田です。」と言うとき、省略されている文の成分はどれですか。",
   c:["主語", "述語", "修飾語", "接続語"],a:0,
   e:"「（わたしは）山田です。」のように、わかりきっている主語が省略されています。"},
  {cat:0,q:"次の文の「ねえ」は、どの文の成分に当たりますか。",
   s:"ねえ、明日はいっしょに帰ろう。",
   c:["独立語", "接続語", "修飾語", "述語"],a:0,
   e:"呼びかけを表し、ほかの文節と直接の関係がないので独立語です。"},
  {cat:0,q:"次の文の「雨なので」は、どの文の成分に当たりますか。",
   s:"雨なので、試合は中止だ。",
   c:["接続語", "述語", "独立語", "主語"],a:0,
   e:"中止の理由を示してあとにつないでいるので接続語です。"},
  {cat:0,q:"次の文の「赤い」は、どの文の成分に当たりますか。",
   s:"赤い風船が空に上がる。",
   c:["修飾語", "独立語", "主語", "述語"],a:0,
   e:"「どんな風船か」をくわしく説明しているので修飾語です。"},
  {cat:0,q:"次の文の「妹が」は、どの文の成分に当たりますか。",
   s:"妹が歌を歌う。",
   c:["主語", "独立語", "修飾語", "述語"],a:0,
   e:"「だれが歌うのか」の「だれが」に当たるので主語です。"},
  {cat:0,q:"次の文の「長い」は、どの文の成分に当たりますか。",
   s:"冬の夜は長い。",
   c:["述語", "接続語", "主語", "独立語"],a:0,
   e:"「夜は」に対して「どんなだ」に当たるので述語です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"庭で弟が犬と遊ぶ。",
   c:["弟が", "庭で", "犬と", "遊ぶ"],a:0,
   e:"述語「遊ぶ」に対して、「だれが遊ぶのか」→「弟が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"毎朝、父は新聞を読む。",
   c:["父は", "毎朝", "新聞を", "読む"],a:0,
   e:"述語「読む」に対して、「だれが読むのか」→「父は」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくこそこのチームのキャプテンだ。",
   c:["ぼくこそ", "この", "チームの", "キャプテンだ"],a:0,
   e:"述語「キャプテンだ」に対して、「だれがキャプテンなのか」→「ぼくこそ」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"この町にも大きな公園がある。",
   c:["公園が", "この", "町にも", "大きな"],a:0,
   e:"述語「ある」に対して、「何があるのか」→「公園が」です。「町にも」は場所を表しています。"},
  {cat:1,q:"主語がない文はどれですか。",
   c:["早く寝なさい。", "母が料理を作る。", "空が青い。", "兄は高校生だ。"],a:0,
   e:"「早く寝なさい。」には「だれが」に当たる文節がありません。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"母は台所で料理を作る。",
   c:["作る", "母は", "台所で", "料理を"],a:0,
   e:"「母は」に対して「どうする」に当たる「作る」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"あの人がぼくの先生だ。",
   c:["先生だ", "あの", "人が", "ぼくの"],a:0,
   e:"「人が」に対して「何だ」に当たる「先生だ」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"夕焼けの空がとても美しい。",
   c:["美しい", "夕焼けの", "空が", "とても"],a:0,
   e:"「空が」に対して「どんなだ」に当たる「美しい」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"公園に大きな木がある。",
   c:["ある", "公園に", "大きな", "木が"],a:0,
   e:"「木が」に対して「ある」が述語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"走れ、ゴールまでもっと速く。",
   c:["走れ", "ゴールまで", "もっと", "速く"],a:0,
   e:"「もっと速く走れ」の語順を入れかえた倒置の文です。述語は「走れ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"今夜は月が明るい。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「明るい」は様子を表すので「何が―どんなだ」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"弟は小学生だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「小学生だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"机の上に本がない。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「ない」は存在しないことを表すので「何が―ある（いる・ない）」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"庭で鳥が鳴く。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:0,
   e:"「鳴く」は動作を表すので「何が―どうする」です。"},
  {cat:3,q:"次の文で、主語・述語の関係にある文節の組み合わせはどれですか。",
   s:"赤い屋根の家が見える。",
   c:["家が ― 見える", "赤い ― 屋根の", "屋根の ― 家が", "赤い ― 見える"],a:0,
   e:"「何が見えるのか」→「家が」。「家が―見える」が主語・述語の関係です。"},
  {cat:0,q:"次の文の「はい」は、どの文の成分に当たりますか。",
   s:"はい、それはぼくの本です。",
   c:["独立語", "修飾語", "主語", "接続語"],a:0,
   e:"応答を表し、ほかの文節と直接関係がないので独立語です。"},
  {cat:0,q:"次の文の「疲れたので」は、どの文の成分に当たりますか。",
   s:"疲れたので、少し休もう。",
   c:["接続語", "修飾語", "独立語", "述語"],a:0,
   e:"休む理由を示してあとにつないでいます。"},
  {cat:0,q:"次の文の「父の」は、どの文の成分に当たりますか。",
   s:"父の車は青い。",
   c:["修飾語", "主語", "独立語", "接続語"],a:0,
   e:"「だれの車か」をくわしく説明しています。"},
  {cat:0,q:"次の文の「運動会だ」は、どの文の成分に当たりますか。",
   s:"明日は運動会だ。",
   c:["述語", "主語", "独立語", "接続語"],a:0,
   e:"「何だ」に当たるので述語です。"},
  {cat:0,q:"次の文の「先生が」は、どの文の成分に当たりますか。",
   s:"先生が教室に入る。",
   c:["主語", "修飾語", "接続語", "独立語"],a:0,
   e:"「だれが入るのか」の「だれが」に当たります。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"昨日、兄が新しい自転車を買った。",
   c:["兄が", "昨日", "新しい", "自転車を"],a:0,
   e:"述語「買った」に対して「だれが買ったのか」→「兄が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"わたしにも小さな妹がいる。",
   c:["妹が", "わたしにも", "小さな", "いる"],a:0,
   e:"述語「いる」に対して「だれがいるのか」→「妹が」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"川の水はとてもきれいだ。",
   c:["水は", "川の", "とても", "きれいだ"],a:0,
   e:"述語「きれいだ」に対して「何がきれいなのか」→「水は」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"ぼくだけが答えを知っている。",
   c:["ぼくだけが", "答えを", "知って", "いる"],a:0,
   e:"「だれが知っているのか」→「ぼくだけが」です。"},
  {cat:1,q:"次の文の主語はどれですか。",
   s:"今日は妹も母と出かけた。",
   c:["妹も", "今日は", "母と", "出かけた"],a:0,
   e:"「だれが出かけたのか」→「妹も」です。「〜も」の形の主語です。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"弟は毎朝牛乳を飲む。",
   c:["飲む", "弟は", "毎朝", "牛乳を"],a:0,
   e:"「弟は」に対して「どうする」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"この町の冬はとても寒い。",
   c:["寒い", "この", "町の", "冬は"],a:0,
   e:"「冬は」に対して「どんなだ」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"わたしの父は町の警察官だ。",
   c:["警察官だ", "わたしの", "父は", "町の"],a:0,
   e:"「父は」に対して「何だ」に当たります。"},
  {cat:2,q:"次の文の述語はどれですか。",
   s:"放課後の教室には誰もいない。",
   c:["いない", "放課後の", "教室には", "誰も"],a:0,
   e:"「誰も」に対して「いない」が述語です。"},
  {cat:2,q:"次の文の述語は、どれに当たりますか。",
   s:"庭で犬が走る。",
   c:["どうする", "どんなだ", "何だ", "ある（いる・ない）"],a:0,
   e:"「走る」は動作を表すので「どうする」です。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"バラの花は美しい。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:1,
   e:"「美しい」は様子を表します。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"この建物は図書館だ。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:2,
   e:"「図書館だ」は「何だ」に当たります。"},
  {cat:3,q:"次の文の主語・述語の関係は、どの型に当たりますか。",
   s:"公園に子どもがいる。",
   c:["何が―どうする", "何が―どんなだ", "何が―何だ", "何が―ある（いる・ない）"],a:3,
   e:"「いる」は存在を表します。"},
  {cat:3,q:"次の倒置の文を、ふつうの語順に直したものはどれですか。",
   s:"行こうよ、一緒に。",
   c:["一緒に行こうよ。", "一緒に行くよ。", "行こう、一緒に。", "一緒によ、行こう。"],a:0,
   e:"修飾語「一緒に」を述語の前にもどします。"},
  {cat:3,q:"倒置の文はどれですか。",
   c:["きれいだなあ、この花は。", "この花はきれいだなあ。", "この花を見る。", "きれいな花だ。"],a:0,
   e:"主語「この花は」と述語「きれいだなあ」の順序が入れかわっています。"}
  ]
},
{
  id:"u3", no:3, name:"修飾語・接続語・独立語", sub:"修飾・被修飾の関係・接続語・独立語",
  scope:"出題範囲：修飾語と被修飾語、連体修飾語・連用修飾語、接続語、独立語。単元1・2の内容（文節・主語・述語）も使います。",
  cats:["修飾語と被修飾語", "連体修飾語・連用修飾語", "接続語", "独立語"],
  qs:[
  {cat:0,q:"「修飾語」の説明として正しいものはどれですか。",
   c:["あとにくる文節をくわしく説明する文節。", "修飾語によってくわしく説明される文節。", "「何が（だれが）」に当たる文節。", "ほかの文節と直接の関係がない文節。"],a:0,
   e:"修飾語はあとの文節をくわしく説明します。説明される側の文節は「被修飾語」といいます。"},
  {cat:0,q:"「被修飾語」の説明として正しいものはどれですか。",
   c:["修飾語によってくわしく説明される文節。", "あとにくる文節をくわしく説明する文節。", "理由や条件を示してあとにつなぐ文節。", "「どうする」「どんなだ」に当たる文節。"],a:0,
   e:"「小さな声」の「声」のように、修飾語にくわしく説明される文節を被修飾語といいます。"},
  {cat:0,q:"修飾語と被修飾語の位置について、正しい説明はどれですか。",
   c:["修飾語はふつう被修飾語より前にあるが、すぐ前にあるとは限らない。", "修飾語は必ず被修飾語のすぐ前にある。", "修飾語は必ず文の初めにある。", "修飾語は必ず被修飾語よりあとにある。"],a:0,
   e:"「しっかりと地面にしるしを付ける。」の「しっかりと」→「付ける」のように、離れていることもあります。"},
  {cat:0,q:"次の文で、「ゆっくり」が修飾している文節はどれですか。",
   s:"赤い車が坂道をゆっくり走り出した。",
   c:["走り出した", "赤い", "車が", "坂道を"],a:0,
   e:"「どのように走り出したか」→「ゆっくり」。被修飾語は「走り出した」です。"},
  {cat:0,q:"次の文で、「大きな」が修飾している文節はどれですか。",
   s:"大きな手で白いボールをつかむ。",
   c:["手で", "白い", "ボールを", "つかむ"],a:0,
   e:"「どんな手か」→「大きな」。被修飾語は「手で」です。"},
  {cat:0,q:"次の文で、「とても」が修飾している文節はどれですか。",
   s:"この部屋は昼でもとても明るい。",
   c:["明るい", "この", "部屋は", "昼でも"],a:0,
   e:"「どのくらい明るいか」→「とても」。被修飾語は「明るい」です。"},
  {cat:0,q:"次の文で、「ころころ」が修飾している文節はどれですか。",
   s:"小さな石が坂をころころ転がる。",
   c:["転がる", "小さな", "石が", "坂を"],a:0,
   e:"「どのように転がるか」→「ころころ」。"},
  {cat:0,q:"次の文で、「暑い」が修飾している文節はどれですか。",
   s:"夏は暑い日が毎日続く。",
   c:["日が", "夏は", "毎日", "続く"],a:0,
   e:"「どんな日か」→「暑い」。被修飾語は「日が」です。"},
  {cat:0,q:"次の文で、「しっかりと」が修飾している文節はどれですか。",
   s:"しっかりと地面に大きなしるしを付ける。",
   c:["付ける", "地面に", "大きな", "しるしを"],a:0,
   e:"「どのように付けるか」→「しっかりと」。修飾語と被修飾語が離れている例です。"},
  {cat:0,q:"次の文で、「すいかの」が修飾している文節はどれですか。",
   s:"春に畑ですいかの苗を植える。",
   c:["苗を", "春に", "畑で", "植える"],a:0,
   e:"「何の苗か」→「すいかの」。被修飾語は「苗を」です。"},
  {cat:0,q:"次の文で、「見た」を修飾していない文節はどれですか。",
   s:"ぼくは昨日公園で大きな犬を見た。",
   c:["大きな", "昨日", "公園で", "犬を"],a:0,
   e:"「大きな」は「犬を」を修飾しています。「昨日」「公園で」「犬を」はどれも「見た」を修飾しています。"},
  {cat:1,q:"「連体修飾語」の説明として正しいものはどれですか。",
   c:["「何」を表す、物事の名前を表す言葉（体言）を修飾する修飾語。", "「どうする」「どんなだ」を表す言葉（用言）を修飾する修飾語。", "理由や条件を示す文節。", "ほかの文節と直接関係のない文節。"],a:0,

過ごしやすい]。[③桜の咲く春]、わたしはその季節がいちばん好きだ。","qs":[{"m":"①","q":"①「春と秋は」は、文の成分として何に当たりますか。","c":["主部","述部","修飾部","接続部"],"a":0,"e":"ひとまとまりで主語の働きをしています。"},{"m":"①","q":"①の「春と」と「秋は」の関係はどれですか。","c":["並立の関係","主・述の関係","修飾・被修飾の関係","補助の関係"],"a":0,"e":"入れかえても意味が変わりません。"},{"m":"②","q":"②「暖かくて過ごしやすい」は、文の成分として何に当たりますか。","c":["述部","主部","修飾部","接続部"],"a":0,"e":"ひとまとまりで述語の働きをしています。"},{"m":"③","q":"③「桜の咲く春」は、文の成分として何に当たりますか。","c":["独立部","主部","述部","修飾部"],"a":0,"e":"ひとまとまりで話題を示す（提示）独立部です。"}]}],"u5":[{"title":"人気のパン屋","t":"　駅前に新しいパン屋ができた。[①そこ]のメロンパンはとても人気がある。[②しかし]、[③それ]は昼前に売り切れてしまう。[④だから]、朝早く行くのがよい。","qs":[{"m":"①","q":"①「そこ」が指している内容はどれですか。","c":["駅前の新しいパン屋","駅前","メロンパン","昼前"],"a":0,"e":"「そこ」に当てはめると「駅前の新しいパン屋のメロンパン」となり、意味が通ります。"},{"m":"②","q":"②「しかし」は、どんな働きをしていますか。","c":["逆接","並列・累加","説明・補足","順接"],"a":0,"e":"人気があるのに手に入りにくいという、予想と反対の内容をつないでいます。"},{"m":"③","q":"③「それ」が指している内容はどれですか。","c":["メロンパン","パン屋","駅前","人気"],"a":0,"e":"昼前に売り切れるのは「メロンパン」です。"},{"m":"④","q":"④「だから」は、どんな働きをしていますか。","c":["順接","並列・累加","説明・補足","転換"],"a":0,"e":"売り切れることが理由で、朝早く行くのがよいという結論が続いています。"}]},{"title":"姉の習い事","t":"　姉はピアノを習っている。[①また]、水泳も習っている。[②どちら]も楽しいそうだ。[③ところで]、ぼくは何を習おうか。","qs":[{"m":"①","q":"①「また」は、どんな働きをしていますか。","c":["並列・累加","転換","順接","説明・補足"],"a":0,"e":"ピアノに水泳を付け加えています。"},{"m":"②","q":"②「どちら」が指している内容はどれですか。","c":["ピアノと水泳","ピアノ","水泳","姉"],"a":0,"e":"二つの習い事の両方を指しています。"},{"m":"③","q":"③「ところで」は、どんな働きをしていますか。","c":["転換","逆接","並列・累加","説明・補足"],"a":0,"e":"姉の話から自分の話へ、話題を変えています。"},{"m":"②","q":"②「どちら」は、こそあど言葉のうち、どれに当たりますか。","c":["はっきりしないものを指す言葉（ど）","話し手に近いものを指す言葉（こ）","聞き手に近いものを指す言葉（そ）","どちらからも遠いものを指す言葉（あ）"],"a":0,"e":"「ど」で始まる言葉は、はっきりしないものを指します。"}]},{"title":"遠くの鳥","t":"　遠くの木を指して、「[①あれ]は何という鳥ですか。」と聞いた。「ヒヨドリです。[②この]辺りにもよく来ますよ。」と先生が答えた。[③つまり]、身近な鳥なのだ。","qs":[{"m":"①","q":"①「あれ」が使われているのはなぜですか。","c":["鳥が話し手からも聞き手からも遠くにいるから","鳥が話し手の近くにいるから","鳥が聞き手の近くにいるから","鳥がどこにいるかわからないから"],"a":0,"e":"「あ」で始まる言葉は、どちらからも遠いものを指します。"},{"m":"①","q":"①「あれ」が指している内容はどれですか。","c":["遠くの木にいる鳥","先生","ヒヨドリという名前","遠くの木"],"a":0,"e":"何という鳥かをたずねているので、木にいる鳥を指しています。"},{"m":"②","q":"②「この」はどんな働きをする言葉ですか。","c":["あとの言葉を指定する","場所を指す","方向を指す","様子を表す"],"a":0,"e":"「この辺り」のように、あとの言葉を指定します。"},{"m":"③","q":"③「つまり」は、どんな働きをしていますか。","c":["説明・補足","並列・累加","逆接","転換"],"a":0,"e":"前の内容を言いかえてまとめています。"}]},{"title":"見学の予定","t":"　明日は、博物館と美術館を見学する。[①前者]では恐竜の化石を、[②後者]では絵画を見る予定だ。[③なお]、昼食は各自で用意すること。","qs":[{"m":"①","q":"①「前者」が指している内容はどれですか。","c":["博物館","美術館","恐竜の化石","絵画"],"a":0,"e":"「前者」は、前に述べた二つのうちの先のほうです。"},{"m":"②","q":"②「後者」が指している内容はどれですか。","c":["美術館","博物館","恐竜の化石","昼食"],"a":0,"e":"「後者」は、二つのうちのあとのほうです。"},{"m":"③","q":"③「なお」は、どんな働きをしていますか。","c":["説明・補足","並列・累加","逆接","転換"],"a":0,"e":"前の内容に付け加えて説明しています。"},{"m":"③","q":"③「なお」と同じ働きをする言葉はどれですか。","c":["ただし","だから","しかし","それとも"],"a":0,"e":"「ただし」も説明・補足の働きをします。"}]},{"title":"朝の掃除","t":"　毎朝、ぼくは家の前を掃除している。[①これ]は祖父から受け継いだ習慣だ。[②なぜなら]、祖父がいつも「[③こう]すると気持ちがいいぞ。」と言っていたからだ。","qs":[{"m":"①","q":"①「これ」が指している内容はどれですか。","c":["毎朝、家の前を掃除していること","家の前","祖父","習慣"],"a":0,"e":"前の文全体の内容を指しています。"},{"m":"②","q":"②「なぜなら」は、どんな働きをしていますか。","c":["説明・補足","並列・累加","逆接","転換"],"a":0,"e":"あとで理由を説明しています。"},{"m":"③","q":"③「こう」が指している内容はどれですか。","c":["家の前を掃除する","気持ちがいい","祖父が言う","習慣を受け継ぐ"],"a":0,"e":"祖父が毎朝していたこと、つまり家の前を掃除することを指しています。"},{"m":"③","q":"③「こう」は何を表す言葉ですか。","c":["様子（どのようにするか）","物事","場所","方向"],"a":0,"e":"「こう・そう・ああ・どう」は様子を表します。"}]},{"title":"雨の運動会","t":"　朝から雨が降っていた。[①（　　）]、運動会は予定どおり行われた。昼には雨がやみ、[②そして]、青空が広がった。[③それ]を見て、みんな大喜びした。","qs":[{"m":"①","q":"①（　　）に当てはまる言葉はどれですか。","c":["しかし","だから","それとも","つまり"],"a":0,"e":"雨が降っていたのに運動会が行われたので、逆接の「しかし」が入ります。"},{"m":"①","q":"①に入る言葉の働きはどれですか。","c":["逆接","並列・累加","説明・補足","順接"],"a":0,"e":"予想と反対の内容をつないでいます。"},{"m":"②","q":"②「そして」は、どんな働きをしていますか。","c":["並列・累加","転換","順接","説明・補足"],"a":0,"e":"雨がやんだことに続けて、青空が広がったことを付け加えています。"},{"m":"③","q":"③「それ」が指している内容はどれですか。","c":["青空が広がったこと","雨","運動会","みんな"],"a":0,"e":"みんなが見て大喜びしたのは、青空が広がったことです。"}]},{"title":"だれのペン","t":"　「[①この]ペン、使ってもいい？」と聞くと、友達は「[②それ]はぼくのじゃないよ。」と答えた。[③では]、だれのペンだろう。","qs":[{"m":"①","q":"①「この」が使われているのはなぜですか。","c":["ペンが話し手の近くにあるから","ペンが聞き手の近くにあるから","ペンが二人から遠くにあるから","ペンの場所がわからないから"],"a":0,"e":"話し手が手に持っているペンなので「この」です。"},{"m":"②","q":"②「それ」が指している内容はどれですか。","c":["わたしが持っているペン","友達のペン","友達","だれのペンか"],"a":0,"e":"話しかけた人が持っているペンを指しています。"},{"m":"②","q":"友達が②「それ」と言ったのは、ペンがだれの近くにあったからですか。","c":["話しかけてきた相手（聞き手）","友達自身（話し手）","二人のどちらからも遠い人","先生"],"a":0,"e":"友達から見て、相手の近くにあるペンなので「それ」です。"},{"m":"③","q":"③「では」は、どんな働きをしていますか。","c":["転換","逆接","並列・累加","説明・補足"],"a":0,"e":"次の話題（だれのペンか）に移っています。"}]},{"title":"熱が出た弟","t":"　弟は熱が出た。[①それで]、今日は学校を休んだ。明日は学校へ行けるか、[②それとも]休むか、まだわからない。母は[③そんな]弟のために、おかゆを作った。","qs":[{"m":"①","q":"①「それで」は、どんな働きをしていますか。","c":["順接","並列・累加","説明・補足","転換"],"a":0,"e":"熱が出たことが理由で、休むという当然の結果が続いています。"},{"m":"②","q":"②「それとも」は、どんな働きをしていますか。","c":["対比・選択","説明・補足","順接","逆接"],"a":0,"e":"行くか休むか、どちらかを選ぶことを表しています。"},{"m":"③","q":"③「そんな」は何を表す言葉ですか。","c":["様子","物事","場所","方向"],"a":0,"e":"「こんな・そんな・あんな・どんな」は様子を表します。"},{"m":"③","q":"③「そんな弟」とはどんな弟ですか。","c":["熱が出て学校を休んだ弟","明日学校へ行く弟","おかゆを作った弟","母の弟"],"a":0,"e":"前に書かれている弟の様子を指しています。"}]},{"title":"星の図鑑","t":"　近所に図書館がある。わたしは[①そこ]で週に一度本を借りる。[②例えば]、先週は星の図鑑を借りた。[③その]図鑑には、きれいな写真が多かった。","qs":[{"m":"①","q":"①「そこ」が指している内容はどれですか。","c":["近所の図書館","近所","本","星の図鑑"],"a":0,"e":"本を借りる場所なので、近所の図書館です。"},{"m":"②","q":"②「例えば」は、どんな働きをしていますか。","c":["説明・補足","並列・累加","逆接","転換"],"a":0,"e":"例を挙げて説明しています。"},{"m":"③","q":"③「その」が指している内容はどれですか。","c":["先週借りた星の図鑑","近所の図書館","きれいな写真","週に一度借りる本"],"a":0,"e":"前の文で借りた星の図鑑を指しています。"},{"m":"③","q":"③「その」はどんな働きをする言葉ですか。","c":["あとの言葉を指定する","場所を指す","方向を指す","様子を表す"],"a":0,"e":"「その図鑑」のように、あとの言葉を指定します。"}]},{"title":"サッカー部","t":"　ぼくはサッカー部に入った。[①けれども]、まだ試合には出られない。先輩たちは[②あんな]に上手なのに。[③要するに]、ぼくは練習が足りないのだ。[④だから]、毎日練習しよう。","qs":[{"m":"①","q":"①「けれども」は、どんな働きをしていますか。","c":["逆接","並列・累加","説明・補足","順接"],"a":0,"e":"部に入ったのに試合に出られないという、予想と反対の内容をつないでいます。"},{"m":"②","q":"②「あんな」は何を表す言葉ですか。","c":["様子","物事","場所","方向"],"a":0,"e":"「あんな」は様子を表すこそあど言葉です。"},{"m":"③","q":"③「要するに」は、どんな働きをしていますか。","c":["説明・補足","並列・累加","逆接","転換"],"a":0,"e":"前の内容をまとめて言いかえています。"},{"m":"④","q":"④「だから」は、どんな働きをしていますか。","c":["順接","並列・累加","説明・補足","転換"],"a":0,"e":"練習が足りないことが理由で、毎日練習するという当然の結論が続いています。"}]}],"u6":[{"title":"メールの交換","t":"　[①となりの][②学校と]メールを交換する[③予定です]。[④とても]楽しみだ。","qs":[{"m":"①","q":"①「となりの」の中の付属語はどれですか。","c":["の","となり","となりの","付属語はない"],"a":0,"e":"「の」はそれだけでは意味がわからず、自立語「となり」に付いています。"},{"m":"②","q":"②「学校と」の「と」は、自立語・付属語のどちらですか。","c":["付属語","自立語","どちらでもない","文によって変わる"],"a":0,"e":"「と」は単独で文節を作れない付属語です。"},{"m":"③","q":"③「予定です」の「予定」の品詞はどれですか。","c":["名詞","助詞","接続詞","形容詞"],"a":0,"e":"活用しない自立語で、主語になれる単語です。"},{"m":"④","q":"④「とても」の品詞はどれですか。","c":["副詞","動詞","助動詞","感動詞"],"a":0,"e":"活用しない自立語で、主に用言を修飾します。"}]},{"title":"白い雲","t":"　[①白い]雲が[②ゆっくり]空を[③流れる]。[④ああ]、気持ちがいい。","qs":[{"m":"①","q":"①「白い」の品詞はどれですか。","c":["形容詞","助動詞","形容動詞","感動詞"],"a":0,"e":"活用する自立語で、言い切りの形が「い」で終わります。"},{"m":"②","q":"②「ゆっくり」の品詞はどれですか。","c":["副詞","動詞","助動詞","感動詞"],"a":0,"e":"活用しない自立語で、「流れる」を修飾しています。"},{"m":"③","q":"③「流れる」の品詞はどれですか。","c":["動詞","感動詞","形容詞","副詞"],"a":0,"e":"活用する自立語で、言い切りの形がウ段の音で終わります。"},{"m":"④","q":"④「ああ」の品詞はどれですか。","c":["感動詞","名詞","副詞","助詞"],"a":0,"e":"活用しない自立語で、独立語になっています。"}]},{"title":"図書館は遠い","t":"　[①この]本は[②静かな]場所で読みたい。[③しかし]、図書館は[④遠い]。","qs":[{"m":"①","q":"①「この」の品詞はどれですか。","c":["連体詞","副詞","感動詞","名詞"],"a":0,"e":"活用しない自立語で、体言「本」だけを修飾します。"},{"m":"②","q":"②「静かな」の品詞はどれですか。","c":["形容動詞","助詞","動詞","接続詞"],"a":0,"e":"言い切りの形が「静かだ」となる、活用する自立語です。"},{"m":"③","q":"③「しかし」の品詞はどれですか。","c":["接続詞","動詞","感動詞","形容詞"],"a":0,"e":"活用しない自立語で、前後の文をつないでいます。"},{"m":"④","q":"④「遠い」は、体言・用言のどちらですか。","c":["用言","体言","どちらでもない","付属語"],"a":0,"e":"「遠い」は形容詞なので用言です。"}]},{"title":"早起き","t":"　弟は六時に[①起きる]。[②起きない]と、母に[③しかられる]。[④六時に]起きるのは大変だ。","qs":[{"m":"①","q":"①「起きる」の品詞はどれですか。","c":["動詞","感動詞","形容詞","副詞"],"a":0,"e":"活用する自立語で、ウ段の音で言い切ります。"},{"m":"②","q":"②「起きない」の中の付属語はどれですか。","c":["ない","起き","起きない","付属語はない"],"a":0,"e":"起き／ない　に分けられ、「ない」が付属語です。"},{"m":"③","q":"③「しかられる」は、「しかる」の形が変わったものです。このように形が変わることを何といいますか。","c":["活用","倒置","省略","複合"],"a":0,"e":"あとに続く言葉によって単語の形が変わることを活用といいます。"},{"m":"④","q":"④「六時に」の中の付属語はどれですか。","c":["に","六","時","六時"],"a":0,"e":"「六時」は名詞（自立語）、「に」は付属語です。"}]},{"title":"きれいな花" itle":"洗濯日和","t":"　[①おはよう]。今日は朝から晴れている。[②しかも]、風もない。[③だから]、洗濯物がよく乾くだろう。[④さあ]、出かけよう。","qs":[{"m":"①","q":"①「おはよう」の感動詞の種類はどれですか。","c":["あいさつ","感動","呼びかけ","応答"],"a":0,"e":"あいさつを表しています。"},{"m":"②","q":"②「しかも」の接続詞の種類はどれですか。","c":["並列・累加","対比・選択","順接","説明・補足"],"a":0,"e":"晴れていることに付け加えています。"},{"m":"③","q":"③「だから」の接続詞の種類はどれですか。","c":["順接","説明・補足","転換","並列・累加"],"a":0,"e":"天気のよさが理由で、当然の結果が続いています。"},{"m":"④","q":"④「さあ」の感動詞の種類はどれですか。","c":["呼びかけ","感動","応答","あいさつ"],"a":0,"e":"相手をさそう呼びかけです。"}]},{"title":"遅れて行く","t":"　[①ええ]、行きます。[②ただし]、少し遅れます。[③なぜなら]、塾があるからです。[④では]、またあとで。","qs":[{"m":"①","q":"①「ええ」の感動詞の種類はどれですか。","c":["応答","感動","呼びかけ","あいさつ"],"a":0,"e":"相手への返事を表しています。"},{"m":"②","q":"②「ただし」の接続詞の種類はどれですか。","c":["説明・補足","逆接","転換","順接"],"a":0,"e":"条件を付け加えて補っています。"},{"m":"③","q":"③「なぜなら」の接続詞の種類はどれですか。","c":["説明・補足","逆接","転換","順接"],"a":0,"e":"理由を説明しています。"},{"m":"④","q":"④「では」の接続詞の種類はどれですか。","c":["転換","並列・累加","順接","対比・選択"],"a":0,"e":"話を切りかえています。"}]},{"title":"花屋で","t":"　[①まあ]、きれいな花。赤い花、[②または]白い花のどちらかを買おう。[③けれども]、両方ほしい。[④それに]、花びんも必要だ。","qs":[{"m":"①","q":"①「まあ」の感動詞の種類はどれですか。","c":["感動","呼びかけ","応答","あいさつ"],"a":0,"e":"感動を表しています。"},{"m":"②","q":"②「または」の接続詞の種類はどれですか。","c":["対比・選択","転換","並列・累加","順接"],"a":0,"e":"どちらかを選ぶことを表しています。"},{"m":"③","q":"③「けれども」の接続詞の種類はどれですか。","c":["逆接","転換","並列・累加","対比・選択"],"a":0,"e":"どちらかと言いながら両方ほしいという、反対の内容をつないでいます。"},{"m":"④","q":"④「それに」の接続詞の種類はどれですか。","c":["並列・累加","対比・選択","順接","説明・補足"],"a":0,"e":"付け加えています。"}]},{"title":"先生からの本","t":"　[①ねえ]、聞いて。昨日、駅で先生に会ったんだ。[②すると]、先生が[③あの]本をくれた。[④つまり]、前に話した本だよ。","qs":[{"m":"①","q":"①「ねえ」の感動詞の種類はどれですか。","c":["呼びかけ","感動","応答","あいさつ"],"a":0,"e":"相手に呼びかけています。"},{"m":"②","q":"②「すると」の接続詞の種類はどれですか。","c":["順接","説明・補足","転換","並列・累加"],"a":0,"e":"前の事柄に続いて起きたことをつないでいます。"},{"m":"③","q":"③「あの」の品詞はどれですか。","c":["連体詞","感動詞","接続詞","代名詞"],"a":0,"e":"体言「本」を修飾しているので連体詞です。「あの、すみません」のように使えば感動詞です。"},{"m":"④","q":"④「つまり」の接続詞の種類はどれですか。","c":["説明・補足","逆接","転換","順接"],"a":0,"e":"言いかえて説明しています。"}]},{"title":"犯人はだれ","t":"　[①いいえ]、違います。犯人は彼ではありません。[②というのは]、彼はその時間、家にいたからです。[③だが]、[④それ]なら犯人はだれだろう。","qs":[{"m":"①","q":"①「いいえ」の感動詞の種類はどれですか。","c":["応答","感動","呼びかけ","あいさつ"],"a":0,"e":"相手への返事を表しています。"},{"m":"②","q":"②「というのは」の接続詞の種類はどれですか。","c":["説明・補足","逆接","転換","順接"],"a":0,"e":"理由を説明しています。"},{"m":"③","q":"③「だが」の接続詞の種類はどれですか。","c":["逆接","転換","並列・累加","対比・選択"],"a":0,"e":"反対の内容をつないでいます。"},{"m":"④","q":"④「それ」の品詞はどれですか。","c":["代名詞（名詞）","接続詞","感動詞","連体詞"],"a":0,"e":"前の内容を指す代名詞です。「それ、行け！」のように使えば感動詞です。"}]},{"title":"楽しい一日","t":"　[①ああ]、疲れた。[②でも]、今日は楽しかった。[③また]明日も遊ぼう。","qs":[{"m":"①","q":"①「ああ」の感動詞の種類はどれですか。","c":["感動","呼びかけ","応答","あいさつ"],"a":0,"e":"気持ちを表す感動詞です。"},{"m":"①","q":"①「ああ」は、どの文の成分に当たりますか。","c":["独立語","接続語","修飾語","主語"],"a":0,"e":"感動詞は独立語になります。"},{"m":"②","q":"②「でも」の接続詞の種類はどれですか。","c":["逆接","転換","並列・累加","対比・選択"],"a":0,"e":"疲れたけれど楽しかったという、反対の内容をつないでいます。"},{"m":"③","q":"③「また」の品詞はどれですか。","c":["副詞","接続詞","感動詞","連体詞"],"a":0,"e":"ここでは「再び」という意味で「遊ぼう」を修飾する副詞です。"}]},{"title":"今日の授業","t":"　[①さて]、今日の授業を始めます。前回は火山について学びました。[②そして]、今日は地震について学びます。[③つまり]、地球の内部の働きです。","qs":[{"m":"①","q":"①「さて」の接続詞の種類はどれですか。","c":["転換","並列・累加","順接","対比・選択"],"a":0,"e":"話を切りかえて、授業を始めています。"},{"m":"①","q":"①「さて」の品詞はどれですか。","c":["接続詞","感動詞","副詞","連体詞"],"a":0,"e":"前の話題を受けて、話を切りかえる接続詞です。"},{"m":"②","q":"②「そして」の接続詞の種類はどれですか。","c":["並列・累加","対比・選択","順接","説明・補足"],"a":0,"e":"前回の内容に続けて、今日の内容を並べています。"},{"m":"③","q":"③「つまり」の接続詞の種類はどれですか。","c":["説明・補足","逆接","転換","順接"],"a":0,"e":"言いかえて説明しています。"}]},{"title":"新しい帽子","t":"　[①こんにちは]。[②あら]、[③それ]は新しい帽子ね。よく似合っているわ。[④だから]、今日はうれしそうなのね。","qs":[{"m":"①","q":"①「こんにちは」の感動詞の種類はどれですか。","c":["あいさつ","感動","呼びかけ","応答"],"a":0,"e":"あいさつを表しています。"},{"m":"②","q":"②「あら」の感動詞の種類はどれですか。","c":["感動","呼びかけ","応答","あいさつ"],"a":0,"e":"驚きを表しています。"},{"m":"③","q":"③「それ」の品詞はどれですか。","c":["代名詞（名詞）","感動詞","接続詞","連体詞"],"a":0,"e":"帽子を指す代名詞です。"},{"m":"④","q":"④「だから」の接続詞の種類はどれですか。","c":["順接","説明・補足","転換","並列・累加"],"a":0,"e":"帽子が似合っていることを理由として、当然の結論が続いています。"}]}],"u10":[{"title":"朝の支度","t":"　朝六時に[①起き]た。顔を[②洗っ]て、朝ごはんを[③食べる]。それから、学校へ[④行こ]う。","qs":[{"m":"①","q":"①「起き」（起きる）の活用の種類はどれですか。","c":["上一段活用","下一段活用","五段活用","カ行変格活用"],"a":0,"e":"「起きない」で、直前がイ段の音です。"},{"m":"②","q":"②「洗っ」は、どの音便に当たりますか。","c":["促音便","イ音便","撥音便","音便ではない"],"a":0,"e":"「洗いて」が「洗って」と、つまる音になっています。"},{"m":"③","q":"③「食べる」の活用形はどれですか。","c":["終止形","連体形","命令形","仮定形"],"a":0,"e":"文が言い切られているので終止形です。"},{"m":"④","q":"④「行こ」の活用形はどれですか。","c":["未然形","連用形","命令形","仮定形"],"a":0,"e":"「う」に続いているので未然形です。"}]},{"title":"冷たい風","t":"　弟が窓を[①開け]た。冷たい風が部屋に[②入っ]てくる。「早く[③閉めろ]。」と兄が言った。","qs":[{"m":"①","q":"①「開け」（開ける）に対応する自動詞はどれですか。","c":["開く","開かれる","開けさせる","開けられる"],"a":0,"e":"「窓を開ける」（他動詞）に対して「窓が開く」（自動詞）です。"},{"m":"②","q":"②「入っ」（入る）の活用の種類はどれですか。","c":["五段活用","下一段活用","サ行変格活用","カ行変格活用"],"a":0,"e":"「入らない」で、直前がア段の音です。"},{"m":"②","q":"②「入っ」は、どの音便に当たりますか。","c":["促音便","イ音便","撥音便","音便ではない"],"a":0,"e":"つまる音「っ」になっています。"},{"m":"③","q":"③「閉めろ」の活用形はどれですか。","c":["命令形","仮定形","未然形","終止形"],"a":0,"e":"命令して言い切っています。"}]},{"title":"ノートにまとめる","t":"　この本は難しいが、辞書を使えば[①読める]。[②書い]てある内容を、ノートに[③まとめ]て[④おこう]。","qs":[{"m":"①","q":"①「読める」のように、「〜することができる」という意味をもつ動詞を何といいますか。","c":["可能動詞","補助動詞","他動詞","複合動詞"],"a":0,"e":"五段活用の「読む」からできた可能動詞です。"},{"m":"②","q":"②「書い」は、どの音便に当たりますか。","c":["イ音便","促音便","撥音便","音便ではない"],"a":0,"e":"「書きて」が「書いて」と「い」の音に変わっています。"},{"m":"③","q":"③「まとめ」（まとめる）の活用の種類はどれですか。","c":["下一段活用","五段活用","上一段活用","カ行変格活用"],"a":0,"e":"「まとめない」で、直前がエ段の音です。"},{"m":"④","q":"④「おこう」のように、本来の意味がうすれて上の語を補助する動詞を何といいますか。","c":["補助動詞","可能動詞","自動詞","複合動詞"],"a":0,"e":"「まとめて／おく」の「おく」は「前もって〜する」という意味の補助動詞です。"}]},{"title":"友達が来る","t":"　友達が家に[①来る]。ぼくは部屋を[②掃除し]て待った。友達が[③来れ]ば、いっしょにゲームを[④する]予定だ。","qs":[{"m":"①","q":"①「来る」の活用の種類はどれですか。","c":["カ行変格活用","サ行変格活用","下一段活用","五段活用"],"a":0,"e":"「来る」一語だけがカ行変格活用です。"},{"m":"②","q":"②「掃除し」（掃除する）の活用の種類はどれですか。","c":["サ行変格活用","下一段活用","カ行変格活用","五段活用"],"a":0,"e":"「〜する」の形の動詞はサ行変格活用です。"},{"m":"③","q":"③「来れ」の活用形はどれですか。","c":["仮定形","終止形","未然形","命令形"],"a":0,"e":"「ば」に続いているので仮定形です。"},{"m":"④","q":"④「する」の活用形はどれですか。","c":["連体形","仮定形","終止形","未然形"],"a":0,"e":"体言「予定」に続いているので連体形です。"}]},{"title":"公園で","t":"　公園で子どもたちが[①遊ん]でいる。ボールが高く[②飛ん]だ。犬もうれしそうに[③走り]回っている。" ","伺いました","おりました"],"a":0,"e":"お客様の動作なので尊敬語を使います。「参る」は謙譲語です。"},{"m":"②","q":"②を正しい敬語に直したものはどれですか。","c":["お聞きください","お聞きしなさい","伺ってください","拝聴してください"],"a":0,"e":"「お〜する」は謙譲語なので、相手の動作には「お〜ください」を使います。"},{"m":"③","q":"③「お茶」の敬語の種類はどれですか。","c":["美化語","丁寧語","尊敬語","謙譲語"],"a":0,"e":"物事を美しく言う美化語です。"},{"m":"④","q":"④「あります」の「ます」の敬語の種類はどれですか。","c":["丁寧語","尊敬語","謙譲語","美化語"],"a":0,"e":"丁寧に述べる丁寧語です。"}]}]};
const circ=i=>String.fromCharCode(0x2460+i);
UNITS.forEach(u=>{u.ps=PSG[u.id]||[];u.ps.forEach((p,i)=>{p.no=i;p.qs.forEach(q=>{q.psg=p;q.ptag=`文章${circ(i)}　${p.title}`})})});
function psgHTML(p,on,head){
  return (head?`<span class="pt">文章${circ(p.no)}　${esc(p.title)}</span>`:"")+
    esc(p.t).replace(/\[([①-⑩])([^\]]+)\]/g,(_,m,w)=>`<span class="ul${m===on?" on":""}"><sup>${m}</sup>${w}</span>`);
}

/* ===== 状態 ===== */
const LABELS=["ア","イ","ウ","エ"];
let unit=null, list=[], idx=0, score=0, answered=false, log=[], cur=null, modeLabel="", bestKey=null;
const $=id=>document.getElementById(id);

function store(k,v){try{if(v===undefined){return JSON.parse(localStorage.getItem(k))}localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function show(id){["home","unit","quiz","result"].forEach(s=>$(s).classList.toggle("hidden",s!==id));window.scrollTo(0,0)}
function esc(t){return t.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function seg(t){return esc(t).replace(/\//g,'<span class="cut" aria-label="区切り">/</span>').replace(/\n/g,"<br>")}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ===== 単元一覧 ===== */
function renderHome(){
  const ul=$("unitList");ul.innerHTML="";
  UNITS.forEach(u=>{
    const ready=!!u.qs, best=ready?store("best_"+u.id):null;
    const li=document.createElement("li");
    li.innerHTML=`<button class="unit-btn" ${ready?"":"disabled"}>
      <span class="no">${u.no}</span>
      <span class="nm">${esc(u.name)}${u.sub?`<span class="sub">${esc(u.sub)}</span>`:""}</span>
      <span class="st">${ready?(best!=null?`最高 ${best}%`:`${u.qs.length}問`):"準備中"}</span></button>`;
    if(ready)li.firstElementChild.onclick=()=>openUnit(u);
    ul.appendChild(li);
  });
  show("home");
}

/* ===== 単元トップ ===== */
function openUnit(u){
  unit=u;
  $("unitTitle").textContent=`単元${u.no}　${u.name}`;
  $("unitScope").textContent=u.scope;
  $("startAll").innerHTML=`全問に挑戦する<small>${u.qs.length}問・分野順</small>`;
  $("startAll").onclick=()=>start(u.qs.slice(),"全問","best_"+u.id);
  const n=Math.min(10,u.qs.length);
  $("startRand").innerHTML=`ランダム${n}問<small>テスト直前の確認に</small>`;
  $("startRand").onclick=()=>start(shuffle(u.qs).slice(0,n),`ランダム${n}問`);
  $("startRand20").innerHTML=`ランダム20問<small>実力チェックに</small>`;
  $("startRand20").onclick=()=>start(shuffle(u.qs).slice(0,20),"ランダム20問");
  const cb=$("catBtns");cb.innerHTML="";
  u.cats.forEach((c,i)=>{
    const qs=u.qs.filter(q=>q.cat===i);
    const b=document.createElement("button");b.className="start";
    b.innerHTML=`${esc(c)}<small>${qs.length}問</small>`;
    b.onclick=()=>start(qs,c);cb.appendChild(b);
  });
  const allPs=[].concat(...u.ps.map(p=>p.qs));
  const pb=$("psgBtns");pb.innerHTML="";
  $("startPsgAll").classList.toggle("hidden",!u.ps.length);
  if(u.ps.length){
    const ba=store("best_"+u.id+"_psall");
    $("startPsgAll").innerHTML=`文章問題をすべて解く<small>${u.ps.length}題・${allPs.length}問${ba!=null?`・最高 ${ba}%`:""}</small>`;
    $("startPsgAll").onclick=()=>start(allPs.slice(),"文章問題すべて","best_"+u.id+"_psall");
  }
  u.ps.forEach((p,i)=>{
    const k="best_"+u.id+"_p"+i, bs=store(k);
    const b=document.createElement("button");b.className="start psg-btn";
    b.innerHTML=`<span class="pn">文章${circ(i)}　${esc(p.title)}</span><small>${p.qs.length}問${bs!=null?`・最高 ${bs}%`:""}</small>`;
    b.onclick=()=>start(p.qs.slice(),`文章${circ(i)}`,k);pb.appendChild(b);
  });
  show("unit");
}

/* ===== 出題 ===== */
function start(qs,label,key){list=qs;idx=0;score=0;log=[];modeLabel=label;bestKey=key||null;show("quiz");renderQ()}
function renderQ(){
  answered=false;
  const q=list[idx];
  const order=shuffle([0,1,2,3]);
  cur={q,order};
  $("qCount").textContent=`${modeLabel}　${idx+1} / ${list.length}`;
  $("qScore").textContent=`正解 ${score}`;
  $("qBar").style.width=(idx/list.length*100)+"%";
  $("qPsg").classList.toggle("hidden",!q.psg);
  if(q.psg)$("qPsg").innerHTML=psgHTML(q.psg,q.m,true);
  $("qTag").textContent=q.psg?"文章問題":unit.cats[q.cat];
  $("qText").textContent=q.q;
  $("qSent").classList.toggle("hidden",!q.s);
  if(q.s)$("qSent").innerHTML=seg(q.s);
  const ul=$("opts");ul.innerHTML="";
  order.forEach((oi,pos)=>{
    const t=q.c[oi], isSeg=t.includes("/");
    const li=document.createElement("li");
    li.innerHTML=`<button class="opt" data-oi="${oi}"><span class="lb">${LABELS[pos]}</span><span class="tx${isSeg?" seg":""}">${seg(t)}</span></button>`;
    li.firstElementChild.onclick=()=>answer(oi);
    ul.appendChild(li);
  });
  $("markBox").innerHTML="";
  $("exp").classList.add("hidden");
  $("next").classList.add("hidden");
  ul.querySelector("button").focus({preventScroll:true});
}
function answer(oi){
  if(answered)return;answered=true;
  const q=cur.q, ok=oi===q.a;
  if(ok)score++;
  log.push({q,picked:oi,ok,pickedLabel:LABELS[cur.order.indexOf(oi)],ansLabel:LABELS[cur.order.indexOf(q.a)]});
  document.querySelectorAll(".opt").forEach(b=>{
    b.disabled=true;const v=+b.dataset.oi;
    if(v===q.a)b.classList.add("correct");
    else if(v===oi)b.classList.add("wrong");
  });
  $("markBox").innerHTML=ok
    ?`<svg class="mark" viewBox="0 0 80 80" aria-label="正解"><circle class="draw" cx="40" cy="40" r="32"/></svg>`
    :`<svg class="mark" viewBox="0 0 80 80" aria-label="不正解"><path class="draw2" d="M14 14 L66 66"/><path class="draw2" style="animation-delay:.45s" d="M66 14 L14 66"/></svg>`;
  const e=$("exp");
  e.innerHTML=`<b>${ok?"正解！":"不正解…　正解は "+LABELS[cur.order.indexOf(q.a)]}</b><p>${seg(q.e)}</p>`;
  e.classList.remove("hidden");
  $("qScore").textContent=`正解 ${score}`;
  const nx=$("next");
  nx.textContent=idx+1<list.length?"次の問題へ":"結果を見る";
  nx.classList.remove("hidden");nx.focus({preventScroll:true});
}
$("next").onclick=()=>{idx++;if(idx<list.length)renderQ();else finish()};
$("quit").onclick=()=>openUnit(unit);

/* ===== 結果 ===== */
function finish(){
  const pct=Math.round(score/list.length*100);
  if(bestKey){const b=store(bestKey);if(b==null||pct>b)store(bestKey,pct)}
  $("resTitle").textContent=`単元${unit.no}　${unit.name}（${modeLabel}）`;
  $("resScore").textContent=score;
  $("resOf").textContent=`/ ${list.length}問　正答率 ${pct}%`;
  $("resVerdict").textContent=pct===100?"全問正解です。この単元はテスト本番も安心です。"
    :pct>=80?"よくできています。間違えた問題の解説を読んで仕上げましょう。"
    :pct>=50?"あと一歩です。間違えた問題を解き直して、解説で確認しましょう。"
    :"まずは解説をよく読み、単元のポイントを確認してから再挑戦しましょう。";
  const wrong=log.filter(l=>!l.ok);
  $("retryWrong").classList.toggle("hidden",!wrong.length);
  $("retryWrong").onclick=()=>start(wrong.map(l=>l.q),"解き直し");
  const r=$("review");r.innerHTML="";
  wrong.forEach(l=>{
    const li=document.createElement("li");
    li.innerHTML=`${l.q.psg?`<div class="rp">${esc(l.q.ptag)}</div>`:""}<div class="rq">${esc(l.q.q)}</div>${l.q.psg?`<div class="rs psg">${psgHTML(l.q.psg,l.q.m)}</div>`:""}${l.q.s?`<div class="rs">${seg(l.q.s)}</div>`:""}
      <div class="ra">あなたの答え：${seg(l.q.c[l.picked])}<br>正解：<span>${seg(l.q.c[l.q.a])}</span></div>
      <div class="ra">${seg(l.q.e)}</div>`;
    r.appendChild(li);
  });
  show("result");
}
$("toUnit").onclick=()=>openUnit(unit);
document.querySelectorAll("[data-go=home]").forEach(b=>b.onclick=renderHome);

/* キーボード操作 */
document.addEventListener("keydown",ev=>{
  if($("quiz").classList.contains("hidden"))return;
  if(!answered&&/^[1-4]$/.test(ev.key)){const b=document.querySelectorAll(".opt")[+ev.key-1];if(b)b.click()}
  else if(answered&&ev.key==="Enter"&&document.activeElement!==$("next")){$("next").click()}
});

renderHome();
</script>
</body>
</html>
