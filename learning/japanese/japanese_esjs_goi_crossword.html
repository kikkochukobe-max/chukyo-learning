<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ことばのマスで語彙力マス</title>
<style>
:root{
  --paper:#FBF6EA;
  --rule:#3C7A5E;        /* 原稿用紙の罫線 */
  --rule-soft:#B7D2C3;
  --ink:#23211C;
  --ink-soft:#6C665A;
  --vermilion:#C24E3A;   /* 朱 */
  --vermilion-soft:#F3DCD5;
  --gold:#FEB342;
  --cell:34px;
}
/* touch-action:manipulation = ダブルタップ拡大を切る。盤面のマスやかなキーボードを
   速く連打すると2回目のタップが「ダブルタップ」と判定されて画面がズームしてしまう
   のをふせぐ。ピンチでの拡大とスクロール（.levels の横スクロール等）はのこる。
   iOS Safari は viewport の user-scalable=no を無視するので、これが実質の対策 */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;
  min-height:calc(100svh + 1px);
  padding-bottom:calc(300px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
body.kb-off{padding-bottom:40px;}
.mincho{font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;}

/* ---------- header ---------- */
header{
  padding:10px 14px 8px;
  border-bottom:2px solid var(--rule);
  background:var(--paper);
}
.brand{font-size:11px;letter-spacing:.14em;color:var(--ink-soft);}
h1{
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  font-size:21px;margin:2px 0 0;letter-spacing:.22em;font-weight:600;
}
h1 span{font-size:11px;letter-spacing:.1em;color:var(--rule);margin-left:6px;font-family:inherit;}

/* ---------- levels ---------- */
.levels{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;}
.levels::-webkit-scrollbar{display:none;}
.lv{
  flex:0 0 auto;border:1.5px solid var(--rule-soft);background:#fff;
  color:var(--ink-soft);border-radius:2px;padding:7px 11px;font-size:12px;
  font-weight:700;line-height:1.25;text-align:center;white-space:nowrap;
}
.lv b{display:block;font-size:9px;font-weight:500;letter-spacing:.06em;opacity:.75;}
.lv[aria-pressed="true"]{background:var(--rule);border-color:var(--rule);color:#fff;}

/* ---------- toolbar ---------- */
.bar{display:flex;gap:6px;padding:0 14px 10px;}
.bar button{
  flex:1;border:1.5px solid var(--ink);background:#fff;color:var(--ink);
  border-radius:2px;padding:9px 4px;font-size:12.5px;font-weight:700;
}
.bar button.primary{background:var(--vermilion);border-color:var(--vermilion);color:#fff;}
.bar button:disabled{opacity:.35;}

/* ---------- grid ---------- */
.board-wrap{display:flex;justify-content:center;padding:2px 8px 14px;}
.board{
  display:grid;gap:0;border:2px solid var(--rule);background:var(--rule-soft);
  padding:2px;
  /* 共通モジュールの正解はんこ(.divp-hanko)は position:absolute・171px固定なので、
     基準を作りつつ はみ出しても切らない（切れると円が欠ける）*/
  position:relative;overflow:visible;
}
.cell{width:var(--cell);height:var(--cell);position:relative;background:transparent;}
.cell.blk{background:transparent;}
.cell.on{background:#fff;border:1px solid var(--rule-soft);}
.cell.on::after{
  content:"";position:absolute;inset:22% 22%;border:1px dashed #E3EDE7;pointer-events:none;
}
.cell .n{
  position:absolute;top:0;left:1px;font-size:8px;line-height:1;color:var(--rule);
  font-weight:700;z-index:2;
}
.cell .v{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--cell) * .62);z-index:1;
  font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
}
.cell.hl{background:var(--vermilion-soft);}
.cell.cur{background:var(--gold);}
.cell.bad .v{color:var(--vermilion);}
.cell.bad{animation:sh .3s;}
@keyframes sh{25%{transform:translateX(-2px)}75%{transform:translateX(2px)}}
.cell.hint .v{color:var(--rule);}
.cell.done .v{color:var(--ink);}
@media (prefers-reduced-motion:reduce){.cell.bad{animation:none;}}

/* ---------- clues ---------- */
.clues{padding:0 14px;}
.clues h2{
  font-size:12px;letter-spacing:.16em;color:#fff;background:var(--rule);
  display:inline-block;padding:3px 10px;margin:10px 0 6px;border-radius:1px;font-weight:700;
}
.clue{
  display:flex;gap:8px;padding:7px 8px;border-bottom:1px solid var(--rule-soft);
  font-size:13px;line-height:1.5;align-items:flex-start;background:transparent;
  width:100%;text-align:left;border-left:none;border-right:none;border-top:none;
  color:var(--ink);
}
.clue .no{
  flex:0 0 22px;height:22px;border:1.5px solid var(--rule);color:var(--rule);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  border-radius:50%;
}
.clue.sel{background:var(--vermilion-soft);}
.clue.solved .no{background:var(--rule);color:#fff;}
.clue .len{font-size:10px;color:var(--ink-soft);margin-left:4px;}
.clue .ans{
  display:block;font-size:12px;color:var(--rule);font-weight:700;margin-top:2px;
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
}
.rule-note{
  margin:14px;padding:9px 11px;border-left:3px solid var(--gold);
  font-size:11px;line-height:1.7;color:var(--ink-soft);background:#fff;
}

/* ---------- keyboard ---------- */
.kb{
  position:fixed;left:0;right:0;bottom:0;background:#F2EADB;
  border-top:2px solid var(--rule);padding:6px 5px calc(6px + env(safe-area-inset-bottom));
  z-index:50;transform:translateY(0);transition:transform .18s;
}
.kb.hidden{transform:translateY(110%);}
.kb .hintbar{
  display:flex;justify-content:space-between;align-items:center;
  font-size:11px;color:var(--ink-soft);padding:0 3px 5px;gap:8px;
}
.kb .hintbar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.keys{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;}
.keys button{
  height:38px;border:1px solid #D6CBB6;background:#fff;border-radius:3px;
  font-size:17px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif;color:var(--ink);
  padding:0;
}
.keys button:active{background:var(--gold);}
.keys .empty{visibility:hidden;}
.keys .fn{
  font-family:inherit;font-size:12px;font-weight:700;background:#E7DFCE;
}
.keys .fn.close{background:var(--rule);border-color:var(--rule);color:#fff;}
.keys .fn.mark{
  background:var(--gold);border-color:#E09B2C;color:var(--ink);
  font-size:11px;line-height:1.15;letter-spacing:0;
}

/* ---------- done ---------- */
.done-wrap{
  position:fixed;inset:0;background:rgba(35,33,28,.55);z-index:80;
  display:flex;align-items:flex-end;
}
.done-wrap.hidden{display:none;}
.sheet{
  background:var(--paper);width:100%;max-height:88svh;overflow:auto;
  border-top:3px solid var(--vermilion);padding:18px 16px calc(20px + env(safe-area-inset-bottom));
}
.sheet h3{
  font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:20px;margin:0 0 4px;
  letter-spacing:.14em;
}
.sheet .sub{font-size:12px;color:var(--ink-soft);margin-bottom:12px;}
.wl{border-top:1px solid var(--rule-soft);}
.wl div{padding:8px 2px;border-bottom:1px solid var(--rule-soft);font-size:13px;line-height:1.55;}
.wl b{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:16px;margin-right:8px;}
.wl small{display:block;color:var(--ink-soft);font-size:11.5px;}
.sheet button{
  width:100%;margin-top:16px;padding:14px;border:none;background:var(--vermilion);
  color:#fff;font-size:15px;font-weight:700;border-radius:3px;
}
</style>
</head>
<body class="kb-off">
<!-- divp-suite 共通モジュール（本番の /assets/ から読み込む。file://単体では読めなくてもツールは動く）。
     ⚠ 必ず <body> 開始直後に置くこと。divp-header.js は「自分のタグの位置」に
        ヘッダーを挿すので、<head> に置くと <head> の中に入って画面に出ない。 -->
<script src="/assets/divp-header.js"></script>
<script src="/assets/divp-core.js"></script>
<!-- 正解エフェクトは小学生(es)用の星＋「正解！」。中学レベル(l4〜l6)も同じ盤面ゲームで、
     ひらがな主体の文言・盤面いっぱいの演出のほうが合うため es 側にそろえた。
     ⚠ es版 Divp.correct(opts) と jh版 Divp.correct(sel,opts) は引数が違う（safeCorrect 参照）。
     ⚠ jh をやめた＝Divp.incorrect（ナイスチャレンジ バッジ）は無い。誤答時の知らせは
        キーボード上の「まちがいが Nマス あるよ」で受け持つ。 -->
<script src="/assets/divp-correct.js"></script>

<header>
  <div class="brand">中京個別指導学院</div>
  <h1>ことばのマスで語彙力マス</h1>
</header>

<div class="levels" id="levels"></div>

<div class="bar">
  <button id="btnNew">新しい問題</button>
  <button id="btnHint">ヒント</button>
  <button id="btnCheck" class="primary">こたえあわせ</button>
</div>


<div class="board-wrap"><div class="board" id="board"></div></div>

<div class="clues">
  <h2>ヨコのカギ</h2><div id="acrossList"></div>
  <h2>タテのカギ</h2><div id="downList"></div>
</div>

<div class="rule-note">
  マスに入れるのは<b>カタカナ</b>です。<br>
  濁点（゛）・半濁点（゜）・小さい字は、その字を入れてから右下の<b>「゛゜小」キー</b>をおすと切りかわります。<br>
  例：ハ→<b class="mincho">バ</b>→<b class="mincho">パ</b>／ツ→<b class="mincho">ヅ</b>→<b class="mincho">ッ</b>
</div>

<div class="kb hidden" id="kb">
  <div class="hintbar">
    <span id="kbHint">マスをタップしてね</span>
  </div>
  <div class="keys" id="keys"></div>
</div>

<div class="done-wrap hidden" id="doneWrap">
  <div class="sheet">
    <h3 id="doneTitle">ぜんぶ そろいました</h3>
    <div class="sub" id="doneSub"></div>
    <div class="wl" id="doneList"></div>
    <button id="btnNext">つぎの問題へ</button>
  </div>
</div>

/* ============ 盤面生成 ============ */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}
  return a;
}

function build(pool,maxSize,target){
  var g={}, placed=[], used={};
  var minR=0,maxR=0,minC=0,maxC=0, has=false;
  function get(r,c){return g[r+','+c];}
  function score(k,r,c,dir){
    var dr=dir==='d'?1:0, dc=dir==='a'?1:0, cross=0;
    if(get(r-dr,c-dc)!==undefined) return -1;
    if(get(r+dr*k.length,c+dc*k.length)!==undefined) return -1;
    for(var i=0;i<k.length;i++){
      var rr=r+dr*i, cc=c+dc*i, cur=get(rr,cc);
      if(cur!==undefined){
        if(cur!==k[i]) return -1;
        cross++;
      }else{
        if(dir==='a'){ if(get(rr-1,cc)!==undefined||get(rr+1,cc)!==undefined) return -1; }
        else { if(get(rr,cc-1)!==undefined||get(rr,cc+1)!==undefined) return -1; }
      }
    }
    if(cross===0) return -1;
    var nMinR=Math.min(minR,r), nMaxR=Math.max(maxR,r+dr*(k.length-1));
    var nMinC=Math.min(minC,c), nMaxC=Math.max(maxC,c+dc*(k.length-1));
    if(nMaxR-nMinR+1>maxSize||nMaxC-nMinC+1>maxSize) return -1;
    var grow=(nMaxR-nMinR)-(maxR-minR)+(nMaxC-nMinC)-(maxC-minC);
    return cross*10-grow*3+Math.random()*2;
  }
  function put(e,k,r,c,dir){
    var dr=dir==='d'?1:0, dc=dir==='a'?1:0;
    for(var i=0;i<k.length;i++) g[(r+dr*i)+','+(c+dc*i)]=k[i];
    if(!has){minR=r;maxR=r+dr*(k.length-1);minC=c;maxC=c+dc*(k.length-1);has=true;}
    else{
      minR=Math.min(minR,r);maxR=Math.max(maxR,r+dr*(k.length-1));
      minC=Math.min(minC,c);maxC=Math.max(maxC,c+dc*(k.length-1));
    }
    placed.push({e:e,k:k,r:r,c:c,dir:dir});
    used[k]=1;
  }

  var list=[];
  for(var i=0;i<pool.length;i++){
    var k=pool[i].w;
    if(k.length<2||k.length>Math.min(6,maxSize)) continue;
    list.push({e:pool[i],k:k});
  }
  shuffle(list);
  // 最初の1語は長めの語を横に
  var firstIdx=0;
  for(var i2=0;i2<list.length;i2++){ if(list[i2].k.length>=4){firstIdx=i2;break;} }
  var first=list.splice(firstIdx,1)[0];
  put(first.e,first.k,0,0,'a');

  var guard=0;
  while(placed.length<target && guard<400){
    guard++;
    var best=null;
    for(var n=0;n<list.length;n++){
      var k=list[n].k;
      if(used[k]) continue;
      for(var pi=0;pi<placed.length;pi++){
        var p=placed[pi];
        var dir=p.dir==='a'?'d':'a';
        var dr=p.dir==='d'?1:0, dc=p.dir==='a'?1:0;
        for(var j=0;j<p.k.length;j++){
          var ch=p.k[j];
          for(var m=0;m<k.length;m++){
            if(k[m]!==ch) continue;
            var rr=p.r+dr*j, cc=p.c+dc*j;
            var sr=(dir==='d')? rr-m : rr;
            var sc=(dir==='a')? cc-m : cc;
            var s=score(k,sr,sc,dir);
            if(s>=0 && (!best||s>best.s)) best={s:s,e:list[n].e,k:k,r:sr,c:sc,dir:dir};
          }
        }
      }
    }
    if(!best) break;
    put(best.e,best.k,best.r,best.c,best.dir);
  }

  var rows=maxR-minR+1, cols=maxC-minC+1;
  var grid=[];
  for(var r=0;r<rows;r++){ grid.push(new Array(cols).fill(null)); }
  for(var key in g){
    var pp=key.split(','),
        r2=+pp[0]-minR, c2=+pp[1]-minC;
    grid[r2][c2]=g[key];
  }
  var pl=placed.map(function(p){return {e:p.e,k:p.k,r:p.r-minR,c:p.c-minC,dir:p.dir};});
  return {grid:grid,rows:rows,cols:cols,placed:pl};
}

function makePuzzle(levelKey, requireIds){
  var lv=DATA[levelKey], best=null, bestHit=-1;
  var need = (requireIds && requireIds.length) ? requireIds : null;
  function countHit(placed){
    if(!need) return 0;
    var s={}; need.forEach(function(id){ s[id]=1; });
    var n=0; placed.forEach(function(p){ if(p.e && s[p.e.id]) n++; });
    return n;
  }
  var TRIES = need ? 60 : 40;
  for(var t=0;t<TRIES;t++){
    // retry指定がある回は、必須語を先頭に寄せたプールで生成し配置されやすくする
    var pool = lv.words;
    if(need){
      var req=[], rest=[];
      lv.words.forEach(function(w){ (need.indexOf(w.id)>=0 ? req : rest).push(w); });
      pool = req.concat(rest);
    }
    var b=build(pool,lv.size,lv.count);
    var hit=countHit(b.placed);
    // 必須語をより多く含み、語数も満たす盤面を優先
    if(!best || hit>bestHit || (hit===bestHit && b.placed.length>best.placed.length)){
      best=b; bestHit=hit;
    }
    if(best.placed.length>=lv.count && (!need || bestHit>=1)) break;
  }
  // 番号付け
  var starts=best.placed.slice().sort(function(a,b){return a.r-b.r||a.c-b.c;});
  var numOf={}, num=0;
  starts.forEach(function(p){
    var key=p.r+','+p.c;
    if(numOf[key]===undefined){ num++; numOf[key]=num; }
    p.no=numOf[key];
  });
  best.placed.forEach(function(p){ p.no=numOf[p.r+','+p.c]; });
  return best;
}

/* ============ 状態 ============ */
var level='l1', puz=null, cellEl={}, val={}, fixed={},
    words=[], active=-1, activeCell=0, hintCount=0, startedAt=0;

var $=function(id){return document.getElementById(id);};

/* ============ divp-suite 連携 ============
   unit_key = japanese_goi_crossword
   レベル → question_key の対応。1語=1 answer で Divp.answer を呼ぶ。
   Divp / API が無い環境（file://・未ログイン）では黙って埋め込みデータのまま動く。 */
var UNIT_KEY='japanese_goi_crossword';
var QKEY={l1:'es_low',l2:'es_mid',l3:'es_high',l4:'js_easy',l5:'js_normal',l6:'js_hard'};
var LVNUM={l1:1,l2:2,l3:3,l4:4,l5:5,l6:6};
var hasDivp=function(){ return (typeof window!=='undefined') && window.Divp; };

/* 正解エフェクト（無ければ何もしない）。safeDivp* 定石に沿う。
   ⚠ es版 divp-correct.js は引数がオプション1個 Divp.correct({target,text,…})。
     jh版の Divp.correct(セレクタ, opts) とは形が違うので、ここで要素を渡す形に寄せる。
     target は星の発生源で、盤面(#board)の中央から散らせる。エフェクトは
     画面いっぱいの fixed レイヤーなので、盤面を作り直しても後片付けは要らない
     （寿命が来ると自分で消える）。 */
function safeCorrect(el,opts){
  try{
    if(!(hasDivp() && window.Divp.correct)) return;
    var o={}; if(opts) for(var k in opts) o[k]=opts[k];
    if(o.target==null) o.target=el;
    window.Divp.correct(o);
  }catch(e){}
}
/* 誤答時のバッジは jh 専用機能（Divp.incorrect）で、es版には無い＝この呼び出しは
   今は何もしない。es は「赤で責めない」うえに誤答マスがその場で分かるので、
   知らせはキーボード上の「まちがいが Nマス あるよ」だけで足りる。
   jh に戻すときのために呼び出し口は残してある。 */
function safeIncorrect(sel,opts){ try{ if(hasDivp() && window.Divp.incorrect) window.Divp.incorrect(sel,opts); }catch(e){} }

/* question_params は params_hash の材料＝「同じ問題」の単位。
   語そのものがIDなので word_id だけを入れる（語釈・レベル・分野を混ぜると、
   先生が語を直したとたんハッシュが変わって永久に mastered にならない）。
   APIが応答せず埋め込みデータで動いているときは word_id が無いので読みで代用する。 */
function wordParams(e){
  return (e && e.id) ? { word_id: Number(e.id) }
                     : { yomi: (e ? e.w : ''), level: (LVNUM[level]||0) };
}

/* 記録専用（エフェクトは出さない）。1語ぶんを1レコードで送る。
   各語につき1回だけ（logged）＝同じ盤面で何度こたえあわせを押しても二重に飛ばない。 */
function logOnce(w, isCorrect, wrongAnswer){
  if(!w || w.logged) return;
  w.logged=true;
  if(!hasDivp() || !window.Divp.answer) return;
  var e=w.e;
  try{
    window.Divp.answer(isCorrect, {
      question_key: QKEY[level],
      question_params: wordParams(e),
      question_text: e.c,
      correct_answer: (e.d ? e.d+'（'+e.w+'）' : e.w),
      wrong_answer: wrongAnswer || ''
    });
  }catch(err){}
}
/* 語のマスに入っている文字を「その子の解答」として読める形にする（誤答の記録用） */
function typedOf(w){
  return w.cells.map(function(k){ return val[k]||'□'; }).join('');
}

function levelChips(){
  var box=$('levels');
  box.innerHTML='';
  Object.keys(DATA).forEach(function(k){
    var b=document.createElement('button');
    b.className='lv';
    b.innerHTML='<b>'+DATA[k].name+'</b>'+DATA[k].sub;
    b.setAttribute('aria-pressed', k===level?'true':'false');
    b.onclick=function(){ level=k; levelChips(); newPuzzle(); };
    box.appendChild(b);
  });
}

function newPuzzle(requireIds){
  puz=makePuzzle(level, requireIds);
  val={}; fixed={}; cellEl={}; active=-1; activeCell=0; hintCount=0;
  startedAt=Date.now();
  words=puz.placed.map(function(p){
    var cells=[];
    for(var i=0;i<p.k.length;i++){
      cells.push((p.dir==='d'? p.r+i : p.r)+','+(p.dir==='a'? p.c+i : p.c));
    }
    return {no:p.no,dir:p.dir,cells:cells,k:p.k,e:p.e,solved:false};
  });
  words.sort(function(a,b){return a.no-b.no;});
  renderBoard();
  renderClues();
  closeKb();
  $('doneWrap').classList.add('hidden');
}

function renderBoard(){
  var board=$('board');
  board.innerHTML='';
  board.style.gridTemplateColumns='repeat('+puz.cols+', var(--cell))';
  var avail=Math.min(window.innerWidth-24, 460);
  var size=Math.max(20,Math.min(44, Math.floor((avail-8)/puz.cols)));
  document.documentElement.style.setProperty('--cell', size+'px');

  var numAt={};
  words.forEach(function(w){ numAt[w.cells[0]]=w.no; });

  for(var r=0;r<puz.rows;r++){
    for(var c=0;c<puz.cols;c++){
      var d=document.createElement('div');
      var key=r+','+c;
      if(puz.grid[r][c]===null){ d.className='cell blk'; }
      else{
        d.className='cell on';
        if(numAt[key]!==undefined){
          var n=document.createElement('div'); n.className='n'; n.textContent=numAt[key]; d.appendChild(n);
        }
        var v=document.createElement('div'); v.className='v'; d.appendChild(v);
        cellEl[key]=d;
        (function(k){ d.onclick=function(){ tapCell(k); }; })(key);
      }
      board.appendChild(d);
    }
  }
  paint();
}

function paint(){
  for(var key in cellEl){
    var el=cellEl[key];
    el.classList.remove('hl','cur','bad');
    el.querySelector('.v').textContent = val[key]||'';
    el.classList.toggle('hint', !!fixed[key]);
  }
  if(active>=0){
    var w=words[active];
    w.cells.forEach(function(k,i){
      cellEl[k].classList.add(i===activeCell?'cur':'hl');
    });
  }
  var all=Object.keys(cellEl).length, filled=0;
  for(var k2 in cellEl){ if(val[k2]) filled++; }
  updateSolved();
  if(filled===all && allCorrect()) finish();
}

function updateSolved(){
  words.forEach(function(w,i){
    var ok=w.cells.every(function(k,j){ return val[k]===w.k[j]; });
    // 語が「初めて」正しく完成した瞬間に1語ぶんを記録する（各語1回だけ）。
    // ただしヒントでマスを開けてもらった語は自分で解けた語ではないので誤答で記録し、
    // 解き直しキューに入れる（でないと「ヒント連打で全問正解」になる）
    if(ok && !w.logged){
      if(w.revealed) logOnce(w, false, '（ヒントでマスを開けた）');
      else           logOnce(w, true);
    }
    w.solved=ok;
    var el=document.querySelector('[data-clue="'+i+'"]');
    if(el){
      el.classList.toggle('solved',ok);
      var a=el.querySelector('.ans');
      if(a) a.textContent = ok ? (w.e.d? w.e.d+'（'+w.e.w+'）' : w.e.w) : '';
    }
  });
}

function allCorrect(){
  return words.every(function(w){ return w.cells.every(function(k,j){ return val[k]===w.k[j]; }); });
}

function renderClues(){
  var A=$('acrossList'), D=$('downList');
  A.innerHTML=''; D.innerHTML='';
  words.forEach(function(w,i){
    var b=document.createElement('button');
    b.className='clue'; b.setAttribute('data-clue',i);
    b.innerHTML='<span class="no">'+w.no+'</span><span>'+w.e.c+
      '<span class="len">（'+w.k.length+'文字）</span><span class="ans"></span></span>';
    b.onclick=function(){ selectWord(i,0); };
    (w.dir==='a'?A:D).appendChild(b);
  });
  updateSolved();
}

function tapCell(key){
  var cands=[];
  words.forEach(function(w,i){ if(w.cells.indexOf(key)>=0) cands.push(i); });
  if(!cands.length) return;
  var pick=cands[0];
  if(cands.length>1 && cands.indexOf(active)>=0){
    pick=cands[(cands.indexOf(active)+1)%cands.length];
  }else{
    for(var i=0;i<cands.length;i++){ if(words[cands[i]].dir==='a'){ pick=cands[i]; break; } }
  }
  selectWord(pick, words[pick].cells.indexOf(key));
}

function selectWord(i,idx){
  active=i;
  var w=words[i];
  if(idx===0 && val[w.cells[0]]){
    var f=w.cells.findIndex(function(k){ return !val[k]; });
    idx = f>=0?f:0;
  }
  activeCell=Math.max(0,idx);
  openKb();
  paint();
  document.querySelectorAll('.clue').forEach(function(el){
    el.classList.toggle('sel', el.getAttribute('data-clue')==String(i));
  });
  $('kbHint').textContent = (w.dir==='a'?'ヨコ':'タテ')+w.no+'　'+w.e.c;
}

function typeChar(ch){
  if(active<0) return;
  var w=words[active], key=w.cells[activeCell];
  if(fixed[key]){ step(1); return; }
  val[key]=ch;
  step(1);
  paint();
}
function step(dir){
  if(active<0) return;
  var w=words[active];
  var i=activeCell+dir;
  if(dir>0){
    while(i<w.cells.length && val[w.cells[i]] && fixed[w.cells[i]]) i++;
  }
  if(i<0) i=0;
  if(i>=w.cells.length) i=w.cells.length-1;
  activeCell=i;
}
function backspace(){
  if(active<0) return;
  var w=words[active], key=w.cells[activeCell];
  if(val[key] && !fixed[key]) { delete val[key]; }
  else { step(-1); var k2=w.cells[activeCell]; if(!fixed[k2]) delete val[k2]; }
  paint();
}

/* ============ 濁点・半濁点・小文字 ============ */
var CYCLES=['カガ','キギ','クグ','ケゲ','コゴ','サザ','シジ','スズ','セゼ','ソゾ',
            'タダ','チヂ','テデ','トド','ツヅッ','ハバパ','ヒビピ','フブプ','ヘベペ','ホボポ',
            'アァ','イィ','ウヴゥ','エェ','オォ','ヤャ','ユュ','ヨョ','ワヮ'];
function cycleChar(ch){
  for(var i=0;i<CYCLES.length;i++){
    var j=CYCLES[i].indexOf(ch);
    if(j>=0) return CYCLES[i].charAt((j+1)%CYCLES[i].length);
  }
  return null;
}
function markKey(){
  if(active<0) return;
  var w=words[active], idx=activeCell;
  if(!val[w.cells[idx]] && idx>0 && val[w.cells[idx-1]]) idx--;
  var key=w.cells[idx];
  if(!val[key]||fixed[key]) return;
  var nc=cycleChar(val[key]);
  if(nc){ val[key]=nc; paint(); }
  else { $('kbHint').textContent='この字には 濁点は つきません'; }
}

/* ============ キーボード ============ */
var KEYS=[
 'ア','カ','サ','タ','ナ','ハ','マ','ヤ','ラ','ワ',
 'イ','キ','シ','チ','ニ','ヒ','ミ','' ,'リ','ヲ',
 'ウ','ク','ス','ツ','ヌ','フ','ム','ユ','ル','ン',
 'エ','ケ','セ','テ','ネ','ヘ','メ','' ,'レ','ー',
 'オ','コ','ソ','ト','ノ','ホ','モ','ヨ','ロ',''
];
function buildKb(){
  var box=$('keys');
  box.innerHTML='';
  KEYS.forEach(function(ch,i){
    var b=document.createElement('button');
    if(i===49){
      b.className='fn mark'; b.id='markKey';
      b.innerHTML='゛゜<br>小';
      b.onclick=markKey;
    }else if(!ch){ b.className='empty'; b.disabled=true; }
    else{ b.textContent=ch; b.onclick=function(){ typeChar(ch); }; }
    box.appendChild(b);
  });
  function fn(label,span,cls,fnc){
    var b=document.createElement('button');
    b.className='fn'+(cls?' '+cls:''); b.textContent=label;
    b.style.gridColumn='span '+span; b.onclick=fnc;
    box.appendChild(b);
  }
  fn('◀',2,'',function(){ step(-1); paint(); });
  fn('1字消す',3,'',backspace);
  fn('▶',2,'',function(){ step(1); paint(); });
  fn('とじる',3,'close',closeKb);
}
function openKb(){ $('kb').classList.remove('hidden'); document.body.classList.remove('kb-off'); }
function closeKb(){
  $('kb').classList.add('hidden'); document.body.classList.add('kb-off');
  active=-1; paint();
  document.querySelectorAll('.clue').forEach(function(el){ el.classList.remove('sel'); });
}

/* ============ ボタン ============ */
$('btnNew').onclick=newPuzzle;
$('btnNext').onclick=newPuzzle;

/* ヒント:
   選択中の語に段階ヒント（vocab_hints 由来）があれば、まず意味の手がかりを1段ずつ出す。
   段階ヒントを出し切ったら/無ければ、従来どおりマスを1つ開ける（最終手段）。
   語データに hints:[{step,type,body},...] があれば使う。頭文字ヒントは読みから自動生成。*/
function stagedHints(w){
  var e=w.e, hs=(e.hints||[]).slice().sort(function(a,b){return a.step-b.step;});
  // 頭文字ヒントが無ければ自動で最後に足す
  if(!hs.some(function(x){return x.type==='firstchar';})){
    hs.push({step:99,type:'firstchar',body:'頭文字は「'+e.w.charAt(0)+'」'});
  }
  return hs;
}
$('btnHint').onclick=function(){
  // 選択中の語があり、まだ出せる意味ヒントがあるなら それを優先
  if(active>=0){
    var w=words[active];
    var hs=stagedHints(w);
    var shown=w.hintShown||0;
    if(shown<hs.length){
      w.hintShown=shown+1;
      hintCount++;
      $('kbHint').textContent='ヒント'+(shown+1)+'：'+hs[shown].body;
      openKb();
      return;
    }
  }
  // 意味ヒントが尽きた/語未選択 → マスを1つ開ける（従来動作）
  var pool=[];
  var scope = active>=0 ? words[active].cells : Object.keys(cellEl);
  scope.forEach(function(k){ if(!val[k]) pool.push(k); });
  if(!pool.length){
    scope=Object.keys(cellEl); pool=scope.filter(function(k){ return !val[k]; });
  }
  if(!pool.length) return;
  var key=pool[Math.floor(Math.random()*pool.length)];
  var p=key.split(',');
  val[key]=puz.grid[+p[0]][+p[1]];
  fixed[key]=1;
  hintCount++;
  // このマスを含む語は「自分で解いた」ことにしない（updateSolved が誤答で記録する）
  words.forEach(function(w){ if(w.cells.indexOf(key)>=0) w.revealed=true; });
  paint();
};

$('btnCheck').onclick=function(){
  var wrong=0;
  for(var key in cellEl){
    var p=key.split(','), ans=puz.grid[+p[0]][+p[1]];
    if(val[key] && val[key]!==ans){ cellEl[key].classList.add('bad'); wrong++; }
  }
  // 全マス埋めたのに違っている語＝はっきり間違えた語なので1回だけ誤答で記録する。
  // （正解しか記録していないと retry_queue に何も入らず ?retry=1 で解き直せない）
  words.forEach(function(w){
    if(w.logged) return;
    var filled=w.cells.every(function(k){ return !!val[k]; });
    if(filled && !w.cells.every(function(k,j){ return val[k]===w.k[j]; })){
      logOnce(w, false, typedOf(w));
    }
  });
  if(wrong===0){
    if(allCorrect()) finish();
    else $('kbHint').textContent='ここまで 正解！　のこりも うめよう';
  }else{
    $('kbHint').textContent='まちがいが '+wrong+'マス あるよ';
    safeIncorrect('#board');
    openKb();
  }
};

function finish(){
  var sec=Math.round((Date.now()-startedAt)/1000);
  var m=Math.floor(sec/60), s=sec%60;
  $('doneSub').textContent = words.length+'語 ／ '+m+'分'+(s<10?'0':'')+s+'秒 ／ ヒント'+hintCount+'回';
  var list=$('doneList');
  list.innerHTML='';
  words.slice().sort(function(a,b){return a.no-b.no;}).forEach(function(w){
    var d=document.createElement('div');
    d.innerHTML='<b>'+(w.e.d? w.e.d : w.e.w)+'</b><span class="mincho">'+w.e.w+'</span><small>'+w.e.c+'</small>';
    list.appendChild(d);
  });
  // 盤面ぜんぶ完成＝1プレイのクリア。共通モジュール（小学生用）の星エフェクトを
  // 盤面中央から散らせ、少し見せてから結果シートを出す。エフェクト側のレイヤーは
  // 最前面なので、結果シートが出たあとも星は上に降りつづける（じゃまはしない）
  $('kb').classList.add('hidden');
  safeCorrect($('board'));
  setTimeout(function(){ $('doneWrap').classList.remove('hidden'); }, 750);
}

window.addEventListener('resize',function(){ if(puz) renderBoard(); });

/* ============ 起動 ============
   1) divp-core があれば Divp.init（未ログイン/file:// では内部でスキップ）
   2) 語彙APIが応答すれば、埋め込みデータ DATA[level].words を DB由来（word_id 付き）で差し替え
      → 失敗しても埋め込みデータのまま動く（内蔵フォールバック）
   API: GET /api/vocab_words.php?level=es_low[&mode=weak&limit=150][&ids=1,2,3]
     → { ok:true, words:[ {id, w(yomi), d(hyoki), c(gloss), cat, len,
                           hints:[{step,type,body},…]} , ... ] }
     mode=weak … その生徒のまだ定着していない語を優先（解き直し用）
     ids       … pending の語を必ず同梱させる（プールに入らないと解き直せない） */
function initDivp(){
  if(hasDivp() && window.Divp.init){ try{ window.Divp.init(UNIT_KEY); }catch(e){} }
}
/* ?retry=1 で開かれたか（解き直しモード） */
var RETRY=(typeof location!=='undefined') && (location.search||'').indexOf('retry=1')>=0;

var poolLoaded={}; // question_key ごとに読み込み済みか
function loadPool(lv, ids, cb){
  var qk=QKEY[lv];
  if(poolLoaded[qk] || typeof fetch==='undefined'){ cb&&cb(); return; }
  // 解き直しでは「まだ定着していない語」を優先で引き、pending の語(ids)は必ず同梱させる。
  // プールを絞るのは意図的: build() は語を混ぜて置くので、プールが大きいほど
  // 1盤面に載る pending 語が減る（＝解き直しリストが減りにくい）
  var url='/api/vocab_words.php?level='+encodeURIComponent(qk)
        + (RETRY ? '&mode=weak&limit=80' : '')
        + ((ids && ids.length) ? '&ids='+encodeURIComponent(ids.join(',')) : '');
  var done=false, t=setTimeout(function(){ if(!done){done=true;cb&&cb();} }, 4000);
  fetch(url, {credentials:'same-origin'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if(j && j.words && j.words.length){
        // 盤面に載る2〜6字だけ採用。既存の生成ロジックはそのまま使える
        var ws=j.words.filter(function(x){ return x.w && x.w.length>=2 && x.w.length<=6; });
        if(ws.length>=DATA[lv].count) DATA[lv].words=ws;
      }
      poolLoaded[qk]=true;
    })
    .catch(function(){})
    .then(function(){ if(!done){done=true;clearTimeout(t);cb&&cb();} });
}

/* ?retry=1 のときは Divp.getRetries() の未定着語(word_id)を必ず含む盤面を作る。
   ⚠ getRetries() は引数なしで Promise を返す（同期の配列ではない）。
   pending はレベルごと（question_key）に分かれているので、今のレベルのぶんだけ使う。 */
var retryCache=null;      // question_key -> [word_id, …]
var retryLevelPicked=false;
function loadRetries(cb){
  if(!RETRY || !hasDivp() || !window.Divp.getRetries){ cb({}); return; }
  if(retryCache){ cb(retryCache); return; }
  var p;
  try{ p=window.Divp.getRetries(); }catch(e){ cb({}); return; }
  if(!p || !p.then){ cb({}); return; }
  p.then(function(rs){
    var byKey={};
    (rs||[]).forEach(function(r){
      var q=r.question_params||{};
      if(typeof q==='string'){ try{ q=JSON.parse(q); }catch(e){ q={}; } }
      if(!q.word_id) return;
      (byKey[r.question_key]=byKey[r.question_key]||[]).push(Number(q.word_id));
    });
    retryCache=byKey; cb(byKey);
  }).catch(function(){ cb({}); });
}

var _newPuzzle=newPuzzle;
newPuzzle=function(){
  loadRetries(function(byKey){
    // 初回だけ、解き直しが一番たまっているレベルへ寄せる
    // （2回目以降も寄せると、生徒がレベルを選び直しても戻されてしまう）
    if(RETRY && !retryLevelPicked){
      retryLevelPicked=true;
      if(!(byKey[QKEY[level]]||[]).length){
        var bestK=null, bestN=0;
        Object.keys(byKey).forEach(function(k){
          if(byKey[k].length>bestN){ bestN=byKey[k].length; bestK=k; }
        });
        if(bestK){
          Object.keys(QKEY).forEach(function(lv){ if(QKEY[lv]===bestK) level=lv; });
          levelChips();
        }
      }
    }
    var need=(byKey[QKEY[level]]||[]).slice(0,40);
    loadPool(level, need, function(){
      _newPuzzle(need.length ? need : null);   // makePuzzle に requireIds として渡る
    });
  });
};

/* ⚠ 共通モジュール(/assets/divp-*.js)は defer で読んでいる＝**この行が走る時点では
   window.Divp がまだ無い**。defer スクリプトは本文の解析が終わってから
   DOMContentLoaded の直前に走るので、そこまで待ってから起動する。
   （待たずに起動すると initDivp() が空振りして unitKey が入らず、
     以後 Divp.answer が全て早期リターン＝1問も記録されない。エラーも出ないので
     「動いているのに記録だけ無い」状態になる。漢文 返り点ドリルと同じ形。） */
function boot(){
  buildKb();
  initDivp();
  levelChips();
  newPuzzle();
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();
})();
</script>
